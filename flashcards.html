<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flash Cards</title>
  <style>
    :root {
      --navy: #1b365d;
      --navy-2: #12243f;
      --gold: #c4a35a;
      --cream: #f7f3ea;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --line: #d8dee6;
      --ok: #2f6f4e;
      --bad: #8b3a3a;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(18, 36, 63, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Calibri, system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    header .sub { color: #c5d0dc; font-size: 13px; }
    main { max-width: 920px; margin: 0 auto; padding: 20px; }
    button, select, input, textarea {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
    }
    button.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    button.gold { background: var(--gold); color: var(--navy-2); font-weight: 650; }
    button.ok { background: var(--ok); }
    button.bad { background: var(--bad); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid #e3c4c4; }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .folder-card { cursor: pointer; }
    .folder-card:hover { border-color: var(--gold); }
    .folder-card h3 { margin: 0 0 6px; font-size: 17px; }
    .muted { color: var(--muted); font-size: 13px; }
    .study-wrap { min-height: 62vh; display: flex; flex-direction: column; gap: 14px; }
    .flash {
      flex: 1;
      min-height: 320px;
      background: var(--navy);
      color: #fff;
      border-radius: 22px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
    }
    .flash.back {
      background: #fff;
      color: var(--ink);
      text-align: left;
      align-items: stretch;
      justify-content: flex-start;
    }
    .flash .hint {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .flash h2 { margin: 18px 0 8px; font-size: 28px; line-height: 1.2; }
    .flash .subtitle { color: var(--gold); font-size: 20px; font-weight: 700; }
    .flash.back h2 { font-size: 20px; margin: 8px 0 4px; color: var(--navy); }
    .flash.back .label {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-top: 10px;
    }
    .flash.back p, .flash.back li { line-height: 1.45; }
    .flash.back ul { margin: 6px 0 0; padding-left: 18px; }
    .progress-bar {
      height: 8px;
      background: #e6e1d6;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--gold);
    }
    label { display: block; font-size: 13px; font-weight: 650; margin: 10px 0 4px; }
    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(560px, 92vw);
    }
    dialog::backdrop { background: rgba(18, 36, 63, 0.45); }
    .dialog-body { padding: 18px; }
    .dialog-head {
      background: var(--navy);
      color: #fff;
      padding: 14px 18px;
      font-weight: 650;
    }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      background: #efe7d4;
      color: var(--navy-2);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 6px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .list-item:last-child { border-bottom: 0; }
    footer.note { margin-top: 28px; color: var(--muted); font-size: 12px; }
    .choices { display: grid; gap: 10px; }
    button.choice {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      text-align: left;
      font-weight: 500;
      line-height: 1.35;
      padding: 12px 14px;
    }
    button.choice:hover:not(:disabled) { border-color: var(--gold); }
    button.choice.correct { background: #e5f4ea; border-color: var(--ok); color: var(--ok); }
    button.choice.wrong { background: #f8eaea; border-color: var(--bad); color: var(--bad); }
    button.choice.idle { opacity: 0.55; }
    .flash.quiz {
      min-height: 180px;
      cursor: default;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Flash Cards</h1>
      <div class="sub" id="headerSub">Folders stay on this device</div>
    </div>
    <div class="row" id="headerActions"></div>
  </header>
  <main id="app"></main>
  <dialog id="modal"></dialog>

  <script>
    const STORE_KEY = "flashcards.v1";
    const RETIRE_AFTER = 3;

    const DEFAULT_CARDS = [
      { front: "National Labor Relations Act (NLRA)", year: "1935", extra: "Wagner Act", purpose: "Protects private-sector employees’ rights to organize, form or join unions, bargain collectively, and engage in concerted activity.", protections: ["Right to unionize and bargain collectively", "Right to strike and take other concerted action", "Prohibits employer unfair labor practices (firing for union activity, interference, refusal to bargain)", "Created the National Labor Relations Board (NLRB)"] },
      { front: "Fair Labor Standards Act (FLSA)", year: "1938", purpose: "Sets nationwide wage-and-hour rules so workers are paid fairly and children are not exploited in the workplace.", protections: ["Federal minimum wage", "Overtime pay (typically 1.5× after 40 hours in a workweek for nonexempt employees)", "Child labor restrictions on age, hours, and hazardous work", "Employer recordkeeping requirements"] },
      { front: "Equal Pay Act", year: "1963", purpose: "Requires that men and women in the same workplace be given equal pay for equal work.", protections: ["Prohibits sex-based wage discrimination", "Covers jobs that require substantially equal skill, effort, and responsibility under similar working conditions", "Pay differences must be based on a factor other than sex (seniority, merit, quantity/quality of production)"] },
      { front: "Title VII of the Civil Rights Act", year: "1964", purpose: "Prohibits employment discrimination and created a federal enforcement path through the EEOC.", protections: ["Bars discrimination based on race, color, religion, sex, or national origin", "Applies to hiring, firing, pay, promotion, and other terms of employment", "Covers harassment and retaliation for complaining about discrimination", "Generally applies to employers with 15 or more employees"] },
      { front: "Age Discrimination in Employment Act (ADEA)", year: "1967", purpose: "Protects older workers from employment decisions based on age rather than ability.", protections: ["Prohibits age discrimination against people 40 and older", "Covers hiring, firing, pay, promotions, layoffs, and benefits", "Generally applies to employers with 20 or more employees"] },
      { front: "Rehabilitation Act", year: "1973", purpose: "Prohibits disability discrimination by the federal government, federal contractors, and programs that receive federal funds.", protections: ["Bars discrimination against qualified people with disabilities", "Requires reasonable accommodation in covered programs and federal employment", "Section 503 requires affirmative action by certain federal contractors", "Predecessor to many ADA concepts"] },
      { front: "Vietnam Era Veterans’ Readjustment Assistance Act (VEVRAA)", year: "1974", extra: "Amended in 2002 by the Jobs for Veterans Act", purpose: "Protects covered veterans in employment with federal contractors and requires proactive hiring efforts.", protections: ["Prohibits discrimination against disabled veterans and other covered veteran categories", "Requires affirmative action for those veterans by covered federal contractors"] },
      { front: "Pregnancy Discrimination Act", year: "1978", purpose: "Makes clear that discrimination because of pregnancy is a form of sex discrimination.", protections: ["Prohibits discrimination for all employment-related purposes on the basis of pregnancy, childbirth, or related medical conditions", "Pregnant workers must be treated the same as other employees similar in their ability or inability to work"] },
      { front: "Consolidated Omnibus Budget Reconciliation Act (COBRA)", year: "1986", purpose: "Lets workers and their families keep group health coverage for a limited time after a job or coverage-ending event.", protections: ["Employers with group health plans and 20 or more employees in the prior year must offer continued health and dental insurance to terminated employees for limited periods", "Coverage is typically at the employee’s expense (plus a small admin fee)"] },
      { front: "Immigration Reform and Control Act (IRCA)", year: "1986", purpose: "Created a legalization path for certain undocumented immigrants and made it illegal to knowingly hire unauthorized workers.", protections: ["Legalized certain seasonal agricultural undocumented immigrants", "Legalized people who entered before Jan. 1, 1982 and lived here continuously (fine, back taxes, and admission of guilt)", "Applicants had to show no disqualifying crimes, pre-1982 presence, and minimal knowledge of U.S. history, government, and English", "Requires employers to verify work authorization (Form I-9) and bars knowing hire of unauthorized workers", "Also prohibits citizenship-status and national-origin discrimination in hiring and firing in many cases"] },
      { front: "Worker Adjustment and Retraining Notification Act (WARN)", year: "1988", purpose: "Gives workers advance notice of large job losses so they can prepare and look for other work.", protections: ["Employers with at least 100 employees must give at least 60 days’ notice of plant closings or mass layoffs of 50 or more people (excluding part-time workers)"] },
      { front: "Americans with Disabilities Act (ADA)", year: "1990", extra: "Amended in 2008", purpose: "Prohibits disability discrimination in employment and public life and requires fair treatment of qualified individuals.", protections: ["Prohibits discrimination against a qualified individual with a disability, or someone perceived as having a disability", "Focus on fair treatment and reasonable accommodation", "Covers hiring, firing, pay, promotions, and job conditions"] },
      { front: "Family and Medical Leave Act (FMLA)", year: "1993", purpose: "Gives eligible employees unpaid, job-protected leave for serious health and family-care needs.", protections: ["Requires leave and job-return for personal or family medical reasons", "Covers care of a newborn or newly adopted child", "Typically up to 12 weeks of unpaid leave in a 12-month period for eligible employees of covered employers"] },
      { front: "Uniformed Services Employment and Reemployment Rights Act (USERRA)", year: "1994", purpose: "Protects the civilian jobs of people who serve in the uniformed services.", protections: ["Members of the uniformed services are entitled to return to their civilian employment after service", "Prohibits discrimination based on military service or obligation", "Preserves seniority and certain benefits upon reemployment"] },
      { front: "Health Insurance Portability and Accountability Act (HIPAA)", year: "1996", purpose: "Sets national rules for how health information is shared, kept private, and kept secure.", protections: ["Provides standards for the electronic exchange, privacy, and security of health information", "Limits how covered entities use and disclose protected health information", "Gives people rights to access and request corrections to their health records"] },
      { front: "Genetic Information Nondiscrimination Act (GINA)", year: "2008", purpose: "Keeps genetic test results and family medical history out of employment decisions.", protections: ["Prohibits employers from discriminating based on genetic testing results when making hiring, firing, job placement, or promotion decisions", "Generally bars employers from requesting or requiring genetic information"] },
      { front: "Patient Protection and Affordable Care Act (ACA)", year: "2010", purpose: "Was created to make healthcare more affordable and more easily accessible to a wider range of Americans.", protections: ["Businesses with fewer than 50 full-time employees do not have to provide health insurance for employees", "Businesses with fewer than 25 employees may receive tax breaks for complying with the ACA", "Expanded access to coverage and consumer protections in the individual and small-group markets"] }
    ];

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);

    function seed() {
      const folderId = uid();
      return {
        folders: [{ id: folderId, name: "U.S. Employment Law" }],
        cards: DEFAULT_CARDS.map((c) => ({
          id: uid(),
          folderId,
          front: c.front,
          year: c.year || "",
          extra: c.extra || "",
          purpose: c.purpose,
          protections: c.protections
        })),
        progress: {}
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return seed();
        const data = JSON.parse(raw);
        if (!data.folders || !data.cards) return seed();
        data.progress = data.progress || {};
        return data;
      } catch {
        return seed();
      }
    }

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    let state = load();
    let view = { page: "home", folderId: null, queue: [], index: 0, flipped: false, choices: [], picked: null, score: 0, asked: 0, run: 0, missed: [], quizTotal: 0, quizSource: [] };

    const app = document.getElementById("app");
    const headerSub = document.getElementById("headerSub");
    const headerActions = document.getElementById("headerActions");
    const modal = document.getElementById("modal");

    function folderById(id) { return state.folders.find((f) => f.id === id); }
    function cardsIn(folderId) { return state.cards.filter((c) => c.folderId === folderId); }
    function prog(cardId) {
      if (!state.progress[cardId]) state.progress[cardId] = { streak: 0, retired: false };
      return state.progress[cardId];
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function activeCards(folderId) {
      return cardsIn(folderId).filter((c) => !prog(c.id).retired);
    }
    function escaped(s) {
      const map = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
      return String(s || "").replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function render() {
      if (view.page === "home") renderHome();
      else if (view.page === "folder") renderFolder();
      else if (view.page === "quiz") renderQuiz();
      else renderStudy();
    }

    function renderHome() {
      headerSub.textContent = "Pick a folder or make a new set";
      headerActions.innerHTML = `
        <button class="secondary" id="exportBtn">Export</button>
        <button class="secondary" id="importBtn">Import</button>
        <button class="gold" id="newFolderBtn">New folder</button>
      `;
      const folders = state.folders.map((f) => {
        const all = cardsIn(f.id);
        const retired = all.filter((c) => prog(c.id).retired).length;
        return `
          <div class="card folder-card" data-open="${f.id}">
            <h3>${escaped(f.name)}</h3>
            <div class="muted">${all.length} cards · ${retired} mastered</div>
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="grid">${folders || `<div class="empty">No folders yet.</div>`}</div>
        <footer class="note">Cards are saved in this browser only. Export a backup if you study on more than one computer.</footer>
        <input id="importFile" type="file" accept="application/json" hidden />
      `;
      document.getElementById("newFolderBtn").onclick = () => openFolderForm();
      document.getElementById("exportBtn").onclick = exportData;
      document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
      document.getElementById("importFile").onchange = importData;
      app.querySelectorAll("[data-open]").forEach((el) => {
        el.onclick = () => {
          view.page = "folder";
          view.folderId = el.dataset.open;
          render();
        };
      });
    }

    function renderFolder() {
      const folder = folderById(view.folderId);
      if (!folder) { view.page = "home"; return render(); }
      const all = cardsIn(folder.id);
      const retired = all.filter((c) => prog(c.id).retired).length;
      const left = all.length - retired;
      headerSub.textContent = folder.name;
      headerActions.innerHTML = `
        <button class="secondary" id="backHome">All folders</button>
        <button class="secondary" id="renameFolder">Rename</button>
        <button class="danger" id="deleteFolder">Delete folder</button>
      `;
      const list = all.map((c) => {
        const p = prog(c.id);
        const tag = p.retired ? "mastered" : (p.streak ? `${p.streak} in a row` : "active");
        return `
          <div class="list-item">
            <div>
              <strong>${escaped(c.front)}</strong>
              <span class="pill">${tag}</span>
              <div class="muted">${escaped(c.subtitle || c.year || c.note || c.extra || "")}</div>
            </div>
            <div class="row">
              <button class="secondary" data-edit="${c.id}">Edit</button>
              <button class="danger" data-del="${c.id}">Delete</button>
            </div>
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between">
            <div>
              <div class="muted">${left} in the mix · ${retired} pulled out after ${RETIRE_AFTER} correct in a row</div>
            </div>
            <div class="row">
              <button class="secondary" id="resetBtn">Reset progress</button>
              <button class="secondary" id="addCardBtn">New card</button>
              <button class="secondary" id="quizBtn" ${left ? "" : "disabled"}>Multiple choice</button>
              <button class="gold" id="studyBtn" ${left ? "" : "disabled"}>Study shuffled</button>
            </div>
          </div>
        </div>
        <div class="card" style="margin-top:12px">${list || `<div class="empty">No cards in this folder yet.</div>`}</div>
      `;
      document.getElementById("backHome").onclick = () => { view.page = "home"; render(); };
      document.getElementById("renameFolder").onclick = () => openFolderForm(folder);
      document.getElementById("deleteFolder").onclick = () => {
        if (!confirm("Delete this folder and all of its cards?")) return;
        state.cards = state.cards.filter((c) => c.folderId !== folder.id);
        state.folders = state.folders.filter((f) => f.id !== folder.id);
        save();
        view.page = "home";
        render();
      };
      document.getElementById("resetBtn").onclick = () => {
        all.forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
        save();
        render();
      };
      document.getElementById("addCardBtn").onclick = () => openCardForm();
      document.getElementById("studyBtn").onclick = startStudy;
      document.getElementById("quizBtn").onclick = startQuiz;
      app.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => openCardForm(state.cards.find((c) => c.id === b.dataset.edit)));
      app.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
        if (!confirm("Delete this card?")) return;
        state.cards = state.cards.filter((c) => c.id !== b.dataset.del);
        delete state.progress[b.dataset.del];
        save();
        render();
      });
    }

    function startStudy() {
      const queue = shuffle(activeCards(view.folderId));
      if (!queue.length) return;
      view.page = "study";
      view.queue = queue.map((c) => c.id);
      view.index = 0;
      view.flipped = false;
      render();
    }

    function cardAnswerText(c) {
      const body = String(c.answer || c.purpose || "").trim();
      const pts = c.points || c.protections || [];
      if (body) return body;
      return pts.join("; ");
    }

    function makeChoices(card) {
      const correct = cardAnswerText(card);
      const pool = cardsIn(view.folderId)
        .filter((c) => c.id !== card.id)
        .map(cardAnswerText)
        .filter((text) => text && text !== correct);
      const unique = [];
      pool.forEach((text) => {
        if (!unique.includes(text)) unique.push(text);
      });
      const wrong = shuffle(unique).slice(0, 3);
      return shuffle([{ text: correct, correct: true }].concat(wrong.map((text) => ({ text, correct: false }))));
    }

    function startQuiz(ids) {
      const source = ids && ids.length ? ids : cardsIn(view.folderId).map((c) => c.id);
      const queue = shuffle(source.map((id) => state.cards.find((c) => c.id === id)).filter(Boolean));
      if (!queue.length) return;
      if (cardsIn(view.folderId).length < 2) {
        alert("Add at least 2 cards in this folder so the quiz can invent wrong answers.");
        return;
      }
      view.page = "quiz";
      view.queue = queue.map((c) => c.id);
      if (!ids) view.quizSource = view.queue.slice();
      view.quizTotal = view.queue.length;
      view.index = 0;
      view.picked = null;
      view.score = 0;
      view.asked = 0;
      view.run = 0;
      view.missed = [];
      view.choices = makeChoices(queue[0]);
      render();
    }

    function currentCard() {
      const id = view.queue[view.index];
      return state.cards.find((c) => c.id === id);
    }

    function renderStudy() {
      const folder = folderById(view.folderId);
      const all = cardsIn(view.folderId);
      const left = activeCards(view.folderId).length;
      const retired = all.length - left;
      headerSub.textContent = folder ? folder.name : "Study";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
        <button class="secondary" id="resetStudy">Reset progress</button>
      `;

      if (!view.queue.length || left === 0) {
        app.innerHTML = `
          <div class="empty card">
            <h2>This folder is clear</h2>
            <p>Every card has been answered correctly ${RETIRE_AFTER} times in a row.</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="resetDone">Reset and study again</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("exitStudy").onclick = backToFolder;
        document.getElementById("resetStudy").onclick = resetAndStay;
        document.getElementById("resetDone").onclick = resetAndStay;
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { startStudy(); return; }
      const p = prog(card.id);
      const pct = all.length ? Math.round((retired / all.length) * 100) : 0;
      const body = view.flipped ? `
        <div class="flash back" id="flipCard">
          <div class="hint">Answer · tap to hide</div>
          ${card.subtitle || card.year ? `<div class="muted">${escaped(card.subtitle || card.year)}${card.note || card.extra ? " · " + escaped(card.note || card.extra) : ""}</div>` : (card.note || card.extra ? `<div class="muted">${escaped(card.note || card.extra)}</div>` : "")}
          ${card.answer || card.purpose ? `<p>${escaped(card.answer || card.purpose)}</p>` : ""}
          ${(card.points || card.protections || []).length ? `<ul>${(card.points || card.protections || []).map((x) => `<li>${escaped(x)}</li>`).join("")}</ul>` : ""}
        </div>
      ` : `
        <div class="flash" id="flipCard">
          <div class="hint">Front · tap to flip</div>
          <h2>${escaped(card.front)}</h2>
          ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          ${card.note || card.extra ? `<div class="muted" style="color:#c5d0dc;margin-top:8px">${escaped(card.note || card.extra)}</div>` : ""}
        </div>
      `;
      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Card ${view.index + 1} of ${view.queue.length} in this shuffle</span>
              <span class="muted">${left} still in the mix · streak ${p.streak}/${RETIRE_AFTER}</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          ${body}
          <div class="row" style="justify-content:center">
            <button class="secondary" id="flipBtn">${view.flipped ? "Hide answer" : "Show answer"}</button>
            <button class="bad" id="missBtn" ${view.flipped ? "" : "disabled"}>Missed it</button>
            <button class="ok" id="gotBtn" ${view.flipped ? "" : "disabled"}>Got it</button>
          </div>
        </div>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;
      document.getElementById("resetStudy").onclick = resetAndStay;
      document.getElementById("flipCard").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("flipBtn").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("gotBtn").onclick = () => grade(true);
      document.getElementById("missBtn").onclick = () => grade(false);
    }

    function renderQuiz() {
      const folder = folderById(view.folderId);
      headerSub.textContent = folder ? folder.name + " · quiz" : "Quiz";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;

      if (view.index >= view.quizTotal) {
        const missedCount = view.missed.length;
        app.innerHTML = `
          <div class="empty card">
            <h2>Quiz complete</h2>
            <p>You got ${view.score} of ${view.asked} right.</p>
            <p class="muted">${missedCount ? missedCount + " missed" : "No misses"}</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="quizAgain">Retake full quiz</button>
              <button class="secondary" id="quizMissed" ${missedCount ? "" : "disabled"}>Practice missed</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("quizAgain").onclick = () => startQuiz(view.quizSource);
        document.getElementById("quizMissed").onclick = () => startQuiz(view.missed);
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { view.index = view.quizTotal; render(); return; }
      const locked = view.picked !== null;
      const choiceHtml = view.choices.map((choice, i) => {
        let cls = "choice";
        if (locked && choice.correct) cls += " correct";
        else if (locked && view.picked === i && !choice.correct) cls += " wrong";
        else if (locked) cls += " idle";
        return `<button class="${cls}" data-choice="${i}" ${locked ? "disabled" : ""}>${escaped(choice.text)}</button>`;
      }).join("");
      const pct = view.quizTotal ? Math.round((view.asked / view.quizTotal) * 100) : 0;

      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Question ${view.index + 1} of ${view.quizTotal}</span>
              <span class="muted">${view.score} correct · ${view.run} in a row</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          <div class="flash quiz">
            <div class="hint">Choose the best answer</div>
            <h2>${escaped(card.front)}</h2>
            ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          </div>
          <div class="choices">${choiceHtml}</div>
          ${locked ? `<div class="row" style="justify-content:center"><button class="gold" id="nextQuiz">${view.index + 1 >= view.quizTotal ? "See results" : "Next"}</button></div>` : ""}
        </div>
      `;
      app.querySelectorAll("[data-choice]").forEach((btn) => {
        btn.onclick = () => {
          const i = Number(btn.dataset.choice);
          view.picked = i;
          view.asked += 1;
          const correct = view.choices[i].correct;
          if (correct) {
            view.score += 1;
            view.run += 1;
          } else {
            view.run = 0;
            if (!view.missed.includes(card.id)) view.missed.push(card.id);
          }
          render();
        };
      });
      const next = document.getElementById("nextQuiz");
      if (next) next.onclick = nextQuiz;
    }

    function nextQuiz() {
      view.index += 1;
      view.picked = null;
      if (view.index < view.quizTotal) {
        const card = currentCard();
        view.choices = card ? makeChoices(card) : [];
      }
      render();
    }

    function markResult(correct) {
      const card = currentCard();
      if (!card) return;
      const p = prog(card.id);
      if (correct) {
        p.streak += 1;
        if (p.streak >= RETIRE_AFTER) p.retired = true;
      } else {
        p.streak = 0;
        p.retired = false;
      }
      save();
    }

    function grade(correct) {
      markResult(correct);
      const remainingIds = view.queue.filter((id, i) => i !== view.index && !prog(id).retired);
      if (!remainingIds.length) {
        view.queue = shuffle(activeCards(view.folderId)).map((c) => c.id);
        view.index = 0;
      } else {
        view.queue = remainingIds;
        view.index = view.index >= view.queue.length ? 0 : view.index;
      }
      view.flipped = false;
      render();
    }

    function backToFolder() {
      view.page = "folder";
      render();
    }
    function resetAndStay() {
      cardsIn(view.folderId).forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
      save();
      startStudy();
    }

    function openFolderForm(folder) {
      modal.innerHTML = `
        <div class="dialog-head">${folder ? "Rename folder" : "New folder"}</div>
        <div class="dialog-body">
          <label>Folder name</label>
          <input id="folderName" type="text" value="${escaped(folder ? folder.name : "")}" />
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveFolder">Save</button>
          </div>
        </div>
      `;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("saveFolder").onclick = () => {
        const name = document.getElementById("folderName").value.trim();
        if (!name) return;
        if (folder) folder.name = name;
        else state.folders.push({ id: uid(), name });
        save();
        modal.close();
        render();
      };
    }

    function openCardForm(card) {
      const subtitle = card ? (card.subtitle || card.year || "") : "";
      const note = card ? (card.note || card.extra || "") : "";
      const answer = card ? (card.answer || card.purpose || "") : "";
      const points = card ? (card.points || card.protections || []) : [];
      modal.innerHTML = `
        <div class="dialog-head">${card ? "Edit card" : "New card"}</div>
        <div class="dialog-body">
          <label>Front (prompt or question)</label>
          <input id="cardFront" type="text" value="${escaped(card ? card.front : "")}" />
          <label>Subtitle (optional)</label>
          <input id="cardSubtitle" type="text" value="${escaped(subtitle)}" placeholder="Year, unit, topic..." />
          <label>Small note (optional)</label>
          <input id="cardNote" type="text" value="${escaped(note)}" />
          <label>Back (answer)</label>
          <textarea id="cardAnswer">${escaped(answer)}</textarea>
          <label>Extra points on the back (optional, one per line)</label>
          <textarea id="cardPoints">${escaped(points.join("\n"))}</textarea>
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveCard">Save card</button>
          </div>
        </div>
      `;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("saveCard").onclick = () => {
        const front = document.getElementById("cardFront").value.trim();
        const answer = document.getElementById("cardAnswer").value.trim();
        const points = document.getElementById("cardPoints").value.split("\n").map((s) => s.trim()).filter(Boolean);
        const subtitle = document.getElementById("cardSubtitle").value.trim();
        const note = document.getElementById("cardNote").value.trim();
        if (!front || !answer) return;
        const payload = { front, subtitle, note, answer, points, year: subtitle, extra: note, purpose: answer, protections: points };
        if (card) Object.assign(card, payload);
        else state.cards.push({ id: uid(), folderId: view.folderId, ...payload });
        save();
        modal.close();
        render();
      };
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flashcards-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data.folders || !data.cards) throw new Error("bad file");
          state = data;
          state.progress = state.progress || {};
          save();
          view.page = "home";
          render();
        } catch {
          alert("That file could not be imported.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    window.onerror = function(msg) {
      const app = document.getElementById("app");
      if (app) app.innerHTML = "<div class=\"card\"><strong>Something broke.</strong><div class=\"muted\">"+String(msg)+"</div></div>";
    };
    try { render(); } catch (err) { window.onerror(err && err.message ? err.message : err); }
  </script>
</body>
</html>
