<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flash Cards</title>
  <style>
    :root {
      --navy: #1b365d;
      --navy-2: #12243f;
      --gold: #c4a35a;
      --cream: #f7f3ea;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --line: #d8dee6;
      --ok: #2f6f4e;
      --bad: #8b3a3a;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(18, 36, 63, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Calibri, system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    header .sub { color: #c5d0dc; font-size: 13px; }
    main { max-width: 920px; margin: 0 auto; padding: 20px; }
    button, select, input, textarea {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
    }
    button.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    button.gold { background: var(--gold); color: var(--navy-2); font-weight: 650; }
    button.ok { background: var(--ok); }
    button.bad { background: var(--bad); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid #e3c4c4; }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .folder-card { cursor: pointer; }
    .folder-card:hover { border-color: var(--gold); }
    .folder-card h3 { margin: 0 0 6px; font-size: 17px; }
    .muted { color: var(--muted); font-size: 13px; }
    .study-wrap { min-height: 62vh; display: flex; flex-direction: column; gap: 14px; }
    .flash {
      flex: 1;
      min-height: 320px;
      background: var(--navy);
      color: #fff;
      border-radius: 22px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
    }
    .flash.back {
      background: #fff;
      color: var(--ink);
      text-align: left;
      align-items: stretch;
      justify-content: flex-start;
    }
    .flash .hint {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .flash h2 { margin: 18px 0 8px; font-size: 28px; line-height: 1.2; }
    .flash .subtitle { color: var(--gold); font-size: 20px; font-weight: 700; }
    .flash.back h2 { font-size: 20px; margin: 8px 0 4px; color: var(--navy); }
    .flash.back .label {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-top: 10px;
    }
    .flash.back p, .flash.back li { line-height: 1.45; }
    .flash.back ul { margin: 6px 0 0; padding-left: 18px; }
    .progress-bar {
      height: 8px;
      background: #e6e1d6;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--gold);
    }
    label { display: block; font-size: 13px; font-weight: 650; margin: 10px 0 4px; }
    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(560px, 92vw);
    }
    dialog::backdrop { background: rgba(18, 36, 63, 0.45); }
    .dialog-body { padding: 18px; }
    .dialog-head {
      background: var(--navy);
      color: #fff;
      padding: 14px 18px;
      font-weight: 650;
    }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      background: #efe7d4;
      color: var(--navy-2);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 6px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .list-item:last-child { border-bottom: 0; }
    footer.note { margin-top: 28px; color: var(--muted); font-size: 12px; }
    .choices { display: grid; gap: 10px; }
    button.choice {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      text-align: left;
      font-weight: 500;
      line-height: 1.35;
      padding: 12px 14px;
    }
    button.choice:hover:not(:disabled) { border-color: var(--gold); }
    button.choice.correct { background: #e5f4ea; border-color: var(--ok); color: var(--ok); }
    button.choice.wrong { background: #f8eaea; border-color: var(--bad); color: var(--bad); }
    button.choice.idle { opacity: 0.55; }
    .flash.quiz {
      min-height: 180px;
      cursor: default;
    }
    textarea.short { min-height: 64px; }
    .flash.scenario { align-items: stretch; text-align: left; justify-content: center; }
    .flash.scenario .hint { text-align: center; }
    .scenario-text { font-size: 19px; line-height: 1.5; white-space: pre-line; margin-top: 18px; }
    .explain {
      border-radius: 12px; padding: 12px 14px; line-height: 1.45; border: 1px solid var(--line); background: #fff;
    }
    .explain.ok { border-color: var(--ok); background: #eef7f1; }
    .explain.bad { border-color: var(--bad); background: #fbf1f1; }
    .explain.ok strong { color: var(--ok); }
    .explain.bad strong { color: var(--bad); }
    .explain p { margin: 6px 0 0; }
    .pill.scen { background: var(--navy); color: #fff; }
    button { touch-action: manipulation; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px);
      background: var(--navy-2); color: #fff; border-left: 4px solid var(--gold);
      padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: all .25s ease; max-width: 92vw; z-index: 50; font-size: 14px;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Flash Cards</h1>
      <div class="sub" id="headerSub">Folders stay on this device</div>
    </div>
    <div class="row" id="headerActions"></div>
  </header>
  <main id="app"></main>
  <dialog id="modal"></dialog>

  <script>
    const STORE_KEY = "flashcards.v1";
    const RETIRE_AFTER = 3;

    const DEFAULT_CARDS = [
      { front: "National Labor Relations Act (NLRA)", year: "1935", extra: "Wagner Act", purpose: "Protects private-sector employees’ rights to organize, form or join unions, bargain collectively, and engage in concerted activity.", protections: ["Right to unionize and bargain collectively", "Right to strike and take other concerted action", "Prohibits employer unfair labor practices (firing for union activity, interference, refusal to bargain)", "Created the National Labor Relations Board (NLRB)"] },
      { front: "Fair Labor Standards Act (FLSA)", year: "1938", purpose: "Sets nationwide wage-and-hour rules so workers are paid fairly and children are not exploited in the workplace.", protections: ["Federal minimum wage", "Overtime pay (typically 1.5× after 40 hours in a workweek for nonexempt employees)", "Child labor restrictions on age, hours, and hazardous work", "Employer recordkeeping requirements"] },
      { front: "Equal Pay Act", year: "1963", purpose: "Requires that men and women in the same workplace be given equal pay for equal work.", protections: ["Prohibits sex-based wage discrimination", "Covers jobs that require substantially equal skill, effort, and responsibility under similar working conditions", "Pay differences must be based on a factor other than sex (seniority, merit, quantity/quality of production)"] },
      { front: "Title VII of the Civil Rights Act", year: "1964", purpose: "Prohibits employment discrimination and created a federal enforcement path through the EEOC.", protections: ["Bars discrimination based on race, color, religion, sex, or national origin", "Applies to hiring, firing, pay, promotion, and other terms of employment", "Covers harassment and retaliation for complaining about discrimination", "Generally applies to employers with 15 or more employees"] },
      { front: "Age Discrimination in Employment Act (ADEA)", year: "1967", purpose: "Protects older workers from employment decisions based on age rather than ability.", protections: ["Prohibits age discrimination against people 40 and older", "Covers hiring, firing, pay, promotions, layoffs, and benefits", "Generally applies to employers with 20 or more employees"] },
      { front: "Rehabilitation Act", year: "1973", purpose: "Prohibits disability discrimination by the federal government, federal contractors, and programs that receive federal funds.", protections: ["Bars discrimination against qualified people with disabilities", "Requires reasonable accommodation in covered programs and federal employment", "Section 503 requires affirmative action by certain federal contractors", "Predecessor to many ADA concepts"] },
      { front: "Vietnam Era Veterans’ Readjustment Assistance Act (VEVRAA)", year: "1974", extra: "Amended in 2002 by the Jobs for Veterans Act", purpose: "Protects covered veterans in employment with federal contractors and requires proactive hiring efforts.", protections: ["Prohibits discrimination against disabled veterans and other covered veteran categories", "Requires affirmative action for those veterans by covered federal contractors"] },
      { front: "Pregnancy Discrimination Act", year: "1978", purpose: "Makes clear that discrimination because of pregnancy is a form of sex discrimination.", protections: ["Prohibits discrimination for all employment-related purposes on the basis of pregnancy, childbirth, or related medical conditions", "Pregnant workers must be treated the same as other employees similar in their ability or inability to work"] },
      { front: "Consolidated Omnibus Budget Reconciliation Act (COBRA)", year: "1986", purpose: "Lets workers and their families keep group health coverage for a limited time after a job or coverage-ending event.", protections: ["Employers with group health plans and 20 or more employees in the prior year must offer continued health and dental insurance to terminated employees for limited periods", "Coverage is typically at the employee’s expense (plus a small admin fee)"] },
      { front: "Immigration Reform and Control Act (IRCA)", year: "1986", purpose: "Created a legalization path for certain undocumented immigrants and made it illegal to knowingly hire unauthorized workers.", protections: ["Legalized certain seasonal agricultural undocumented immigrants", "Legalized people who entered before Jan. 1, 1982 and lived here continuously (fine, back taxes, and admission of guilt)", "Applicants had to show no disqualifying crimes, pre-1982 presence, and minimal knowledge of U.S. history, government, and English", "Requires employers to verify work authorization (Form I-9) and bars knowing hire of unauthorized workers", "Also prohibits citizenship-status and national-origin discrimination in hiring and firing in many cases"] },
      { front: "Worker Adjustment and Retraining Notification Act (WARN)", year: "1988", purpose: "Gives workers advance notice of large job losses so they can prepare and look for other work.", protections: ["Employers with at least 100 employees must give at least 60 days’ notice of plant closings or mass layoffs of 50 or more people (excluding part-time workers)"] },
      { front: "Americans with Disabilities Act (ADA)", year: "1990", extra: "Amended in 2008", purpose: "Prohibits disability discrimination in employment and public life and requires fair treatment of qualified individuals.", protections: ["Prohibits discrimination against a qualified individual with a disability, or someone perceived as having a disability", "Focus on fair treatment and reasonable accommodation", "Covers hiring, firing, pay, promotions, and job conditions"] },
      { front: "Family and Medical Leave Act (FMLA)", year: "1993", purpose: "Gives eligible employees unpaid, job-protected leave for serious health and family-care needs.", protections: ["Requires leave and job-return for personal or family medical reasons", "Covers care of a newborn or newly adopted child", "Typically up to 12 weeks of unpaid leave in a 12-month period for eligible employees of covered employers"] },
      { front: "Uniformed Services Employment and Reemployment Rights Act (USERRA)", year: "1994", purpose: "Protects the civilian jobs of people who serve in the uniformed services.", protections: ["Members of the uniformed services are entitled to return to their civilian employment after service", "Prohibits discrimination based on military service or obligation", "Preserves seniority and certain benefits upon reemployment"] },
      { front: "Health Insurance Portability and Accountability Act (HIPAA)", year: "1996", purpose: "Sets national rules for how health information is shared, kept private, and kept secure.", protections: ["Provides standards for the electronic exchange, privacy, and security of health information", "Limits how covered entities use and disclose protected health information", "Gives people rights to access and request corrections to their health records"] },
      { front: "Genetic Information Nondiscrimination Act (GINA)", year: "2008", purpose: "Keeps genetic test results and family medical history out of employment decisions.", protections: ["Prohibits employers from discriminating based on genetic testing results when making hiring, firing, job placement, or promotion decisions", "Generally bars employers from requesting or requiring genetic information"] },
      { front: "Patient Protection and Affordable Care Act (ACA)", year: "2010", purpose: "Was created to make healthcare more affordable and more easily accessible to a wider range of Americans.", protections: ["Businesses with fewer than 50 full-time employees do not have to provide health insurance for employees", "Businesses with fewer than 25 employees may receive tax breaks for complying with the ACA", "Expanded access to coverage and consumer protections in the individual and small-group markets"] }
    ];

    // Decks baked into this file by build.sh from decks/inbox/*.json. Keep the marker comments intact.
    const BUNDLED_DECKS = /*BUNDLED_DECKS_START*/[]/*BUNDLED_DECKS_END*/;
    const BUILD_INFO = /*BUILD_INFO_START*/null/*BUILD_INFO_END*/;

    const uid = () => crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);

    function seed() {
      const folderId = uid();
      return {
        folders: [{ id: folderId, name: "U.S. Employment Law" }],
        cards: DEFAULT_CARDS.map((c) => ({
          id: uid(),
          folderId,
          front: c.front,
          year: c.year || "",
          extra: c.extra || "",
          purpose: c.purpose,
          protections: c.protections
        })),
        progress: {}
      };
    }

    // Bring any saved/imported state up to the current shape without dropping anything.
    // Older saves (v1: folders/cards/progress only) gain the newer optional fields with defaults.
    function migrate(data) {
      const out = data && typeof data === "object" ? data : {};
      out.folders = Array.isArray(out.folders) ? out.folders.filter((f) => f && typeof f === "object") : [];
      out.cards = Array.isArray(out.cards) ? out.cards.filter((c) => c && typeof c === "object") : [];
      out.progress = out.progress && typeof out.progress === "object" && !Array.isArray(out.progress) ? out.progress : {};
      out.bundled = out.bundled && typeof out.bundled === "object" && !Array.isArray(out.bundled) ? out.bundled : {};
      out.folders.forEach((f) => {
        if (f.id === undefined || f.id === null || f.id === "") f.id = uid();
        f.id = String(f.id);
        if (typeof f.name !== "string" || !f.name.trim()) f.name = f.name ? String(f.name) : "Untitled folder";
      });
      out.cards.forEach((c) => {
        if (c.id === undefined || c.id === null || c.id === "") c.id = uid();
        c.id = String(c.id);
        if (c.folderId !== undefined && c.folderId !== null) c.folderId = String(c.folderId);
        if (typeof c.front !== "string") c.front = c.front === undefined || c.front === null ? "" : String(c.front);
      });
      Object.keys(out.progress).forEach((k) => {
        const p = out.progress[k];
        if (!p || typeof p !== "object") { out.progress[k] = { streak: 0, retired: false }; return; }
        p.streak = Number.isFinite(Number(p.streak)) ? Number(p.streak) : 0;
        p.retired = !!p.retired;
      });
      out.schema = 2;
      return out;
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return migrate(seed());
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.folders) || !Array.isArray(data.cards)) return migrate(seed());
        return migrate(data);
      } catch {
        // Keep an unreadable save around instead of silently losing it.
        try {
          const raw = localStorage.getItem(STORE_KEY);
          if (raw) localStorage.setItem(STORE_KEY + ".unreadable-" + Date.now(), raw);
        } catch {}
        return migrate(seed());
      }
    }

    function save() {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    }

    /* ---------- Merge engine (used by Import and by bundled decks) ---------- */
    function cleanStr(v) { return v === undefined || v === null ? "" : String(v).trim(); }
    function cleanList(v) {
      if (Array.isArray(v)) return v.map(cleanStr).filter(Boolean);
      return cleanStr(v) ? [cleanStr(v)] : [];
    }
    function isScenario(c) { return !!c && c.type === "scenario" && Array.isArray(c.choices) && c.choices.length >= 2; }
    // Comparable content of a card (understands legacy year/extra/purpose/protections fields).
    function contentKey(c) {
      return JSON.stringify([
        cleanStr(c.front), cleanStr(c.subtitle || c.year), cleanStr(c.note || c.extra), cleanStr(c.answer || c.purpose),
        cleanList(c.points || c.protections), c.type === "scenario" ? "scenario" : "",
        c.type === "scenario" ? cleanList(c.choices) : [], c.type === "scenario" ? Number(c.correct) : null,
        c.type === "scenario" ? cleanStr(c.explanation) : ""
      ]);
    }
    function newSummary() {
      return { foldersAdded: 0, cardsAdded: 0, cardsUpdated: 0, unchanged: 0, skipped: 0, problems: [], decks: [] };
    }

    // Turn one card from a deck file into the app's card shape. Returns { card } or { error }.
    function normalizeDeckCard(raw, deckKey, i) {
      if (!raw || typeof raw !== "object") return { error: "is not an object" };
      const front = cleanStr(raw.front);
      if (!front) return { error: "has no front" };
      const card = {
        id: cleanStr(raw.id) || `${deckKey}-${String(i + 1).padStart(3, "0")}`,
        front,
        subtitle: cleanStr(raw.subtitle),
        note: cleanStr(raw.note),
        answer: cleanStr(raw.answer),
        points: cleanList(raw.points)
      };
      if (raw.type === "scenario") {
        const choices = cleanList(raw.choices);
        if (choices.length < 2) return { error: "is a scenario with fewer than 2 choices" };
        const correct = Number(raw.correct);
        if (!Number.isInteger(correct) || correct < 0 || correct >= choices.length) return { error: "has a 'correct' index outside its choices" };
        card.type = "scenario";
        card.choices = choices;
        card.correct = correct;
        card.explanation = cleanStr(raw.explanation);
      } else if (!card.answer && !card.points.length) {
        return { error: "has no answer" };
      }
      return { card };
    }

    function applyCardContent(target, src) {
      ["front", "subtitle", "note", "answer", "points"].forEach((k) => { target[k] = src[k]; });
      if (src.type === "scenario") {
        target.type = "scenario";
        target.choices = src.choices.slice();
        target.correct = src.correct;
        target.explanation = src.explanation;
      } else {
        delete target.type; delete target.choices; delete target.correct; delete target.explanation;
      }
      // Deck cards use the modern fields only; drop stale legacy copies so they can't disagree.
      delete target.year; delete target.extra; delete target.purpose; delete target.protections;
    }

    function slugify(s) { return cleanStr(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "deck"; }

    // Merge one deck ({id, folder, course, order, cards}) into state. Never deletes anything.
    function mergeDeck(deck, sum) {
      if (!deck || typeof deck !== "object" || !Array.isArray(deck.cards)) throw new Error("A deck needs a \"cards\" list.");
      const deckId = cleanStr(deck.id);
      const name = cleanStr(deck.folder) || cleanStr(deck.name) || deckId || "Imported deck";
      let folder = deckId
        ? state.folders.find((f) => f.deckId === deckId)
        : state.folders.find((f) => !f.deckId && f.name === name);
      if (!folder) {
        let id = deckId ? "deck-" + deckId : uid();
        if (folderById(id)) id = uid();
        folder = { id, name };
        state.folders.push(folder);
        sum.foldersAdded += 1;
      } else if (folder.deckFolderName && folder.deckFolderName !== name && folder.name === folder.deckFolderName) {
        folder.name = name; // deck title changed upstream and the user hadn't renamed it
      }
      if (deckId) folder.deckId = deckId;
      folder.deckFolderName = name;
      if (cleanStr(deck.course)) folder.course = cleanStr(deck.course);
      if (deck.order !== undefined && deck.order !== null && deck.order !== "" && Number.isFinite(Number(deck.order))) folder.order = Number(deck.order);
      const deckKey = deckId || slugify(name);
      const seen = new Set();
      deck.cards.forEach((raw, i) => {
        const res = normalizeDeckCard(raw, deckKey, i);
        if (res.error) { sum.skipped += 1; sum.problems.push(`${name}: card ${i + 1} ${res.error}`); return; }
        const nc = res.card;
        if (seen.has(nc.id)) { sum.skipped += 1; sum.problems.push(`${name}: duplicate card id ${nc.id}`); return; }
        seen.add(nc.id);
        const existing = state.cards.find((c) => c.id === nc.id);
        if (existing) {
          if (existing.folderId !== folder.id || contentKey(existing) !== contentKey(nc)) {
            applyCardContent(existing, nc);
            existing.folderId = folder.id;
            sum.cardsUpdated += 1;
          } else {
            sum.unchanged += 1;
          }
        } else {
          const card = { id: nc.id, folderId: folder.id };
          applyCardContent(card, nc);
          state.cards.push(card);
          sum.cardsAdded += 1;
        }
      });
      sum.decks.push(name);
      return folder;
    }

    function betterProgress(a, b) {
      if (!a) return b;
      if (!b) return a;
      if (!!a.retired !== !!b.retired) return a.retired ? a : b;
      return (Number(b.streak) || 0) > (Number(a.streak) || 0) ? b : a;
    }
    function betterBoss(a, b) {
      if (!a) return b;
      if (!b) return a;
      const best = (Number(b.pct) || 0) > (Number(a.pct) || 0) ? { ...b } : { ...a };
      best.passed = !!(a.passed || b.passed);
      return best;
    }
    function betterMatch(a, b) {
      if (!a) return b;
      if (!b) return a;
      if (a.pairs !== b.pairs) return (b.pairs || 0) > (a.pairs || 0) ? b : a;
      return b.ms < a.ms ? b : a;
    }

    // Merge a full backup ({folders, cards, progress}). Adds what's missing, keeps local card
    // content, keeps the better progress / scores. Never deletes anything.
    function mergeBackup(data, sum) {
      const incoming = migrate(JSON.parse(JSON.stringify(data)));
      const folderMap = {};
      incoming.folders.forEach((f) => {
        let local = folderById(f.id)
          || (f.deckId && state.folders.find((x) => x.deckId === f.deckId))
          || (!f.deckId && state.folders.find((x) => !x.deckId && x.name === f.name));
        if (!local) {
          local = { ...f };
          if (folderById(local.id)) local.id = uid();
          state.folders.push(local);
          sum.foldersAdded += 1;
        } else {
          ["deckId", "deckFolderName", "course", "order"].forEach((k) => {
            if (local[k] === undefined && f[k] !== undefined) local[k] = f[k];
          });
          const bb = betterBoss(local.bestBoss, f.bestBoss); if (bb) local.bestBoss = bb;
          const bm = betterMatch(local.bestMatch, f.bestMatch); if (bm) local.bestMatch = bm;
          if (f.unlocked) local.unlocked = true;
        }
        folderMap[f.id] = local.id;
      });
      incoming.cards.forEach((c) => {
        const folderId = folderMap[c.folderId] !== undefined ? folderMap[c.folderId] : c.folderId;
        const inProg = incoming.progress[c.id];
        let local = state.cards.find((x) => x.id === c.id);
        if (!local) local = state.cards.find((x) => x.folderId === folderId && cleanStr(x.front) === cleanStr(c.front) && (x.type || "") === (c.type || ""));
        if (!local) {
          const card = { ...c, folderId };
          if (state.cards.some((x) => x.id === card.id)) card.id = uid();
          state.cards.push(card);
          if (inProg) state.progress[card.id] = { ...inProg };
          sum.cardsAdded += 1;
        } else {
          const bp = betterProgress(state.progress[local.id], inProg);
          if (bp) state.progress[local.id] = { ...bp };
          sum.unchanged += 1;
        }
      });
    }

    // Figure out what an imported JSON file is and merge it. Atomic: on error nothing changes.
    function classifyImport(data) {
      const items = Array.isArray(data) ? data : (data && Array.isArray(data.decks) && !Array.isArray(data.cards) ? data.decks : [data]);
      return items.map((d) => {
        if (d && typeof d === "object" && Array.isArray(d.folders) && Array.isArray(d.cards)) return { kind: "backup", data: d };
        if (d && typeof d === "object" && Array.isArray(d.cards)) return { kind: "deck", data: d };
        throw new Error("This file isn't a flash card deck or backup.");
      });
    }
    function mergeImport(data) {
      const items = classifyImport(data);
      const before = JSON.stringify(state);
      const sum = newSummary();
      try {
        items.forEach((it) => it.kind === "backup" ? mergeBackup(it.data, sum) : mergeDeck(it.data, sum));
      } catch (err) {
        state = migrate(JSON.parse(before));
        throw err;
      }
      save();
      return sum;
    }
    function summaryText(sum) {
      const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
      return `${plural(sum.foldersAdded, "folder")} added · ${plural(sum.cardsAdded, "card")} added · ${sum.cardsUpdated} updated` +
        (sum.unchanged ? ` · ${sum.unchanged} already up to date` : "") + (sum.skipped ? ` · ${sum.skipped} skipped` : "");
    }

    function hashString(s) {
      let h = 0x811c9dc5;
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 0x01000193) >>> 0;
      }
      return h.toString(16).padStart(8, "0");
    }

    // Merge decks shipped inside this file. Each deck is applied once per content version
    // (hash stored in state.bundled), so a deck the user deleted only comes back if it changed.
    function applyBundledDecks() {
      const sum = newSummary();
      (Array.isArray(BUNDLED_DECKS) ? BUNDLED_DECKS : []).forEach((deck) => {
        if (!deck || typeof deck !== "object" || !Array.isArray(deck.cards)) return;
        const key = cleanStr(deck.id) || cleanStr(deck.folder);
        if (!key) return;
        const h = hashString(JSON.stringify(deck));
        if (state.bundled[key] === h) return;
        mergeDeck(deck, sum);
        state.bundled[key] = h;
      });
      if (sum.decks.length) save();
      return sum;
    }

    let state = load();
    let bundledSummary = null;
    try { bundledSummary = applyBundledDecks(); } catch (err) { console.warn("Bundled decks could not be applied", err); }
    let view = { page: "home", folderId: null, queue: [], index: 0, flipped: false, choices: [], picked: null, score: 0, asked: 0, run: 0, missed: [], quizTotal: 0, quizSource: [] };

    const app = document.getElementById("app");
    const headerSub = document.getElementById("headerSub");
    const headerActions = document.getElementById("headerActions");
    const modal = document.getElementById("modal");

    function folderById(id) { return state.folders.find((f) => f.id === id); }
    function cardsIn(folderId) { return state.cards.filter((c) => c.folderId === folderId); }
    function prog(cardId) {
      if (!state.progress[cardId]) state.progress[cardId] = { streak: 0, retired: false };
      return state.progress[cardId];
    }
    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function activeCards(folderId) {
      return cardsIn(folderId).filter((c) => !prog(c.id).retired);
    }
    function escaped(s) {
      const map = {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"};
      return String(s || "").replace(/[&<>"']/g, (ch) => map[ch]);
    }

    function render() {
      if (view.page === "home") renderHome();
      else if (view.page === "folder") renderFolder();
      else if (view.page === "quiz") renderQuiz();
      else renderStudy();
    }

    function renderHome() {
      headerSub.textContent = "Pick a folder or make a new set";
      headerActions.innerHTML = `
        <button class="secondary" id="exportBtn">Export</button>
        <button class="secondary" id="importBtn">Import</button>
        <button class="gold" id="newFolderBtn">New folder</button>
      `;
      const folders = state.folders.map((f) => {
        const all = cardsIn(f.id);
        const retired = all.filter((c) => prog(c.id).retired).length;
        return `
          <div class="card folder-card" data-open="${f.id}">
            <h3>${escaped(f.name)}</h3>
            <div class="muted">${all.length} cards · ${retired} mastered</div>
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="grid">${folders || `<div class="empty">No folders yet.</div>`}</div>
        <footer class="note">Cards are saved in this browser only. Export a backup if you study on more than one computer.${BUILD_INFO && BUILD_INFO.decks ? ` · Includes ${BUILD_INFO.decks} built-in deck${BUILD_INFO.decks === 1 ? "" : "s"} (updated ${escaped(BUILD_INFO.date)})` : ""}</footer>
      `;
      document.getElementById("newFolderBtn").onclick = () => openFolderForm();
      document.getElementById("exportBtn").onclick = exportData;
      document.getElementById("importBtn").onclick = openImportDialog;
      app.querySelectorAll("[data-open]").forEach((el) => {
        el.onclick = () => {
          view.page = "folder";
          view.folderId = el.dataset.open;
          render();
        };
      });
    }

    function renderFolder() {
      const folder = folderById(view.folderId);
      if (!folder) { view.page = "home"; return render(); }
      const all = cardsIn(folder.id);
      const retired = all.filter((c) => prog(c.id).retired).length;
      const left = all.length - retired;
      headerSub.textContent = folder.name;
      headerActions.innerHTML = `
        <button class="secondary" id="backHome">All folders</button>
        <button class="secondary" id="renameFolder">Rename</button>
        <button class="danger" id="deleteFolder">Delete folder</button>
      `;
      const list = all.map((c) => {
        const p = prog(c.id);
        const tag = p.retired ? "mastered" : (p.streak ? `${p.streak} in a row` : "active");
        const scen = isScenario(c);
        return `
          <div class="list-item">
            <div>
              <strong>${escaped(scen ? truncate(c.front, 140) : c.front)}</strong>
              ${scen ? `<span class="pill scen">scenario</span>` : ""}
              <span class="pill">${tag}</span>
              <div class="muted">${escaped(c.subtitle || c.year || c.note || c.extra || (scen ? c.choices.length + " choices" : ""))}</div>
            </div>
            <div class="row">
              <button class="secondary" data-edit="${c.id}">Edit</button>
              <button class="danger" data-del="${c.id}">Delete</button>
            </div>
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="card">
          <div class="row" style="justify-content:space-between">
            <div>
              <div class="muted">${left} in the mix · ${retired} pulled out after ${RETIRE_AFTER} correct in a row</div>
            </div>
            <div class="row">
              <button class="secondary" id="resetBtn">Reset progress</button>
              <button class="secondary" id="addCardBtn">New card</button>
              <button class="secondary" id="quizBtn" ${left ? "" : "disabled"}>Multiple choice</button>
              <button class="gold" id="studyBtn" ${left ? "" : "disabled"}>Study shuffled</button>
            </div>
          </div>
        </div>
        <div class="card" style="margin-top:12px">${list || `<div class="empty">No cards in this folder yet.</div>`}</div>
      `;
      document.getElementById("backHome").onclick = () => { view.page = "home"; render(); };
      document.getElementById("renameFolder").onclick = () => openFolderForm(folder);
      document.getElementById("deleteFolder").onclick = () => {
        if (!confirm("Delete this folder and all of its cards?")) return;
        state.cards = state.cards.filter((c) => c.folderId !== folder.id);
        state.folders = state.folders.filter((f) => f.id !== folder.id);
        save();
        view.page = "home";
        render();
      };
      document.getElementById("resetBtn").onclick = () => {
        all.forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
        save();
        render();
      };
      document.getElementById("addCardBtn").onclick = () => openCardForm();
      document.getElementById("studyBtn").onclick = startStudy;
      document.getElementById("quizBtn").onclick = () => startQuiz();
      app.querySelectorAll("[data-edit]").forEach((b) => b.onclick = () => openCardForm(state.cards.find((c) => c.id === b.dataset.edit)));
      app.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
        if (!confirm("Delete this card?")) return;
        state.cards = state.cards.filter((c) => c.id !== b.dataset.del);
        delete state.progress[b.dataset.del];
        save();
        render();
      });
    }

    function startStudy() {
      const queue = shuffle(activeCards(view.folderId));
      if (!queue.length) return;
      view.page = "study";
      view.queue = queue.map((c) => c.id);
      view.index = 0;
      view.flipped = false;
      view.studyPicked = null;
      render();
    }

    function cardAnswerText(c) {
      if (isScenario(c)) return cleanStr(c.answer) || cleanStr(c.choices[c.correct]) || cleanStr(c.explanation);
      const body = String(c.answer || c.purpose || "").trim();
      const pts = c.points || c.protections || [];
      if (body) return body;
      return pts.join("; ");
    }

    function truncate(s, n) {
      const t = cleanStr(s).replace(/\s+/g, " ");
      if (t.length <= n) return t;
      const cut = t.slice(0, n);
      const sp = cut.lastIndexOf(" ");
      return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[\s,;:.\-–]+$/, "") + "…";
    }

    // Wrong-answer pool for a regular card: other regular cards in the folder, topped up from
    // the same course if the folder alone is too small. Scenario cards never feed this pool.

    function distractorPool(card) {
      const correct = cardAnswerText(card);
      const folder = folderById(card.folderId);
      const unique = [];
      const add = (cards) => cards.forEach((c) => {
        if (c.id === card.id || isScenario(c)) return;
        const text = cardAnswerText(c);
        if (text && text !== correct && !unique.includes(text)) unique.push(text);
      });
      add(cardsIn(card.folderId));
      if (unique.length < 3 && folder && folder.course) {
        const extra = [];
        state.folders.filter((f) => f.id !== folder.id && f.course === folder.course).forEach((f) => extra.push(...cardsIn(f.id)));
        add(shuffle(extra));
      }
      return unique;
    }

    function makeChoices(card) {
      if (isScenario(card)) {
        // Keep the author's order (Legal / Illegal / Depends style sets read best as written).
        return card.choices.map((text, i) => ({ text, correct: i === Number(card.correct) }));
      }
      const correct = cardAnswerText(card);
      const wrong = shuffle(distractorPool(card)).slice(0, 3);
      return shuffle([{ text: correct, correct: true }].concat(wrong.map((text) => ({ text, correct: false }))));
    }

    function startQuiz(ids) {
      const source = ids && ids.length ? ids : cardsIn(view.folderId).map((c) => c.id);
      const queue = shuffle(source.map((id) => state.cards.find((c) => c.id === id)).filter(Boolean));
      if (!queue.length) return;
      if (queue.some((c) => !isScenario(c) && distractorPool(c).length < 1)) {
        alert("Add at least 2 regular (non-scenario) cards in this folder so the quiz can invent wrong answers.");
        return;
      }
      view.page = "quiz";
      view.queue = queue.map((c) => c.id);
      if (!ids || view.quizFolder !== view.folderId) {
        view.quizSource = cardsIn(view.folderId).map((c) => c.id);
        view.quizFolder = view.folderId;
      }
      view.quizTotal = view.queue.length;
      view.index = 0;
      view.picked = null;
      view.score = 0;
      view.asked = 0;
      view.run = 0;
      view.missed = [];
      view.choices = makeChoices(queue[0]);
      render();
    }

    function currentCard() {
      const id = view.queue[view.index];
      return state.cards.find((c) => c.id === id);
    }

    function feedbackBox(card, ok) {
      const correctText = isScenario(card) ? card.choices[card.correct] : cardAnswerText(card);
      const why = isScenario(card) ? (cleanStr(card.explanation) || cleanStr(card.answer)) : "";
      return `
        <div class="explain ${ok ? "ok" : "bad"}" id="explainBox">
          <strong>${ok ? "Correct" : "Not quite"}</strong>${ok ? "" : ` · Best answer: <em>${escaped(correctText)}</em>`}
          ${why ? `<p>${escaped(why)}</p>` : ""}
        </div>`;
    }

    function scenarioPrompt(card, hint) {
      return `
        <div class="flash quiz scenario">
          <div class="hint">${escaped(hint)}</div>
          ${card.subtitle ? `<div class="subtitle" style="font-size:15px;margin-top:14px">${escaped(card.subtitle)}</div>` : ""}
          <div class="scenario-text">${escaped(card.front)}</div>
        </div>`;
    }

    function renderStudy() {
      const folder = folderById(view.folderId);
      const all = cardsIn(view.folderId);
      const left = activeCards(view.folderId).length;
      const retired = all.length - left;
      const pendingScenario = view.studyPicked !== null && view.studyPicked !== undefined;
      headerSub.textContent = folder ? folder.name : "Study";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
        <button class="secondary" id="resetStudy">Reset progress</button>
      `;

      if ((!view.queue.length || left === 0) && !pendingScenario) {
        app.innerHTML = `
          <div class="empty card">
            <h2>This folder is clear</h2>
            <p>Every card has been answered correctly ${RETIRE_AFTER} times in a row.</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="resetDone">Reset and study again</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("exitStudy").onclick = backToFolder;
        document.getElementById("resetStudy").onclick = resetAndStay;
        document.getElementById("resetDone").onclick = resetAndStay;
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { startStudy(); return; }
      const p = prog(card.id);
      const pct = all.length ? Math.round((retired / all.length) * 100) : 0;
      const top = `
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Card ${view.index + 1} of ${view.queue.length} in this shuffle</span>
              <span class="muted">${left} still in the mix · streak ${p.streak}/${RETIRE_AFTER}</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>`;

      if (isScenario(card)) {
        const locked = pendingScenario;
        const choiceHtml = card.choices.map((text, i) => {
          let cls = "choice";
          if (locked && i === Number(card.correct)) cls += " correct";
          else if (locked && i === view.studyPicked) cls += " wrong";
          else if (locked) cls += " idle";
          return `<button class="${cls}" data-spick="${i}" ${locked ? "disabled" : ""}>${escaped(text)}</button>`;
        }).join("");
        app.innerHTML = `
          <div class="study-wrap">
            ${top}
            ${scenarioPrompt(card, "Scenario · choose the best answer")}
            <div class="choices">${choiceHtml}</div>
            ${locked ? feedbackBox(card, view.studyPicked === Number(card.correct)) : ""}
            <div class="row" style="justify-content:center">
              ${locked ? `<button class="gold" id="nextStudy">Next</button>` : `<span class="muted">Pick an answer, it's graded automatically</span>`}
            </div>
          </div>`;
        document.getElementById("exitStudy").onclick = backToFolder;
        document.getElementById("resetStudy").onclick = resetAndStay;
        app.querySelectorAll("[data-spick]").forEach((btn) => {
          btn.onclick = () => {
            if (view.studyPicked !== null && view.studyPicked !== undefined) return;
            view.studyPicked = Number(btn.dataset.spick);
            markResult(view.studyPicked === Number(card.correct));
            render();
          };
        });
        const next = document.getElementById("nextStudy");
        if (next) next.onclick = () => { view.studyPicked = null; advanceStudy(); };
        return;
      }

      const body = view.flipped ? `
        <div class="flash back" id="flipCard">
          <div class="hint">Answer · tap to hide</div>
          ${card.subtitle || card.year ? `<div class="muted">${escaped(card.subtitle || card.year)}${card.note || card.extra ? " · " + escaped(card.note || card.extra) : ""}</div>` : (card.note || card.extra ? `<div class="muted">${escaped(card.note || card.extra)}</div>` : "")}
          ${card.answer || card.purpose ? `<p>${escaped(card.answer || card.purpose)}</p>` : ""}
          ${(card.points || card.protections || []).length ? `<ul>${(card.points || card.protections || []).map((x) => `<li>${escaped(x)}</li>`).join("")}</ul>` : ""}
        </div>
      ` : `
        <div class="flash" id="flipCard">
          <div class="hint">Front · tap to flip</div>
          <h2>${escaped(card.front)}</h2>
          ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          ${card.note || card.extra ? `<div class="muted" style="color:#c5d0dc;margin-top:8px">${escaped(card.note || card.extra)}</div>` : ""}
        </div>
      `;
      app.innerHTML = `
        <div class="study-wrap">
          ${top}
          ${body}
          <div class="row" style="justify-content:center">
            <button class="secondary" id="flipBtn">${view.flipped ? "Hide answer" : "Show answer"}</button>
            <button class="bad" id="missBtn" ${view.flipped ? "" : "disabled"}>Missed it</button>
            <button class="ok" id="gotBtn" ${view.flipped ? "" : "disabled"}>Got it</button>
          </div>
        </div>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;
      document.getElementById("resetStudy").onclick = resetAndStay;
      document.getElementById("flipCard").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("flipBtn").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("gotBtn").onclick = () => grade(true);
      document.getElementById("missBtn").onclick = () => grade(false);
    }

    function renderQuiz() {
      const folder = folderById(view.folderId);
      headerSub.textContent = folder ? folder.name + " · quiz" : "Quiz";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;

      if (view.index >= view.quizTotal) {
        const missedCount = view.missed.length;
        app.innerHTML = `
          <div class="empty card">
            <h2>Quiz complete</h2>
            <p>You got ${view.score} of ${view.asked} right.</p>
            <p class="muted">${missedCount ? missedCount + " missed" : "No misses"}</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="quizAgain">Retake full quiz</button>
              <button class="secondary" id="quizMissed" ${missedCount ? "" : "disabled"}>Practice missed</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("quizAgain").onclick = () => startQuiz(view.quizSource);
        document.getElementById("quizMissed").onclick = () => startQuiz(view.missed.slice());
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { view.index = view.quizTotal; render(); return; }
      const locked = view.picked !== null;
      const choiceHtml = view.choices.map((choice, i) => {
        let cls = "choice";
        if (locked && choice.correct) cls += " correct";
        else if (locked && view.picked === i && !choice.correct) cls += " wrong";
        else if (locked) cls += " idle";
        return `<button class="${cls}" data-choice="${i}" ${locked ? "disabled" : ""}>${escaped(choice.text)}</button>`;
      }).join("");
      const pct = view.quizTotal ? Math.round((view.asked / view.quizTotal) * 100) : 0;
      const prompt = isScenario(card) ? scenarioPrompt(card, "Scenario · choose the best answer") : `
          <div class="flash quiz">
            <div class="hint">Choose the best answer</div>
            <h2>${escaped(card.front)}</h2>
            ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          </div>`;

      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Question ${view.index + 1} of ${view.quizTotal}</span>
              <span class="muted">${view.score} correct · ${view.run} in a row</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          ${prompt}
          <div class="choices">${choiceHtml}</div>
          ${locked && isScenario(card) ? feedbackBox(card, !!view.choices[view.picked].correct) : ""}
          ${locked ? `<div class="row" style="justify-content:center"><button class="gold" id="nextQuiz">${view.index + 1 >= view.quizTotal ? "See results" : "Next"}</button></div>` : ""}
        </div>
      `;
      app.querySelectorAll("[data-choice]").forEach((btn) => {
        btn.onclick = () => {
          if (view.picked !== null) return;
          const i = Number(btn.dataset.choice);
          view.picked = i;
          view.asked += 1;
          const correct = view.choices[i].correct;
          if (correct) {
            view.score += 1;
            view.run += 1;
          } else {
            view.run = 0;
            if (!view.missed.includes(card.id)) view.missed.push(card.id);
          }
          render();
        };
      });
      const next = document.getElementById("nextQuiz");
      if (next) next.onclick = nextQuiz;
    }

    function nextQuiz() {
      view.index += 1;
      view.picked = null;
      if (view.index < view.quizTotal) {
        const card = currentCard();
        view.choices = card ? makeChoices(card) : [];
      }
      render();
    }

    function markResult(correct) {
      const card = currentCard();
      if (!card) return;
      const p = prog(card.id);
      if (correct) {
        p.streak += 1;
        if (p.streak >= RETIRE_AFTER) p.retired = true;
      } else {
        p.streak = 0;
        p.retired = false;
      }
      save();
    }

    function grade(correct) {
      markResult(correct);
      advanceStudy();
    }

    function advanceStudy() {
      const remainingIds = view.queue.filter((id, i) => i !== view.index && !prog(id).retired);
      if (!remainingIds.length) {
        view.queue = shuffle(activeCards(view.folderId)).map((c) => c.id);
        view.index = 0;
      } else {
        view.queue = remainingIds;
        view.index = view.index >= view.queue.length ? 0 : view.index;
      }
      view.flipped = false;
      view.studyPicked = null;
      render();
    }

    function backToFolder() {
      view.page = "folder";
      render();
    }
    function resetAndStay() {
      cardsIn(view.folderId).forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
      save();
      startStudy();
    }

    function openFolderForm(folder) {
      modal.innerHTML = `
        <div class="dialog-head">${folder ? "Rename folder" : "New folder"}</div>
        <div class="dialog-body">
          <label>Folder name</label>
          <input id="folderName" type="text" value="${escaped(folder ? folder.name : "")}" />
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveFolder">Save</button>
          </div>
        </div>
      `;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("saveFolder").onclick = () => {
        const name = document.getElementById("folderName").value.trim();
        if (!name) return;
        if (folder) folder.name = name;
        else state.folders.push({ id: uid(), name });
        save();
        modal.close();
        render();
      };
    }

    function openCardForm(card) {
      const scen = !!(card && isScenario(card));
      const subtitle = card ? (card.subtitle || card.year || "") : "";
      const note = card ? (card.note || card.extra || "") : "";
      const answer = card ? (card.answer || card.purpose || "") : "";
      const points = card ? (card.points || card.protections || []) : [];
      const choices = scen ? card.choices : [];
      modal.innerHTML = `
        <div class="dialog-head">${card ? "Edit card" : "New card"}</div>
        <div class="dialog-body">
          <label for="cardType">Card type</label>
          <select id="cardType">
            <option value="basic" ${scen ? "" : "selected"}>Flash card (flip to see answer)</option>
            <option value="scenario" ${scen ? "selected" : ""}>Scenario (pick the right answer)</option>
          </select>
          <label id="frontLabel" for="cardFront">Front (prompt or question)</label>
          <textarea id="cardFront" class="short">${escaped(card ? card.front : "")}</textarea>
          <label>Subtitle (optional)</label>
          <input id="cardSubtitle" type="text" value="${escaped(subtitle)}" placeholder="Year, unit, topic..." />
          <label>Small note (optional)</label>
          <input id="cardNote" type="text" value="${escaped(note)}" />
          <div id="basicFields">
            <label>Back (answer)</label>
            <textarea id="cardAnswer">${escaped(answer)}</textarea>
            <label>Extra points on the back (optional, one per line)</label>
            <textarea id="cardPoints">${escaped(points.join("\n"))}</textarea>
          </div>
          <div id="scenarioFields">
            <label>Choices (one per line, 2–5)</label>
            <textarea id="cardChoices" class="short" placeholder="Legal&#10;Illegal&#10;Depends">${escaped(choices.join("\n"))}</textarea>
            <label for="cardCorrect">Correct choice</label>
            <select id="cardCorrect"></select>
            <label>Explanation (shown after answering)</label>
            <textarea id="cardExplanation" class="short">${escaped(scen ? card.explanation || "" : "")}</textarea>
            <label>Short answer (optional, used in reviews)</label>
            <input id="cardScenarioAnswer" type="text" value="${escaped(scen ? card.answer || "" : "")}" />
          </div>
          <div id="formError" class="muted" style="color:var(--bad);margin-top:8px"></div>
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveCard">Save card</button>
          </div>
        </div>
      `;
      modal.showModal();
      const $ = (id) => document.getElementById(id);
      const choiceLines = () => $("cardChoices").value.split("\n").map((s) => s.trim()).filter(Boolean);
      let selected = scen ? Number(card.correct) : 0;
      const fillCorrect = () => {
        const lines = choiceLines();
        if (selected >= lines.length) selected = 0;
        $("cardCorrect").innerHTML = lines.length
          ? lines.map((t, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${i + 1}. ${escaped(truncate(t, 60))}</option>`).join("")
          : `<option value="0">Type the choices above first</option>`;
      };
      const syncType = () => {
        const isScen = $("cardType").value === "scenario";
        $("basicFields").style.display = isScen ? "none" : "";
        $("scenarioFields").style.display = isScen ? "" : "none";
        $("frontLabel").textContent = isScen ? "Scenario (what happens?)" : "Front (prompt or question)";
      };
      fillCorrect();
      syncType();
      $("cardType").onchange = syncType;
      $("cardChoices").oninput = fillCorrect;
      $("cardCorrect").onchange = () => { selected = Number($("cardCorrect").value); };
      $("cancelModal").onclick = () => modal.close();
      $("saveCard").onclick = () => {
        const err = (m) => { $("formError").textContent = m; };
        const front = $("cardFront").value.trim();
        const subtitle = $("cardSubtitle").value.trim();
        const note = $("cardNote").value.trim();
        let payload;
        if ($("cardType").value === "scenario") {
          const lines = choiceLines();
          const correct = Number($("cardCorrect").value);
          if (!front) return err("Write the scenario first.");
          if (lines.length < 2 || lines.length > 5) return err("A scenario needs 2 to 5 choices, one per line.");
          if (!Number.isInteger(correct) || correct < 0 || correct >= lines.length) return err("Pick the correct choice.");
          payload = { type: "scenario", front, subtitle, note, choices: lines, correct, explanation: $("cardExplanation").value.trim(), answer: $("cardScenarioAnswer").value.trim(), points: [] };
        } else {
          const answer = $("cardAnswer").value.trim();
          const points = $("cardPoints").value.split("\n").map((s) => s.trim()).filter(Boolean);
          if (!front || !answer) return err("A flash card needs a front and an answer.");
          payload = { front, subtitle, note, answer, points, year: subtitle, extra: note, purpose: answer, protections: points };
        }
        if (card) {
          if (payload.type === "scenario") { delete card.year; delete card.extra; delete card.purpose; delete card.protections; }
          else { delete card.type; delete card.choices; delete card.correct; delete card.explanation; }
          Object.assign(card, payload);
        } else {
          state.cards.push({ id: uid(), folderId: view.folderId, ...payload });
        }
        save();
        modal.close();
        render();
      };
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flashcards-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function readJsonFile(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch { alert("That file isn't valid JSON, so it could not be imported."); return; }
        cb(data);
      };
      reader.readAsText(file);
    }

    function openImportDialog() {
      modal.innerHTML = `
        <div class="dialog-head">Import</div>
        <div class="dialog-body">
          <p style="margin-top:0">Add a deck file (new chapters or updated cards) or merge in a backup. Nothing you already have is deleted, and your progress is kept.</p>
          <button class="gold" id="pickMerge">Choose file to add / merge</button>
          <input id="mergeFile" type="file" accept="application/json,.json" hidden />
          <div style="border-top:1px solid var(--line);margin:18px 0 12px"></div>
          <div class="muted">Moving to a new device? Restoring replaces everything in this browser with the backup.</div>
          <div class="row" style="justify-content:space-between;margin-top:10px">
            <button class="danger" id="pickRestore">Restore backup (replaces everything)</button>
            <button class="secondary" id="cancelModal">Cancel</button>
          </div>
          <input id="restoreFile" type="file" accept="application/json,.json" hidden />
        </div>`;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("pickMerge").onclick = () => document.getElementById("mergeFile").click();
      document.getElementById("pickRestore").onclick = () => document.getElementById("restoreFile").click();
      document.getElementById("mergeFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importMerge);
        e.target.value = "";
      };
      document.getElementById("restoreFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importRestore);
        e.target.value = "";
      };
    }

    function importMerge(data) {
      let sum;
      try { sum = mergeImport(data); }
      catch (err) { alert("That file could not be imported. " + (err && err.message ? err.message : "")); return; }
      showSummary("Import complete", sum);
    }

    function importRestore(data) {
      if (!data || Array.isArray(data) || !Array.isArray(data.folders) || !Array.isArray(data.cards)) {
        alert("Restore needs a full backup file (made with Export). To add a deck, use \"Choose file to add / merge\" instead.");
        return;
      }
      if (!confirm("Replace ALL folders, cards and progress in this browser with this backup?\n\nThis can't be undone. Tip: Export first if you might want your current data.")) return;
      state = migrate(JSON.parse(JSON.stringify(data)));
      applyBundledDecks();
      save();
      modal.close();
      view.page = "home";
      render();
      toast(`Backup restored: ${state.folders.length} folders, ${state.cards.length} cards.`);
    }

    function showSummary(title, sum) {
      modal.innerHTML = `
        <div class="dialog-head">${escaped(title)}</div>
        <div class="dialog-body">
          <p style="margin-top:0"><strong id="importSummary">${escaped(summaryText(sum))}</strong></p>
          ${sum.decks.length ? `<div class="muted">Decks: ${sum.decks.map(escaped).join(", ")}</div>` : ""}
          ${sum.problems.length ? `<div class="muted" style="margin-top:8px;color:var(--bad)">${sum.problems.slice(0, 8).map(escaped).join("<br>")}${sum.problems.length > 8 ? "<br>…" : ""}</div>` : ""}
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="gold" id="closeSummary">Done</button>
          </div>
        </div>`;
      if (!modal.open) modal.showModal();
      document.getElementById("closeSummary").onclick = () => modal.close();
      view.page = view.page === "home" || view.page === "folder" ? view.page : "home";
      render();
    }

    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 4500);
    }

    window.onerror = function(msg) {
      const app = document.getElementById("app");
      if (app) app.innerHTML = "<div class=\"card\"><strong>Something broke.</strong><div class=\"muted\">"+String(msg)+"</div></div>";
    };
    try { render(); } catch (err) { window.onerror(err && err.message ? err.message : err); }
    if (bundledSummary && (bundledSummary.foldersAdded || bundledSummary.cardsAdded || bundledSummary.cardsUpdated)) {
      toast(`New study material: ${bundledSummary.decks.join(", ")} (${bundledSummary.cardsAdded} new, ${bundledSummary.cardsUpdated} updated cards)`);
    }
  </script>
</body>
</html>
