        if (days < 1) throw new Error("The target date has to be on or after the start date.");
        remaining.forEach((ch, i) => sched.push({ chapter: ch, due: addDays(startDate, Math.ceil(((i + 1) * days) / remaining.length) - 1) }));
      } else {
        const preset = info.presets[pace];
        if (!preset) throw new Error("Unknown pace.");
        const placed = new Set();
        const weeks = preset.weeks.map((w) => w.filter((ch) => remaining.includes(ch))).filter((w) => w.length);
        weeks.forEach((w) => w.forEach((ch) => placed.add(ch)));
        const leftovers = remaining.filter((ch) => !placed.has(ch));
        if (leftovers.length) { if (weeks.length) weeks[weeks.length - 1].push(...leftovers); else weeks.push(leftovers); }
        weeks.forEach((w, wi) => w.forEach((ch, i) => sched.push({ chapter: ch, due: addDays(startDate, 7 * wi + Math.ceil(((i + 1) * 7) / w.length) - 1) })));
      }
      sched.sort((a, b) => a.chapter - b.chapter);
      return sched;
    }

    function makePlan(course, pace, startDate, targetDate) {
      const info = courseInfo(course);
      if (!PACES.includes(pace)) throw new Error("Pick a pace.");
      if (!validISO(startDate)) throw new Error("Pick a valid start date.");
      const old = state.plans[course];
      const schedule = buildSchedule(info, pace, startDate, targetDate, old);
      const remainingDues = schedule.filter((e) => !chapterPassed(course, e.chapter)).map((e) => e.due).sort();
      const history = old ? (old.history || []).concat([{ pace: old.pace, startDate: old.startDate, targetDate: old.targetDate, createdAt: old.createdAt, replacedOn: todayISO(), passedAtSwitch: schedule.filter((e) => chapterPassed(course, e.chapter)).length }]) : [];
      state.plans[course] = {
        pace, startDate,
        targetDate: pace === "custom" ? targetDate : (remainingDues[remainingDues.length - 1] || startDate),
        createdAt: todayISO(),
        schedule, history
      };
      save();
      return state.plans[course];
    }

    function planMilestones(info, plan) {
      return (info.quarters || []).map((q) => {
        const dues = plan.schedule.filter((e) => q.chapters.includes(e.chapter)).map((e) => e.due).sort();
        if (!dues.length) return null;
        return { milestone: true, label: `${q.label} quarterly quiz`, chapters: q.chapters, due: dues[dues.length - 1], ready: q.chapters.every((ch) => chapterPassed(info.course, ch)) };
      }).filter(Boolean);
    }

    // Where the plan stands today.
    function planStatus(course, plan, today = todayISO()) {
      const info = courseInfo(course);
      const items = plan.schedule.map((e) => ({ ...e, folder: chapterFolder(course, e.chapter), passed: chapterPassed(course, e.chapter) }));
      const passed = items.filter((e) => e.passed).length;
      const dueBefore = items.filter((e) => e.due < today).length;
      const dueByToday = items.filter((e) => e.due <= today).length;
      let status = "on", diff = 0;
      if (passed < dueBefore) { status = "behind"; diff = dueBefore - passed; }
      else if (passed > dueByToday) { status = "ahead"; diff = passed - dueByToday; }
      const wi = Math.max(0, Math.floor(daysBetween(plan.startDate, today) / 7));
      const wkStart = addDays(plan.startDate, 7 * wi), wkEnd = addDays(wkStart, 6);
      let week = items.filter((e) => e.due >= wkStart && e.due <= wkEnd);
      const overdue = items.filter((e) => !e.passed && e.due < wkStart);
      const ordered = items.slice().sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : a.chapter - b.chapter));
      const current = ordered.find((e) => !e.passed) || null;
      let nextStep = null;
      if (current && current.folder) nextStep = pathSteps(current.folder).next;
      return { info, items, passed, total: items.length, dueBefore, dueByToday, status, diff, week, overdue, wkStart, wkEnd, weekNo: wi + 1, current, nextStep, today };
    }
    function statusText(st) {
      if (st.status === "behind") return `Behind by ${st.diff} chapter${st.diff === 1 ? "" : "s"}`;
      if (st.status === "ahead") return `Ahead by ${st.diff} chapter${st.diff === 1 ? "" : "s"}`;
      return "On track";
    }
    function itemState(e, st) {
      if (e.passed) return ["passed", "✓ passed"];
      if (!e.folder) return ["soon", "coming soon"];
      if (e.due < st.today) return ["overdue", "overdue"];
      if (e.due === st.today) return ["today", "due today"];
      if (st.current && st.current.chapter === e.chapter) return ["current", "current"];
      return ["upcoming", "upcoming"];
    }

    function planBannerHtml(course) {
      const info = courseInfo(course);
      const plan = state.plans[course];
      if (!plan) {
        return `
          <div class="card plan-banner" data-plan-course="${escaped(course)}">
            <div><strong>${escaped(info.title)}</strong> <span class="muted">· no study plan yet</span></div>
            <div class="muted" style="margin-top:4px">Pick a pace: Speedy (2 weeks), Medium (3 weeks, recommended), Deliberate (4 weeks), or your own target date.</div>
            <div class="row" style="margin-top:10px"><button class="gold small" data-plan-open="${escaped(course)}">Plan my pace</button></div>
          </div>`;
      }
      const st = planStatus(course, plan);
      const weekList = st.week.map((e) => `Ch ${e.chapter}${e.passed ? " ✓" : e.folder ? "" : " (coming soon)"}`).join(", ");
      const cur = st.current;
      return `
        <div class="card plan-banner" data-plan-course="${escaped(course)}" id="planBanner">
          <div class="row" style="justify-content:space-between">
            <div><strong>${escaped(info.title)}</strong> <span class="muted">· ${escaped(paceLabel(plan, info))}</span></div>
            <span class="status-pill ${st.status}" id="planStatus">${statusText(st)}</span>
          </div>
          <div class="muted" style="margin-top:6px">Week ${st.weekNo} (${fmtDay(st.wkStart)} – ${fmtDay(st.wkEnd)}): ${weekList || "nothing due this week"}${st.overdue.length ? ` · overdue: ${st.overdue.map((e) => "Ch " + e.chapter).join(", ")}` : ""} · ${st.passed} of ${st.total} bosses passed</div>
          <div class="row" style="margin-top:10px;justify-content:space-between">
            <div id="planNext">${cur
              ? (cur.folder
                ? `Next: <strong>Ch ${cur.chapter} · ${escaped(st.nextStep ? st.nextStep.title : "Boss quiz")}</strong> <span class="muted">(due ${fmtDay(cur.due)})</span>`
                : `Next: <strong>Ch ${cur.chapter}</strong> <span class="muted">coming soon, deck not loaded yet (due ${fmtDay(cur.due)})</span>`)
              : `<strong>All chapters passed 🎉</strong>`}</div>
            <div class="row">
              ${cur && cur.folder ? `<button class="gold small" id="planGo" data-plan-go="${escaped(cur.folder.id)}" data-step-key="${st.nextStep ? st.nextStep.key : "boss"}">Go</button>` : ""}
              <button class="secondary small" data-plan-open="${escaped(course)}">Open plan</button>
            </div>
          </div>
        </div>`;
    }

    function renderPlan() {
      const courses = plannableCourses();
      if (!courses.length) { view.page = "home"; return render(); }
      const course = courses.includes(view.planCourse) ? view.planCourse : (courses.includes("C202") ? "C202" : courses[0]);
      view.planCourse = course;
      const info = courseInfo(course);
      const plan = state.plans[course];
      const draft = view.planDraft && view.planDraft.course === course ? view.planDraft : { course, pace: plan ? plan.pace : "medium", target: plan && plan.pace === "custom" ? plan.targetDate : addDays(todayISO(), 20), start: todayISO() };
      view.planDraft = draft;
      const passedCount = Array.from({ length: info.chapters }, (_, i) => i + 1).filter((ch) => chapterPassed(course, ch)).length;
      headerSub.textContent = "Study plan";
      headerActions.innerHTML = `<button class="secondary" id="planBack">All folders</button>`;
      const paceCard = (key) => {
        const p = info.presets[key];
        const label = key === "custom" ? "Custom" : p.label;
        const sub = key === "custom" ? "Pick a target date" : `${p.length} · ${p.weeks.map((w, i) => `Wk${i + 1} Ch${w[0]}${w.length > 1 ? "–" + w[w.length - 1] : ""}`).join(", ")}`;
        return `
          <label class="pace ${draft.pace === key ? "sel" : ""}">
            <input type="radio" name="pace" value="${key}" ${draft.pace === key ? "checked" : ""} />
            <span class="pace-title">${label}${key !== "custom" && p.recommended ? ` <span class="pill next-pill">Recommended</span>` : ""}</span>
            <span class="muted">${escaped(sub)}</span>
            ${key === "custom" ? `<input type="date" id="planTarget" value="${escaped(draft.target)}" />` : ""}
          </label>`;
      };
      let scheduleHtml = "";
      if (plan) {
        const st = planStatus(course, plan);
        const rows = st.items.map((e) => ({ ...e, kind: "ch" })).concat(planMilestones(info, plan).map((m) => ({ ...m, kind: "ms" })))
          .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.kind === b.kind ? (a.chapter || 0) - (b.chapter || 0) : a.kind === "ch" ? -1 : 1)));
        let lastGroup = null;
        scheduleHtml = rows.map((r) => {
          const off = daysBetween(plan.startDate, r.due);
          const group = off < 0 ? "Done before this plan" : `Week ${Math.floor(off / 7) + 1} · ${fmtDay(addDays(plan.startDate, Math.floor(off / 7) * 7))} – ${fmtDay(addDays(plan.startDate, Math.floor(off / 7) * 7 + 6))}`;
          const head = group !== lastGroup ? `<div class="plan-week">${escaped(group)}</div>` : "";
          lastGroup = group;
          if (r.kind === "ms") {
            return head + `<div class="plan-row milestone"><span class="plan-ch">🏁</span><span class="plan-title"><strong>${escaped(r.label)}</strong> <span class="muted">Ch ${r.chapters[0]}–${r.chapters[r.chapters.length - 1]} · reminder${r.ready ? ", you're ready" : ""}</span></span><span class="plan-due">by ${fmtDay(r.due)}</span><span class="plan-state"><span class="status-pill ms">quiz</span></span></div>`;
          }
          const [cls, label] = itemState(r, st);
          const isCur = st.current && st.current.chapter === r.chapter;
          return head + `
            <div class="plan-row ${cls} ${isCur ? "cur" : ""}" data-plan-ch="${r.chapter}">
              <span class="plan-ch">Ch ${r.chapter}</span>
              <span class="plan-title">${r.folder ? `<a href="#" data-plan-folder="${escaped(r.folder.id)}">${escaped(chapterTitle(course, r.chapter) || r.folder.name)}</a>${isCur && st.nextStep ? ` <span class="muted">· next: ${escaped(st.nextStep.title)}</span>` : ""}` : `<span class="muted">Deck not loaded yet</span>`}</span>
              <span class="plan-due">${fmtDay(r.due)}</span>
              <span class="plan-state"><span class="status-pill ${cls}">${label}</span></span>
            </div>`;
        }).join("");
        scheduleHtml = `
          <div class="card" style="margin-top:12px" id="planSchedule">
            <div class="row" style="justify-content:space-between">
              <div><strong style="color:var(--navy);font-size:16px">${escaped(paceLabel(plan, info))}</strong>
                <div class="muted">${fmtDay(plan.startDate)} → ${fmtDay(plan.targetDate)} · planned ${escaped(fmtDate(plan.createdAt))}${plan.history && plan.history.length ? ` · pace changed ${plan.history.length}×` : ""}</div></div>
              <div class="row"><span class="status-pill ${st.status}">${statusText(st)}</span><button class="secondary small" id="sharePlan">Share plan</button></div>
            </div>
            <div class="plan-list">${scheduleHtml}</div>
          </div>`;
      }
      app.innerHTML = `
        ${courses.length > 1 ? `<div class="row" style="margin-bottom:10px">${courses.map((c) => `<button class="${c === course ? "gold" : "secondary"} small" data-plan-tab="${escaped(c)}">${escaped(c)}</button>`).join("")}</div>` : ""}
        <div class="card">
          <h2 style="margin:0 0 4px;color:var(--navy);font-size:20px">${escaped(info.title)} · study plan</h2>
          <div class="muted">${info.started ? `Course started ${fmtDay(info.started)}, ${parseISO(info.started).getFullYear()} · ` : ""}${info.chapters} chapters${info.quarters.length ? ` in ${info.quarters.length} quarters, each ending with a quarterly quiz` : ""} · ${passedCount} of ${info.chapters} chapter bosses passed</div>
        </div>
        <div class="card" style="margin-top:12px">
          <strong style="color:var(--navy)">${plan ? "Change pace" : "Pick your pace"}</strong>
          <div class="pace-grid">${PACES.map(paceCard).join("")}</div>
          <div class="row" style="margin-top:10px;align-items:flex-end">
            <div><label for="planStart" style="margin-top:0">Start date</label><input type="date" id="planStart" value="${escaped(draft.start)}" /></div>
            <button class="gold" id="savePlan">${plan ? "Replan remaining chapters" : "Create plan"}</button>
          </div>
          <div class="muted" style="margin-top:8px">${passedCount ? `${passedCount} passed chapter${passedCount === 1 ? "" : "s"} stay done; ` : ""}${info.chapters - passedCount} remaining chapter${info.chapters - passedCount === 1 ? "" : "s"} get scheduled from the start date. You can change pace anytime.</div>
          <div id="planError" class="muted" style="color:var(--bad);margin-top:6px"></div>
        </div>
        ${scheduleHtml}`;
      document.getElementById("planBack").onclick = () => { view.page = "home"; render(); };
      app.querySelectorAll("[data-plan-tab]").forEach((b) => { b.onclick = () => { view.planCourse = b.dataset.planTab; view.planDraft = null; render(); }; });
      app.querySelectorAll("input[name=pace]").forEach((r) => { r.onchange = () => { draft.pace = r.value; render(); }; });
      const tgt = document.getElementById("planTarget");
      if (tgt) tgt.onchange = () => { draft.target = tgt.value; draft.pace = "custom"; render(); };
      const startEl = document.getElementById("planStart");
      startEl.onchange = () => { draft.start = startEl.value; };
      document.getElementById("savePlan").onclick = () => {
        draft.start = startEl.value;
        if (tgt) draft.target = tgt.value;
        try {
          const had = !!state.plans[course];
          makePlan(course, draft.pace, draft.start, draft.target);
          view.planDraft = null;
          render();
          toast(had ? "Plan updated: remaining chapters rescheduled." : "Plan created. You've got this.");
        } catch (err) {
          document.getElementById("planError").textContent = err.message || String(err);
        }
      };
      app.querySelectorAll("[data-plan-folder]").forEach((a) => { a.onclick = (e) => { e.preventDefault(); view.folderId = a.dataset.planFolder; view.page = "folder"; render(); window.scrollTo(0, 0); }; });
      const share = document.getElementById("sharePlan");
      if (share) share.onclick = () => sharePlan(course);
    }

    function planText(course) {
      const plan = state.plans[course];
      if (!plan) return "";
      const st = planStatus(course, plan);
      const info = st.info;
      const lines = [];
      lines.push(`${info.title} study plan`);
      lines.push(`Generated: ${st.today}`);
      lines.push(`Pace: ${paceLabel(plan, info)}`);
      lines.push(`Start: ${plan.startDate} · Target finish: ${plan.targetDate}${info.started ? ` · Course started: ${info.started}` : ""}`);
      lines.push(`Status: ${statusText(st)} · ${st.passed} of ${st.total} chapter bosses passed · ${st.dueBefore} chapter(s) due before today`);
      if (st.current) {
        lines.push(`Current chapter: Ch ${st.current.chapter}${st.current.folder ? ` (${st.current.folder.name})` : " (deck not loaded yet)"}${st.nextStep ? ` · Next step: ${st.nextStep.title}` : ""}`);
      } else {
        lines.push("Current chapter: none, every chapter boss is passed");
      }
      lines.push("Schedule:");
      const rows = st.items.map((e) => ({ ...e, kind: "ch" })).concat(planMilestones(info, plan).map((m) => ({ ...m, kind: "ms" })))
        .sort((a, b) => (a.due < b.due ? -1 : a.due > b.due ? 1 : (a.kind === b.kind ? (a.chapter || 0) - (b.chapter || 0) : a.kind === "ch" ? -1 : 1)));
      rows.forEach((r) => {
        const day = parseISO(r.due).toLocaleDateString("en-US", { weekday: "short" });
        if (r.kind === "ms") { lines.push(`  >> ${r.label} (Ch ${r.chapters[0]}-${r.chapters[r.chapters.length - 1]}) by ${day} ${r.due} · reminder${r.ready ? ", ready" : ""}`); return; }
        let status;
        if (r.passed) status = `passed${r.folder && r.folder.bestBoss ? ` (boss ${Math.round(r.folder.bestBoss.pct)}%)` : ""}`;
        else if (!r.folder) status = "coming soon (no deck yet)";
        else {
          const steps = pathSteps(r.folder);
          status = (r.due < st.today ? "overdue" : r.due === st.today ? "due today" : "upcoming") +
            ` · steps done: ${steps.steps.filter((s) => s.done && !s.na).map((s) => s.title).join(", ") || "none"}` +
            (steps.next ? ` · next: ${steps.next.title}` : "");
        }
        lines.push(`  Ch ${String(r.chapter).padEnd(2)}  due ${day} ${r.due}  ${status}`);
      });
      if (plan.history && plan.history.length) {
        const h = plan.history[plan.history.length - 1];
        lines.push(`Pace changes: ${plan.history.length} (last: ${h.pace} -> ${plan.pace} on ${h.replacedOn})`);
      }
      return lines.join("\n");
    }

    function copyText(text) {
      const fallback = () => {
        const ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        let ok = false;
        try { ok = document.execCommand("copy"); } catch {}
        ta.remove();
        return ok;
      };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
      } catch {}
      return Promise.resolve(fallback());
    }

    function downloadText(name, text) {
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    function sharePlan(course) {
      const text = planText(course);
      const file = `${course.toLowerCase()}-plan.txt`;
      modal.innerHTML = `
        <div class="dialog-head">Share plan</div>
        <div class="dialog-body">
          <div class="muted" id="copyStatus">Copying to clipboard…</div>
          <textarea id="planTextBox" readonly style="min-height:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin-top:8px">${escaped(text)}</textarea>
          <div class="row" style="justify-content:flex-end;margin-top:12px">
            <button class="secondary" id="copyAgain">Copy</button>
            <button class="secondary" id="downloadPlan">Download ${escaped(file)}</button>
            <button class="gold" id="closeShare">Done</button>
          </div>
        </div>`;
      modal.showModal();
      const status = document.getElementById("copyStatus");
      const doCopy = () => copyText(text).then((ok) => {
        status.textContent = ok ? "Copied to clipboard. Paste it to your study assistant, or download the file." : "Couldn't reach the clipboard here. Select the text below or download the file.";
      });
      doCopy();
      document.getElementById("copyAgain").onclick = doCopy;
      document.getElementById("downloadPlan").onclick = () => downloadText(file, text);
      document.getElementById("closeShare").onclick = () => modal.close();
    }

    function startStudy(mode) {
      mode = MODE_LABEL[mode] ? mode : "mixed";
      const queue = shuffle(activeStudy(view.folderId, mode));
      if (!queue.length) return;
      view.studyMode = mode;
      // Track a "full pass" over the concept (regular) cards that were still active at the start.
      view.studyTargets = queue.filter((c) => !isScenario(c)).map((c) => c.id);
      view.studySeen = [];
      view.page = "study";
      view.queue = queue.map((c) => c.id);
      view.index = 0;
      view.flipped = false;
      view.studyPicked = null;
      render();
    }

    function cardAnswerText(c) {
      if (isScenario(c)) return cleanStr(c.answer) || cleanStr(c.choices[c.correct]) || cleanStr(c.explanation);
      const body = String(c.answer || c.purpose || "").trim();
      const pts = c.points || c.protections || [];
      if (body) return body;
      return pts.join("; ");
    }

    function truncate(s, n) {
      const t = cleanStr(s).replace(/\s+/g, " ");
      if (t.length <= n) return t;
      const cut = t.slice(0, n);
      const sp = cut.lastIndexOf(" ");
      return (sp > n * 0.6 ? cut.slice(0, sp) : cut).replace(/[\s,;:.\-–]+$/, "") + "…";
    }

    // Wrong-answer pool for a regular card: other regular cards in the folder, topped up from
    // the same course if the folder alone is too small. Scenario cards never feed this pool.

    function distractorPool(card) {
      const correct = cardAnswerText(card);
      const folder = folderById(card.folderId);
      const unique = [];
      const add = (cards) => cards.forEach((c) => {
        if (c.id === card.id || isScenario(c)) return;
        const text = cardAnswerText(c);
        if (text && text !== correct && !unique.includes(text)) unique.push(text);
      });
      add(cardsIn(card.folderId));
      if (unique.length < 3 && folder && folder.course) {
        const extra = [];
        state.folders.filter((f) => f.id !== folder.id && f.course === folder.course).forEach((f) => extra.push(...cardsIn(f.id)));
        add(shuffle(extra));
      }
      return unique;
    }

    function makeChoices(card) {
      if (isScenario(card)) {
        // Keep the author's order (Legal / Illegal / Depends style sets read best as written).
        return card.choices.map((text, i) => ({ text, correct: i === Number(card.correct) }));
      }
      const correct = cardAnswerText(card);
      const wrong = shuffle(distractorPool(card)).slice(0, 3);
      return shuffle([{ text: correct, correct: true }].concat(wrong.map((text) => ({ text, correct: false }))));
    }

    function startQuiz(ids) {
      const source = ids && ids.length ? ids : cardsIn(view.folderId).map((c) => c.id);
      const queue = shuffle(source.map((id) => state.cards.find((c) => c.id === id)).filter(Boolean));
      if (!queue.length) return;
      if (queue.some((c) => !isScenario(c) && distractorPool(c).length < 1)) {
        alert("Add at least 2 regular (non-scenario) cards in this folder so the quiz can invent wrong answers.");
        return;
      }
      view.page = "quiz";
      view.queue = queue.map((c) => c.id);
      if (!ids || view.quizFolder !== view.folderId) {
        view.quizSource = cardsIn(view.folderId).map((c) => c.id);
        view.quizFolder = view.folderId;
      }
      view.quizTotal = view.queue.length;
      view.quizFull = view.queue.length === cardsIn(view.folderId).length;
      view.index = 0;
      view.picked = null;
      view.score = 0;
      view.asked = 0;
      view.run = 0;
      view.missed = [];
      view.choices = makeChoices(queue[0]);
      render();
    }

    function currentCard() {
      const id = view.queue[view.index];
      return state.cards.find((c) => c.id === id);
    }

    function feedbackBox(card, ok) {
      const correctText = isScenario(card) ? card.choices[card.correct] : cardAnswerText(card);
      const why = isScenario(card) ? (cleanStr(card.explanation) || cleanStr(card.answer)) : "";
      return `
        <div class="explain ${ok ? "ok" : "bad"}" id="explainBox">
          <strong>${ok ? "Correct" : "Not quite"}</strong>${ok ? "" : ` · Best answer: <em>${escaped(truncate(correctText, 220))}</em>`}
          ${why ? `<p>${escaped(why)}</p>` : ""}
          ${readMoreHtml(card)}
        </div>`;
    }

    // The card's source/"Read more" note, shown only after answering or flipping.

    function readMoreHtml(card) {
      const raw = cleanStr(card && (card.note || card.extra));
      if (!raw) return "";
      const m = raw.match(/^read more\s*[:\-–]\s*(.*)$/i);
      return `<div class="readmore"><span class="rm-label">📖 ${m ? "Read more" : "Note"}</span><span class="rm-text">${escaped(m ? m[1] : raw)}</span></div>`;
    }

    function scenarioPrompt(card, hint) {
      return `
        <div class="flash quiz scenario">
          <div class="hint">${escaped(hint)}</div>
          ${card.subtitle ? `<div class="subtitle" style="font-size:15px;margin-top:14px">${escaped(card.subtitle)}</div>` : ""}
          <div class="scenario-text">${escaped(card.front)}</div>
        </div>`;
    }

    function renderStudy() {
      const folder = folderById(view.folderId);
      const mode = view.studyMode || "mixed";
      const all = studyPool(view.folderId, mode);
      const left = activeStudy(view.folderId, mode).length;
      const retired = all.length - left;
      const pendingScenario = view.studyPicked !== null && view.studyPicked !== undefined;
      headerSub.textContent = folder ? `${folder.name} · ${MODE_LABEL[mode]}` : "Study";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
        <button class="secondary" id="resetStudy">Reset progress</button>
      `;

      if ((!view.queue.length || left === 0) && !pendingScenario) {
        app.innerHTML = `
          <div class="empty card">
            <h2>${mode === "concept" ? "Concept cards are clear" : mode === "scenario" ? "Scenarios are clear" : "This folder is clear"}</h2>
            <p>Every ${mode === "concept" ? "concept card" : mode === "scenario" ? "scenario" : "card"} has been answered correctly ${RETIRE_AFTER} times in a row.</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="resetDone">Reset and study again</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("exitStudy").onclick = backToFolder;
        document.getElementById("resetStudy").onclick = resetAndStay;
        document.getElementById("resetDone").onclick = resetAndStay;
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { startStudy(view.studyMode); return; }
      const p = prog(card.id);
      const pct = all.length ? Math.round((retired / all.length) * 100) : 0;
      const top = `
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Card ${view.index + 1} of ${view.queue.length} in this shuffle</span>
              <span class="muted">${left} still in the mix · streak ${p.streak}/${RETIRE_AFTER}</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>`;

      if (isScenario(card)) {
        const locked = pendingScenario;
        const choiceHtml = card.choices.map((text, i) => {
          let cls = "choice";
          if (locked && i === Number(card.correct)) cls += " correct";
          else if (locked && i === view.studyPicked) cls += " wrong";
          else if (locked) cls += " idle";
          return `<button class="${cls}" data-spick="${i}" ${locked ? "disabled" : ""}>${escaped(text)}</button>`;
        }).join("");
        app.innerHTML = `
          <div class="study-wrap">
            ${top}
            ${scenarioPrompt(card, "Scenario · choose the best answer")}
            <div class="choices">${choiceHtml}</div>
            ${locked ? feedbackBox(card, view.studyPicked === Number(card.correct)) : ""}
            <div class="row" style="justify-content:center">
              ${locked ? `<button class="gold" id="nextStudy">Next</button>` : `<span class="muted">Pick an answer, it's graded automatically</span>`}
            </div>
          </div>`;
        document.getElementById("exitStudy").onclick = backToFolder;
        document.getElementById("resetStudy").onclick = resetAndStay;
        app.querySelectorAll("[data-spick]").forEach((btn) => {
          btn.onclick = () => {
            if (view.studyPicked !== null && view.studyPicked !== undefined) return;
            view.studyPicked = Number(btn.dataset.spick);
            markResult(view.studyPicked === Number(card.correct));
            render();
          };
        });
        const next = document.getElementById("nextStudy");
        if (next) next.onclick = () => { view.studyPicked = null; advanceStudy(); };
        return;
      }

      const body = view.flipped ? `
        <div class="flash back" id="flipCard">
          <div class="hint">Answer · tap to hide</div>
          ${card.subtitle || card.year ? `<div class="muted">${escaped(card.subtitle || card.year)}</div>` : ""}
          ${card.answer || card.purpose ? `<p>${escaped(card.answer || card.purpose)}</p>` : ""}
          ${(card.points || card.protections || []).length ? `<ul>${(card.points || card.protections || []).map((x) => `<li>${escaped(x)}</li>`).join("")}</ul>` : ""}
          ${readMoreHtml(card)}
        </div>
      ` : `
        <div class="flash" id="flipCard">
          <div class="hint">Front · tap to flip</div>
          <h2>${escaped(card.front)}</h2>
          ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
        </div>
      `;
      app.innerHTML = `
        <div class="study-wrap">
          ${top}
          ${body}
          <div class="row" style="justify-content:center">
            <button class="secondary" id="flipBtn">${view.flipped ? "Hide answer" : "Show answer"}</button>
            <button class="bad" id="missBtn" ${view.flipped ? "" : "disabled"}>Missed it</button>
            <button class="ok" id="gotBtn" ${view.flipped ? "" : "disabled"}>Got it</button>
          </div>
        </div>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;
      document.getElementById("resetStudy").onclick = resetAndStay;
      document.getElementById("flipCard").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("flipBtn").onclick = () => { view.flipped = !view.flipped; render(); };
      document.getElementById("gotBtn").onclick = () => grade(true);
      document.getElementById("missBtn").onclick = () => grade(false);
    }

    function renderQuiz() {
      const folder = folderById(view.folderId);
      headerSub.textContent = folder ? folder.name + " · quiz" : "Quiz";
      headerActions.innerHTML = `
        <button class="secondary" id="exitStudy">Back to folder</button>
      `;
      document.getElementById("exitStudy").onclick = backToFolder;

      if (view.index >= view.quizTotal) {
        const missedCount = view.missed.length;
        app.innerHTML = `
          <div class="empty card">
            <h2>Quiz complete</h2>
            <p>You got ${view.score} of ${view.asked} right.</p>
            <p class="muted">${missedCount ? missedCount + " missed" : "No misses"}</p>
            <div class="row" style="justify-content:center;margin-top:12px">
              <button class="gold" id="quizAgain">Retake full quiz</button>
              <button class="secondary" id="quizMissed" ${missedCount ? "" : "disabled"}>Practice missed</button>
              <button class="secondary" id="backDone">Back to folder</button>
            </div>
          </div>`;
        document.getElementById("quizAgain").onclick = () => startQuiz(view.quizSource);
        document.getElementById("quizMissed").onclick = () => startQuiz(view.missed.slice());
        document.getElementById("backDone").onclick = backToFolder;
        return;
      }

      const card = currentCard();
      if (!card) { view.index = view.quizTotal; render(); return; }
      const locked = view.picked !== null;
      const choiceHtml = view.choices.map((choice, i) => {
        let cls = "choice";
        if (locked && choice.correct) cls += " correct";
        else if (locked && view.picked === i && !choice.correct) cls += " wrong";
        else if (locked) cls += " idle";
        return `<button class="${cls}" data-choice="${i}" ${locked ? "disabled" : ""}>${escaped(choice.text)}</button>`;
      }).join("");
      const pct = view.quizTotal ? Math.round((view.asked / view.quizTotal) * 100) : 0;
      const prompt = isScenario(card) ? scenarioPrompt(card, "Scenario · choose the best answer") : `
          <div class="flash quiz">
            <div class="hint">Choose the best answer</div>
            <h2>${escaped(card.front)}</h2>
            ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          </div>`;

      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Question ${view.index + 1} of ${view.quizTotal}</span>
              <span class="muted">${view.score} correct · ${view.run} in a row</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          ${prompt}
          <div class="choices">${choiceHtml}</div>
          ${locked ? feedbackBox(card, !!view.choices[view.picked].correct) : ""}
          ${locked ? `<div class="row" style="justify-content:center"><button class="gold" id="nextQuiz">${view.index + 1 >= view.quizTotal ? "See results" : "Next"}</button></div>` : ""}
        </div>
      `;
      app.querySelectorAll("[data-choice]").forEach((btn) => {
        btn.onclick = () => {
          if (view.picked !== null) return;
          const i = Number(btn.dataset.choice);
          view.picked = i;
          view.asked += 1;
          const correct = view.choices[i].correct;
          if (correct) {
            view.score += 1;
            view.run += 1;
          } else {
            view.run = 0;
            if (!view.missed.includes(card.id)) view.missed.push(card.id);
          }
          render();
        };
      });
      const next = document.getElementById("nextQuiz");
      if (next) next.onclick = nextQuiz;
    }

    function nextQuiz() {
      view.index += 1;
      view.picked = null;
      if (view.index >= view.quizTotal && view.quizFull && view.asked) {
        const folder = folderById(view.folderId);
        const pct = Math.round((view.score / view.asked) * 100);
        if (folder && (typeof folder.quizBest !== "number" || pct > folder.quizBest)) { folder.quizBest = pct; save(); }
      }
      if (view.index < view.quizTotal) {
        const card = currentCard();
        view.choices = card ? makeChoices(card) : [];
      }
      render();
    }

    function startBoss() {
      const cards = shuffle(cardsIn(view.folderId));
      if (cards.length < 2) { alert("Add at least 2 cards to this folder for a boss quiz."); return; }
      if (cards.some((c) => !isScenario(c) && distractorPool(c).length < 1)) {
        alert("Add at least 2 regular (non-scenario) cards in this folder so the quiz can invent wrong answers.");
        return;
      }
      view.page = "boss";
      view.boss = { folderId: view.folderId, ids: cards.map((c) => c.id), index: 0, sel: null, choices: makeChoices(cards[0]), answers: [], result: null };
      render();
    }

    function renderBoss() {
      const b = view.boss;
      const folder = folderById(view.folderId);
      if (!b || !folder) { view.page = "folder"; return render(); }
      headerSub.textContent = folder.name + " · boss quiz";
      headerActions.innerHTML = `<button class="secondary" id="exitBoss">${b.result ? "Back to folder" : "Quit boss"}</button>`;
      document.getElementById("exitBoss").onclick = () => {
        if (!b.result && b.answers.length && !confirm("Quit the boss quiz? This attempt won't count.")) return;
        backToFolder();
      };
      if (b.result) return renderBossResults(b, folder);

      const card = state.cards.find((c) => c.id === b.ids[b.index]);
      if (!card) { b.ids.splice(b.index, 1); if (b.index >= b.ids.length) finishBoss(); else { b.choices = makeChoices(state.cards.find((c) => c.id === b.ids[b.index])); render(); } return; }
      const total = b.ids.length;
      const pct = Math.round((b.index / total) * 100);
      const prompt = isScenario(card) ? scenarioPrompt(card, `Boss quiz · pass mark ${BOSS_PASS}%`) : `
          <div class="flash quiz">
            <div class="hint">Boss quiz · pass mark ${BOSS_PASS}%</div>
            <h2>${escaped(card.front)}</h2>
            ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          </div>`;
      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Question ${b.index + 1} of ${total}</span>
              <span class="muted">No feedback until the end · no skipping</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          ${prompt}
          <div class="choices">${b.choices.map((ch, i) => `<button class="choice ${b.sel === i ? "selected" : ""}" data-bpick="${i}">${escaped(ch.text)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center">
            <button class="gold" id="bossNext" ${b.sel === null ? "disabled" : ""}>${b.index + 1 >= total ? "Lock in & finish" : "Lock in & next"}</button>
          </div>
        </div>`;
      app.querySelectorAll("[data-bpick]").forEach((btn) => {
        btn.onclick = () => { b.sel = Number(btn.dataset.bpick); render(); };
      });
      document.getElementById("bossNext").onclick = () => {
        if (b.sel === null) return;
        b.answers.push({ id: card.id, choices: b.choices, picked: b.sel, ok: !!b.choices[b.sel].correct });
        b.index += 1;
        b.sel = null;
        if (b.index >= b.ids.length) return finishBoss();
        b.choices = makeChoices(state.cards.find((c) => c.id === b.ids[b.index]) || card);
        render();
        window.scrollTo(0, 0);
      };
    }

    function finishBoss() {
      const b = view.boss;
      const folder = folderById(b.folderId);
      const total = b.answers.length;
      const correct = b.answers.filter((a) => a.ok).length;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      const passed = pct >= BOSS_PASS;
      const prevBest = folder.bestBoss;
      const today = todayISO();
      const newBest = !prevBest || pct > (Number(prevBest.pct) || 0);
      if (newBest) folder.bestBoss = { pct, passed: passed || !!(prevBest && prevBest.passed), date: today };
      else if (passed && !prevBest.passed) folder.bestBoss.passed = true;
      folder.lastBoss = { pct, passed, date: today };
      const next = nextChapter(folder);
      b.result = { pct, passed, correct, total, newBest: newBest && !!prevBest, unlocked: passed && next && !(prevBest && prevBest.passed) ? next.id : null };
      save();
      render();
      window.scrollTo(0, 0);
    }

    function renderBossResults(b, folder) {
      const r = b.result;
      const missed = b.answers.filter((a) => !a.ok);
      const next = nextChapter(folder);
      const review = missed.map((a) => {
        const card = state.cards.find((c) => c.id === a.id);
        if (!card) return "";
        const right = a.choices.find((c) => c.correct);
        const why = isScenario(card) ? (cleanStr(card.explanation) || cleanStr(card.answer)) : "";
        const pts = !isScenario(card) ? (card.points || card.protections || []) : [];
        return `
          <div class="review-item">
            <div class="review-q">${escaped(card.front)}</div>
            <div class="review-a bad">✗ Your answer: ${escaped(a.choices[a.picked].text)}</div>
            <div class="review-a ok">✓ Correct: ${escaped(right ? right.text : cardAnswerText(card))}</div>
            ${why ? `<div class="muted" style="margin-top:4px">${escaped(why)}</div>` : ""}
            ${pts.length ? `<ul class="muted" style="margin:4px 0 0;padding-left:18px">${pts.map((x) => `<li>${escaped(x)}</li>`).join("")}</ul>` : ""}
            ${readMoreHtml(card)}
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="card boss-result ${r.passed ? "pass" : "fail"}" id="bossResult">
          <div class="boss-badge">${r.passed ? "Boss defeated" : "Not yet"}</div>
          <div class="boss-score">${r.pct}%</div>
          <div class="muted">${r.correct} of ${r.total} correct · pass mark ${BOSS_PASS}%${folder.bestBoss ? ` · best ${Math.round(folder.bestBoss.pct)}%` : ""}${r.newBest ? " · new best!" : ""}</div>
          ${r.passed && next ? `<p style="margin:10px 0 0"><strong>${escaped(next.name)}</strong> is ${r.unlocked ? "now unlocked" : "open"}.</p>` : ""}
          ${!r.passed ? `<p style="margin:10px 0 0" class="muted">Review the misses below, practice them, then try again.</p>` : ""}
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="${r.passed ? "secondary" : "gold"}" id="bossPractice" ${missed.length ? "" : "disabled"}>Practice missed (${missed.length})</button>
            <button class="secondary" id="bossRetake">Retake boss</button>
            ${r.passed && next ? `<button class="gold" id="bossNextCh">Go to ${escaped(chLabel(next))}</button>` : ""}
          </div>
        </div>
        ${missed.length ? `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Review missed questions</h3>${review}</div>` : ""}
      `;
      document.getElementById("bossPractice").onclick = () => startQuiz(missed.map((a) => a.id));
      document.getElementById("bossRetake").onclick = startBoss;
      const go = document.getElementById("bossNextCh");
      if (go) go.onclick = () => { view.folderId = next.id; view.page = "folder"; render(); };
    }

    /* ---------- Matching game ---------- */
    const MATCH_PAIRS = 6;
    const MATCH_PENALTY_MS = 2000;
    function matchableCards(folderId) {
      return cardsIn(folderId).filter((c) => !isScenario(c) && cleanStr(c.front) && cardAnswerText(c));
    }

    function startMatch() {
      const picked = [];
      const seenA = new Set(), seenF = new Set();
      shuffle(matchableCards(view.folderId)).forEach((c) => {
        const a = cardAnswerText(c), f = cleanStr(c.front);
        if (picked.length >= MATCH_PAIRS || seenA.has(a) || seenF.has(f)) return;
        seenA.add(a); seenF.add(f);
        picked.push({ id: c.id, term: truncate(f, 70), def: truncate(a, 110), full: a });
      });
      if (picked.length < 3) { alert("Matching needs at least 3 regular (non-scenario) cards with different answers."); return; }
      view.page = "match";
      view.match = { folderId: view.folderId, pairs: picked, defs: shuffle(picked.map((x) => x.id)), matched: [], selTerm: null, selDef: null, start: Date.now(), penalty: 0, misses: 0, result: null };
      render();
    }

    function matchElapsed(m) { return Date.now() - m.start + m.penalty; }

    function renderMatch() {
      const m = view.match;
      const folder = folderById(view.folderId);
      if (!m || !folder) { view.page = "folder"; return render(); }
      headerSub.textContent = folder.name + " · match";
      headerActions.innerHTML = `<button class="secondary" id="exitMatch">Back to folder</button>`;
      document.getElementById("exitMatch").onclick = backToFolder;
      if (m.result) return renderMatchResult(m, folder);
      const byId = (id) => m.pairs.find((x) => x.id === id);
      app.innerHTML = `
        <div class="study-wrap" style="min-height:0">
          <div class="row" style="justify-content:space-between">
            <span class="match-timer"><span id="matchTime">${fmtTime(matchElapsed(m))}</span> <span id="penaltyFlash" class="penalty"></span></span>
            <span class="muted" id="matchStatus">Matched ${m.matched.length} of ${m.pairs.length}${m.misses ? ` · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s)` : ""}</span>
          </div>
          <div class="muted">Tap a term, then its definition. Wrong pairs add ${MATCH_PENALTY_MS / 1000} seconds.${folder.bestMatch ? ` Best: ${fmtTime(folder.bestMatch.ms)}` : ""}</div>
          <div class="match-grid">
            <div class="match-col">${m.pairs.map((x) => `<button class="match-tile term" data-term="${escaped(x.id)}">${escaped(x.term)}</button>`).join("")}</div>
            <div class="match-col">${m.defs.map((id) => { const x = byId(id); return `<button class="match-tile def" data-def="${escaped(x.id)}" title="${escaped(x.full)}">${escaped(x.def)}</button>`; }).join("")}</div>
          </div>
        </div>`;
      const tiles = (attr) => Array.from(app.querySelectorAll(`[data-${attr}]`));
      const paint = () => {
        tiles("term").forEach((el) => el.classList.toggle("sel", el.dataset.term === m.selTerm));
        tiles("def").forEach((el) => el.classList.toggle("sel", el.dataset.def === m.selDef));
      };
      const status = () => {
        document.getElementById("matchStatus").textContent = `Matched ${m.matched.length} of ${m.pairs.length}` +
          (m.misses ? ` · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s)` : "");
      };
      const check = () => {
        if (m.selTerm === null || m.selDef === null) return paint();
        const t = app.querySelector(`[data-term="${CSS.escape(m.selTerm)}"]`);
        const d = app.querySelector(`[data-def="${CSS.escape(m.selDef)}"]`);
        if (m.selTerm === m.selDef) {
          m.matched.push(m.selTerm);
          [t, d].forEach((el) => { el.classList.remove("sel"); el.classList.add("matched"); el.disabled = true; });
        } else {
          m.misses += 1;
          m.penalty += MATCH_PENALTY_MS;
          [t, d].forEach((el) => { el.classList.remove("sel"); el.classList.add("wrong"); setTimeout(() => el.classList.remove("wrong"), 600); });
          const pf = document.getElementById("penaltyFlash");
          pf.textContent = `+${MATCH_PENALTY_MS / 1000}s`;
          pf.classList.remove("show"); void pf.offsetWidth; pf.classList.add("show");
        }
        m.selTerm = m.selDef = null;
        status();
        paint();
        if (m.matched.length === m.pairs.length) finishMatch();
      };
      tiles("term").forEach((el) => {
        if (m.matched.includes(el.dataset.term)) { el.classList.add("matched"); el.disabled = true; }
        el.onclick = () => { if (el.disabled) return; m.selTerm = m.selTerm === el.dataset.term ? null : el.dataset.term; check(); };
      });
      tiles("def").forEach((el) => {
        if (m.matched.includes(el.dataset.def)) { el.classList.add("matched"); el.disabled = true; }
        el.onclick = () => { if (el.disabled) return; m.selDef = m.selDef === el.dataset.def ? null : el.dataset.def; check(); };
      });
      paint();
      if (matchTimer) clearInterval(matchTimer);
      matchTimer = setInterval(() => {
        const el = document.getElementById("matchTime");
        if (!el || view.page !== "match" || view.match !== m || m.result) { clearInterval(matchTimer); matchTimer = null; return; }
        el.textContent = fmtTime(matchElapsed(m));
      }, 100);
    }

    function finishMatch() {
      const m = view.match;
      if (matchTimer) { clearInterval(matchTimer); matchTimer = null; }
      const folder = folderById(m.folderId);
      const ms = matchElapsed(m);
      const prev = folder.bestMatch;
      const pairs = m.pairs.length;
      const isBest = !prev || prev.pairs !== pairs || ms < prev.ms;
      if (isBest) folder.bestMatch = { ms, pairs, date: todayISO() };
      m.result = { ms, isBest: isBest && !!prev && prev.pairs === pairs, first: !prev };
      save();
      setTimeout(() => { if (view.page === "match" && view.match === m) render(); }, 450);
    }

    function renderMatchResult(m, folder) {
      const r = m.result;
      app.innerHTML = `
        <div class="card boss-result pass" id="matchResult">
          <div class="boss-badge">${r.isBest ? "New best time!" : "All matched"}</div>
          <div class="boss-score">${fmtTime(r.ms)}</div>
          <div class="muted">${m.pairs.length} pairs · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s penalty)</div>
          <div class="muted" style="margin-top:4px">Best for this folder: <strong id="matchBest">${folder.bestMatch ? fmtTime(folder.bestMatch.ms) : "-"}</strong></div>
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="gold" id="matchAgain">Play again</button>
            <button class="secondary" id="matchBack">Back to folder</button>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <h3 style="margin:0 0 6px">The pairs</h3>
          ${m.pairs.map((x) => { const c = state.cards.find((k) => k.id === x.id); return `
            <div class="review-item">
              <div class="review-q" style="margin-bottom:2px">${escaped(c ? c.front : x.term)}</div>
              <div class="muted">${escaped(x.full)}</div>
              ${c ? readMoreHtml(c) : ""}
            </div>`; }).join("")}
        </div>`;
      document.getElementById("matchAgain").onclick = startMatch;
      document.getElementById("matchBack").onclick = backToFolder;
    }

    function markResult(correct) {
      const card = currentCard();
      if (!card) return;
      const p = prog(card.id);
      if (correct) {
        p.streak += 1;
        if (p.streak >= RETIRE_AFTER) p.retired = true;
      } else {
        p.streak = 0;
        p.retired = false;
      }
      save();
    }

    function grade(correct) {
      const card = currentCard();
      markResult(correct);
      if (card && !isScenario(card)) noteConceptSeen(card.id);
      advanceStudy();
    }

    function noteConceptSeen(id) {
      const folder = folderById(view.folderId);
      if (!folder || !view.studyTargets || !view.studyTargets.length) return;
      if (!view.studySeen.includes(id)) view.studySeen.push(id);
      if (!folder.conceptPass && view.studyTargets.every((t) => view.studySeen.includes(t) || !state.cards.some((c) => c.id === t))) {
        folder.conceptPass = todayISO();
        save();
        toast("Full pass through the concept cards ✓");
      }
    }

    function advanceStudy() {
      const remainingIds = view.queue.filter((id, i) => i !== view.index && !prog(id).retired);
      if (!remainingIds.length) {
        view.queue = shuffle(activeStudy(view.folderId, view.studyMode || "mixed")).map((c) => c.id);
        view.index = 0;
      } else {
        view.queue = remainingIds;
        view.index = view.index >= view.queue.length ? 0 : view.index;
      }
      view.flipped = false;
      view.studyPicked = null;
      render();
    }

    function backToFolder() {
      view.page = "folder";
      render();
    }
    function resetAndStay() {
      studyPool(view.folderId, view.studyMode || "mixed").forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
      save();
      startStudy(view.studyMode);
    }

    function openFolderForm(folder) {
      modal.innerHTML = `
        <div class="dialog-head">${folder ? "Rename folder" : "New folder"}</div>
        <div class="dialog-body">
          <label>Folder name</label>
          <input id="folderName" type="text" value="${escaped(folder ? folder.name : "")}" />
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveFolder">Save</button>
          </div>
        </div>
      `;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("saveFolder").onclick = () => {
        const name = document.getElementById("folderName").value.trim();
        if (!name) return;
        if (folder) folder.name = name;
        else state.folders.push({ id: uid(), name });
        save();
        modal.close();
        render();
      };
    }

    function openCardForm(card) {
      const scen = !!(card && isScenario(card));
      const subtitle = card ? (card.subtitle || card.year || "") : "";
      const note = card ? (card.note || card.extra || "") : "";
      const answer = card ? (card.answer || card.purpose || "") : "";
      const points = card ? (card.points || card.protections || []) : [];
      const choices = scen ? card.choices : [];
      modal.innerHTML = `
        <div class="dialog-head">${card ? "Edit card" : "New card"}</div>
        <div class="dialog-body">
          <label for="cardType">Card type</label>
          <select id="cardType">
            <option value="basic" ${scen ? "" : "selected"}>Flash card (flip to see answer)</option>
            <option value="scenario" ${scen ? "selected" : ""}>Scenario (pick the right answer)</option>
          </select>
          <label id="frontLabel" for="cardFront">Front (prompt or question)</label>
          <textarea id="cardFront" class="short">${escaped(card ? card.front : "")}</textarea>
          <label>Subtitle (optional)</label>
          <input id="cardSubtitle" type="text" value="${escaped(subtitle)}" placeholder="Year, unit, topic..." />
          <label>Read more / source note (optional, shown after answering)</label>
          <input id="cardNote" type="text" value="${escaped(note)}" />
          <div id="basicFields">
            <label>Back (answer)</label>
            <textarea id="cardAnswer">${escaped(answer)}</textarea>
            <label>Extra points on the back (optional, one per line)</label>
            <textarea id="cardPoints">${escaped(points.join("\n"))}</textarea>
          </div>
          <div id="scenarioFields">
            <label>Choices (one per line, 2–5)</label>
            <textarea id="cardChoices" class="short" placeholder="Legal&#10;Illegal&#10;Depends">${escaped(choices.join("\n"))}</textarea>
            <label for="cardCorrect">Correct choice</label>
            <select id="cardCorrect"></select>
            <label>Explanation (shown after answering)</label>
            <textarea id="cardExplanation" class="short">${escaped(scen ? card.explanation || "" : "")}</textarea>
            <label>Short answer (optional, used in reviews)</label>
            <input id="cardScenarioAnswer" type="text" value="${escaped(scen ? card.answer || "" : "")}" />
          </div>
          <div id="formError" class="muted" style="color:var(--bad);margin-top:8px"></div>
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveCard">Save card</button>
          </div>
        </div>
      `;
      modal.showModal();
      const $ = (id) => document.getElementById(id);
      const choiceLines = () => $("cardChoices").value.split("\n").map((s) => s.trim()).filter(Boolean);
      let selected = scen ? Number(card.correct) : 0;
      const fillCorrect = () => {
        const lines = choiceLines();
        if (selected >= lines.length) selected = 0;
        $("cardCorrect").innerHTML = lines.length
          ? lines.map((t, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${i + 1}. ${escaped(truncate(t, 60))}</option>`).join("")
          : `<option value="0">Type the choices above first</option>`;
      };
      const syncType = () => {
        const isScen = $("cardType").value === "scenario";
        $("basicFields").style.display = isScen ? "none" : "";
        $("scenarioFields").style.display = isScen ? "" : "none";
        $("frontLabel").textContent = isScen ? "Scenario (what happens?)" : "Front (prompt or question)";
      };
      fillCorrect();
      syncType();
      $("cardType").onchange = syncType;
      $("cardChoices").oninput = fillCorrect;
      $("cardCorrect").onchange = () => { selected = Number($("cardCorrect").value); };
      $("cancelModal").onclick = () => modal.close();
      $("saveCard").onclick = () => {
        const err = (m) => { $("formError").textContent = m; };
        const front = $("cardFront").value.trim();
        const subtitle = $("cardSubtitle").value.trim();
        const note = $("cardNote").value.trim();
        let payload;
        if ($("cardType").value === "scenario") {
          const lines = choiceLines();
          const correct = Number($("cardCorrect").value);
          if (!front) return err("Write the scenario first.");
          if (lines.length < 2 || lines.length > 5) return err("A scenario needs 2 to 5 choices, one per line.");
          if (!Number.isInteger(correct) || correct < 0 || correct >= lines.length) return err("Pick the correct choice.");
          payload = { type: "scenario", front, subtitle, note, choices: lines, correct, explanation: $("cardExplanation").value.trim(), answer: $("cardScenarioAnswer").value.trim(), points: [] };
        } else {
          const answer = $("cardAnswer").value.trim();
          const points = $("cardPoints").value.split("\n").map((s) => s.trim()).filter(Boolean);
          if (!front || !answer) return err("A flash card needs a front and an answer.");
          payload = { front, subtitle, note, answer, points, year: subtitle, extra: note, purpose: answer, protections: points };
        }
        if (card) {
          if (payload.type === "scenario") { delete card.year; delete card.extra; delete card.purpose; delete card.protections; }
          else { delete card.type; delete card.choices; delete card.correct; delete card.explanation; }
          Object.assign(card, payload);
        } else {
          state.cards.push({ id: uid(), folderId: view.folderId, ...payload });
        }
        save();
        modal.close();
        render();
      };
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flashcards-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function readJsonFile(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch { alert("That file isn't valid JSON, so it could not be imported."); return; }
        cb(data);
      };
      reader.readAsText(file);
    }

    function openImportDialog() {
      modal.innerHTML = `
        <div class="dialog-head">Import</div>
        <div class="dialog-body">
          <p style="margin-top:0">Add a deck file (new chapters or updated cards) or merge in a backup. Nothing you already have is deleted, and your progress is kept.</p>
          <button class="gold" id="pickMerge">Choose file to add / merge</button>
          <input id="mergeFile" type="file" accept="application/json,.json" hidden />
          <div style="border-top:1px solid var(--line);margin:18px 0 12px"></div>
          <div class="muted">Moving to a new device? Restoring replaces everything in this browser with the backup.</div>
          <div class="row" style="justify-content:space-between;margin-top:10px">
            <button class="danger" id="pickRestore">Restore backup (replaces everything)</button>
            <button class="secondary" id="cancelModal">Cancel</button>
          </div>
          <input id="restoreFile" type="file" accept="application/json,.json" hidden />
        </div>`;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("pickMerge").onclick = () => document.getElementById("mergeFile").click();
      document.getElementById("pickRestore").onclick = () => document.getElementById("restoreFile").click();
      document.getElementById("mergeFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importMerge);
        e.target.value = "";
      };
      document.getElementById("restoreFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importRestore);
        e.target.value = "";
      };
    }

    function importMerge(data) {
      let sum;
      try { sum = mergeImport(data); }
      catch (err) { alert("That file could not be imported. " + (err && err.message ? err.message : "")); return; }
      showSummary("Import complete", sum);
    }

    function importRestore(data) {
      if (!data || Array.isArray(data) || !Array.isArray(data.folders) || !Array.isArray(data.cards)) {
        alert("Restore needs a full backup file (made with Export). To add a deck, use \"Choose file to add / merge\" instead.");
        return;
      }
      if (!confirm("Replace ALL folders, cards and progress in this browser with this backup?\n\nThis can't be undone. Tip: Export first if you might want your current data.")) return;
      state = migrate(JSON.parse(JSON.stringify(data)));
      applyBundledDecks();
      save();
      modal.close();
      view.page = "home";
      render();
      toast(`Backup restored: ${state.folders.length} folders, ${state.cards.length} cards.`);
    }

    function showSummary(title, sum) {
      modal.innerHTML = `
        <div class="dialog-head">${escaped(title)}</div>
        <div class="dialog-body">
          <p style="margin-top:0"><strong id="importSummary">${escaped(summaryText(sum))}</strong></p>
          ${sum.decks.length ? `<div class="muted">Decks: ${sum.decks.map(escaped).join(", ")}</div>` : ""}
          ${sum.problems.length ? `<div class="muted" style="margin-top:8px;color:var(--bad)">${sum.problems.slice(0, 8).map(escaped).join("<br>")}${sum.problems.length > 8 ? "<br>…" : ""}</div>` : ""}
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="gold" id="closeSummary">Done</button>
          </div>
        </div>`;
      if (!modal.open) modal.showModal();
      document.getElementById("closeSummary").onclick = () => modal.close();
      view.page = view.page === "home" || view.page === "folder" ? view.page : "home";
      render();
    }

    let matchTimer = null;
    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 4500);
    }

    window.onerror = function(msg) {
      const app = document.getElementById("app");
      if (app) app.innerHTML = "<div class=\"card\"><strong>Something broke.</strong><div class=\"muted\">"+String(msg)+"</div></div>";
    };
    try { render(); } catch (err) { window.onerror(err && err.message ? err.message : err); }
    if (bundledSummary && (bundledSummary.foldersAdded || bundledSummary.cardsAdded || bundledSummary.cardsUpdated)) {
      toast(`New study material: ${bundledSummary.decks.join(", ")} (${bundledSummary.cardsAdded} new, ${bundledSummary.cardsUpdated} updated cards)`);
    }
  </script>
</body>
</html>
