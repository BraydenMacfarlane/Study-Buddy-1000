5.18 Practice · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies"},{"id":"c202-ch05-141","type":"scenario","front":"Each morning, Suzy searches for qualified people the company could recruit. What is she doing?","choices":["Recruiting","Sourcing","Referring","Resourcing"],"correct":1,"explanation":"Likely per text: identifying qualified people to recruit is sourcing.","subtitle":"Ch 5 Quiz Q1 · Effective HRM","note":"Read more: 5.2 Introduction"},{"id":"c202-ch05-142","type":"scenario","front":"Activities that affect the number and type of people willing to apply for and accept job offers are called...","choices":["Sourcing","Resourcing","Recruiting","Referring"],"correct":2,"explanation":"Likely per text: that's the definition of recruiting.","subtitle":"Ch 5 Quiz Q2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.12 Recruiting"},{"id":"c202-ch05-143","type":"scenario","front":"A source that looks for current employees who could fit another position is called...","choices":["Internal recruiting","External recruiting","Organizational recruiting","Outsourced recruiting"],"correct":0,"explanation":"Likely per text: internal recruiting sources look inside the company.","subtitle":"Ch 5 Quiz Q3 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-144","type":"scenario","front":"A source that targets people outside the company is called...","choices":["Internal recruiting","Organizational recruiting","Outsourced recruiting","External recruiting"],"correct":3,"explanation":"Likely per text: external recruiting sources target outsiders.","subtitle":"Ch 5 Quiz Q4 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-145","type":"scenario","front":"Companies with a promote-from-within philosophy usually turn first to which sources?","choices":["External recruiting","Outsourced recruiting","Organizational recruiting","Internal recruiting"],"correct":3,"explanation":"Likely per text: promote-from-within firms try internal sources first.","subtitle":"Ch 5 Quiz Q5 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-146","type":"scenario","front":"Relying only on ___ to fill senior positions can limit new insights.","choices":["External sourcing","Marketing","Internal sourcing","Organizational sourcing"],"correct":2,"explanation":"Likely per text: insiders-only for senior roles limits fresh perspectives.","subtitle":"Ch 5 Quiz Q6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-147","type":"scenario","front":"Every quarter, Lisa identifies three employees who could become managers in the future. What is she practicing?","choices":["Talent inventory","Talent management","Internal management","Succession management"],"correct":3,"explanation":"Likely per text: preparing future leaders is succession management.","subtitle":"Ch 5 Quiz Q7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-148","type":"scenario","front":"A record of employees' characteristics, experience, and competencies is a(n)...","choices":["Talent inventory","Internal inventory","Succession plan","Internal management system"],"correct":0,"explanation":"Likely per text: that's a talent inventory.","subtitle":"Ch 5 Quiz Q8 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-149","type":"scenario","front":"Which systems let a company communicate job openings to its employees?","choices":["Talent inventory","Internal job posting","Succession management","Internal management"],"correct":1,"explanation":"Likely per text: internal job posting systems announce openings to employees.","subtitle":"Ch 5 Quiz Q9 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-150","type":"scenario","front":"Which is a drawback of recruiting externally?","choices":["Outside hires typically take longer to hire and train","It saves the company money","It brings a more diverse applicant pool","Internal candidates know less about the culture"],"correct":0,"explanation":"Likely per text: external hires usually take longer to hire and train. Saving money and diversity aren't drawbacks, and insiders know more about the culture, not less.","subtitle":"Ch 5 Quiz Q10 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"}]},{"id":"c202-ch06","folder":"C202 Ch 6: Selection and Hiring","course":"C202","order":6,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 6 Study Guide: Selection and Hiring\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter belongs to **Effective Human Resource Management**: *evaluating strategies, policies, and procedures for effective HRM within an organization*. Effective HRM is the heaviest area on the Objective Assessment (OA), about **52%**, covering Chapters 4-8, 12, and 13. WGU's checklist for this chapter has three items: person-organization fit, the differences among interview types, and fairness in hiring.\n\nStarting with this chapter, WGU's study guide follows a fictional new hire, Antonio, through realistic workplace situations. That is a strong hint about OA style: expect short scenarios that ask you to **label** what's happening (Which kind of fit is this? Which interview type is this question? Which kind of fairness was violated?). The deck's Apply cards test the same skills with new people and companies. A few topics preview **Legal and Regulatory** ideas: the Uniform Guidelines (UGESP), the ADA's limits on medical exams, the Fair Credit Reporting Act, and \"ban the box.\"\n\nChapter 6 is part of **Quarter 2** (Chapters 5-8). WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n---\n\n## 6.1-6.3 Why selection matters\n\nThe **selection process** gathers and evaluates information to decide who gets hired. The weaker the applicant pool, the stronger the assessment needs to be. Jack Welch called hiring great people brutally hard but more important than anything else. The evidence backs him up: at Time Warner, top-quartile scorers on a sales-focus assessment sold up to 71% more than bottom-quartile scorers. Like recruiting, selection shapes what employees **can** do.\n\nThe flow runs: assess candidates, combine the information, choose who gets an offer, decide what the offer contains, and negotiate.\n\n*Opening case:* Zappos built its customer-service strategy on culture. CEO Tony Hsieh believed that if you get the culture right, great service and a strong brand follow, so the challenge was making culture fit a real hiring priority.\n\n## 6.4 Assessment goals and accuracy\n\nThe primary goal is to identify the people who will best meet staffing goals, such as job performance and executing the strategy. Screening out bad hires can be worth more than finding good ones, because one bad manager or one unethical decision can do enormous damage. In the quiz's words: sometimes **not hiring** a poor fit is more valuable than **hiring** good performers.\n\nAssessment information must be accurate. Every hiring decision lands in one of four outcomes:\n\n- **True positive:** hired and successful (good)\n- **True negative:** not hired, and would have failed (good)\n- **False positive:** hired but unsuccessful (bad)\n- **False negative:** not hired, but would have succeeded (bad)\n\nPerfect prediction isn't realistic; the aim is many true positives and true negatives. Which error matters more depends on the job. False positives are worst in high-risk jobs like air traffic controller or surgeon. False negatives are costly when the rejected person strengthens a competitor (a star salesperson or researcher), or when a rejected protected-class member wins a discrimination settlement.\n\n## 6.5 Fit: job, group, and organization\n\nPeople need to fit at three levels to succeed. Know these definitions cold; the first checklist item asks you to define P-O fit, and the quiz asks you to tell all three apart.\n\n- **Person-job fit** matches a person's **abilities to the job's demands**, and their **needs and motivations to the job's attributes and rewards**. It's the **primary focus of most assessment** because it drives performance. It also relates to satisfaction, commitment, and intent to stay. Dimensions: education, job competencies, job knowledge, experience, and task-relevant personality.\n- **Person-group fit** is the match with the **workgroup, including the supervisor**: fitting coworkers' communication styles, goals, and skills. It matters most when **work is interdependent**, as in teams and small firms. Dimensions: expertise relative to the team, conflict style, teamwork values, communication skills, and personality for working with others.\n- **Person-organization (P-O) fit** is the match between a person's **values, attitudes, and personality** and the **organization's values, norms, and culture**. Dimensions: integrity, compassion, competitiveness, values, and goals. P-O fit has a strong positive link to **satisfaction, commitment, and intent to stay**, but **little or no effect on whether someone meets the job's requirements**. That's why companies pair it with person-job assessment.\n\n*Examples of P-O fit hiring:* Hilton gets over a million applications a year and screens first for brand and culture fit (hospitality as a calling: warm, genuine, caring), then trains skills. It even asks housekeeping applicants, \"Do you enjoy cleaning?\" Zappos believes people who don't fit its culture won't be happy or successful there.\n\n*Telling them apart:* ask what is being matched. Skills, knowledge, or what the job pays and offers = person-job. The team or the boss = person-group. Values and culture = person-organization. *Caution:* hiring for fit doesn't mean hiring people you feel comfortable with. That slides into stereotyping and illegal discrimination. Fit should be defined by job-related values and behaviors, not by background or similarity to the interviewer.\n\n*A wording note:* one practice question says P-O fit \"influences satisfaction, performance, commitment, and retention.\" The intended answer is P-O fit, but remember the research nuance: its effect on meeting job requirements is small.\n\n## 6.6 Ethics, legal compliance, and stakeholder reactions\n\n**Ethics:** explain how results will be used and how privacy is protected, weigh invasive methods (drug and integrity tests) carefully, use trained administrators, keep results confidential, and destroy rejected candidates' information after an appropriate time.\n\n**Legal compliance:** defensible hiring compares all applicants on the same fair, consistent, objective, job-predictive information. Subjective judgments aren't illegal in themselves, but they invite stereotyping and disparate impact, so train assessors. Three sources of guidance:\n\n- **Uniform Guidelines on Employee Selection Procedures (UGESP):** federal guidance for complying with bans on discrimination by race, color, religion, sex, and national origin. Examples: do a job analysis; justify any required training or experience by its link to job content; set cutoff scores that are reasonable and consistent with normal proficiency.\n- **Standards for Educational and Psychological Testing:** joint standards from AERA, APA, and NCME.\n- **Principles for the Validation and Use of Personnel Selection Procedures:** good-practice principles for choosing, building, and using selection tools.\n\n**Stakeholder reactions:** the process must work for recruits, recruiters, and hiring managers. Managers skip two-hour interviews they find unreasonable, and applicants withdraw when faced with too many tests. Applicants are future hires, referral sources, and customers, so every contact shapes the employer image. Reactions even affect accuracy: anxious applicants score lower, so making tests feel fair and job-related improves the data.\n\n## 6.7 Assessment methods and validity\n\nMethods come in three waves, with rigor rising at each stage:\n\n1. **Screening assessment methods** reduce **applicants to candidates** by checking minimum qualifications (résumés, applications, phone screens).\n2. **Evaluative assessment methods** examine candidates in depth to **decide whom to hire** (tests, interviews, work samples).\n3. **Contingent assessment methods** come **after a contingent offer**: background checks, drug screens, medical exams. Passing leads to the formal offer.\n\nScreening and evaluative tools can be used at any stage, but contingent assessments only come after a contingent offer. Sequencing options: cheapest first to shrink the pool, best predictors first, or self-selection tools first so poor fits opt out. Use multiple methods for the most important characteristics.\n\n**Validity** here means how well a method predicts job performance (closer to 1 is better). Table 6.3's headline numbers: cognitive ability 0.51; personality 0 to 0.33; integrity 0.41; **job knowledge 0.48**; structured interviews 0.51-0.63; unstructured interviews 0.20-0.38; work samples 0.34; simulations 0.54; assessment centers 0.37; reference checks 0.26. *Erratum:* the book prints the job knowledge value as \".048,\" a typo for 0.48. The pattern to remember: structured interviews, simulations, and cognitive tests predict best; unstructured interviews and references predict worst. Cognitive tests and interviews carry moderate adverse impact; most other methods are low.\n\n## 6.8 Screening methods\n\n- **Résumés and cover letters** are standard but often inaccurate. Common lies: overstated skills, stretched tenure, and false reasons for leaving. *Erratum:* the book says Yahoo's Ross Levinsohn was ousted for inflated credentials. It was actually CEO **Scott Thompson** (2012); Levinsohn was his interim replacement. Verify what you rely on.\n- **Job applications** collect the same information from everyone, which makes comparison easier. Include a statement that false information is grounds for dismissal.\n- **Telephone screens** confirm basic facts, availability, salary expectations, deal-breakers, and willingness to relocate or travel.\n\n## 6.9-6.10 Ability, personality, and integrity tests\n\n**Cognitive ability tests** (Wonderlic, Raven's) measure reasoning, logic, and perception. They predict success in virtually every job, especially complex jobs and jobs requiring new learning. But they tend to produce **disparate impact**, so never use them alone; combining them with other tools reduces adverse impact while keeping prediction. Applicants dislike them because they seem unrelated to the job.\n\n**Noncognitive ability tests** cover sensory abilities (vision, hearing) and psychomotor abilities (strength, dexterity). Physical tests must be truly job-necessary because they can cause adverse impact.\n\n**Personality** is usually assessed with the **Big Five**. **Conscientiousness** predicts performance in **all** occupations; emotional stability predicts most jobs. Extraversion predicts sales and management, agreeableness predicts teamwork and helping jobs, and openness predicts creativity, adaptability, and expatriate success. Cognitive ability is \"can do\"; conscientiousness and emotional stability are \"will do.\" Personality tests aren't predictive enough to use alone, and questions that reveal mental impairments can violate the ADA.\n\n**Integrity tests** assess honesty, reliability, and trustworthiness. They have little adverse impact, are unrelated to cognitive ability (so they add prediction), are cheap, and predict theft and counterproductive behavior. They're most valuable for cash-handling or in-home jobs.\n\n## 6.11 Job knowledge tests and interviews\n\n**Job knowledge tests** measure technical knowledge of the job's duties, tools, and processes, such as an HR knowledge test for an HR applicant. They have minimal adverse impact and predict well, especially for complex jobs.\n\n**Interviews** assess interpersonal skills, decision style, and leadership. Applicants like them because they seem job-related, and they double as recruiting tools. This is the second checklist item, so know each type and how to spot it.\n\n- **Unstructured interview:** questions vary from candidate to candidate and there are no standards for judging answers. Interviewers fall back on personal theories (eye contact, appearance) and a global gut judgment. Answers are hard to compare, prediction is weak, and the method is expensive and legally risky. **Not recommended.**\n- **Structured interview:** has three features: (1) **the same questions for every candidate**, (2) questions **developed from a job analysis** to assess specific qualifications, and (3) a **formal scoring system** with trained raters (predetermined scoring keys). This reduces bias from irrelevant factors like attractiveness, and well-developed structured interviews **predict well**. It costs more and requires training.\n\nStructured interviews come in two types:\n\n- **Behavioral interview:** based on the idea that **past behavior predicts future behavior**. The candidate describes a real **situation, the action they took, and the result**. Cue phrases: \"Tell me about a time...\" or \"Describe a situation when...\" It works best for **experienced** candidates. *Example:* \"Tell me about a time you had to write up an employee.\"\n- **Situational interview:** poses a **hypothetical** scenario and asks what the candidate **would** do. Cue phrases: \"What would you do if...\" or \"How would you handle...\" It works well for candidates with **limited experience**. Southwest Airlines uses them. *Example:* \"How would you handle a customer who is yelling at a coworker?\"\n\nBoth types use rating scales with anchored answers (for example, 5 = empathize, diagnose, and satisfy the customer; 3 = apologize and refund; 1 = call the manager).\n\n- **Case interview:** the candidate gets a **business problem to solve** and presents a solution, thinking aloud. They can ask questions, and there's rarely one right answer. **The process matters more than the answer.** It assesses business knowledge, reasoning, presentation, and communication, and is common in **consulting and investment banking**. *Example:* \"Our client's sales fell 15% last year. Walk me through how you'd find out why.\"\n\n*Spotting them:* past = behavioral; hypothetical = situational; business problem with reasoning = case; same questions with a scoring key = structured; anything goes with no scoring = unstructured.\n\n## 6.12 Work samples, simulations, and assessment centers\n\n**Work samples** measure performance on actual or simulated tasks, from situational judgment questions to portfolios. A **simulation** gives real tasks or recreates critical events, like a 911 call-taker handling mock calls. Work samples have low adverse impact, are well received, and are hard to fake, but they're expensive and work best for short tasks.\n\nAn **assessment center** is a battery of exercises: in-basket tasks (handling a pile of memos under time pressure), group discussions, role-plays with \"subordinates\" or \"clients,\" decision problems, presentations, and writing. About six participants are observed by several trained assessors, sometimes over days, and the result is a report on strengths, development needs, and potential.\n\n## 6.13-6.14 Contingent methods: references, medical and drug tests, background checks\n\n- **Reference checks** confirm information and reveal past performance. Former employers often say little for fear of defamation, but checking still reduces negligent hiring risk. Ask about fit and behavior, not just dates.\n- **Medical exams** must be job-related and consistent with business necessity. The **ADA** requires them to come **only after a contingent offer**, be given to everyone entering the same job, and be kept confidential and stored separately. Collecting medical information last makes it clear why someone was rejected. **Drug tests** are the most common medical test; publish a policy covering who is tested, which substances, cutoffs, confirmation, and consequences.\n- **Background checks** review criminal history, credit, and reputation, and are routine in healthcare, childcare, and finance. Under the **Fair Credit Reporting Act (FCRA)**, applicants get a copy of the report and a summary of rights, with a chance to fix errors before a decision. **\"Ban the box\"** laws delay criminal-history questions until after initial qualification; federal agencies and contractors must wait until after a conditional offer. If negative information leads to a rejection, give an **adverse action notice** with the screening company's contact information and the right to dispute it. Checks must be job-relevant, disclosed, consented to in writing, and documented. Judge records individually: the offense, how long ago it was, and the nature of the job.\n\n## 6.15 MITRE case\n\nMITRE hires highly educated engineers over a process of up to three months that it publishes openly: acknowledge every résumé, phone screen, prescreen, two to four interviews (sometimes with a presentation), background checks, and an offer with a week to decide. Transparency and courtesy at every step support fairness and the employer brand.\n\n## 6.16 Choosing whom to hire\n\n- **Multiple hurdles:** candidates must **pass each assessment** to move on. Use it when a **minimum level is essential**, such as a strength test for firefighters or the FBI's cognitive and judgment tests. It's slower and costlier.\n- **Compensatory approach:** **high scores offset low ones** (strong experience makes up for a lower GPA). Don't use it for must-have minimums.\n- **Combined:** a hurdle for the essentials, then a compensatory score across the rest.\n- **Cut score:** the minimum score needed to be hired. It's set by job experts or statistics and reflects strategy: high for \"hire only the best,\" lower for urgent fills or cost leadership.\n- **Rank ordering:** list candidates from highest to lowest. It doesn't guarantee minimum standards on its own.\n- **Best practice:** offer the job to the highest-ranked candidates who are above the cut score, and identify at least one backup.\n\n## 6.17 Making the offer\n\nAt the offer stage the focus shifts from evaluating to **persuading**. Maximize the **employee value proposition**, meaning the intrinsic and extrinsic rewards someone gets for their time and talent, not just salary. Google and SAS pay average wages but win with perks and environment. Five factors shape the offer: the **job** (level, exempt status), the **organization** (policies, internal equity, urgency, union contracts, strategy), the **finalist** (needs, competing offers), **external** conditions (labor market, cost of living, competitor pay), and **legal** factors (EEO and affirmative action goals).\n\n## 6.18 Fairness perceptions\n\nThis is the third checklist item. Fairness perceptions affect whether candidates accept offers, recommend the company, keep buying from it, and consider suing.\n\n- **Distributive fairness** is the fairness of **outcomes**. It's usually **low for most applicants**, simply because most aren't hired. *Violation example:* a less qualified friend of the manager gets the job.\n- **Procedural fairness** is the fairness of the **policies and procedures** used to decide. It's driven by job relatedness, a **chance to demonstrate abilities**, and the propriety of questions. *Violation examples:* the manager had a hidden favorite all along; a top test score is overruled by a \"bad feeling\"; an illegal question.\n- **Interactional fairness** is the **respect and quality of interpersonal treatment**. *Violation examples:* rude or unprepared interviewers, last-minute cancellations, an unreasonable negotiator. *Upholding example:* a recruiter calls to explain a rejection and thanks the candidate.\n\n**How to promote fairness in hiring:** use structured interviews and standardized rubrics so everyone is judged on the same criteria; base every assessment on a job analysis; give each candidate a chance to show their skills; avoid improper or illegal questions; use validated, non-invasive methods; explain the process and timeline; communicate promptly and respectfully, including with people you reject; train interviewers; and monitor results for adverse impact. Fair procedures and respectful treatment **soften the sting of rejection**, even when the outcome is disappointing.\n\n## 6.19-6.20 Negotiation and the employment contract\n\nHow negotiable an offer is depends on the job, the manager, the organization, and the candidate's value. Government jobs usually follow fixed pay scales. *Erratum:* the book says mid-level jobs often have a negotiable range of 10-20%, but its own example (a $50,000 job with a $40,000-$60,000 range) is plus or minus 20%, a 40% total spread. Remember the idea, not the exact percentage. Commonly negotiated items include salary, sign-on bonus, stock or bonuses, relocation, some benefits, start date, and title. Know your **BATNA** (best alternative to a negotiated agreement) and turn down offers worse than it. Not negotiating a first salary can cost hundreds of thousands over a career; in one MBA study, 52% of men but only 12% of women negotiated.\n\nMost jobs run on an **implicit employment contract**, an understanding that isn't written down. A legally binding contract needs an **offer** (terms clear enough to show willingness to be bound), **acceptance** (exactly as offered; adding terms makes it a **counteroffer**), and **consideration** (an exchange of value, usually pay for labor).\n\n## 6.21-6.23 Succession, Zappos, and open hiring\n\n**Succession management** identifies critical jobs that can't be left vacant and plans to fill them quickly. Only 30% of family businesses survive to the second generation.\n\nZappos screens in **two steps**: first skills and experience (job fit), then a second interview on values and personality (culture fit). It notes how candidates treat the shuttle driver, then offers new hires $3,000 to quit after four weeks of training; about 10% take it, so poor fits leave early. The Body Shop's **open hiring** asks only three questions (authorized to work? able to stand 8 hours? able to lift 50 pounds?) and hires first-come, first-served, which cut monthly turnover by 60%.\n\n## 6.25 Reliability and validity\n\n**Reliability** is **consistency**. A reliable measure gives similar scores on repeated use. Coefficients run from 0 to 1: above 0.70 is acceptable, and 0.80 or higher is preferred. **Validity** is **usefulness for a purpose**: how well the measure predicts what matters, such as job success. Height is reliable but not valid for most jobs. **An unreliable measure cannot be valid.** Think of a target: tight clusters are reliable, centered clusters are valid. Validity is specific to a purpose and a group, so use tools validated for your population. UGESP requires supporting evidence when a tool has adverse impact.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Define person-organizational (P-O) fit.\n2. Describe the differences between structured, behavioral, and case interviews.\n3. Explain how to promote fairness in hiring practices.\n\nTo get there, make sure you can also explain:\n\n- Person-job vs. person-group vs. person-organization fit, and what each predicts\n- Unstructured vs. structured interviews, and situational vs. behavioral questions\n- Distributive, procedural, and interactional fairness, with an example of each\n- The four selection outcomes, and when false positives matter most\n- Screening vs. evaluative vs. contingent methods, and why medical exams come last\n- Which methods predict best, and the job knowledge erratum (0.48, not .048)\n- Multiple hurdles vs. compensatory, cut scores, and rank ordering\n- Offer, acceptance, and consideration; reliability vs. validity\n","cards":[{"id":"c202-ch06-001","front":"What is the selection process?","answer":"Gathering and evaluating information to decide who gets hired.","subtitle":"Ch 6.2 · Effective HRM","note":"Read more: 6.2 Introduction","points":["The weaker the applicant pool, the stronger assessment must be","Then: combine information, choose who gets the offer, set offer terms, negotiate","Like recruiting, it shapes what employees CAN do"]},{"id":"c202-ch06-002","front":"What evidence shows that strong selection pays off?","answer":"Time Warner's top-quartile scorers on a sales assessment sold up to 71% more than bottom-quartile scorers.","subtitle":"Ch 6.2 · Effective HRM","note":"Read more: 6.2 Introduction","points":["Steve Jobs: a great programmer is worth 25 average ones","Jack Welch: hiring great people is brutally hard, and nothing matters more"]},{"id":"c202-ch06-003","front":"What is the primary goal of assessment in selection?","answer":"Identify the people who will best meet staffing goals, such as job performance and executing strategy.","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["Screening out bad hires can matter more than finding good ones","Quiz wording: not hiring a poor fit can be worth more than hiring good performers"]},{"id":"c202-ch06-004","front":"Why can screening out a bad hire be worth more than finding a good one?","answer":"One bad manager or unethical decision can do enormous damage; small businesses are hurt most.","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["The wider the range of talent in the pool, the more accuracy matters"]},{"id":"c202-ch06-005","front":"What are the four possible selection outcomes?","answer":"True positive, true negative (correct decisions); false positive, false negative (errors).","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["True positive: hired and successful","True negative: rejected, would have failed","False positive: hired, unsuccessful","False negative: rejected, would have succeeded"]},{"id":"c202-ch06-006","front":"What is a false positive in selection?","answer":"Someone who was hired but turns out to be unsuccessful.","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["Worst in high-risk jobs: surgeon, air traffic controller"]},{"id":"c202-ch06-007","front":"What is a false negative in selection?","answer":"Someone who was rejected but would have succeeded in the job.","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["Costly when the person strengthens a competitor or wins a discrimination claim"]},{"id":"c202-ch06-008","front":"When is a false negative especially costly?","answer":"When the rejected star joins a competitor, or a rejected protected-class member wins a settlement.","subtitle":"Ch 6.4 · Effective HRM","note":"Read more: 6.4 Assessment Goals","points":["Example: a top salesperson or researcher hired by a rival"]},{"id":"c202-ch06-009","front":"What is person-organization (P-O) fit?","answer":"The match between a person's values, attitudes, and personality and the organization's values, norms, and culture.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Dimensions: integrity, compassion, competitiveness, values, goals","Strongly linked to satisfaction, commitment, and intent to stay","Little or no effect on meeting job requirements"]},{"id":"c202-ch06-010","front":"What outcomes does P-O fit predict, and which does it barely affect?","answer":"Strongly predicts satisfaction, commitment, and intent to stay; little effect on meeting job requirements.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Moderate link with attitudes; modest effect on actual turnover","That's why firms pair it with person-job assessment"]},{"id":"c202-ch06-011","front":"What are the five dimensions of P-O fit listed in the text?","answer":"Integrity, compassion, competitiveness, values, and goals.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["All are about matching the culture, not the job's tasks"]},{"id":"c202-ch06-012","front":"What is person-job fit?","answer":"Matching abilities to the job's demands, and needs and motivations to the job's attributes and rewards.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Primary focus of most assessment (drives performance)","Dimensions: education, competencies, job knowledge, experience, task-relevant personality"]},{"id":"c202-ch06-013","front":"Which type of fit is the primary focus of most hiring assessment?","answer":"Person-job fit, because it drives job performance.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Also linked to satisfaction, commitment, and intent to stay"]},{"id":"c202-ch06-014","front":"What is person-group fit?","answer":"The match between a person and their workgroup, including the supervisor.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Fitting coworkers' communication styles, goals, and skills","Dimensions: expertise vs. team, conflict style, teamwork values, communication, personality"]},{"id":"c202-ch06-015","front":"When does person-group fit matter most?","answer":"When work is interdependent, as in teams and small firms.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Raises satisfaction, commitment, and intent to stay"]},{"id":"c202-ch06-016","front":"How can you tell the three types of fit apart in a scenario?","answer":"Ask what's matched: skills or job rewards = job; team or boss = group; values or culture = organization.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Fit at all three levels maximizes performance, retention, and engagement"]},{"id":"c202-ch06-017","front":"How does Hilton hire for P-O fit?","answer":"It screens first for brand and culture fit (hospitality as a calling), then trains the skills.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["1M+ applications, about 100,000 hires a year","Asks housekeepers, 'Do you enjoy cleaning?'"]},{"id":"c202-ch06-018","front":"What is the caution about hiring for fit?","answer":"Fit isn't comfort or similarity; hiring people like yourself risks stereotyping and illegal discrimination.","subtitle":"Ch 6.5 · Effective HRM","note":"Read more: 6.5 Fit","points":["Define fit by job-related values and behaviors"]},{"id":"c202-ch06-019","front":"What are ethical practices in running selection?","answer":"Explain how results are used, protect privacy, use trained administrators, and destroy old applicant data.","subtitle":"Ch 6.6 · Effective HRM","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Weigh invasive methods (drug, integrity tests) carefully","Keep results confidential"]},{"id":"c202-ch06-020","front":"What makes a hiring process legally defensible?","answer":"Comparing all applicants on the same fair, consistent, objective, job-predictive information.","subtitle":"Ch 6.6 · Legal & Regulatory","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Subjective judgments aren't illegal per se but invite stereotyping and disparate impact","Train assessors"]},{"id":"c202-ch06-021","front":"What are the Uniform Guidelines on Employee Selection Procedures (UGESP)?","answer":"Federal guidance for complying with bans on hiring discrimination by race, color, religion, sex, national origin.","subtitle":"Ch 6.6 · Legal & Regulatory","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Do a job analysis","Justify required training or experience by job content","Cutoff scores must be reasonable and match normal proficiency"]},{"id":"c202-ch06-022","front":"What are the Standards for Educational and Psychological Testing?","answer":"Joint testing standards published by AERA, APA, and NCME.","subtitle":"Ch 6.6 · Effective HRM","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Companion: Principles for the Validation and Use of Personnel Selection Procedures"]},{"id":"c202-ch06-023","front":"Why do applicant reactions to selection matter?","answer":"Applicants are future hires, referral sources, and customers; reactions shape offer acceptance and image.","subtitle":"Ch 6.6 · Effective HRM","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["PNC fixed its 'black hole' job board because teller applicants are often customers","Anxiety lowers test scores, hurting accuracy"]},{"id":"c202-ch06-024","front":"How do applicant reactions affect test accuracy?","answer":"Anxiety lowers scores while motivation and self-efficacy raise them, so fair-seeming tests give better data.","subtitle":"Ch 6.6 · Effective HRM","note":"Read more: 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Make assessments feel job-related and reduce anxiety"]},{"id":"c202-ch06-025","front":"What do screening assessment methods do?","answer":"Reduce applicants to candidates by checking minimum qualifications.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods; 6.8 Screening Assessment Methods","points":["Résumés, cover letters, applications, phone screens"]},{"id":"c202-ch06-026","front":"What do evaluative assessment methods do?","answer":"Examine candidates in depth to decide whom to hire.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods","points":["Tests, interviews, work samples, assessment centers"]},{"id":"c202-ch06-027","front":"What are contingent assessment methods?","answer":"Checks done after a contingent offer, such as background checks, drug screens, and medical exams.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods; 6.13 Contingent Assessment Methods: Reference Checks and Medical and Drug Tests","points":["Passing leads to the formal offer","Only these must wait for an offer"]},{"id":"c202-ch06-028","front":"What are three ways to sequence assessment methods?","answer":"Cheapest first to shrink the pool, best predictors first, or self-selection tools first so poor fits opt out.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods","points":["Use multiple methods for the most important characteristics"]},{"id":"c202-ch06-029","front":"Which assessment methods have the highest validity in Table 6.3?","answer":"Structured interviews (0.51-0.63), simulations (0.54), and cognitive ability tests (0.51).","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods","points":["Validity = how well it predicts job performance; closer to 1 is better"]},{"id":"c202-ch06-030","front":"Which assessment methods have the lowest validity in Table 6.3?","answer":"Unstructured interviews (0.20-0.38) and reference checks (0.26); personality ranges from 0 to 0.33.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods","points":["Work samples 0.34, assessment centers 0.37, integrity 0.41"]},{"id":"c202-ch06-031","front":"What is the validity of job knowledge tests, and what's the book's typo?","answer":"0.48. Table 6.3 prints '.048', which is a typo for 0.48.","subtitle":"Ch 6.7 · Effective HRM","note":"Read more: 6.7 Assessment Methods; 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Erratum: the decimal point is misplaced in the book","Job knowledge tests predict well, especially for complex jobs"]},{"id":"c202-ch06-032","front":"Which assessment methods tend to have moderate adverse impact?","answer":"Cognitive ability tests and interviews (structured and unstructured).","subtitle":"Ch 6.7 · Legal & Regulatory","note":"Read more: 6.7 Assessment Methods","points":["Most other methods are rated low; medical/background checks are mixed"]},{"id":"c202-ch06-033","front":"What are the most common résumé lies?","answer":"Overstated skill mastery, stretched tenure to hide an employer, and a false reason for leaving.","subtitle":"Ch 6.8 · Effective HRM","note":"Read more: 6.8 Screening Assessment Methods","points":["2020 Checkster survey of 400 applicants and 400 managers","A signed 'falsification means termination' statement improves honesty"]},{"id":"c202-ch06-034","front":"Which Yahoo CEO left in 2012 over a padded résumé?","answer":"Scott Thompson. The book wrongly names Ross Levinsohn, who was his interim replacement.","subtitle":"Ch 6.8 · Effective HRM","note":"Read more: 6.8 Screening Assessment Methods","points":["Erratum: teach Thompson; know the book says Levinsohn","Lesson: verify self-reported credentials"]},{"id":"c202-ch06-035","front":"Why use a job application in addition to a résumé?","answer":"It gathers the same information from everyone, making comparison easier and checking résumé accuracy.","subtitle":"Ch 6.8 · Effective HRM","note":"Read more: 6.8 Screening Assessment Methods","points":["Include: inaccurate information is grounds for dismissal","Keep demographic questions away from recruiters"]},{"id":"c202-ch06-036","front":"What does a telephone screen typically confirm?","answer":"Résumé facts, availability, salary expectations, deal-breakers, and willingness to relocate or travel.","subtitle":"Ch 6.8 · Effective HRM","note":"Read more: 6.8 Screening Assessment Methods","points":["Can also probe culture fit and other suitable positions"]},{"id":"c202-ch06-037","front":"What do cognitive ability tests measure, and how well do they predict?","answer":"General mental ability (reasoning, logic, perception); they predict success in virtually all jobs.","subtitle":"Ch 6.9 · Effective HRM","note":"Read more: 6.9 Evaluative Assessment Methods: Cognitive and Noncognitive Ability Tests","points":["Most important for complex jobs, newcomers, and jobs requiring new learning","Examples: Wonderlic, Raven's Progressive Matrices"]},{"id":"c202-ch06-038","front":"What is the main risk of cognitive ability tests, and how do you manage it?","answer":"They tend to produce disparate impact, so never use them alone; combine them with other assessments.","subtitle":"Ch 6.9 · Legal & Regulatory","note":"Read more: 6.9 Evaluative Assessment Methods: Cognitive and Noncognitive Ability Tests","points":["Combining keeps prediction while reducing adverse impact","Applicants dislike them as not job-related"]},{"id":"c202-ch06-039","front":"What do noncognitive ability tests measure?","answer":"Sensory abilities (seeing, hearing, speech) and psychomotor abilities (strength, dexterity, coordination).","subtitle":"Ch 6.9 · Effective HRM","note":"Read more: 6.9 Evaluative Assessment Methods: Cognitive and Noncognitive Ability Tests","points":["Physical tests must be truly job-necessary; they can cause adverse impact"]},{"id":"c202-ch06-040","front":"What are the Big Five personality traits?","answer":"Extraversion, conscientiousness, emotional stability, agreeableness, and openness to experience.","subtitle":"Ch 6.10 · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests","points":["Text: they capture up to 75% of personality","Not predictive enough to use alone"]},{"id":"c202-ch06-041","front":"Which Big Five trait predicts performance in all occupations?","answer":"Conscientiousness: planful, detail-oriented, rule-following, and hardworking.","subtitle":"Ch 6.10 · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests","points":["Emotional stability predicts most jobs","Together they're the 'will do' factors; cognitive ability is 'can do'"]},{"id":"c202-ch06-042","front":"What does each of the other Big Five traits predict?","answer":"Extraversion: sales and management. Agreeableness: teamwork and helping. Openness: creativity and expat success.","subtitle":"Ch 6.10 · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests","points":["These predict only for specific jobs or criteria"]},{"id":"c202-ch06-043","front":"What legal caution applies to personality testing?","answer":"Questions that reveal a mental impairment or psychological condition may violate the ADA.","subtitle":"Ch 6.10 · Legal & Regulatory","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests","points":["Protect test scores; consult a lawyer"]},{"id":"c202-ch06-044","front":"What do integrity tests measure, and what are their strengths?","answer":"Honesty, reliability, and trustworthiness; low adverse impact, cheap, and they predict theft and misconduct.","subtitle":"Ch 6.10 · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests","points":["Unrelated to cognitive ability, so they add prediction","Most useful for cash handling, in-home work, valuables"]},{"id":"c202-ch06-045","front":"What do job knowledge tests measure?","answer":"Job-related, often technical, knowledge of duties, tools, and processes.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Example: an HR knowledge test for an HR applicant","Minimal adverse impact; predict well for complex jobs"]},{"id":"c202-ch06-046","front":"Why do employers and applicants like interviews?","answer":"They assess interpersonal skills and leadership, seem job-related, and double as recruiting.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["They also let candidates self-select out"]},{"id":"c202-ch06-047","front":"What is an unstructured interview?","answer":"One where questions vary by candidate and there are no standards for judging answers.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Relies on personal theories (eye contact, appearance) and gut judgment","Hard to compare, weak prediction, expensive, legally risky: not recommended"]},{"id":"c202-ch06-048","front":"Why are unstructured interviews not recommended?","answer":"Answers are hard to compare, they predict poorly, and they're expensive and legally risky.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews; 6.7 Assessment Methods","points":["Validity only 0.20-0.38"]},{"id":"c202-ch06-049","front":"What are the three features of a structured interview?","answer":"Same questions for everyone, questions built from a job analysis, and a formal scoring system.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Trained raters use predetermined scoring keys","Reduces bias from attractiveness and other irrelevant factors"]},{"id":"c202-ch06-050","front":"What are the trade-offs of a structured interview?","answer":"It predicts well and reduces bias, but it costs more and requires interviewer training.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Validity 0.51-0.63"]},{"id":"c202-ch06-051","front":"What are the two types of structured interview?","answer":"Behavioral (past behavior) and situational (hypothetical scenarios).","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Both can be mixed in one interview"]},{"id":"c202-ch06-052","front":"What is a behavioral interview?","answer":"A structured interview asking how the candidate actually handled past situations, since past behavior predicts future.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Candidate describes situation, action, result","Cue: 'Tell me about a time...'"]},{"id":"c202-ch06-053","front":"Which candidates are behavioral interviews best suited for?","answer":"Experienced candidates who have relevant past situations to describe.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Train scorers, ask consistently, probe skillfully"]},{"id":"c202-ch06-054","front":"What is a situational interview?","answer":"A structured interview posing hypothetical scenarios and asking what the candidate would do.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Cue: 'What would you do if...' or 'How would you handle...'","Southwest Airlines uses them"]},{"id":"c202-ch06-055","front":"Which candidates are situational interviews best suited for?","answer":"Candidates with limited work experience, since no past examples are needed.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Predicts well"]},{"id":"c202-ch06-056","front":"What is a case interview?","answer":"Giving the candidate a business problem to solve and present, thinking aloud.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Candidate may ask questions; rarely one right answer","Common in consulting and investment banking"]},{"id":"c202-ch06-057","front":"What does a case interview assess?","answer":"Business knowledge, reasoning, presentation, and communication; the process matters more than the answer.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["That's why candidates should think aloud"]},{"id":"c202-ch06-058","front":"How do structured, behavioral, and case interviews differ?","answer":"Structured = same scored questions; behavioral = real past actions; case = solve a business problem aloud.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Behavioral is one type of structured interview; situational is the other","Case focuses on the reasoning process"]},{"id":"c202-ch06-059","front":"What is the quickest cue for labeling an interview question?","answer":"Past = behavioral; hypothetical = situational; business problem = case; no standards = unstructured.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Same questions plus scoring key = structured"]},{"id":"c202-ch06-060","front":"How do structured interview rating scales work?","answer":"Answers are scored against anchors, e.g., 5 = empathize and solve, 3 = apologize and refund, 1 = call manager.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Anchors make scoring consistent across interviewers"]},{"id":"c202-ch06-061","front":"What is the bias concern with AI interview tools like HireVue?","answer":"Algorithms can be blind to protected traits, but correlated features must be checked and mitigated.","subtitle":"Ch 6.11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews","points":["Human implicit and explicit bias also causes adverse impact"]},{"id":"c202-ch06-062","front":"What are work samples?","answer":"Assessments of performance on actual or simulated job tasks, from judgment questions to portfolios.","subtitle":"Ch 6.12 · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)","points":["Low adverse impact, well received, hard to fake","Expensive; best for short tasks"]},{"id":"c202-ch06-063","front":"What is a simulation in selection?","answer":"A work sample that gives real tasks or recreates critical job events.","subtitle":"Ch 6.12 · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)","points":["Example: a 911 call-taker handling mock calls","Validity 0.54"]},{"id":"c202-ch06-064","front":"What is an assessment center?","answer":"A battery of exercises (in-basket, group discussion, role-plays, presentations) scored by trained assessors.","subtitle":"Ch 6.12 · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)","points":["About 6 participants; can last days","Report covers strengths, development needs, overall potential"]},{"id":"c202-ch06-065","front":"What is an in-basket exercise?","answer":"Handling a stack of memos and tasks under a time limit, as in an assessment center.","subtitle":"Ch 6.12 · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)","points":["Tests prioritizing and decision making"]},{"id":"c202-ch06-066","front":"Why do employers check references even though former employers say little?","answer":"Documented reference checks reduce negligent hiring risk and can still confirm key facts.","subtitle":"Ch 6.13 · Effective HRM","note":"Read more: 6.13 Contingent Assessment Methods: Reference Checks and Medical and Drug Tests","points":["Former employers fear defamation claims","Ask about fit and behavior, not just dates"]},{"id":"c202-ch06-067","front":"When may an employer require a medical exam?","answer":"Only after a contingent offer, for everyone entering the job, if job-related and a business necessity.","subtitle":"Ch 6.13 · Legal & Regulatory","note":"Read more: 6.13 Contingent Assessment Methods: Reference Checks and Medical and Drug Tests","points":["ADA rule; keep results confidential and stored separately","Collected last so the reason for any rejection is clear"]},{"id":"c202-ch06-068","front":"What should a drug-testing policy tell applicants in advance?","answer":"Who's tested, which substances, timing, cutoff levels, confirmation steps, safeguards, and consequences.","subtitle":"Ch 6.13 · Legal & Regulatory","note":"Read more: 6.13 Contingent Assessment Methods: Reference Checks and Medical and Drug Tests","points":["Drug tests are the most common medical test","Know state rules and union contracts"]},{"id":"c202-ch06-069","front":"What does the Fair Credit Reporting Act (FCRA) require?","answer":"Applicants get a copy of their credit report and a rights summary, with a chance to fix errors first.","subtitle":"Ch 6.14 · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks","points":["About half of employers run credit checks; critics call them unfair"]},{"id":"c202-ch06-070","front":"What are 'ban the box' laws?","answer":"Laws delaying criminal-history questions until after initial qualification, or a conditional offer for federal jobs.","subtitle":"Ch 6.14 · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks","points":["Records disproportionately affect Black and Hispanic applicants","35+ states and 150 cities/counties by 2020"]},{"id":"c202-ch06-071","front":"What is an adverse action notice?","answer":"Notice of negative background information, with the screener's contact details and the right to dispute it.","subtitle":"Ch 6.14 · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks","points":["Allow fair time to contest"]},{"id":"c202-ch06-072","front":"How should employers evaluate a criminal record?","answer":"Individually: the nature and gravity of the offense, time since it occurred, and the nature of the job.","subtitle":"Ch 6.14 · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks","points":["Checks must be job-relevant, disclosed, consented to in writing, and documented"]},{"id":"c202-ch06-073","front":"What makes MITRE's hiring process a good example?","answer":"It's transparent and courteous: every résumé is acknowledged and every step is published.","subtitle":"Ch 6.15 · Effective HRM","note":"Read more: 6.15 Case Study: Hiring at MITRE Corporation","points":["Up to 3 months; 2-4 interviews, background checks, one week to decide"]},{"id":"c202-ch06-074","front":"What is the multiple hurdles approach?","answer":"Candidates must pass each assessment satisfactorily to advance to the next.","subtitle":"Ch 6.16 · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire","points":["Use when a minimum level is essential (firefighter strength test)","Slower and costlier"]},{"id":"c202-ch06-075","front":"What is the compensatory approach?","answer":"Combining scores so high scores on some assessments offset low scores on others.","subtitle":"Ch 6.16 · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire","points":["Strong experience can make up for a lower GPA","Not for must-have minimums"]},{"id":"c202-ch06-076","front":"What is a cut score?","answer":"The minimum score a candidate needs to be hired, set by job experts or statistics.","subtitle":"Ch 6.16 · Strategic HRM","note":"Read more: 6.16 Choosing Whom to Hire","points":["High for 'hire only the best'; lower for urgent fills or cost leadership"]},{"id":"c202-ch06-077","front":"What is rank ordering, and its limitation?","answer":"Listing candidates from highest to lowest score; it doesn't guarantee they meet minimum standards.","subtitle":"Ch 6.16 · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire","points":["Pair it with a cut score"]},{"id":"c202-ch06-078","front":"What is the recommended final-choice practice?","answer":"Offer the job to the highest-ranked candidates above the cut score, with at least one backup.","subtitle":"Ch 6.16 · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire","points":["Set cut scores high enough to ensure minimum performance"]},{"id":"c202-ch06-079","front":"What is the employee value proposition?","answer":"The intrinsic and extrinsic rewards someone receives in exchange for their time and talent.","subtitle":"Ch 6.17 · Effective HRM","note":"Read more: 6.17 Making the Job Offer","points":["Maximize it, not just salary; tailor it to the finalist","Google and SAS pay average but offer standout perks"]},{"id":"c202-ch06-080","front":"What five categories of factors shape a job offer?","answer":"Job type, organizational factors, finalist factors, external factors, and legal factors.","subtitle":"Ch 6.17 · Effective HRM","note":"Read more: 6.17 Making the Job Offer","points":["Organizational: policies, internal equity, urgency, union contracts, strategy","External: labor market, cost of living, competitor pay"]},{"id":"c202-ch06-081","front":"Why must offers respect internal equity?","answer":"Paying new hires more than current staff can backfire when incumbents demand matching pay.","subtitle":"Ch 6.17 · Effective HRM","note":"Read more: 6.17 Making the Job Offer","points":["An organizational factor in offer content"]},{"id":"c202-ch06-082","front":"What is distributive fairness in hiring?","answer":"The perceived fairness of the outcome, such as who got the job.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions","points":["Usually low for most applicants, since most aren't hired"]},{"id":"c202-ch06-083","front":"What is procedural fairness in hiring?","answer":"The perceived fairness of the policies and procedures used to make the decision.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions","points":["Driven by job relatedness, a chance to show abilities, proper questions","Violated by a hidden favorite or an illegal question"]},{"id":"c202-ch06-084","front":"What is interactional fairness in hiring?","answer":"The perceived respect and quality of interpersonal treatment candidates receive.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions","points":["Violated by rude or unprepared interviewers and last-minute cancellations"]},{"id":"c202-ch06-085","front":"What three things drive perceptions of procedural fairness?","answer":"Job relatedness of the assessment, a chance to demonstrate abilities, and appropriate questions.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions","points":["Candidates prefer definitive, non-invasive, validated methods"]},{"id":"c202-ch06-086","front":"How can an employer promote fairness in hiring?","answer":"Use job-related structured methods for all, let candidates show skills, and treat everyone with respect.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions; 6.6 Ethics, Legal Compliance, and Positive Stakeholder Reactions","points":["Same rubric for everyone; trained interviewers; no improper questions","Explain the process; communicate promptly, including rejections","Monitor results for adverse impact"]},{"id":"c202-ch06-087","front":"Why does fairness still matter for rejected applicants?","answer":"Fair procedures and respectful treatment soften negative reactions to rejection.","subtitle":"Ch 6.18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions","points":["Affects recommendations, buying from the firm, and lawsuit intentions"]},{"id":"c202-ch06-088","front":"How negotiable are job offers, per the text?","answer":"It varies by job, manager, organization, and candidate value; government jobs usually use fixed scales.","subtitle":"Ch 6.19 · Effective HRM","note":"Read more: 6.19 Negotiating Employment Contracts","points":["Erratum: book says mid-level ranges are 10-20% negotiable","But its example ($40K-$60K on a $50K job) is ±20%, a 40% spread"]},{"id":"c202-ch06-089","front":"What is a BATNA?","answer":"Your best alternative to a negotiated agreement; decline any offer worse than it.","subtitle":"Ch 6.19 · Effective HRM","note":"Read more: 6.19 Negotiating Employment Contracts","points":["Signaling willingness to walk away can loosen talks"]},{"id":"c202-ch06-090","front":"What does research show about gender and salary negotiation?","answer":"Far fewer women negotiate (12% vs. 52% of men in one MBA study), compounding pay gaps.","subtitle":"Ch 6.19 · Effective HRM","note":"Read more: 6.19 Negotiating Employment Contracts","points":["Negotiators gained 7-8%","Not negotiating can cost $500K+ over a career"]},{"id":"c202-ch06-091","front":"What is an implicit employment contract?","answer":"An understanding of employment terms that isn't in a written or verbal contract; the norm for most jobs.","subtitle":"Ch 6.20 · Effective HRM","note":"Read more: 6.20 The Employment Contract","points":["Written contracts are more common at senior levels","A letter of agreement often substitutes"]},{"id":"c202-ch06-092","front":"What three elements make an employment contract legally binding?","answer":"Offer, acceptance, and consideration.","subtitle":"Ch 6.20 · Legal & Regulatory","note":"Read more: 6.20 The Employment Contract","points":["Offer: clear terms","Acceptance: exactly as offered","Consideration: exchange of value, usually pay for labor"]},{"id":"c202-ch06-093","front":"What happens if a candidate 'accepts' but asks for $10,000 more?","answer":"It isn't an acceptance; adding terms makes it a counteroffer.","subtitle":"Ch 6.20 · Legal & Regulatory","note":"Read more: 6.20 The Employment Contract","points":["Acceptance must match the offer exactly"]},{"id":"c202-ch06-094","front":"What is succession management in this chapter?","answer":"Identifying critical jobs that can't be left vacant and planning to fill them quickly.","subtitle":"Ch 6.21 · Strategic HRM","note":"Read more: 6.21 Succession Management","points":["Only 30% of family businesses reach the 2nd generation","Assess potential, not just current performance"]},{"id":"c202-ch06-095","front":"What is Zappos's two-step hiring process?","answer":"First assess skills and experience for job fit, then a second interview on values for culture fit.","subtitle":"Ch 6.22 · Effective HRM","note":"Read more: 6.22 Real World Response: How Zappos Hires the Right People","points":["Rejects talented but egotistical candidates","Shuttle drivers report how candidates behave"]},{"id":"c202-ch06-096","front":"Why does Zappos offer new hires $3,000 to quit after training?","answer":"So people who don't fit the culture leave early; about 10% take the offer.","subtitle":"Ch 6.22 · Effective HRM","note":"Read more: 6.22 Real World Response: How Zappos Hires the Right People","points":["Follows a 4-week paid training on culture and customer obsession"]},{"id":"c202-ch06-097","front":"What is open hiring at The Body Shop?","answer":"Hiring first-come, first-served after three yes/no questions, with no interview, background check, or drug test.","subtitle":"Ch 6.23 · Effective HRM","note":"Read more: 6.23 Strategic HRM Exercise: Open Hiring at the Body Shop","points":["Authorized to work? Stand 8 hours? Lift 50+ lbs?","Monthly turnover fell 60%"]},{"id":"c202-ch06-098","front":"What is reliability?","answer":"Consistency: a measure gives similar scores when repeated.","subtitle":"Ch 6.25 · Effective HRM","note":"Read more: 6.25 Appendix: Reliability and Validity","points":["Coefficient 0-1: above 0.70 acceptable, 0.80+ preferred","Necessary but not sufficient"]},{"id":"c202-ch06-099","front":"What is validity?","answer":"How well a measure assesses what it claims and predicts what matters, such as job success.","subtitle":"Ch 6.25 · Effective HRM","note":"Read more: 6.25 Appendix: Reliability and Validity","points":["Specific to a purpose and to a group","UGESP requires evidence if a tool has adverse impact"]},{"id":"c202-ch06-100","front":"Can an unreliable measure be valid?","answer":"No. Reliability is necessary for validity, though a reliable measure can still be invalid.","subtitle":"Ch 6.25 · Effective HRM","note":"Read more: 6.25 Appendix: Reliability and Validity","points":["Height is reliable but not valid for most jobs","Target: tight cluster = reliable; centered = valid"]},{"id":"c202-ch06-101","type":"scenario","front":"Priya, interviewing for a nurse-manager role, is asked: \"Tell me about a time you had to correct a coworker's charting error. What did you do, and what happened?\" Which interview type is this?","choices":["Situational","Case","Unstructured","Behavioral"],"correct":3,"explanation":"It asks about a real past event (situation, action, result), so it's behavioral. Past behavior predicts future behavior.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-102","type":"scenario","front":"A bank asks a recent graduate: \"Suppose a customer insists on withdrawing cash without ID and starts shouting. How would you handle it?\" Which interview type is this?","choices":["Case","Assessment center","Situational","Behavioral"],"correct":2,"explanation":"A hypothetical 'how would you handle' question is situational. It suits candidates with limited experience.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-103","type":"scenario","front":"A consulting firm hands Marcus a one-page brief, \"A regional grocer's profits fell 12% last year,\" and asks him to talk through how he'd diagnose and fix it. Which interview type is this?","choices":["Behavioral","Work sample portfolio","Case","Situational"],"correct":2,"explanation":"Solving a business problem aloud is a case interview. The reasoning process matters more than the final answer.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-104","type":"scenario","front":"Every candidate for a dispatcher job answers the same six questions drawn from a job analysis, and two trained raters score each answer against a 1-5 key. What kind of interview is this?","choices":["Unstructured","Case","Assessment center","Structured"],"correct":3,"explanation":"Same questions, built from job analysis, with a formal scoring key: the three features of a structured interview.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-105","type":"scenario","front":"A store manager chats with each applicant about whatever comes up, then hires the one who \"felt right.\" What's the main problem with this approach?","choices":["It's a situational interview: too focused on hypotheticals","It's an unstructured interview: inconsistent and a weak predictor","It's a case interview: too focused on business problems","It's a behavioral interview: too focused on past events"],"correct":1,"explanation":"Varying questions with no answer standards define an unstructured interview, which predicts poorly (0.20-0.38) and is legally risky.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-106","type":"scenario","front":"A hiring manager is filling an entry-level role. Most applicants are students with little work history. Which structured interview type fits best?","choices":["Behavioral, because it relies on candidates' past jobs","Unstructured, because students need a relaxed chat","Case, because every role needs a business problem to solve","Situational, because it doesn't require past examples"],"correct":3,"explanation":"Situational questions pose hypotheticals, so they work for candidates without relevant past experience.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-107","type":"scenario","front":"For a senior project manager opening, the panel wants evidence of how candidates actually led troubled projects. Which interview type fits best?","choices":["Unstructured","Case","Behavioral","Situational"],"correct":2,"explanation":"Behavioral interviews ask experienced candidates to describe real situations, actions, and results.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-108","type":"scenario","front":"\"If you were assigned to a team that disagreed with your approach, what would you do?\" Which interview type is this?","choices":["Case","Unstructured","Situational","Behavioral"],"correct":2,"explanation":"'What would you do' is a hypothetical, so it's situational. Rephrased as 'Tell me about a time a team disagreed with you,' it would be behavioral.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-109","type":"scenario","front":"Jae is asked to estimate how many electric-scooter chargers a mid-size city needs and explain his assumptions out loud. What is the interviewer mainly assessing?","choices":["His past experience with chargers","His personality fit with the team","His reasoning process and communication","Whether he gets the exact right number"],"correct":2,"explanation":"Case interviews rarely have one right answer. They assess business reasoning, presentation, and communication, so thinking aloud matters.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-110","type":"scenario","front":"Two interviewers ask candidates for the same job completely different questions and rate them on gut feel. What fix would improve both fairness and prediction most?","choices":["Longer interviews so the gut feel is surer","Letting each interviewer pick favorite questions","Adding a third interviewer who also uses gut feel","Same job-based questions with a scoring key"],"correct":3,"explanation":"Structuring the interview (same questions, job analysis, formal scoring) raises validity to 0.51-0.63 and makes the process procedurally fair.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-111","type":"scenario","front":"After Lena's final interview, the recruiter calls to explain she wasn't chosen, answers her questions, and thanks her for her time. Fair or unfair, and which type?","choices":["Fair: distributive","Fair: interactional","Fair: procedural","Unfair: distributive"],"correct":1,"explanation":"Respectful, considerate treatment during a rejection upholds interactional fairness.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-112","type":"scenario","front":"Omar posts the top score on a validated skills test, but the manager rejects him because she \"just had a bad feeling.\" Fair or unfair, and which type?","choices":["Fair: procedural","Unfair: procedural","Unfair: interactional","Fair: distributive"],"correct":1,"explanation":"Ignoring the established, job-related process in favor of a gut feeling violates procedural fairness.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-113","type":"scenario","front":"A firm scores every candidate with the same interview rubric so each is judged on identical criteria. Fair or unfair, and which type?","choices":["Fair: interactional","Fair: distributive","Unfair: procedural","Fair: procedural"],"correct":3,"explanation":"Consistent, job-related procedures applied to everyone uphold procedural fairness.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-114","type":"scenario","front":"Aisha is hired because she's the most qualified candidate, even though another finalist is the manager's golf buddy. Fair or unfair, and which type?","choices":["Fair: distributive","Fair: interactional","Unfair: procedural","Unfair: distributive"],"correct":0,"explanation":"The outcome went to the most deserving candidate, so distributive (outcome) fairness is upheld.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-115","type":"scenario","front":"An interviewer shows up 25 minutes late, checks his phone throughout, and cuts the candidate off mid-answer. Which fairness type is violated?","choices":["Interactional","Procedural","Distributive","Validity"],"correct":0,"explanation":"Rude, disrespectful treatment violates interactional fairness, regardless of the procedures or outcome.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-116","type":"scenario","front":"Carlos learns the job was promised to an internal favorite before interviews began, and he never got to show his skills. Which fairness type is violated?","choices":["Interactional","Distributive","Reliability","Procedural"],"correct":3,"explanation":"A rigged process with no chance to demonstrate abilities violates procedural fairness (the book's 'Judy' example).","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-117","type":"scenario","front":"The manager's nephew, who failed two required certifications, gets the job over three qualified finalists. Which fairness type is most directly violated?","choices":["Reliability","Distributive","Interactional","Validity"],"correct":1,"explanation":"The outcome went to an undeserving person, violating distributive (outcome) fairness. The favoritism also raises procedural concerns.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-118","type":"scenario","front":"An interviewer asks a candidate whether she plans to have children soon. Which fairness type does this question damage most?","choices":["Interactional, but only if she ends up rejected","None, since asking about family plans is fine","Procedural, through an improper question","Distributive, through an unfair hiring outcome"],"correct":2,"explanation":"Improper or illegal questions undermine procedural fairness, and family plans aren't job-related.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-119","type":"scenario","front":"A firm can't hire most of its 400 applicants. What would most improve how rejected applicants view it?","choices":["Rejecting everyone at once by a form letter months later","Clear, job-related steps and courteous, timely rejections","Hiring more people than needed to raise distributive fairness","Saying nothing so no one can complain about the reason"],"correct":1,"explanation":"Distributive fairness will be low for most applicants anyway; procedural and interactional fairness soften the reaction to rejection.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-120","type":"scenario","front":"HR wants to make its hiring fairer. Which change does NOT promote fairness?","choices":["Telling candidates the steps and timeline up front","Letting each manager use personal favorite questions","Basing every assessment on a job analysis","Training interviewers and using a common scoring key"],"correct":1,"explanation":"Inconsistent, manager-chosen questions undermine procedural fairness; the other three promote it.","subtitle":"Ch 6.18 Apply · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-121","type":"scenario","front":"Brightline Labs prizes experimentation and candor. Candidate Nia describes loving rapid testing and blunt feedback, and the interviewer notes, \"She thinks the way we work.\" What does this show?","choices":["Her values and work style align with the culture","Her technical skills meet the job's requirements","She'll mesh well with her immediate supervisor","Her pay expectations fit the salary range"],"correct":0,"explanation":"Matching personal values and work style to organizational culture and norms is person-organization fit.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-122","type":"scenario","front":"A nonprofit hires Diego because his commitment to community service matches its mission and values. Which kind of fit was assessed?","choices":["Person-organization","Person-job","Person-group","Person-supervisor"],"correct":0,"explanation":"Values aligning with the organization's mission and culture is P-O fit.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-123","type":"scenario","front":"An airline confirms Mei's certifications and flight hours meet the first-officer requirements. Which kind of fit is this?","choices":["Person-group","Person-culture","Person-job","Person-organization"],"correct":2,"explanation":"Matching abilities and qualifications to job demands is person-job fit, the primary focus of most assessment.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-124","type":"scenario","front":"A six-person design team works on every project together.
