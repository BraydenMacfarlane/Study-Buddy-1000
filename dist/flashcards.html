e newcomer's traits and builds confidence; divestiture strips identity, like boot camp.","subtitle":"Ch 7.18 · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture","points":["Divestiture is inappropriate in most work organizations"]},{"id":"c202-ch07-078","front":"What is the difference between serial and disjunctive socialization?","answer":"Serial gives newcomers role models to follow; disjunctive leaves them to develop roles alone.","subtitle":"Ch 7.18 · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture","points":["Disjunctive often happens when replacing the old guard"]},{"id":"c202-ch07-079","front":"Why is staggered orientation often better than one-time?","answer":"Brief meetings spread over weeks reduce overload and improve retention of information.","subtitle":"Ch 7.18 · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture","points":["One-time is cheaper"]},{"id":"c202-ch07-080","front":"What are the four socialization loyalty enhancers?","answer":"Group socialization, formal activities in a set order and time frame, role models or mentors, and social support.","subtitle":"Ch 7.20 · Effective HRM","note":"Read more: 7.20 Effective Socialization","points":["Also lower turnover and raise commitment and satisfaction"]},{"id":"c202-ch07-081","front":"What metrics show whether onboarding is working?","answer":"Percent with email ready on day one, onboarding satisfaction, and new-hire attrition and performance.","subtitle":"Ch 7.20 · Effective HRM","note":"Read more: 7.20 Effective Socialization","points":["HR owns planning and follow-up with supervisors"]},{"id":"c202-ch07-082","front":"What's the drawback of computer-only orientation?","answer":"It produced weaker socialization on people, politics, goals, and values than in-person orientation.","subtitle":"Ch 7.19 · Effective HRM","note":"Read more: 7.19 Socialization Options: What and Whom to Include and How to Use Technology","points":["Tech is great for paperwork, checklists, and pre-start forms"]},{"id":"c202-ch07-083","front":"How does Facebook's six-week Bootcamp socialize new engineers?","answer":"Fixing bugs across the code base with mentors teaches the code, the habits, and the culture, and builds networks.","subtitle":"Ch 7.21 · Effective HRM","note":"Read more: 7.21 Case Study: Socializing New Engineers at Facebook","points":["Model answer for the case's first short-answer question"]},{"id":"c202-ch07-084","front":"How does letting new hires choose their team motivate Facebook teams?","answer":"Teams get engineers who actually want to be there, and teams must stay attractive to recruit.","subtitle":"Ch 7.21 · Effective HRM","note":"Read more: 7.21 Case Study: Socializing New Engineers at Facebook","points":["Model answer for the case's second question; passion drives effectiveness"]},{"id":"c202-ch07-085","front":"What is learning agility?","answer":"Learning from experience and applying it to new situations while staying open and curious.","subtitle":"Ch 7.22 · Effective HRM","note":"Read more: 7.22 The Trainee","points":["Agile learners have more successful careers","Includes seeking feedback and explaining one's thinking"]},{"id":"c202-ch07-086","front":"What is motivation to transfer?","answer":"A trainee's willingness to apply what they learned back on the job.","subtitle":"Ch 7.22 · Effective HRM","note":"Read more: 7.22 The Trainee","points":["Some treat training as a break; explain why it matters"]},{"id":"c202-ch07-087","front":"What is self-regulation in learning?","answer":"Guiding one's own thoughts, feelings, behavior, and attention toward a goal over time.","subtitle":"Ch 7.22 · Effective HRM","note":"Read more: 7.22 The Trainee","points":["Crucial in self-paced eLearning with little structure"]},{"id":"c202-ch07-088","front":"What is Hamburger University?","answer":"McDonald's training center since 1961, tying training to career paths and offering college credit.","subtitle":"Ch 7.23 · Effective HRM","note":"Read more: 7.23 Real World Response: How Training Drives Performance at McDonald's","points":["Campuses worldwide; 350,000+ graduates"]},{"id":"c202-ch07-089","front":"What is a continuous learning plan?","answer":"A proactive personal plan to keep your skills current through courses, certificates, and conferences.","subtitle":"Ch 7.24 · Effective HRM","note":"Read more: 7.24 Strategic HRM Exercise: Training at Apple Stores","points":["Professional groups like SHRM help"]},{"id":"c202-ch07-090","type":"scenario","front":"Harbor Credit Union's L&D lead wants a new teller program. Before writing any content, what should she do first?","choices":["Design the training program","Pick an engaging delivery method","Conduct a needs assessment","Develop learning objectives"],"correct":2,"explanation":"The needs assessment comes first; it identifies what training must accomplish and produces the objectives.","subtitle":"Ch 7.5 Apply · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"},{"id":"c202-ch07-091","type":"scenario","front":"A team has finished its needs assessment and written learning objectives for a forklift course. What's the next step?","choices":["Evaluate the planned training","Repeat the needs assessment","Design the training program","Implement the training"],"correct":2,"explanation":"After objectives comes design: choosing content, methods, materials, setting, and instructors.","subtitle":"Ch 7.5 Apply · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"},{"id":"c202-ch07-092","type":"scenario","front":"Which sequence correctly orders the steps of an effective training program?","choices":["Design, assess needs, set objectives, evaluate, implement","Assess needs, design, implement, set objectives, evaluate","Assess needs, set objectives, design, implement, evaluate","Set objectives, assess needs, implement, design, evaluate"],"correct":2,"explanation":"Need, Objective, Design, Implement, Evaluate, then evaluation feeds the next needs assessment.","subtitle":"Ch 7.5 Apply · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"},{"id":"c202-ch07-093","type":"scenario","front":"A hospital ran a new charting course and asked nurses to rate it, then used the ratings to decide what to fix before next quarter's needs assessment. Which step was it completing?","choices":["Design the training","Develop learning objectives","Evaluate the training","Implement the training"],"correct":2,"explanation":"Collecting information to decide whether to improve or continue is evaluation, which feeds the next cycle.","subtitle":"Ch 7.5 Apply · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"},{"id":"c202-ch07-094","type":"scenario","front":"A trainer schedules sessions, books the room, sends invitations, and breaks a six-hour module into three short sessions with practice time. Which step is this?","choices":["Evaluating the training","Implementing the training","Designing the training","Conducting a needs assessment"],"correct":1,"explanation":"Scheduling and delivering, while preventing overload and allowing practice, is implementation.","subtitle":"Ch 7.10 Apply · Effective HRM","note":"Read more: 7.10 Implement the Training"},{"id":"c202-ch07-095","type":"scenario","front":"Call-center quality is falling. A needs assessment shows reps know the procedures, but the phone software crashes constantly. What should HR recommend?","choices":["Fix the software rather than retrain","Retrain every rep on the procedures","Add a refresher course on call scripts","Train supervisors to coach more often"],"correct":0,"explanation":"Training isn't always the answer. If the cause is equipment or the system, fix that.","subtitle":"Ch 7.6 Apply · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment"},{"id":"c202-ch07-096","type":"scenario","front":"A firm studies its new strategy, upcoming regulations, and efficiency data to see where training could help most. Which level of needs assessment is this?","choices":["Organizational analysis","Task analysis","Person analysis","Kirkpatrick results analysis"],"correct":0,"explanation":"Organizational analysis looks company-wide for improvement opportunities tied to strategy, laws, and change.","subtitle":"Ch 7.6 Apply · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment"},{"id":"c202-ch07-097","type":"scenario","front":"HR observes welders and reviews the job analysis to pinpoint which skills and behaviors the course should target. Which level is this?","choices":["Results analysis","Task analysis","Organizational analysis","Person analysis"],"correct":1,"explanation":"Task analysis identifies the jobs, competencies, and behaviors to target.","subtitle":"Ch 7.6 Apply · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment"},{"id":"c202-ch07-098","type":"scenario","front":"A manager reviews each rep's appraisal and skill inventory to decide who should attend advanced negotiation training. Which level is this?","choices":["Organizational analysis","Reaction analysis","Person analysis","Task analysis"],"correct":2,"explanation":"Person analysis determines which individuals need which training.","subtitle":"Ch 7.6 Apply · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment"},{"id":"c202-ch07-099","type":"scenario","front":"A course aims to have managers genuinely value inclusive hiring and act on it consistently. What type of learning objective is this?","choices":["Psychomotor","Kinesthetic","Affective","Cognitive"],"correct":2,"explanation":"Changing attitudes and values is an affective objective; acting consistently on a value is the top level (characterization).","subtitle":"Ch 7.7 Apply · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives"},{"id":"c202-ch07-100","type":"scenario","front":"A course goal is that lab techs can pipette accurately and adapt the technique to new equipment. What type of objective is this?","choices":["Psychomotor","Affective","Cognitive","Auditory"],"correct":0,"explanation":"Building physical skill is psychomotor; adapting to new situations is its fourth level.","subtitle":"Ch 7.7 Apply · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives"},{"id":"c202-ch07-101","type":"scenario","front":"An objective says new analysts will be able to evaluate three vendor proposals against set criteria. Which revised Bloom's level is targeted?","choices":["Applying","Understanding","Evaluating","Remembering"],"correct":2,"explanation":"Judging against criteria is 'evaluating,' fifth of six levels in the revised (2001) Bloom's taxonomy.","subtitle":"Ch 7.7 Apply · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives"},{"id":"c202-ch07-102","type":"scenario","front":"Sofia, a new account rep, practices calming an irate client in a role play with a trainer playing the client. Which training method is this?","choices":["Classroom","Virtual","Experiential","On-the-job"],"correct":2,"explanation":"Role plays are experiential training: learning through a structured experience that recreates the job.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-103","type":"scenario","front":"Theo learns to run the espresso machine during real shifts while a senior barista shows him, answers questions, and corrects him. Which method is this?","choices":["Games","On-the-job","Experiential","Classroom"],"correct":1,"explanation":"Learning real tasks on the job with a coworker's guidance is OJT.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-104","type":"scenario","front":"Employees in five countries log into a live webinar on the new expense policy. Which method is this?","choices":["Experiential","Virtual","Classroom","On-the-job"],"correct":1,"explanation":"Online tools that reach dispersed employees are virtual training.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-105","type":"scenario","front":"New paralegals attend an instructor-led workshop in the firm's training room. Which method is this?","choices":["Classroom","Virtual","On-the-job","Experiential"],"correct":0,"explanation":"A face-to-face, instructor-led session is classroom training.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-106","type":"scenario","front":"Warehouse hires earn points and climb a leaderboard in an app that scores how accurately they pack mock orders. Which method is this?","choices":["Classroom","On-the-job","Experiential","Games"],"correct":3,"explanation":"Points, scores, and competition mark training games (gamification).","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-107","type":"scenario","front":"A leadership team spends a day on a ropes course to build trust. Which method is this?","choices":["On-the-job (leading real teams)","Experiential (adventure)","Classroom (team-building talk)","Virtual (online module)"],"correct":1,"explanation":"Adventure learning such as ropes courses is a form of experiential training.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-108","type":"scenario","front":"A utility pairs each new line worker with a master technician for a formal two-year program with set milestones. What is this?","choices":["Virtual simulation of line work","Structured OJT (apprenticeship)","Unstructured OJT (shadowing)","Experiential role play on safety"],"correct":1,"explanation":"Formal, planned on-the-job learning like an apprenticeship is structured OJT.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-109","type":"scenario","front":"A new cashier picks up the register mostly by asking whoever is nearby, with no plan. What's the risk?","choices":["Unstructured OJT tends to be inconsistent","Classroom training is too costly for this","Virtual training can't teach registers","Experiential training is too risky for cashiers"],"correct":0,"explanation":"Unstructured OJT happens even without a program, but it's casual and often less thorough or consistent.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-110","type":"scenario","front":"A retailer wants managers to practice firing someone, with realistic reactions from tears to anger, without real employees. Which approach fits best?","choices":["A lecture on termination policy","Shadowing a real termination","A written quiz on wrongful-termination law","A VR simulation (virtual)"],"correct":3,"explanation":"VR tools like Talespin's 'Barry' let managers rehearse terminations safely; that's virtual training.","subtitle":"Ch 7.8 Apply · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-111","type":"scenario","front":"A bank has no formal course, but new tellers learn shortcuts by watching coworkers and asking questions. What kind of learning is this?","choices":["Classroom training","Adaptive learning","Informal learning","Structured OJT"],"correct":2,"explanation":"Learning without a formal curriculum or trainer is informal learning, the most common kind.","subtitle":"Ch 7.13 Apply · Effective HRM","note":"Read more: 7.13 Informal Learning and Gamification"},{"id":"c202-ch07-112","type":"scenario","front":"An eLearning platform skips modules a learner has already mastered and slows down where she struggles. What is this?","choices":["Unstructured OJT","Experiential training","Collective socialization","Adaptive learning"],"correct":3,"explanation":"Adaptive learning adjusts material and pace to each learner, like a personal tutor.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-113","type":"scenario","front":"Maya learns best from diagrams and hands-on practice. Per the text, why does her learning style matter when her employer designs training?","choices":["It replaces the needs assessment, since style shows what she needs to learn","It matters only for evaluation, because style determines her reaction scores","Methods that fit how she learns keep her engaged and help her learn and transfer","It decides whether she should be trained at all or reassigned to another role"],"correct":2,"explanation":"Per the text, matching methods to learning style improves engagement, learning, and transfer. Research caution: studies generally don't support 'meshing' (matching instruction to a preferred style); using several formats and fitting the method to the skill is what holds up. Answer per the text on the OA.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-114","type":"scenario","front":"Andre says he learns by actually doing things with his hands. Which sensory modality does that describe?","choices":["Auditory","Visual","Observational","Kinesthetic"],"correct":3,"explanation":"Kinesthetic learners learn by doing; tactile is touching; visual is seeing; auditory is hearing.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-115","type":"scenario","front":"Lin retains the most from podcasts and spoken explanations. Which sensory modality is this?","choices":["Tactile","Kinesthetic","Auditory","Visual"],"correct":2,"explanation":"Learning by hearing is the auditory modality.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-116","type":"scenario","front":"A trainer knows her audience has mixed preferences. Which design choice reflects both the text's advice and the research?","choices":["Use several formats: demo, visuals, practice","Sort trainees by style into separate course tracks","Use only lecture, since style doesn't matter","Let each trainee skip any format they dislike"],"correct":0,"explanation":"Offering multiple modalities engages varied learners (Farmers Insurance does this) without relying on unsupported style-matching. Research caution: studies generally don't support 'meshing' (matching instruction to a preferred style); using several formats and fitting the method to the skill is what holds up. Answer per the text on the OA.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-117","type":"scenario","front":"A firm needs to teach CPR to staff who say they're 'auditory learners.' Research-wise, what matters most for method choice?","choices":["The skill: CPR needs hands-on practice","Their style: CPR should be taught by audio","Neither: let them choose any method","Cost: use the cheapest audio module"],"correct":0,"explanation":"Research supports fitting the method to the content: a physical skill needs practice regardless of stated preference. Research caution: studies generally don't support 'meshing' (matching instruction to a preferred style); using several formats and fitting the method to the skill is what holds up. Answer per the text on the OA.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-118","type":"scenario","front":"A designer says, \"Training works best when the method matches the learner's abilities and traits.\" Which concept is this, per the text?","choices":["Kirkpatrick's learning level","Aptitude-treatment interaction","Near transfer","Collective socialization"],"correct":1,"explanation":"Aptitude-treatment interaction: effectiveness depends on learner traits, so methods should fit the learner. The concept is real; strict style-matching is what research doesn't support. Research caution: studies generally don't support 'meshing' (matching instruction to a preferred style); using several formats and fitting the method to the skill is what holds up. Answer per the text on the OA.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-119","type":"scenario","front":"Per Towler and Dipboye, Ravi prefers demonstrations and diagrams over figuring things out himself. Which preference is this?","choices":["Group learning","Structured learning","Observational learning","Discovery learning"],"correct":2,"explanation":"Observational learners prefer external stimuli like demonstrations and diagrams.","subtitle":"Ch 7.9 Apply · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-120","type":"scenario","front":"After a CRM course, Dana scores 94% on the post-training knowledge test. Which Kirkpatrick level is measured?","choices":["Reaction","Behavior","Results","Learning"],"correct":3,"explanation":"A test of knowledge gained measures the learning level.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-121","type":"scenario","front":"Participants fill out a survey rating how engaging and useful the session felt. Which level is this?","choices":["Learning","Behavior","Results","Reaction"],"correct":3,"explanation":"Feelings and satisfaction measure the reaction level, the cheapest and easiest.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-122","type":"scenario","front":"Three months after training, the clinic's patient wait times drop 18%. Which level is this?","choices":["Behavior","Learning","Reaction","Results"],"correct":3,"explanation":"Organizational outcomes are the results level, the hardest to isolate.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-123","type":"scenario","front":"A month later, supervisors observe that Kai now uses the new safety checklist correctly on every shift. Which level is this?","choices":["Behavior","Learning","Results","Reaction"],"correct":0,"explanation":"Applying learning on the job (transfer) is the behavior level.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-124","type":"scenario","front":"A sales team loved the training and aced the test, but nobody changed how they sell. Which level failed, and what does it predict?","choices":["Results; behavior will improve on its own","Behavior; results are unlikely to improve","Reaction; learning will drop next time","Learning; the test must have been invalid"],"correct":1,"explanation":"Each level feeds the next. Without behavior change on the job, business results won't follow.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-125","type":"scenario","front":"HR has a small budget and wants the quickest, cheapest evaluation of a new course. Which level fits?","choices":["Behavior","Learning","Reaction","Results"],"correct":2,"explanation":"Cost and difficulty rise by level; reaction surveys are fast, easy, and cheap.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-126","type":"scenario","front":"A retailer judges its sales training by the number of hours employees spent in class. What would Kirkpatrick's model suggest instead?","choices":["Measure trainer satisfaction (learning)","Measure attendance and punctuality (behavior)","Measure sales and conversion (results)","Measure more class hours (reaction)"],"correct":2,"explanation":"Evaluate against the original goals; for a retailer, results like sales and conversion rates, not hours.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-127","type":"scenario","front":"A $25,000 customer-service course produces $100,000 in measurable benefits. What's the ROI?","choices":["25%","75%","300%","400%"],"correct":2,"explanation":"(100,000 − 25,000) ÷ 25,000 × 100 = 300%: a $3 net gain per $1 invested.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-128","type":"scenario","front":"A training report says the program's ROI was 400%. What does that mean for each $1 invested?","choices":["$4 back in total ($3 net gain)","$400 net gain per $1","$0.40 net gain per $1","$4 net gain ($5 back in total)"],"correct":3,"explanation":"ROI = (benefits − costs) ÷ costs. 400% means $4 of net gain per $1, so $5 comes back in total. The book's 'return of 400 percent, or $4' refers to the net gain.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-129","type":"scenario","front":"A program's ROI is negative, but leaders say it built trust and morale they didn't measure. What does the text advise?","choices":["Ignore ROI, since only reaction scores matter","Change or drop it unless those benefits justify it","Always continue any program leaders like","Always cancel immediately when ROI is negative"],"correct":1,"explanation":"Negative ROI suggests changing or discontinuing the program, unless there are important unmeasured benefits.","subtitle":"Ch 7.12 Apply · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-130","type":"scenario","front":"After training, Ana's supervisor tells her, \"Forget that course; we do it the old way here.\" What is most damaged?","choices":["Learning, via a weak or missing post-test","Transfer, via a poor transfer climate","Reaction scores, via a poor training room","The needs assessment, via bad data"],"correct":1,"explanation":"A supportive transfer climate is a top predictor of transfer; a dismissive boss kills it.","subtitle":"Ch 7.14 Apply · Effective HRM","note":"Read more: 7.14 Reinforcing Training"},{"id":"c202-ch07-131","type":"scenario","front":"A manager stops requiring weekly refresher modules for reps who keep their quality scores high. Which reinforcer is this?","choices":["Extinction","Negative reinforcement","Punishment","Positive reinforcement"],"correct":1,"explanation":"Removing something unpleasant to increase the desired behavior is negative reinforcement, not punishment.","subtitle":"Ch 7.14 Apply · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training"},{"id":"c202-ch07-132","type":"scenario","front":"Coworkers used to laugh when Max mocked the new process; now they ignore it, and the mocking fades. Which reinforcer is this?","choices":["Positive reinforcement","Extinction","Punishment","Negative reinforcement"],"correct":1,"explanation":"Removing the reinforcement (laughter) so a behavior fades is extinction.","subtitle":"Ch 7.14 Apply · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training"},{"id":"c202-ch07-133","type":"scenario","front":"A supervisor publicly praises Jo the day she first uses the new de-escalation technique. Which reinforcer is this, and why does it work?","choices":["Negative reinforcement, since it removes stress","Extinction, since it stops her old habits","Punishment, since it pressures the coworkers","Positive reinforcement: immediate and specific"],"correct":3,"explanation":"Adding a reward increases the behavior; reinforcers work best when immediate, sincere, and specific.","subtitle":"Ch 7.14 Apply · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training"},{"id":"c202-ch07-134","type":"scenario","front":"A phone rep is trained to follow an exact six-step script. What kind of transfer is this?","choices":["Far transfer (open skill)","Negative transfer (skill loss)","Disjunctive transfer","Near transfer (closed skill)"],"correct":3,"explanation":"Applying skills exactly as taught is near transfer of closed skills; leadership principles are far transfer.","subtitle":"Ch 7.14 Apply · Effective HRM","note":"Read more: 7.14 Reinforcing Training"},{"id":"c202-ch07-135","type":"scenario","front":"Before his first day, Eli's recruiter and future manager give him consistent, honest previews of the role. Which socialization phase is this?","choices":["Anticipatory","Encounter","Settling in","Divestiture"],"correct":0,"explanation":"Expectations formed before entry, through recruiters and managers, are anticipatory socialization.","subtitle":"Ch 7.17 Apply · Effective HRM","note":"Read more: 7.17 Phases of Socialization"},{"id":"c202-ch07-136","type":"scenario","front":"In her first weeks, Rosa learns the team's norms and her role, and her manager clarifies expectations. Which phase is this?","choices":["Investiture","Encounter","Anticipatory","Settling in"],"correct":1,"explanation":"Starting work and learning the culture, norms, and job is the encounter phase.","subtitle":"Ch 7.17 Apply · Effective HRM","note":"Read more: 7.17 Phases of Socialization"},{"id":"c202-ch07-137","type":"scenario","front":"A firm hires 40 graduates at once and wants them to bond as a cohort and stay longer. Which option fits best?","choices":["Disjunctive socialization","Divestiture socialization","Collective socialization","Individual socialization"],"correct":2,"explanation":"Collective socialization suits many newcomers at once and builds cohort identity and embeddedness. (The book's claim that it costs more than individual is likely backwards.)","subtitle":"Ch 7.18 Apply · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture"},{"id":"c202-ch07-138","type":"scenario","front":"A law firm eliminates a share of junior associates at each review stage. What risk does this tournament approach carry?","choices":["Too much creativity among associates","Cohort solidarity that's too strong","Faster, more radical culture change","Risk aversion and stifled innovation"],"correct":3,"explanation":"Tournament socialization breeds risk aversion, insecurity, and homogeneous norms, and slows culture change.","subtitle":"Ch 7.18 Apply · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture"},{"id":"c202-ch07-139","type":"scenario","front":"A new marketing hire is told, \"Forget everything you did before; you'll start at the bottom and earn our way of thinking.\" Which option is this?","choices":["Contest","Divestiture","Investiture","Serial"],"correct":1,"explanation":"Stripping away a newcomer's identity and prior skills is divestiture, inappropriate in most workplaces.","subtitle":"Ch 7.18 Apply · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture"},{"id":"c202-ch07-140","type":"scenario","front":"An onboarding team wants to maximize new-hire loyalty. Which plan uses the four loyalty enhancers?","choices":["Solo online modules at each hire's own pace","Elimination rounds that keep only the top hires","One long first-day lecture, then nothing","Group sessions, set order, mentors, support"],"correct":3,"explanation":"The four enhancers: socialize as a group; formal activities in order within a set time; role models or mentors; social support.","subtitle":"Ch 7.20 Apply · Effective HRM","note":"Read more: 7.20 Effective Socialization"},{"id":"c202-ch07-141","type":"scenario","front":"Kirk is building a training program for new hires. What should his first step be?","choices":["Conduct a needs assessment","Develop learning objectives","Implement the training","Design the training"],"correct":0,"explanation":"The needs assessment always comes first.","subtitle":"Ch 7.6 Practice · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment"},{"id":"c202-ch07-142","type":"scenario","front":"Training evaluation checks whether which objectives were met?","choices":["Learning objectives (all types)","Affective learning objectives only","Psychomotor learning objectives only","Cognitive learning objectives only"],"correct":0,"explanation":"Evaluation checks all the learning objectives, whether cognitive, affective, or psychomotor.","subtitle":"Ch 7.7 Practice · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives"},{"id":"c202-ch07-143","type":"scenario","front":"Training through verbal or written instructions, observation, imitation, and practice is...","choices":["Virtual training","Experiential training","Classroom training","On-the-job training"],"correct":3,"explanation":"That combination while doing the work is on-the-job training.","subtitle":"Ch 7.8 Practice · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-144","type":"scenario","front":"Role plays and action learning are forms of...","choices":["On-the-job training","Experiential training","Virtual training","Classroom training"],"correct":1,"explanation":"Role plays and action learning are experiential.","subtitle":"Ch 7.8 Practice · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-145","type":"scenario","front":"Training that relies on online tools is...","choices":["Experiential training","Classroom training","Virtual training","On-the-job training"],"correct":2,"explanation":"Online tools define virtual training.","subtitle":"Ch 7.8 Practice · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-146","type":"scenario","front":"Tamika learns best by actually doing the task. Which modality is that?","choices":["Tactile","Visual","Auditory","Kinesthetic"],"correct":3,"explanation":"Learning by doing is kinesthetic; tactile is touching.","subtitle":"Ch 7.9 Practice · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-147","type":"scenario","front":"Preventing information overload and allowing practice time are priorities when...","choices":["Implementing the training","Conducting a needs assessment","Designing the training","Evaluating the training"],"correct":0,"explanation":"Those are implementation practices.","subtitle":"Ch 7.10 Practice · Effective HRM","note":"Read more: 7.10 Implement the Training"},{"id":"c202-ch07-148","type":"scenario","front":"Without proper ___, a company can't know whether to improve or continue a training program.","choices":["Evaluation","Implementation","Objectives","Discovery"],"correct":0,"explanation":"Evaluation tells you whether to adopt, improve, or continue training.","subtitle":"Ch 7.11 Practice · Effective HRM","note":"Read more: 7.11 Evaluate the Training"},{"id":"c202-ch07-149","type":"scenario","front":"After training, John changed how he does his daily work. What is the highest Kirkpatrick level reached?","choices":["Reaction","Learning","Results","Behavior"],"correct":3,"explanation":"Using learning on the job is the behavior level.","subtitle":"Ch 7.12 Practice · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-150","type":"scenario","front":"Susan takes a test after watching a training video. Which level is measured?","choices":["Learning","Results","Behavior","Reaction"],"correct":0,"explanation":"A knowledge test measures learning.","subtitle":"Ch 7.12 Practice · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-151","type":"scenario","front":"HR surveys new hires about their onboarding experience. Which level is this?","choices":["Behavior","Reaction","Learning","Results"],"correct":1,"explanation":"Surveys of how participants felt measure reaction.","subtitle":"Ch 7.12 Practice · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-152","type":"scenario","front":"A hospital's patient satisfaction rises 22% after training, matching its objectives. Which level is this?","choices":["Reaction","Behavior","Results","Learning"],"correct":2,"explanation":"Organizational outcomes are the results level.","subtitle":"Ch 7.12 Practice · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-153","type":"scenario","front":"Once learning objectives are written, which step comes next?","choices":["Conducting a needs assessment","Implementing the training","Developing more objectives","Designing the training"],"correct":3,"explanation":"Likely per text: design follows objectives.","subtitle":"Ch 7 Quiz Q1 · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"},{"id":"c202-ch07-154","type":"scenario","front":"Learning objectives and trainees' sensory modality preferences are used in which phase?","choices":["Design","Needs assessment","Implementation","Evaluation"],"correct":0,"explanation":"Likely per text: design, where methods and materials are chosen.","subtitle":"Ch 7 Quiz Q2 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training; 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-155","type":"scenario","front":"Which of these guide the content and delivery methods of training?","choices":["Affective objectives only","Cognitive objectives only","Learning objectives","Psychomotor objectives only"],"correct":2,"explanation":"Likely per text: learning objectives, of every type, guide content and delivery.","subtitle":"Ch 7 Quiz Q3 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives"},{"id":"c202-ch07-156","type":"scenario","front":"A face-to-face trainer or an instructor-led workshop is which training method?","choices":["Experiential","Virtual","On-the-job","Classroom"],"correct":3,"explanation":"Likely per text: classroom training.","subtitle":"Ch 7 Quiz Q4 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-157","type":"scenario","front":"Police cadets role-play making an arrest. Which training is this?","choices":["Reaction","Experiential","Kinesthetic","On-the-job"],"correct":1,"explanation":"Likely per text: role plays are experiential training.","subtitle":"Ch 7 Quiz Q5 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-158","type":"scenario","front":"A supervisor or coworker demonstrates the task, answers questions, and gives feedback. Which method is this?","choices":["On-the-job","Experiential","Classroom","Virtual"],"correct":0,"explanation":"Likely per text: on-the-job training.","subtitle":"Ch 7 Quiz Q6 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-159","type":"scenario","front":"Shelby must train employees located in several different countries. Which method fits best?","choices":["Virtual","On-the-job","Classroom","Experiential"],"correct":0,"explanation":"Likely per text: virtual, since online tools reach dispersed staff. Moderate confidence: the question's exact wording wasn't captured, so this is the likely intended answer.","subtitle":"Ch 7 Quiz Q7 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-160","type":"scenario","front":"A new drive-thru worker learns by watching, imitating, asking questions, and practicing with feedback. Which method is this?","choices":["Classroom","Experiential","Virtual","On-the-job"],"correct":3,"explanation":"Likely per text: on-the-job training.","subtitle":"Ch 7 Quiz Q8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training"},{"id":"c202-ch07-161","type":"scenario","front":"Learning by hearing is which sensory modality?","choices":["Auditory","Visual","Kinesthetic","Tactile"],"correct":0,"explanation":"Likely per text: auditory.","subtitle":"Ch 7 Quiz Q9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles"},{"id":"c202-ch07-162","type":"scenario","front":"Feedback forms completed after training assess which Kirkpatrick level?","choices":["Behavior","Reactions","Learning","Results"],"correct":1,"explanation":"Likely per text: reactions.","subtitle":"Ch 7 Quiz Q10 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-163","type":"scenario","front":"At which Kirkpatrick level are organizational benefits identified?","choices":["Results","Learning","Behavior","Reaction"],"correct":0,"explanation":"Likely per text: results.","subtitle":"Ch 7 Quiz Q11 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment"},{"id":"c202-ch07-164","type":"scenario","front":"Which list contains the necessary elements of an effective training program?","choices":["Job analysis, objectives, design, delivery, appraisal","Needs assessment, objectives, design, implementation, evaluation","Organizational, task, and person analysis, then delivery","Reaction, learning, behavior, results, reinforcement"],"correct":1,"explanation":"Likely per text: the five steps. Distractors here are paraphrased; the others mix in job analysis, needs-assessment levels, or Kirkpatrick's levels.","subtitle":"Ch 7 Quiz Q12 · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training"}]},{"id":"c202-ch08","folder":"C202 Ch 8: Performance Management","course":"C202","order":8,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 8 Study Guide: Performance Management\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter belongs to **Effective Human Resource Management**: *evaluating strategies, policies, and procedures for effective HRM within an organization*. Effective HRM is the heaviest area on the Objective Assessment (OA), about **52%**, covering Chapters 4-8, 12, and 13. WGU's checklist for this chapter is the longest so far, with seven items: the benefits of performance management, the benefits of goal setting, sources of performance information, why feedback matters, the purpose and the process of progressive discipline, and common obstacles.\n\nWGU's study guide follows Antonio into his first performance review. Its activities show the OA's style: true/false on benefits, picking the goal-setting benefits, choosing raters who actually know the work, spotting effective feedback, explaining why discipline is progressive, labeling discipline steps, and spotting obstacles. The deck's Apply cards test those skills with new people and companies. Rating errors and legal defensibility touch **Legal and Regulatory**, and goal setting connects to **Motivational Concepts**.\n\nChapter 8 closes **Quarter 2** (Chapters 5-8). WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz. Take the Quarter 2 quiz after this chapter.\n\n---\n\n## 8.1-8.3 What performance management is\n\n**Performance management** is the system that directs and motivates employees, workgroups, and business units to accomplish organizational goals. It links past performance to future needs, sets specific goals, aligns people and processes with the strategy, and uses feedback and obstacle removal to maximize everyone's contribution. Where staffing and training shape what employees **can** do, performance management shapes what they **will** do.\n\nThe organization wants strategy execution, goal alignment, development, and a basis for rewards. Employees want development, rewards, and the satisfaction of good work. The best systems serve both. Sprint, for example, used ongoing coaching and three to five criteria per person, each tied to a strategic objective.\n\n*Opening case:* Microsoft's **stack ranking** forced managers to label a fixed share of every team as great, mediocre, or terrible, regardless of actual quality. Top engineers avoided working together, sabotage grew, and innovation suffered. CEO Satya Nadella wanted a **growth mindset** culture of learning, collaboration, and persistence through setbacks.\n\n## 8.4 Benefits of performance management\n\nThis is the first checklist item. Performance management covers individuals, teams, units, processes, and projects, so that **all parts of the organization work together for results**. It has three main benefits:\n\n1. **It aligns goals.** Organizational goals cascade to unit, team, and individual goals and processes. Measuring both efficiency and effectiveness matters because **behaviors are not results**: being busy doesn't mean contributing, and finishing doesn't mean finishing efficiently or ethically. For interdependent work, give team-level goals and feedback as well as individual ones.\n2. **It provides clear goals and feedback.** \"What gets measured gets done.\" Goals and feedback are among a manager's **most powerful motivational tools**. Employees want to know how they're doing and how to improve.\n3. **It generates useful data** for benchmarking against best practices, judging change efforts like training, supporting fair and consistent treatment, and calculating the ROI of new processes or technology.\n\n*Guide-style true/false check:* \"Busy means contributing\" is **false**. \"Performance management is the same as measuring behaviors\" is **false**, because results matter too. \"Data are used for benchmarking\" and \"clear goals and feedback are powerful motivators\" are **true**.\n\nGoogle studied its managers and found that good management improves retention and team performance. It identified eight good behaviors (such as being a good coach and caring about team members) and five to avoid, and most low-rated managers improved after feedback.\n\n## 8.4 Why feedback matters to goal accomplishment\n\nThis is the fourth checklist item, and the book introduces it early. **Goals without feedback are ineffective.** Goals direct and energize effort; **feedback tracks progress toward the goals**, so people can adjust. Praise alone isn't enough; people need **specific, task-related** feedback. Feedback matters most for complex tasks where people can't easily judge their own progress. Improvement is most likely when the feedback shows a need to change, the employee accepts it, believes change is feasible, sets goals, and acts. WD-40 replaced labels like \"excellent\" with feedback on how to improve, and both engagement and performance rose.\n\n*Effective vs. ineffective feedback:* \"Add a clearer call to action in the first paragraph to raise click-throughs\" is effective because it's specific, actionable, and tied to the goal. \"Great job, keep it up!\", \"You're a real team player,\" and \"Your emails need to be shorter\" are weak: vague, about the person, or missing the how and why.\n\n## 8.5 The balanced scorecard\n\nKaplan and Norton's **balanced scorecard** translates strategy into four perspectives, which form a chain:\n\n- **Learning and growth:** employee skills, satisfaction, and retention\n- **Internal business processes:** quality, cost, and efficiency\n- **Customer:** satisfaction, retention, and market share\n- **Financial:** operating income and return on capital\n\nEach perspective has objectives, measures, targets, and initiatives. The scorecard balances internal with external measures, results with the drivers of future results, and objective with subjective measures.\n\n## 8.6 Steps in the performance management process\n\nThe nine steps are:\n\n1. Link organizational goals to the mission and strategy.\n2. Set subgoals for units, groups, and individuals.\n3. Communicate goals and expectations.\n4. Create work processes and assign resources.\n5. Measure progress.\n6. Assess performance against goals.\n7. Give regular feedback.\n8. Identify and overcome obstacles.\n9. Reward goal achievement.\n\n**Goals, coaching, and feedback are the most important part.** Ongoing feedback matters more than interim ratings. Ritz-Carlton praises publicly and criticizes privately, and its feedback focuses on improvement. Feedback reinforces desired behavior and goal accomplishment, which is why the quiz calls feedback the practice that reinforces both.\n\n## 8.7 Goal setting and standards\n\nThis is the second checklist item. **SMART goals** are Specific (clear and understandable), Measurable (verifiable, results-oriented), Achievable (accepted and agreed upon), Relevant (important to the mission), and Time-bound (a deadline and milestones). Results are made measurable through **quantity, quality, cost, and timeliness**. **Standards** define acceptable levels of results; for example, 200 parts an hour meets the standard and more than 250 is superior.\n\n**Benefits of goal setting:** forty-plus years of research show that **specific, challenging goals** raise performance for individuals, groups, and organizations. They:\n\n- **focus attention** on what matters instead of random tasks\n- **increase effort**\n- **sustain persistence through setbacks**\n- **prompt new strategies**\n\nIn short, goals affect **direction, effort, and persistence**. Goal-linked incentives strongly shape employees' **behavior**. **Commitment** matters most for specific, difficult goals, and it's highest when the person believes the goal is important and attainable. **Self-efficacy** (belief in your own ability) raises performance and the goals people set. Goal setting works best with **progress feedback**. Managers help set goals because **organizational success depends on it**.\n\n**Cautions:** goals can backfire. Mortgage volume goals helped fuel the 2008 crisis, and Enron's revenue incentives and Bausch & Lomb's falsified sales show that overly ambitious goals can push people toward unethical behavior. Narrow goals can crowd out safety and cooperation. Keep goals few (Ritz-Carlton allows at most three priorities per unit), involve the people affected to build commitment, and don't hold people accountable for factors outside their control.\n## 8.8 Sources of performance information\n\nThis is the third checklist item. **Multisource (360-degree) assessment** gathers ratings from several sources:\n\n- **Supervisor:** the most common and expected source. It's used for promotion and pay decisions; \"challenge sessions,\" where supervisors scrutinize each other's ratings, keep raters honest.\n- **Self:** often opens the review meeting, surfaces development needs, and adds information others lack. Its limit is that people misjudge themselves, some too high and some too low.\n- **Peers and coworkers:** see behavior the boss misses and know the most in interdependent work. They rate more honestly when ratings are used for development. One practice is to drop the highest and lowest peer ratings.\n- **Subordinates (upward reviews):** rate a manager's leadership and interpersonal behavior. Anonymity is critical because people fear retaliation, and many unanswered items can signal a problem.\n- **Internal and external customers:** add the stakeholder view. External customers are best asked about interpersonal behavior, since they can't separate the employee from company rules and resources.\n\nThe key principle is **task acquaintance**: the amount and type of work contact a rater has with the person rated. People can only rate what they've actually observed. Choose and weight sources by credibility and opportunity to observe. *Guide-style example:* a designer who works with you daily, a client who approves your work, and an account manager who presents it are good sources. A payroll administrator or a CEO who has never seen your work is not. Non-supervisor ratings are usually used for development, and 360-degree systems fit egalitarian cultures better than hierarchical ones.\n\n## 8.9-8.11 Measurement methods: rating vs. ranking\n\n**Rating methods** compare each employee to standards, so everyone can earn a high rating if they deserve it:\n\n- **Essay:** flexible, but hard to compare across employees\n- **Critical incidents:** specific examples of good and poor behavior; specific, but time-consuming to record\n- **Graphic rating scales:** ratings like unsatisfactory to outstanding on dimensions such as quality and cooperation; more reliable and comparable than essays\n- **BARS (behaviorally anchored rating scales):** each scale point is anchored by a behavioral example, developed from critical incidents\n- **BOS (behavioral observation scales):** rate how often each desired behavior occurs; gives more feedback than BARS\n- **Forced choice:** pick the statement that fits best from a secretly weighted set; reduces bias but can't easily be shared as feedback\n- **Checklist:** check the behaviors that apply\n- **Work standards:** output compared to targets; best for production jobs\n- **Management by objectives (MBO):** evaluation against goals set jointly with the employee, which builds commitment\n\n**Ranking methods** compare employees to each other, so not everyone can rank high even if all are excellent. They include **forced ranking** (best to worst), **paired comparison** (each person compared with every other), and **forced distribution** (for example, top 20%, middle 70%, bottom 10%). Forced distribution can build a competitive culture but erodes teamwork; Chemtura dropped it because giving excellent people mediocre ratings demotivated them. Termination quotas carry legal risk. Combining methods, such as BARS or a graphic scale plus an essay, keeps things simple while identifying development needs.\n\n## 8.12-8.15 Ethics, feedback, reviews, and continuous performance management\n\nPerformance management shouldn't be used only to squeeze more out of people. Wells Fargo's aggressive cross-sell goals overwhelmed its ethics training.\n\nThe **review process** has three steps: **preparation** (gather information from all sources, including a self-evaluation), **communication** (a two-way meeting: put the employee at ease, listen first, cover strengths and improvement areas, and agree on documented goals), and **follow-through** (regular coaching and praise). **Effective feedback** focuses on behavior, not character; compares performance to goals and past performance rather than to other people; is specific about the desired behavior; and is limited to a few points, with at most three improvement areas. **Constructive** feedback addresses behavior with examples of how to correct it and never attacks the person. Negative feedback is accepted best when it's objective, comes from a credible source, and is delivered tactfully. Nonmonetary rewards like specific praise are motivating. Wording should also fit the culture: \"room for improvement, but overall good\" reads as criticism to many Chinese and Korean managers but as praise to many U.S. managers.\n\nUsing one rating for both pay and development forces a choice between honest-but-low feedback and a raise. That's why United Airlines decoupled the two. **Continuous performance management** replaces the annual review with frequent check-ins and coaching (Adobe, Deloitte, Cargill). Adobe saw voluntary turnover fall 30%. It isn't for everyone: Intel reinstated scores.\n\n## 8.16 Improvement and development plans\n\nThe primary goal of an appraisal discussion is **improvement**; the second is a legally defensible record. First, decide whether the issue is a **performance problem** (can't do it) or a **behavior problem** (can, but disrupts the workplace). A **performance improvement plan (PIP)** documents the deficiency, the objectives with metrics, the actions and support, the timeframe, and signatures, and it's built with the employee. **FOSA+** structures the conversation: **F**acts, **O**bjectives, **S**olutions, **A**ctions (consequences), plus your support. An **employee development plan** makes good performance better.\n\n## 8.17 Progressive discipline: purpose and process\n\nThese are checklist items five and six. Discipline requires a legitimate reason, or just cause.\n\n**Purpose:** **progressive discipline** applies increasingly severe measures when an employee fails to correct a problem after a reasonable chance. It **alerts the employee to a problem that needs correcting**, **starts with the least severe action** needed to stimulate improvement, and **escalates only if the problem isn't corrected**. It's about correction, not punishment or instant firing, and it creates fairness and legal documentation.\n\n**Process (typical steps):**\n\n1. **Counseling:** an informal talk that raises the problem before it needs a written warning; it doesn't have to be documented.\n2. **Written warning:** a formal document with the problem's history, the employee's explanation, expectations, consequences, and a timeframe; it goes in the file. The book says it **may be repeated** with stronger wording (the second becomes a final warning).\n3. **Suspension without pay:** usually less than a week, often one to three days, with a written record. The act matters more than the length.\n4. **Termination:** when earlier steps fail, after the employee has a chance to explain and a fair investigation, followed by written notice.\n\nThe process is flexible. Serious offenses like fighting, harassment, or drug use can skip steps, and minor issues start at the lowest step. Bring a witness. At every step, describe the behavior with specific examples, explain the standard, let the employee explain, and state the expectations, timeframe, and consequences calmly. Frito-Lay's \"Discipline Without Punishment\" uses a paid one-day suspension during which the employee writes a commitment to change.\n\n*Which steps can repeat?* The text explicitly says the written warning can repeat. The quiz's likely intended answer for \"two steps an employer may repeat\" is **written warning and suspension**, the two middle steps; treat that with moderate confidence.\n\n## 8.18-8.19 Prudential and common obstacles\n\nPrudential makes collaborative, respectful behavior part of every assessment and uses an incident team plus employee-chosen improvement plans to address toxic behavior. Performance management supports collaboration by measuring it, giving feedback, and holding people accountable.\n\nThis is the seventh checklist item. **The three common obstacles** are:\n\n1. **Not communicating a performance plan:** employees aren't told the goals, standards, and how they'll be measured. A **performance plan** spells out goals, measures, weights, and standards for the period, and it's developed with the employee.\n2. **Lack of accountability:** managers aren't held responsible for giving regular, accurate feedback, for example by avoiding poor performance to keep the peace. Locate ownership of the system at a senior level.\n3. **Human biases and errors:** for example, ratings based on friendship rather than standards.\n\n\"Human capacity limitations\" is **not** one of the three.\n\n## 8.20 Rating biases and errors\n\n- **Contrast effect:** comparing a person to coworkers instead of to standards\n- **First impression:** early judgments color later ratings\n- **Recency effect:** recent events count too much; prevent it by **recording performance regularly**\n- **High potential error:** rating promise instead of actual performance\n- **Halo effect:** one positive trait inflates all the ratings\n- **Horns effect:** one negative trait lowers all the ratings\n- **Similar-to-me effect:** higher ratings for people like the rater\n- **Leniency error:** everyone rated **too high**\n- **Central tendency:** everyone rated in the middle\n- **Stereotyping:** assuming group traits apply to the individual\n- **Opportunity bias:** ignoring factors beyond the employee's control\n\nThe fixes are rater training, year-round documentation, clear goals, and standards based on observable behavior.\n\n## 8.21-8.23 Legal and ethical issues, Microsoft, and feedback seeking\n\nAppraisals help show just cause, but sloppy ones hurt. Low ratings concentrated in a protected group invite scrutiny of job-relatedness. *Erratum:* the book says an age discrimination claim \"may be supported by Title VII,\" but age claims fall under the **Age Discrimination in Employment Act (ADEA)**. Retaliatory low ratings are illegal, and **negligent performance appraisal** claims can arise when required reviews are skipped or botched. A defensible system bases criteria on job analysis, uses trained raters with firsthand knowledge, gives poor performers a chance to improve, documents specifics, and ensures **no surprises at review time**.\n\nMicrosoft replaced stack ranking with \"Talent Talks\" on impact, contributions to others, and use of others' work, plus frequent check-ins. The self-assessment in 8.23 separates feedback seeking, avoiding, and mitigating. If your own job lacks goals and feedback, create your own.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Describe the benefits of performance management.\n2. Explain the benefits of goal setting.\n3. Identify sources of performance information.\n4. Explain why feedback is important to goal accomplishment.\n5. Describe the purpose of progressive discipline.\n6. Describe the process of progressive discipline.\n7. Identify common obstacles to effective performance management.\n\nTo get there, make sure you can also explain:\n\n- The three benefits, and why behaviors aren't results\n- SMART goals, and how goals affect direction, effort, and persistence\n- Task acquaintance, and which raters fit a scenario\n- Effective vs. ineffective feedback phrasing\n- The four discipline steps from a scenario, and when steps can be skipped\n- Rating vs. ranking methods, and the rating errors by name\n- The ADEA erratum and how to make appraisals legally defensible\n","cards":[{"id":"c202-ch08-001","front":"What is performance management?","answer":"A system that directs and motivates people and units toward organizational goals via goals, feedback, and support.","subtitle":"Ch 8.2 · Effective HRM","note":"Read more: 8.2 Introduction","points":["Links past performance to future needs; aligns people with strategy","Shapes what employees WILL do (staffing and training shape CAN do)"]},{"id":"c202-ch08-002","front":"What do organizations and employees each want from performance management?","answer":"Organizations: execution, alignment, development, rewards. Employees: development, rewards, satisfaction.","subtitle":"Ch 8.2 · Effective HRM","note":"Read more: 8.2 Introduction","points":["The best systems meet both sets of goals","Managers should voice praise and appreciation"]},{"id":"c202-ch08-003","front":"What was wrong with Microsoft's stack ranking?","answer":"It forced fixed shares of great, mediocre, and terrible ratings, so stars avoided each other and innovation fell.","subtitle":"Ch 8.3 · Effective HRM","note":"Read more: 8.3 Real World Challenge: Improving Culture through Performance Management at Microsoft","points":["Per 10 people: 2 great, 7 mediocre, 1 terrible, regardless of quality","Nadella wanted a growth mindset instead"]},{"id":"c202-ch08-004","front":"What is a growth mindset?","answer":"Focusing on learning, persisting through setbacks, and using failure and criticism to improve.","subtitle":"Ch 8.3 · Effective HRM","note":"Read more: 8.3 Real World Challenge: Improving Culture through Performance Management at Microsoft; 8.22 Real World Response: Improving Culture through Performance Management at Microsoft","points":["Microsoft's shift from 'know-it-alls' to 'learn-it-alls'"]},{"id":"c202-ch08-005","front":"What are the three main benefits of performance management?","answer":"It aligns goals across levels, provides clear goals and feedback, and generates useful data.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Goal: all parts of the organization working together for results"]},{"id":"c202-ch08-006","front":"What is the primary goal of performance management across the organization?","answer":"Getting all parts (individuals, teams, units, processes, projects) working together to achieve results.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Covers more than individual employees"]},{"id":"c202-ch08-007","front":"How does performance management align goals?","answer":"It cascades organizational goals into unit, team, and individual goals and measures progress on them.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Measure efficiency and effectiveness, then communicate to performers"]},{"id":"c202-ch08-008","front":"Why aren't behaviors the same as results?","answer":"Being busy doesn't mean contributing, and finishing doesn't mean finishing efficiently or ethically.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Performance management measures results, not just activity"]},{"id":"c202-ch08-009","front":"What useful data does performance management generate?","answer":"Benchmarks against best practices, results of change efforts, support for fair treatment, and ROI.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Example: judge whether safety training worked"]},{"id":"c202-ch08-010","front":"Why should interdependent teams get team-level goals and feedback?","answer":"Individual-only goals can create stars who hurt the team; team goals reward working together.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Use both team and individual levels"]},{"id":"c202-ch08-011","front":"What did Google's research on managers find?","answer":"Good managers improve retention and team performance; feedback helped most low-rated managers improve a lot.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["8 good behaviors (e.g., good coach) and 5 to avoid"]},{"id":"c202-ch08-012","front":"Why is feedback important to goal accomplishment?","answer":"Goals direct effort, but feedback tracks progress toward them so people can adjust; goals alone don't work.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Goals + feedback are among managers' most powerful tools","Matters most for complex tasks that are hard to self-judge"]},{"id":"c202-ch08-013","front":"Why isn't praise alone enough feedback?","answer":"People need specific, task-related information to know what to change.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["WD-40 swapped labels like 'excellent' for improvement feedback; engagement rose"]},{"id":"c202-ch08-014","front":"When is feedback most likely to lead to improvement?","answer":"When it shows a need to change, the employee accepts it, believes change is feasible, sets goals, and acts.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?; 8.24 Summary and Application","points":["Coaching helps bridge feedback and action"]},{"id":"c202-ch08-015","front":"For which tasks is feedback most important?","answer":"Complex tasks where people can't easily judge their own progress.","subtitle":"Ch 8.4 · Effective HRM","note":"Read more: 8.4 Why Is Performance Management Important?","points":["Simple tasks give natural feedback"]},{"id":"c202-ch08-016","front":"What is the balanced scorecard?","answer":"Kaplan and Norton's system translating strategy into four perspectives: learning/growth, process, customer, financial.","subtitle":"Ch 8.5 · Strategic HRM","note":"Read more: 8.5 Balanced Scorecard","points":["A chain: learning and growth -> processes -> customer -> financial","Each has objectives, measures, targets, and initiatives"]},{"id":"c202-ch08-017","front":"What three balances does the balanced scorecard strike?","answer":"Internal vs. external measures, results vs. drivers of future results, and objective vs. subjective measures.","subtitle":"Ch 8.5 · Strategic HRM","note":"Read more: 8.5 Balanced Scorecard","points":["Captures intangibles like talent and customer relationships"]},{"id":"c202-ch08-018","front":"What does each balanced scorecard perspective measure?","answer":"Learning/growth: skills, retention. Process: quality, cost. Customer: satisfaction, share. Financial: income, return.","subtitle":"Ch 8.5 · Strategic HRM","note":"Read more: 8.5 Balanced Scorecard","points":["Kaiser Permanente sent scorecard reports with paychecks"]},{"id":"c202-ch08-019","front":"What are the nine steps of the performance management process?","answer":"Link goals to strategy, set subgoals, communicate, resource, measure, assess, give feedback, remove obstacles, reward.","subtitle":"Ch 8.6 · Effective HRM","note":"Read more: 8.6 Steps in the Performance Management Process","points":["Goals, coaching, and feedback are the most important part"]},{"id":"c202-ch08-020","front":"What is the most important part of the performance management process?","answer":"Goals, coaching, and ongoing feedback; ongoing feedback matters more than interim ratings.","subtitle":"Ch 8.6 · Effective HRM","note":"Read more: 8.6 Steps in the Performance Management Process","points":["Supervisor commitment is essential"]},{"id":"c202-ch08-021","front":"How does Ritz-Carlton handle positive and constructive feedback?","answer":"It praises publicly, criticizes privately, focuses on improvement, and shares positive stories.","subtitle":"Ch 8.6 · Effective HRM","note":"Read more: 8.6 Steps in the Performance Management Process","points":["Recognition signals which behaviors are valued"]},{"id":"c202-ch08-022","front":"What does SMART stand for in goal setting?","answer":"Specific, measurable, achievable, relevant, and time-bound.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Specific = clear and understandable","Relevant = important to the mission","Goals should also be challenging"]},{"id":"c202-ch08-023","front":"How can results be made measurable?","answer":"By describing them in terms of quantity, quality, cost, and timeliness.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Example: profit +20% in a year; overhead −10%"]},{"id":"c202-ch08-024","front":"What are performance standards?","answer":"Defined levels of acceptable results, such as 200 parts an hour meets and 250+ is superior.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Linked to rewards, punishments, and remediation"]},{"id":"c202-ch08-025","front":"What are the benefits of setting specific, challenging goals?","answer":"They focus attention, increase effort, sustain persistence through setbacks, and prompt new strategies.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Goals affect direction, effort, and persistence","Works for individuals, groups, units, and organizations"]},{"id":"c202-ch08-026","front":"Which kind of goals produce the highest performance?","answer":"Specific and difficult goals, when the person is committed to them.","subtitle":"Ch 8.7 · Motivational Concepts","note":"Read more: 8.7 Setting Goals and Standards","points":["40+ years of goal-setting research"]},{"id":"c202-ch08-027","front":"When is goal commitment highest?","answer":"When the person believes the goal is important and attainable.","subtitle":"Ch 8.7 · Motivational Concepts","note":"Read more: 8.7 Setting Goals and Standards","points":["Commitment matters most for specific, difficult goals","Involve people in setting goals to build it"]},{"id":"c202-ch08-028","front":"What is self-efficacy, and how does it affect goal setting?","answer":"Belief in your own ability; it raises performance, the goals people set, and resilience after failure.","subtitle":"Ch 8.7 · Motivational Concepts","note":"Read more: 8.7 Setting Goals and Standards","points":["Also shapes commitment and strategy choice"]},{"id":"c202-ch08-029","front":"Why does goal setting work best with feedback?","answer":"Progress feedback shows whether effort is on track, so people can adjust strategy.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards; 8.4 Why Is Performance Management Important?","points":["Goals without feedback are ineffective"]},{"id":"c202-ch08-030","front":"How can goals backfire?","answer":"Overly ambitious or narrow goals can push unethical or risky behavior and crowd out safety and cooperation.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Mortgage volume goals and the 2008 crisis; Enron; Bausch & Lomb","Big goal-linked rewards may dampen intrinsic motivation"]},{"id":"c202-ch08-031","front":"How many priorities does Ritz-Carlton allow per unit, and why?","answer":"At most three, because beyond three you diffuse resources.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["Balance financial and nonfinancial goals"]},{"id":"c202-ch08-032","front":"What did Cargill's Everyday Performance Management change?","answer":"It dropped the annual review for continuous recognition, team-owned performance talks, and coaching.","subtitle":"Ch 8.7 · Effective HRM","note":"Read more: 8.7 Setting Goals and Standards","points":["More useful feedback, less paperwork"]},{"id":"c202-ch08-033","front":"What is multisource (360-degree) assessment?","answer":"Gathering performance ratings from several sources: self, supervisor, peers, subordinates, and customers.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Supervisor ratings drive promotion decisions; others are mostly for development"]},{"id":"c202-ch08-034","front":"What are the main sources of performance information?","answer":"Supervisor, self, peers or coworkers, subordinates (upward), and internal or external customers.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Choose and weight by credibility and opportunity to observe"]},{"id":"c202-ch08-035","front":"What is task acquaintance?","answer":"The amount and type of work contact a rater has with the person being rated.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Raters can only judge what they've observed","The key test for choosing a source"]},{"id":"c202-ch08-036","front":"What is the supervisor's role as a rating source?","answer":"The most common, expected source; rates performance, development needs, and promotion potential.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["'Challenge sessions' let supervisors scrutinize each other's ratings"]},{"id":"c202-ch08-037","front":"What are the benefits and limits of self-assessment?","answer":"It opens dialogue and adds unseen information, but people misjudge themselves, too high or too low.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Often opens the appraisal meeting"]},{"id":"c202-ch08-038","front":"Why are peers valuable rating sources?","answer":"They see task and interpersonal behavior the boss misses, especially in interdependent work.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["More honest when ratings are for development","Drop the highest and lowest peer ratings"]},{"id":"c202-ch08-039","front":"What are upward reviews, and what do they require?","answer":"Subordinates rating a manager's leadership and interpersonal behavior; anonymity is critical.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Fear of retaliation is the main limit","Many unanswered items can signal a problem"]},{"id":"c202-ch08-040","front":"What should external customers be asked to rate?","answer":"Interpersonal behavior, because they can't separate the employee from company rules and resources.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Customers broaden whom employees aim to please"]},{"id":"c202-ch08-041","front":"Which cultures suit 360-degree feedback best?","answer":"Egalitarian cultures; it fits less well in hierarchical or paternalistic cultures.","subtitle":"Ch 8.8 · Effective HRM","note":"Read more: 8.8 Performance Information Sources","points":["Ratings must be accepted and seen as fair"]},{"id":"c202-ch08-042","front":"What is the difference between rating and ranking methods?","answer":"Rating compares each person to standards; ranking compares people to each other.","subtitle":"Ch 8.9 · Effective HRM","note":"Read more: 8.9 Performance Measurement Methods; 8.11 Performance Ranking Methods","points":["Rating: everyone can score high if deserved","Ranking: someone must be low even if all are excellent"]},{"id":"c202-ch08-043","front":"What are essay appraisals and critical incidents?","answer":"Essay: a written description of strengths and weaknesses. Critical incidents: specific good and bad examples.","subtitle":"Ch 8.9 · Effective HRM","note":"Read more: 8.9 Performance Measurement Methods","points":["Both specific but hard to compare; incidents are time-consuming to record"]},{"id":"c202-ch08-044","front":"What is a graphic rating scale?","answer":"Rating dimensions like quality or cooperation on a scale such as unsatisfactory to outstanding.","subtitle":"Ch 8.9 · Effective HRM","note":"Read more: 8.9 Performance Measurement Methods","points":["More reliable and comparable than essays","Best combined with essays and critical incidents"]},{"id":"c202-ch08-045","front":"What are behaviorally anchored rating scales (BARS)?","answer":"Scales where each point is anchored by a behavioral example, developed from critical incidents.","subtitle":"Ch 8.9 · Effective HRM","note":"Read more: 8.9 Performance Measurement Methods","points":["Example: 5 = anticipates needs; 1 = does only what's told"]},{"id":"c202-ch08-046","front":"What are behavioral observation scales (B
