<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flash Cards</title>
  <style>
    :root {
      --navy: #1b365d;
      --navy-2: #12243f;
      --gold: #c4a35a;
      --cream: #f7f3ea;
      --ink: #1a1a1a;
      --muted: #5c6570;
      --line: #d8dee6;
      --ok: #2f6f4e;
      --bad: #8b3a3a;
      --card: #ffffff;
      --shadow: 0 10px 30px rgba(18, 36, 63, 0.12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Calibri, system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-weight: 650;
    }
    header .sub { color: #c5d0dc; font-size: 13px; }
    main { max-width: 920px; margin: 0 auto; padding: 20px; }
    button, select, input, textarea {
      font: inherit;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--navy);
      color: #fff;
    }
    button.secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid var(--line);
    }
    button.gold { background: var(--gold); color: var(--navy-2); font-weight: 650; }
    button.ok { background: var(--ok); }
    button.bad { background: var(--bad); }
    button.danger { background: transparent; color: var(--bad); border: 1px solid #e3c4c4; }
    button:disabled { opacity: 0.45; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .folder-card { cursor: pointer; }
    .folder-card:hover { border-color: var(--gold); }
    .folder-card h3 { margin: 0 0 6px; font-size: 17px; }
    .muted { color: var(--muted); font-size: 13px; }
    .study-wrap { min-height: 62vh; display: flex; flex-direction: column; gap: 14px; }
    .flash {
      flex: 1;
      min-height: 320px;
      background: var(--navy);
      color: #fff;
      border-radius: 22px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow);
      cursor: pointer;
      position: relative;
    }
    .flash.back {
      background: #fff;
      color: var(--ink);
      text-align: left;
      align-items: stretch;
      justify-content: flex-start;
    }
    .flash .hint {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--gold);
      text-transform: uppercase;
    }
    .flash h2 { margin: 18px 0 8px; font-size: 28px; line-height: 1.2; }
    .flash .subtitle { color: var(--gold); font-size: 20px; font-weight: 700; }
    .flash.back h2 { font-size: 20px; margin: 8px 0 4px; color: var(--navy); }
    .flash.back .label {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.12em;
      font-weight: 700;
      margin-top: 10px;
    }
    .flash.back p, .flash.back li { line-height: 1.45; }
    .flash.back ul { margin: 6px 0 0; padding-left: 18px; }
    .progress-bar {
      height: 8px;
      background: #e6e1d6;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--gold);
    }
    label { display: block; font-size: 13px; font-weight: 650; margin: 10px 0 4px; }
    input[type="text"], textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    dialog {
      border: 0;
      border-radius: 16px;
      padding: 0;
      width: min(560px, 92vw);
    }
    dialog::backdrop { background: rgba(18, 36, 63, 0.45); }
    .dialog-body { padding: 18px; }
    .dialog-head {
      background: var(--navy);
      color: #fff;
      padding: 14px 18px;
      font-weight: 650;
    }
    .empty {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
    }
    .pill {
      display: inline-block;
      background: #efe7d4;
      color: var(--navy-2);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      margin-left: 6px;
    }
    .list-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .list-item:last-child { border-bottom: 0; }
    footer.note { margin-top: 28px; color: var(--muted); font-size: 12px; }
    .choices { display: grid; gap: 10px; }
    button.choice {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      text-align: left;
      font-weight: 500;
      line-height: 1.35;
      padding: 12px 14px;
    }
    button.choice:hover:not(:disabled) { border-color: var(--gold); }
    button.choice.correct { background: #e5f4ea; border-color: var(--ok); color: var(--ok); }
    button.choice.wrong { background: #f8eaea; border-color: var(--bad); color: var(--bad); }
    button.choice:disabled { opacity: 1; }
    button.choice.idle, button.choice.idle:disabled { opacity: 0.55; }
    .flash.quiz {
      min-height: 180px;
      cursor: default;
    }
    textarea.short { min-height: 64px; }
    .flash.scenario { align-items: stretch; text-align: left; justify-content: center; }
    .flash.scenario .hint { text-align: center; }
    .scenario-text { font-size: 19px; line-height: 1.5; white-space: pre-line; margin-top: 18px; }
    .explain {
      border-radius: 12px; padding: 12px 14px; line-height: 1.45; border: 1px solid var(--line); background: #fff;
    }
    .explain.ok { border-color: var(--ok); background: #eef7f1; }
    .explain.bad { border-color: var(--bad); background: #fbf1f1; }
    .explain.ok strong { color: var(--ok); }
    .explain.bad strong { color: var(--bad); }
    .explain p { margin: 6px 0 0; }
    .pill.scen { background: var(--navy); color: #fff; }
    .plan-banner { margin-bottom: 18px; border-left: 5px solid var(--navy); }
    .status-pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: #efe7d4; color: var(--navy-2); white-space: nowrap; }
    .status-pill.on, .status-pill.passed { background: #e5f4ea; color: var(--ok); }
    .status-pill.ahead { background: #dfeaf7; color: var(--navy); }
    .status-pill.behind, .status-pill.overdue { background: #f8eaea; color: var(--bad); }
    .status-pill.today, .status-pill.current { background: var(--gold); color: var(--navy-2); }
    .status-pill.soon { background: #eceff3; color: var(--muted); font-weight: 500; }
    .status-pill.ms { background: var(--navy); color: #fff; }
    .pace-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
    .pace { position: relative; display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; font-weight: 400; }
    .pace.sel { border-color: var(--gold); box-shadow: inset 0 0 0 2px var(--gold); background: #fffaf0; }
    .pace input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
    .pace-title { font-weight: 700; color: var(--navy); font-size: 15px; }
    .pace .muted { font-size: 12px; }
    input[type=date] { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; font: inherit; }
    .plan-list { margin-top: 10px; }
    .plan-week { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a6d2b; margin: 14px 0 4px; }
    .plan-row { display: grid; grid-template-columns: 52px 1fr 110px 100px; gap: 8px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); font-size: 14px; }
    .plan-row.cur { background: #fffaf0; border-radius: 8px; }
    .plan-row.milestone { background: #f4f6f9; border-radius: 8px; }
    .plan-ch { font-weight: 700; color: var(--navy); }
    .plan-title a { color: var(--navy); }
    .plan-due { color: var(--muted); font-size: 13px; }
    .plan-state { text-align: right; }
    @media (max-width: 860px) { .pace-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .plan-row { grid-template-columns: 44px 1fr 86px; } .plan-state { grid-column: 2 / 4; text-align: left; } }
    .path-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; }
    .path-head strong { color: var(--navy); font-size: 16px; }
    .path-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .step { display: flex; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .step-num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; background: #efe7d4; color: var(--navy-2); }
    .step.done .step-num { background: var(--ok); color: #fff; }
    .step.next { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #fffaf0; }
    .step.next .step-num { background: var(--gold); color: var(--navy-2); }
    .step.na { opacity: .55; }
    .step-title { font-weight: 700; color: var(--navy); font-size: 14.5px; margin-bottom: 2px; }
    .step .muted { font-size: 12.5px; }
    .step-actions { margin-top: 8px; gap: 6px; }
    button.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
    .pill.next-pill { background: var(--gold); color: var(--navy-2); font-weight: 650; margin-left: 4px; }
    .mode-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 12px; }
    @media (max-width: 860px) { .mode-grid { grid-template-columns: repeat(3, 1fr); } }
    .mode-grid button { display: flex; flex-direction: column; align-items: flex-start; text-align: left; font-weight: 650; }
    .mode-grid button small { font-weight: 400; font-size: 12px; opacity: .8; margin-top: 2px; }
    @media (max-width: 860px) { .path-steps { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px) { .path-steps { grid-template-columns: 1fr; } .mode-grid { grid-template-columns: 1fr 1fr; } }
    .guide-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; border-left: 5px solid var(--gold); }
    .ov-title { font-weight: 700; color: var(--navy); font-size: 16px; margin-right: 8px; }
    .ov-status { margin-left: 8px; }
    .ov-status.unread { color: #8a6d2b; font-weight: 650; }
    .ok-text { color: var(--ok); }
    .ov-done { margin-top: 8px; font-size: 13px; color: var(--ok); font-weight: 650; }
    .guide-sticky {
      position: sticky; top: 0; z-index: 5; background: var(--cream); padding: 10px 0 8px;
      display: flex; align-items: center; gap: 12px; font-size: 13px;
    }
    .guide-bar { flex: 1; height: 6px; background: #e6e1d6; border-radius: 99px; overflow: hidden; }
    .guide-bar > span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .1s; }
    .guide-sticky .muted { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .guide-wrap { max-width: calc(68ch + 72px); font-size: 17.5px; margin: 0 auto; }
    .guide { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 30px 36px 26px; box-shadow: var(--shadow); }
    .guide-meta { color: var(--gold); font-weight: 700; font-size: 13px; letter-spacing: .06em; line-height: 1.6; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .guide-meta .muted { letter-spacing: 0; font-weight: 400; }
    .md.guide-md { font-size: 17.5px; line-height: 1.75; color: #222; }
    .md.guide-md h3 { font-size: 27px; margin: 24px 0 10px; line-height: 1.25; }
    .md.guide-md h4 { font-size: 21px; margin: 30px 0 8px; padding-top: 14px; border-top: 1px solid var(--line); }
    .md.guide-md h5 { font-size: 15px; margin: 22px 0 4px; color: #8a6d2b; }
    .md.guide-md p { margin: 10px 0 14px; }
    .md.guide-md li { margin: 6px 0; }
    .guide-end { text-align: center; margin-top: 26px; padding-top: 18px; border-top: 2px solid var(--gold); }
    .md { line-height: 1.6; font-size: 15px; }
    .md h3, .md h4, .md h5 { color: var(--navy); margin: 18px 0 6px; line-height: 1.3; }
    .md h3 { font-size: 20px; } .md h4 { font-size: 17px; } .md h5 { font-size: 15px; text-transform: uppercase; letter-spacing: .05em; }
    .md p { margin: 8px 0; }
    .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
    .md li { margin: 3px 0; }
    .md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
    .ov-source { margin-top: 12px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
    .ov-link { display: inline-block; margin-top: 8px; font-size: 13px; color: #8a6d2b; font-weight: 650; text-decoration: none; }
    .ov-link:hover { text-decoration: underline; }
    .readmore {
      display: flex; gap: 8px; align-items: baseline; margin-top: 12px; padding: 8px 10px;
      border-left: 3px solid var(--gold); background: #fbf6ea; border-radius: 0 8px 8px 0;
      font-size: 13px; line-height: 1.4; color: var(--navy-2); text-align: left;
    }
    .readmore .rm-label { color: #8a6d2b; font-weight: 750; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
    .flash.back .readmore { margin-top: auto; }
    .flash.back ul + .readmore, .flash.back p + .readmore { margin-top: 16px; }
    button.choice.selected { border-color: var(--gold); background: #fbf6ea; box-shadow: inset 0 0 0 2px var(--gold); }
    .course { margin-bottom: 22px; }
    .course-head { font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--navy); margin: 4px 0 10px; border-bottom: 2px solid var(--gold); padding-bottom: 6px; }
    .course-head .muted { text-transform: none; letter-spacing: 0; font-weight: 400; margin-left: 6px; }
    .folder-card.locked { opacity: .55; background: #f1eee7; box-shadow: none; }
    .folder-card.locked:hover { opacity: .8; }
    .lock { font-size: 12px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
    .lock.open { color: var(--gold); }
    .boss-line.passed strong { color: var(--ok); }
    .boss-result { text-align: center; padding: 26px 16px; border-top: 6px solid var(--bad); }
    .boss-result.pass { border-top-color: var(--ok); }
    .boss-badge { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--bad); }
    .boss-result.pass .boss-badge { color: var(--ok); }
    .boss-score { font-size: 56px; font-weight: 750; color: var(--navy); line-height: 1.1; margin: 6px 0; }
    .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .match-col { display: grid; gap: 8px; align-content: start; }
    .match-tile {
      background: #fff; color: var(--ink); border: 1px solid var(--line); text-align: left; line-height: 1.3;
      min-height: 56px; padding: 10px 12px; font-size: 14px; transition: background .15s, border-color .15s, transform .1s;
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .match-tile.term { font-weight: 650; color: var(--navy); }
    .match-tile.sel { border-color: var(--gold); background: #fbf6ea; box-shadow: inset 0 0 0 2px var(--gold); }
    .match-tile.matched { background: #e5f4ea; border-color: var(--ok); color: var(--ok); opacity: 1; }
    .match-tile.wrong { background: #f8eaea; border-color: var(--bad); color: var(--bad); animation: shake .35s; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .match-timer { font-size: 26px; font-weight: 750; color: var(--navy); font-variant-numeric: tabular-nums; }
    .penalty { font-size: 15px; color: var(--bad); opacity: 0; }
    .penalty.show { animation: pen 1.2s ease; }
    @keyframes pen { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
    @media (max-width: 520px) {
      main { padding: 14px; }
      .match-tile { font-size: 13px; padding: 8px 9px; min-height: 52px; }
      .match-grid { gap: 8px; }
      .flash h2 { font-size: 24px; }
      .scenario-text { font-size: 17px; }
      header { flex-wrap: wrap; }
      .guide { padding: 20px 18px; border-radius: 12px; }
      .md.guide-md { font-size: 17px; line-height: 1.7; }
      .md.guide-md h3 { font-size: 23px; }
      .md.guide-md h4 { font-size: 19px; }
    }
    .review-item { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .review-item:last-child { border-bottom: 0; }
    .review-q { white-space: pre-line; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .review-a { font-size: 14px; margin-top: 2px; }
    .review-a.ok { color: var(--ok); }
    .review-a.bad { color: var(--bad); }
    button { touch-action: manipulation; }
    #toast {
      position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 30px);
      background: var(--navy-2); color: #fff; border-left: 4px solid var(--gold);
      padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow);
      opacity: 0; pointer-events: none; transition: all .25s ease; max-width: 92vw; z-index: 50; font-size: 14px;
    }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Flash Cards</h1>
      <div class="sub" id="headerSub">Folders stay on this device</div>
    </div>
    <div class="row" id="headerActions"></div>
  </header>
  <main id="app"></main>
  <dialog id="modal"></dialog>

  <script>
    const STORE_KEY = "flashcards.v1";
    const RETIRE_AFTER = 3;

    const DEFAULT_CARDS = [
      { front: "National Labor Relations Act (NLRA)", year: "1935", extra: "Wagner Act", purpose: "Protects private-sector employees’ rights to organize, form or join unions, bargain collectively, and engage in concerted activity.", protections: ["Right to unionize and bargain collectively", "Right to strike and take other concerted action", "Prohibits employer unfair labor practices (firing for union activity, interference, refusal to bargain)", "Created the National Labor Relations Board (NLRB)"] },
      { front: "Fair Labor Standards Act (FLSA)", year: "1938", purpose: "Sets nationwide wage-and-hour rules so workers are paid fairly and children are not exploited in the workplace.", protections: ["Federal minimum wage", "Overtime pay (typically 1.5× after 40 hours in a workweek for nonexempt employees)", "Child labor restrictions on age, hours, and hazardous work", "Employer recordkeeping requirements"] },
      { front: "Equal Pay Act", year: "1963", purpose: "Requires that men and women in the same workplace be given equal pay for equal work.", protections: ["Prohibits sex-based wage discrimination", "Covers jobs that require substantially equal skill, effort, and responsibility under similar working conditions", "Pay differences must be based on a factor other than sex (seniority, merit, quantity/quality of production)"] },
      { front: "Title VII of the Civil Rights Act", year: "1964", purpose: "Prohibits employment discrimination and created a federal enforcement path through the EEOC.", protections: ["Bars discrimination based on race, color, religion, sex, or national origin", "Applies to hiring, firing, pay, promotion, and other terms of employment", "Covers harassment and retaliation for complaining about discrimination", "Generally applies to employers with 15 or more employees"] },
      { front: "Age Discrimination in Employment Act (ADEA)", year: "1967", purpose: "Protects older workers from employment decisions based on age rather than ability.", protections: ["Prohibits age discrimination against people 40 and older", "Covers hiring, firing, pay, promotions, layoffs, and benefits", "Generally applies to employers with 20 or more employees"] },
      { front: "Rehabilitation Act", year: "1973", purpose: "Prohibits disability discrimination by the federal government, federal contractors, and programs that receive federal funds.", protections: ["Bars discrimination against qualified people with disabilities", "Requires reasonable accommodation in covered programs and federal employment", "Section 503 requires affirmative action by certain federal contractors", "Predecessor to many ADA concepts"] },
      { front: "Vietnam Era Veterans’ Readjustment Assistance Act (VEVRAA)", year: "1974", extra: "Amended in 2002 by the Jobs for Veterans Act", purpose: "Protects covered veterans in employment with federal contractors and requires proactive hiring efforts.", protections: ["Prohibits discrimination against disabled veterans and other covered veteran categories", "Requires affirmative action for those veterans by covered federal contractors"] },
      { front: "Pregnancy Discrimination Act", year: "1978", purpose: "Makes clear that discrimination because of pregnancy is a form of sex discrimination.", protections: ["Prohibits discrimination for all employment-related purposes on the basis of pregnancy, childbirth, or related medical conditions", "Pregnant workers must be treated the same as other employees similar in their ability or inability to work"] },

    const BUNDLED_DECKS = /*BUNDLED_DECKS_START*/[{"id":"c202-ch01","folder":"C202 Ch 1: Strategic Human Resource Management","course":"C202","order":1,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 1 Study Guide: Strategic Human Resource Management\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter falls under **Strategic Human Resource Management**: *determining the strategic impact of HRM on the organization*. Chapters 1 and 2 together make up about 14% of the Objective Assessment (OA). Expect questions that ask you to judge how an HR choice helps or hurts a company's strategy, not just to define terms. A few ideas preview other competencies: compensation types (1.9) return under **Motivational Concepts**, performance management (1.8) under **Effective HRM**, and employment law (1.4) under **Legal and Regulatory Requirements** in Chapter 3.\n\nChapter 1 is part of **Quarter 1** (Chapters 1-4), which ends with a quarterly quiz. WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n## 1.1-1.3 Why this chapter matters: people are the advantage\n\n### Competitive advantage\n\n**Competitive advantage** means doing something differently from your competitors in a way that lets you outperform them. Companies chase it through technology, products, location, low cost, or great service.\n\n*Why it matters:* The chapter's central claim is that people create and sustain every one of those sources. A clever product gets copied. A low-cost process stalls if workers don't run it well. Great service is nothing more than employees treating customers well. So whoever attracts, develops, and keeps the best talent tends to win, especially in knowledge-based businesses where the employees' expertise *is* the product.\n\n*Example:* Two coffee shops buy the same machines and beans. The one with better-trained, more engaged baristas wins the loyal customers.\n\n*Connection:* Everything else in the chapter explains *how* HR turns people into that advantage.\n\n### The opening case: Patagonia\n\nPatagonia makes outdoor clothing, and its mission centers on building the best product, causing no unnecessary harm, and using business to address environmental problems. It is a certified B Corp and a major environmental donor.\n\n*Why it matters:* HR's job is to build a culture that reinforces Patagonia's strategy. The chapter returns to this case in 1.20.\n\n## 1.4 What is HRM?\n\n### Definition\n\n**Human resource management (HRM)** is the function responsible for attracting, hiring, developing, rewarding, and retaining talent. It also handles people issues and makes sure the company complies with employment laws.\n\n*Why it matters:* Employee costs are one of the biggest items in most budgets, so how a firm manages people has a huge financial impact. HRM's ultimate purpose is to **manage risk** (legal, financial, cultural) and to **build a talent system that keeps great employees**.\n\n*A quick history:* The first \"personnel\" department appeared at National Cash Register in 1901, after a strike, and focused on payroll, safety, and compliance. HR later added labor relations, recruiting, training, and, since the 1980s, change and culture. Today technology and outsourcing absorb much of the paperwork, which frees HR to act strategically.\n\n### The should do / can do / will do model\n\nThis is the chapter's most important framework. HRM shapes performance by influencing three things:\n\n1. **What employees should do.** This is *direction*. Business strategy, competition, and laws shape it. **HR planning** designs work so it's efficient and forecasts how many and what kinds of people the company will need. Employment laws (many of which exist because of past discrimination) set limits on what employers can do.\n2. **What employees can do.** This is *ability*. Recruiting and staffing bring in people with the right ability and motivation, and training builds their skills. Example: when a hospital buys a new machine, nurses need training before they *can* use it.\n3. **What employees will do.** This is *motivation*. Compensation and performance management push effort in a direction.\n\n*Why it matters:* All three must be in place and pointing the same way. When they are, you get effective work processes (strategy gets executed, the environment is positive, employees are engaged). That produces competitive advantage, which produces organizational performance.\n\n*The foundation is \"can do\":* Staffing and development come first because incentives can't create ability. You can't bonus someone into skills they don't have.\n\n*Warning about \"will do\":* Rewards can drive the wrong behavior. Subprime mortgage brokers earned bonuses for risky loans. In 2016 Wells Fargo fired more than 5,000 employees who opened fake customer accounts to hit sales quotas. The lesson: when you design rewards, ask what behavior they might *accidentally* encourage.\n\n*How HRM creates value:* It cuts people-related costs (turnover, lawsuits), improves service and client relationships, and improves product cost and quality.\n\n*Everyday example:* A new server needs to know the service standards (should), be trained on the ordering system (can), and have a reason to upsell, like tips (will).\n\n## 1.5 What does HRM do? The six functions\n\nHRM designs systems that acquire, motivate, develop, and retain talent. The chapter groups that work into six functions:\n\n1. Staffing\n2. Training and development\n3. Performance management\n4. Rewards and benefits\n5. Health and safety\n6. Employee-management relations\n\n*Connection:* Each one maps onto the should/can/will model. Staffing and training mostly drive \"can do,\" and rewards and performance management drive \"will do.\" The next six sections cover each function, and the chapter keeps stressing that they depend on one another.\n\n## 1.6 Staffing\n\n**Staffing** is planning, acquiring, deploying, and retaining employees so the organization has the talent it needs to carry out its **business strategy**. It moves talent *into*, *through*, and *out of* the company.\n\n*The steps:* identify job requirements, then source candidates, recruit them (attract them, keep them interested, get them to accept), retain and move people within the company, and finally manage **separations**: terminations for performance, layoffs, restructuring, and resignations. Separations are part of staffing, a point the quiz tests.\n\n*Why it matters:* A wrong hire is hard to fix. Training and pay can't make up for someone who lacks the basic ability or fit for the job.\n\n*Example:* At Caribou Coffee, district managers who carefully staffed their store manager roles saw stronger revenue.\n\n*Connection:* Staffing supplies the raw talent that training and performance management work with, so it directly affects both. (Chapters 5 and 6 go deeper on recruiting and selection.)\n\n## 1.7 Training and development\n\n**Training and development** builds employees' capabilities through formal and informal learning. It also covers career planning, organizational development, and compliance training (for example, teaching managers how to interview and terminate legally).\n\n*Why it matters:* Training is how a company keeps skills current. It can be wasted, though: if a hire can't succeed, or quits before the company recoups the cost, the money is gone. Some retail jobs see turnover around 200% a year.\n\n*Connection:* Training only pays off when it's aligned with performance management and rewards. If reviews and pay don't recognize new skills, people won't use them. HRM is a system of functions that reinforce each other.\n\n### Succession planning\n\n**Succession planning** prepares people in advance to step into key positions, which reduces disruption when someone leaves.\n\n*Example:* Citigroup started searching for a CEO only after its leader left, and the company drifted. Google worked with Sundar Pichai for years; he became Google's CEO in 2015 and Alphabet's CEO in 2019, which made the handoff smooth. CEO succession is the role companies most often overlook.\n\n## 1.8 Performance management\n\n**Performance management** aligns employees' goals and behaviors with the organization's goals and strategy. It also appraises past and current performance and suggests ways to improve.\n\n*Why it matters:* It's how strategy shows up in each person's job. It's often tied to pay, so biased or inaccurate ratings demotivate people quickly.\n\n*What makes it work:* **Specific goals** and **frequent feedback**. Goals tell people what to aim for; feedback tells them how they're doing so they can adjust.\n\n- Without goals, focus is unclear, people underperform, and some quit, which creates more work for staffing.\n- Without accurate feedback, people can't adjust. Feedback that feels unfair lowers effort.\n- **Performance feedback** also maintains ethical behavior and communicates expectations. This is the answer to the quiz question about which kind of feedback supports ethics.\n\n*Connection:* Performance management depends on staffing for talent and on development to close gaps, and it feeds the rewards system.\n\n## 1.9 Rewards and benefits\n\nPay that feels adequate and fair drives motivation, performance, and retention.\n\n### Total rewards\n\n**Total rewards** is the sum of everything an employee receives for their time, effort, and performance. It has three parts:\n\n1. **Direct financial compensation:** salary, wages, commissions, bonuses, and stock options.\n2. **Indirect financial compensation (benefits):** health insurance, wellness programs, paid vacation, free meals, and retirement plans.\n3. **Nonfinancial compensation:** intrinsic rewards from the job or workplace, like feeling successful, appreciated, or proud of your work. The textbook shows this as roughly half of total rewards.\n\n*Why it matters:* Compare job offers on total rewards, not salary alone. A lower salary with strong retirement matching, health coverage, and training can be worth more.\n\n*Connection to staffing:* Pay level and hiring influence each other. Premium pay lets a company recruit top candidates. Low pay may force it to hire less-prepared people and then raise pay or train more. Incentive pay also depends on accurate performance management and on staffing and training supplying ability.\n\n*Example:* Costco pays roughly twice the market rate, more than rival Sam's Club. Because turnover is lower and productivity higher, its labor returns are similar, and customers get a better experience. Top pay isn't always necessary (does every marketer need an MBA?), but it can be an advantage.\n\n## 1.10 Health and safety\n\nThis function covers wellness, accident and injury prevention, ergonomics, disaster preparedness, bullying, and violence. **Workplace safety** protects employees from toxins, accidents, and injuries. **Workplace health** covers physical *and* mental health; job instability and heavy workloads raise stress.\n\n*Why it matters:* A healthy, safe workplace is the ethical thing to do, and it also pays. It raises productivity, lowers health care and workers' compensation premiums, and cuts lost time. Many federal and state laws apply.\n\n*Example:* A warehouse that provides safety gear, trains workers to use it, and holds people accountable avoids injuries, downtime, and insurance spikes.\n\n## 1.11 Employee-management relations\n\n**Employee-management relations** reflects society's beliefs about the relationship between workers and owners, and it defines the employment rights of both sides.\n\n*Why it matters:* Positive relations improve communication, problem solving, and performance, in union and non-union workplaces alike. Tools include participation programs and employee surveys. In unionized settings, employers must bargain in good faith, and a collective bargaining agreement sets the terms. In 2019 about 33.6% of public-sector workers were union members, versus 6.2% in the private sector.\n\n### Alignment of HR functions\n\nThe six functions must be **consistent in what they reinforce** and must not undermine each other.\n\n*Example of misalignment:* A company trains teamwork but pays only for individual results. Employees follow the money.\n\n*Example of alignment:* SAS, an analytics company, treats employees as its most valuable asset. Its trust-based culture, results-focused performance management, and generous benefits (on-site medical care, tuition reimbursement, flexible schedules) all point the same way. The result is low turnover and decades on \"best places to work\" lists.\n\n## 1.12 How HRM influences organizational performance\n\n### Two ways HRM adds value\n\nHRM adds value by improving **efficiency** (efficient systems and processes) or by contributing to **revenue growth**. The chapter calls HR an underused source of advantage. Effective HR systems also:\n\n- clarify responsibilities in light of the mission\n- develop capabilities and use skills efficiently\n- link rewards fairly to responsibility and performance\n- raise engagement and effort\n- improve change management\n- reduce bad outcomes like turnover and legal liability\n\n*Quiz trap:* \"Reporting ethics breaches to the Bureau of Labor Statistics\" is *not* one of these outcomes.\n\n### Four types of HR risk\n\n1. **Strategic risk:** talent strategy, culture, ethics, people investments, and change. *Example:* rapid growth erodes the ethical culture.\n2. **Operational risk:** how quickly and well you hire, develop, and keep top performers. *Example:* key roles sit unfilled and projects stall.\n3. **Financial risk:** pay, benefits, turnover, overtime, and costly errors or accidents. *Example:* overtime costs double.\n4. **Compliance risk:** diversity, safety, unions, whistleblowers, and harassment. *Example:* managers were never trained on harassment policy.\n\n### Small organizations\n\nFirms with fewer than 500 workers employ about half the U.S. workforce, yet many have no HR budget or trained managers. Poor HR practices are a leading cause of small-business failure, so HR is an investment, not just a cost.\n\n## 1.13 The role of HRM in executing business strategy\n\n### Business strategy and fit\n\n**Business strategy** is how a company competes. It reflects what customers want, what the company wants, and what it can deliver cost-effectively, and it can differ across business units. The key idea is **fit**: HR must fit the business strategy, and the strategy must fit the competitive environment. Competitive advantage comes from using resources and capabilities, mostly talent, to create superior value.\n\n### Talent philosophy\n\nA **talent philosophy** is a company's system of beliefs about how employees should be treated. It covers the value of diversity, ethics, short-term versus career-long employment, and whether employees are assets or \"investors\" of their time. Founders usually shape it: are employees partners to develop, or replaceable parts? *(On the quiz, \"employee philosophy\" is the tempting wrong answer.)*\n\n*Example:* Goldman Sachs calls its people its greatest asset.\n\n### HR strategy vs. strategic HRM\n\n- **Human resource strategy** links the entire HR function to the business strategy.\n- **Strategic HRM** aligns the company's values and goals with employees' behaviors, values, and goals, and it shapes the strategy of each HR function.\n\n*Connection:* When the functions are aligned this way, they form an **integrated HRM system** guided by the talent philosophy. This is the \"alignment\" idea from 1.11, viewed from the strategy level.\n\n## 1.14 Global issues\n\nHR has to adapt to strategy, local labor markets, and different cultural values around the world.\n\n### Global mindset\n\nA **global mindset** is the set of personal attributes that lets you influence people and organizations from very different social, cultural, and institutional systems. You build it through experience. One expert calls basic business skills \"table stakes\" and cross-cultural influence the real differentiator. HSBC sends new managers on long international assignments to develop it.\n\n### Culture and power distance\n\nCultures differ in what motivates people, how directly they communicate, and how they balance family and work. **Power distance**, the acceptance of hierarchy, is small in the U.S., Sweden, and Germany and large in Japan and Mexico. Managers in high power-distance cultures are less likely to empower employees or enrich jobs.\n\n*Example:* A \"challenge your boss\" program that works in Sweden may flop in a high power-distance country. The lesson is to match HR practices to the local culture.\n\n## 1.15 Gaining a competitive advantage through HRM\n\nMichael Porter says advantage comes from offering superior customer value: either a better product at a premium price or a good product at a lower price. Different advantages need different HR approaches:\n\n- **Operational excellence** (low cost): lean pay and benefits, teamwork, consistent procedures, and tight cost control. *Example:* a budget airline.\n- **Product innovation** (Apple, 3M, Nintendo, pharma): an innovative culture and hires with teamwork, analytical, and creative skills who persist through failure.\n- **Customer intimacy, or customization** (consulting, retail, banking): deep customer knowledge and flexible service. Starbucks charges a premium and invests heavily in hiring active learners with customer skills and emotional resilience.\n- **Growth** (Chipotle, Panera): develop and acquire talent, either organically by opening locations or through **mergers and acquisitions (M&A)**. M&A is a common route to international expansion.\n\n*Why M&A fails:* Most often the problem is **culture clash**, not technical or financial issues. DaimlerChrysler, HP-Compaq, and AOL-Time Warner are the classic examples. Check culture, values, and structure fit before the deal.\n\n*Connection:* Whatever the strategy, retention and engagement sustain it (Southwest Airlines, SAS).\n\n## 1.16 Who is responsible for HRM?\n\nHR is shared across many players, and technology increasingly pushes HR tasks to managers and employees.\n\n- **HR professionals:** strategic partners, not \"police.\" They align the talent philosophy and HR strategy with the business, build managers' HR skills, need business acumen (how the company makes money), and lead **organizational change** such as expansion, restructuring, and downsizing.\n- **Managers:** every supervising manager does HRM daily. HR supplies tools like interview guides and review forms, but those only add value if managers use them well. Mattel made managers partners in managing talent.\n- **Employees:** they increasingly own their own development and keep their skills records current. **Employee handbooks** document HR policies, and good **communication** between HR and employees is essential.\n- **Shared service centers:** in-house hubs that centralize routine transactions like payroll and benefits to cut cost and improve consistency (Home Depot's HR call centers).\n- **Outside vendors:** outsourcing payroll, benefits, or relocation is often smart, especially for small firms, because vendors bring expertise and better pricing.\n- **Professional employer organizations (PEOs):** they lease workers to client firms for about 2-7% of gross wages and become the *legal employer*, handling payroll, benefits, training, and discipline. The client gains flexibility; in a downturn it simply doesn't renew the lease.\n\n## 1.17 Case study: HR transformation at IBM\n\nIBM operates in more than 170 countries. Its HR goal was the right talent, at the right time, in the right place. IBM split HR into **core roles** (policy design, internal consulting) and **administrative roles** (payroll, expenses, records). It centralized admin work in global service centers and automated repeatable processes.\n\n*Why it matters:* Freeing HR from paperwork let it focus on hiring, upskilling, leadership development, and compensation, which is exactly the shift from administrative to strategic HR described in 1.4. IBM also replaced the annual review with flexible goals and frequent feedback, including peer feedback, through Checkpoint, an app employees helped design. That connects to the goals-and-feedback lesson from 1.8.\n\n## 1.18 Ethics in HRM\n\nThe **Society for Human Resource Management (SHRM)**, the largest HR professional association, publishes a code of ethical and professional standards. HR professionals should add value and support ethical success, take responsibility for their decisions, and advocate for the profession. The guidelines include holding high ethical standards, measuring HR's effectiveness, obeying the law, serving with social responsibility, advocating for proper treatment of people, and advocating openly through proper channels.\n\n*Example:* If a leader pressures HR to bury a safety complaint, the code points toward escalating it properly.\n\n## 1.19 Human resource management systems and careers\n\nA **human resource management system (HRMS)** is a technology platform that securely stores employee records (payroll, benefits), tracks recruiting and staffing, and runs analytics. It can be cloud-based (Workday, Cornerstone OnDemand) or built in-house. Choose one based on how you'll actually use it and how easy it is for managers and employees. Modern systems integrate apps and support continuous feedback.\n\n*Careers:* HR jobs were projected to grow faster than average, and hiring, motivating, and retaining people are great-manager skills in any field.\n\n## 1.20 Patagonia's response\n\nPatagonia calls itself \"a cause disguised as a company,\" and its HR practices put that culture into action:\n\n- **Hiring:** interviews start with \"what drew you here?\" to find community-minded people who add to the culture.\n- **Benefits that reinforce the mission:** up to two months of paid environmental volunteering after a year, bail support for peaceful environmental protest, and subsidized on-site childcare. The childcare helps nearly all new mothers return to work.\n- **Results:** about 4% turnover and thousands of applicants for a handful of openings.\n\n*Connection:* This is strategic HRM in action. The talent philosophy, staffing, and rewards all reinforce the business strategy.\n\n## 1.22 Pulling it together\n\n- People, not assets, explain why some firms outperform others. HRM turns potential into performance by shaping what employees **should**, **can**, and **will** do.\n- The six functions must be aligned into one integrated system guided by a talent philosophy. Functions that conflict undermine strategy.\n- How a firm positions itself determines the advantage it needs, and that determines its HR strategy.\n\n## What to be able to explain\n\nThese are WGU's official Chapter 1 Learning Checklist items. You should be able to explain each one in a business context:\n\n- Explain how HRM strategy supports a company's business strategy.\n- Describe the six primary HRM functions and what they do.\n- Explain why HRM is critical to a company’s overall performance.\n- Identify the impact of misaligned HR functions (e.g., when rewards conflict with training).\n\nTo get there, make sure you can also explain:\n\n- Should/can/will do, which functions drive each, and why \"can do\" is the foundation\n- How a reward system can backfire (Wells Fargo)\n- Direct vs. indirect vs. nonfinancial compensation\n- The two ways HRM adds value and the four HR risk types\n- How talent philosophy, HR strategy, and strategic HRM differ\n- Which HR approach fits each competitive strategy, and why M&A often fails\n- Who shares HR responsibility, and PEO vs. shared service center\n","cards":[{"id":"c202-ch01-001","front":"Why does HRM count as a source of competitive advantage?","answer":"Every edge a firm has, from tech to cost to service, is built by people, and HRM shapes who they are and how they work.","subtitle":"Ch 1.2 · Strategic HRM","note":"Read more: 1.2 Introduction","points":["Competitive advantage = doing something differently from rivals that lets you outperform them","Talent matters most in knowledge-based firms, where people ARE the product","Examples: Patagonia, Apple, Zappos, Marriott"]},{"id":"c202-ch01-002","front":"What is human resource management (HRM)?","answer":"The function that attracts, hires, develops, rewards, and retains talent, and handles people issues and compliance.","subtitle":"Ch 1.4 · Strategic HRM","note":"Read more: 1.4 What Is HRM?","points":["Also manages people-related risk and builds the overall talent system","Employee costs are one of the biggest budget items, so this is high stakes","History: first 'personnel' department at National Cash Register in 1901, after a strike"]},{"id":"c202-ch01-003","front":"How do 'should do', 'can do', and 'will do' differ in the HRM performance model?","answer":"Should = direction (planning, law); can = ability (staffing, training); will = motivation (pay, performance mgmt).","subtitle":"Ch 1.4 · Strategic HRM","note":"Read more: 1.4 What Is HRM?","points":["All three feed effective work processes, then competitive advantage, then org performance","Aligning all three maximizes motivation and advantage","Think: Does the employee know what to do? Are they able? Do they want to?"]},{"id":"c202-ch01-004","front":"Why are staffing and training called the foundation of the should/can/will model?","answer":"Incentives can't create ability; if people lack the talent or skills, no pay plan will fix their performance.","subtitle":"Ch 1.4 · Strategic HRM","note":"Read more: 1.4 What Is HRM?","points":["Staffing brings in ability and motivation; training builds skills","Example: a nurse can't run a new machine just because you pay a bonus","Covered more in Ch 5-7"]},{"id":"c202-ch01-005","front":"How can a compensation system backfire on ethics?","answer":"Rewards tied to narrow targets can push people to cut corners to hit them, so HR must foresee unintended effects.","subtitle":"Ch 1.4 · Strategic HRM","note":"Read more: 1.4 What Is HRM?","points":["Wells Fargo (2016): 5,000+ fired for opening fake accounts to hit sales quotas","Subprime mortgage brokers' bonuses rewarded risky loans","Lesson: design 'will do' systems by asking what behavior they might accidentally reward"]},{"id":"c202-ch01-006","front":"What is staffing, and what does it move through the organization?","answer":"Planning, acquiring, deploying, and retaining people; it moves talent into, through, and out of the firm.","subtitle":"Ch 1.6 · Strategic HRM","note":"Read more: 1.6 Staffing","points":["Steps: job requirements, sourcing, recruiting, retaining/moving, separations","Separations (layoffs, quits, terminations) are part of staffing","Its purpose is to help execute the business strategy","Caribou Coffee: careful hiring of store managers drove revenue"]},{"id":"c202-ch01-007","front":"Why is training wasted if performance management and rewards don't line up with it?","answer":"If reviews and pay don't recognize the new skills, people have little reason to use them on the job.","subtitle":"Ch 1.7 · Strategic HRM","note":"Read more: 1.7 Training and Development; 1.11 Employee-Management Relations","points":["HRM is a system of mutually reinforcing functions","Training is also wasted if hires can't succeed or quit before costs are recouped (some retail turnover ~200%)"]},{"id":"c202-ch01-008","front":"What is succession planning, and why does it matter?","answer":"Preparing people ahead of time to fill key roles, so leadership changes don't leave the company adrift.","subtitle":"Ch 1.7 · Strategic HRM","note":"Read more: 1.7 Training and Development","points":["Citigroup started looking only after its CEO left and drifted","Google groomed Sundar Pichai for years: Google CEO 2015, Alphabet CEO 2019","CEO succession is often overlooked"]},{"id":"c202-ch01-009","front":"What is performance management?","answer":"Aligning employee goals and behavior with company strategy, appraising performance, and guiding improvement.","subtitle":"Ch 1.8 · Effective HRM","note":"Read more: 1.8 Performance Management","points":["Depends on staffing (raw talent) and development (fixing gaps)","Often tied to pay, so biased ratings demotivate people"]},{"id":"c202-ch01-010","front":"Why do specific goals and frequent feedback improve performance?","answer":"Goals show people what to aim for; feedback shows how they're doing so they can adjust before it's too late.","subtitle":"Ch 1.8 · Effective HRM","note":"Read more: 1.8 Performance Management","points":["No goals: unclear focus, underperformance, quits (which burdens staffing)","Feedback that feels unfair lowers effort","Performance feedback also maintains ethical behavior and communicates expectations"]},{"id":"c202-ch01-011","front":"What does 'total rewards' include?","answer":"Everything an employee gets for their time and effort: direct pay, benefits, and nonfinancial rewards.","subtitle":"Ch 1.9 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits","points":["Judge job offers on total rewards, not salary alone","In the textbook's pie chart, nonfinancial rewards are roughly half"]},{"id":"c202-ch01-012","front":"How do direct and indirect financial compensation differ?","answer":"Direct is cash-type pay like salary, bonuses, and stock options; indirect is benefits like insurance and PTO.","subtitle":"Ch 1.9 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits","points":["Direct: salary, wages, commissions, bonuses, stock options","Indirect (benefits): health insurance, wellness, paid vacation, free meals, retirement"]},{"id":"c202-ch01-013","front":"What is nonfinancial compensation?","answer":"Intrinsic rewards from the work or its setting, such as feeling successful, valued, or appreciated.","subtitle":"Ch 1.9 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits","points":["Not money and not a benefit, but still a real part of total rewards","Examples: meaningful work, recognition, a supportive team"]},{"id":"c202-ch01-014","front":"How do pay level and staffing influence each other?","answer":"Premium pay lets you recruit top candidates; low pay may force you to hire less-ready people and train more.","subtitle":"Ch 1.9 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits","points":["Incentive pay also depends on accurate performance management","Top pay isn't always needed: does every marketer need an MBA?"]},{"id":"c202-ch01-015","front":"Why can paying well above market still be cost-effective?","answer":"Higher pay can cut turnover and raise productivity, so labor cost per sale stays competitive and service improves.","subtitle":"Ch 1.9 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits","points":["Costco pays well above Sam's Club yet gets similar labor returns","Lower turnover also means lower hiring and training costs"]},{"id":"c202-ch01-016","front":"Why does health and safety pay off for the business, not just ethically?","answer":"Healthier, safer workers are more productive and cut insurance, workers' comp costs, and lost time.","subtitle":"Ch 1.10 · Strategic HRM","note":"Read more: 1.10 Health and Safety","points":["Safety = protection from toxins, accidents, injuries; health = physical AND mental","About half of U.S. worksites offer wellness programs","Provide gear, train on it, hold people accountable; many federal/state laws apply (Ch 12)"]},{"id":"c202-ch01-017","front":"What does employee-management relations cover?","answer":"The relationship and rights between employees and employer, including union bargaining and employee voice.","subtitle":"Ch 1.11 · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations","points":["Tools: participation programs, employee surveys","In union settings, employers must bargain in good faith; contracts set terms","2019 union membership: 33.6% public sector vs 6.2% private"]},{"id":"c202-ch01-018","front":"What does it mean for HR functions to be 'aligned'?","answer":"They all reinforce the same behaviors and never undercut each other, so they work as one integrated system.","subtitle":"Ch 1.11 · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations; 1.13 The Role of HRM in Executing Business Strategy","points":["Example of misalignment: training teamwork but paying only for individual results","SAS: trust-based culture, results-based reviews, and rich benefits all point the same way"]},{"id":"c202-ch01-019","front":"What are the two broad ways HRM adds value to an organization?","answer":"By improving efficiency (getting more from resources) and by contributing to revenue growth.","subtitle":"Ch 1.12 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?","points":["Other effects: clearer responsibilities, better skills use, higher engagement, better change mgmt, less turnover","Also lowers legal liability","Good people practices linked to up to 30% higher firm value (Watson Wyatt)"]},{"id":"c202-ch01-020","front":"How do strategic and operational HR risk differ?","answer":"Strategic risk covers talent strategy, culture, and ethics; operational risk is how well you hire, grow, keep people.","subtitle":"Ch 1.12 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?","points":["Strategic: talent strategy, culture, ethics, people investment, change","Operational: speed and effectiveness of hiring, developing, retaining top performers"]},{"id":"c202-ch01-021","front":"How do financial and compliance HR risk differ?","answer":"Financial risk is about people costs like pay and turnover; compliance risk is legal, like safety and harassment.","subtitle":"Ch 1.12 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?","points":["Financial: pay, benefits, turnover, overtime, time-to-hire, errors, accidents","Compliance: diversity, safety, unions, whistleblowers, harassment","Moody's bond ratings even factor in recruiting, retention, and training"]},{"id":"c202-ch01-022","front":"What is a business strategy?","answer":"How a company chooses to compete, based on what customers want and what it can deliver cost-effectively.","subtitle":"Ch 1.13 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy","points":["Can differ across business units","HRM must fit the strategy, and the strategy must fit the competitive environment"]},{"id":"c202-ch01-023","front":"What is a talent philosophy?","answer":"A company's beliefs about how employees should be treated, e.g., as long-term partners or replaceable inputs.","subtitle":"Ch 1.13 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy","points":["Covers diversity, ethics, short vs career-long tenure, assets vs investors of their time","Usually shaped by founders","Goldman Sachs: people are our greatest asset; diverse staff serves diverse clients"]},{"id":"c202-ch01-024","front":"How do HR strategy and strategic HRM differ?","answer":"HR strategy ties HR to business strategy; strategic HRM aligns employee and company goals within each HR function.","subtitle":"Ch 1.13 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy","points":["Strategic HRM shapes the strategy of each HR function","Aligned functions form an integrated HRM system guided by the talent philosophy"]},{"id":"c202-ch01-025","front":"What is a global mindset, and how do you get one?","answer":"The ability to influence people from very different cultures and systems; it's built through experience.","subtitle":"Ch 1.14 · Strategic HRM","note":"Read more: 1.14 Global Issues","points":["i4cp: cross-cultural influence matters more than basic business skills ('table stakes')","HSBC sends new managers on long international assignments to build it"]},{"id":"c202-ch01-026","front":"How should power distance shape HR practices in another country?","answer":"In high power-distance cultures, empowering employees can clash with norms, so practices should fit local culture.","subtitle":"Ch 1.14 · Strategic HRM","note":"Read more: 1.14 Global Issues","points":["Small power distance: U.S., Sweden, Germany; large: Japan, Mexico","Cultures also differ in motivation, communication style, family vs work emphasis"]},{"id":"c202-ch01-027","front":"How do operational excellence and product innovation strategies need different HRM?","answer":"Operational excellence stresses cost control and consistency; innovation needs creative hires and room to experiment.","subtitle":"Ch 1.15 · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM","points":["Operational excellence: lean pay/benefits, teamwork, standard procedures","Innovation (Apple, 3M, pharma): hire for creativity, analysis, teamwork; reward persistence","Porter: advantage = better product at a premium or good product for less"]},{"id":"c202-ch01-028","front":"What HR approach fits a customer intimacy (customization) strategy?","answer":"Hiring and developing people who learn customers' needs and can flex service, often with heavy HR investment.","subtitle":"Ch 1.15 · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM","points":["Common in consulting, retail, banking","Starbucks: hires active learners with customer skills and emotional resilience"]},{"id":"c202-ch01-029","front":"Why do mergers and acquisitions so often fail?","answer":"The combining firms' cultures, values, or structures clash, more often than any technical or financial issue.","subtitle":"Ch 1.15 · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM","points":["M&A is a common route to growth and international expansion","Failures: DaimlerChrysler, HP-Compaq, AOL-Time Warner","Check culture fit before the deal"]},{"id":"c202-ch01-030","front":"Why is every supervising manager responsible for HRM?","answer":"HR supplies the tools, but managers use them daily; the system only works if managers apply them well.","subtitle":"Ch 1.16 · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?","points":["HR is a support function: interview guides, review forms, etc.","Mattel made managers true partners in managing talent","Employees also own pieces: their own development, records, certifications"]},{"id":"c202-ch01-031","front":"How does a PEO differ from a shared service center?","answer":"A PEO is an outside firm that becomes the legal employer; a shared service center is an in-house hub for routine HR.","subtitle":"Ch 1.16 · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?","points":["PEO: leases workers for ~2-7% of gross wages; handles payroll, benefits, training, discipline","Shared service center: centralizes payroll/benefits transactions (Home Depot HR call centers)","Outsourcing to vendors is a third option, especially for small firms"]},{"id":"c202-ch01-032","front":"Why did IBM separate core HR roles from administrative ones?","answer":"Centralizing routine admin freed HR experts to focus on strategic work like talent, leadership, and upskilling.","subtitle":"Ch 1.17 · Strategic HRM","note":"Read more: 1.17 Case Study: HR Transformation at IBM","points":["Admin (payroll, expenses, records) moved to global service centers","Also replaced annual reviews with frequent feedback via the employee-designed Checkpoint app","Goal: right talent, right time, right place"]},{"id":"c202-ch01-033","front":"What is an HRMS, and how should a firm choose one?","answer":"A tech platform for employee records, recruiting, and analytics; choose based on real intended use and ease of use.","subtitle":"Ch 1.19 · Strategic HRM","note":"Read more: 1.19 Human Resource Management Systems","points":["Cloud (Workday, Cornerstone OnDemand) or in-house","Increasingly integrates apps and supports continuous feedback"]},{"id":"c202-ch01-034","front":"How does Patagonia's HR reinforce its business strategy?","answer":"It hires for mission fit and offers cause-driven benefits, building a loyal workforce with very low turnover.","subtitle":"Ch 1.20 · Strategic HRM","note":"Read more: 1.20 Real World Response: Patagonia; 1.3 Real World Challenge: Patagonia","points":["Paid environmental volunteering, bail for peaceful protest, on-site childcare","Nearly 100% of new mothers return; ~4% turnover; ~9,000 applicants for few openings","Strategy: high-quality, responsibly made gear; 'do well and do good'"]},{"id":"c202-ch01-035","front":"What does SHRM's code ask of HR professionals?","answer":"Act ethically, obey the law, measure HR's impact, and openly advocate for fair treatment of people.","subtitle":"Ch 1.18 · Strategic HRM","note":"Read more: 1.18 Ethics in HRM","points":["SHRM = largest HR professional association","Professional responsibility: add value, own your decisions, advocate for the profession"]},{"id":"c202-ch01-036","type":"scenario","front":"Exit interviews show new hires at a call center quit because nobody told them the job requires rotating weekend shifts. HR rewrites job postings and adds a realistic job preview. Which HR function is this?","choices":["Training and development","Employee-management relations","Staffing","Performance management"],"correct":2,"explanation":"Defining job requirements and recruiting people who will accept and stay in the role is staffing. Fixing the front end of hiring prevents the turnover.","subtitle":"Ch 1.6 Apply · Strategic HRM","note":"Read more: 1.6 Staffing"},{"id":"c202-ch01-037","type":"scenario","front":"A firm's new strategy needs reps to cross-sell. The reps know how and would earn commission for it, but no one told them it's a priority and their job descriptions still say 'take orders.' Which element is missing?","choices":["Can do","Should do","Will do","None, the system is aligned"],"correct":1,"explanation":"They have the ability (can do) and the incentive (will do), but no direction. Planning and job design tell people what they should do.","subtitle":"Ch 1.4 Apply · Strategic HRM","note":"Read more: 1.4 What Is HRM?"},{"id":"c202-ch01-038","type":"scenario","front":"A startup's sales reps don't understand the product. The CEO's fix is a huge commission bonus. What's the flaw?","choices":["Pay can't supply missing ability; this is a staffing or training gap","Bonuses are a form of indirect compensation","The reps should be moved to a PEO","Nothing; motivation is always the issue"],"correct":0,"explanation":"Incentives affect 'will do,' not 'can do.' If people lack knowledge, you need better hiring or training first.","subtitle":"Ch 1.4 Apply · Strategic HRM","note":"Read more: 1.4 What Is HRM?; 1.6 Staffing"},{"id":"c202-ch01-039","type":"scenario","front":"A company pays bonuses only on the number of new accounts opened. Months later an audit finds many accounts were never authorized by customers. What went wrong?","choices":["The reward created an incentive to game the metric","Training didn't cover sales skills","Staffing hired too few reps","The firm lacked an HRMS"],"correct":0,"explanation":"A narrow target rewarded volume regardless of how it was reached. Wells Fargo is the real example. Good 'will do' design anticipates unintended consequences.","subtitle":"Ch 1.4 Apply · Strategic HRM","note":"Read more: 1.4 What Is HRM?"},{"id":"c202-ch01-040","type":"scenario","front":"A hospital trains nurses on a new safety checklist, but annual reviews and raises are based only on patients seen per shift. Nurses skip the checklist. Best diagnosis?","choices":["The nurses lack ability","The training needed more hours","Staffing hired the wrong people","HR functions are misaligned and work against each other"],"correct":3,"explanation":"Training teaches one behavior while performance management and pay reward another. Functions must reinforce the same behaviors.","subtitle":"Ch 1.11 Apply · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations; 1.7 Training and Development"},{"id":"c202-ch01-041","type":"scenario","front":"Offer A: $80K, few benefits. Offer B: $74K plus full health coverage, a 6% retirement match, tuition aid, and flexible hours. How should you compare them?","choices":["Pick A; salary is what counts","Compare total rewards across both offers","Pick whichever has the bigger bonus","Ignore benefits since they aren't compensation"],"correct":1,"explanation":"Total rewards includes direct pay, benefits (indirect), and nonfinancial rewards. B's benefits may be worth far more than $6K.","subtitle":"Ch 1.9 Apply · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits"},{"id":"c202-ch01-042","type":"scenario","front":"Which of these is indirect financial compensation?","choices":["A quarterly sales bonus","Stock options","Public recognition at a team meeting","An employer-paid gym membership"],"correct":3,"explanation":"Indirect financial compensation is benefits like wellness, insurance, and PTO. Bonuses and options are direct; recognition is nonfinancial.","subtitle":"Ch 1.9 Apply · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits"},{"id":"c202-ch01-043","type":"scenario","front":"An employee files a harassment complaint, and HR learns that supervisors were never trained on the anti-harassment policy. Which HR risk is most exposed?","choices":["Compliance risk","Strategic risk","Operational risk","Financial risk"],"correct":0,"explanation":"Harassment, safety, unions, and whistleblowers fall under compliance risk because they involve legal obligations.","subtitle":"Ch 1.12 Apply · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-044","type":"scenario","front":"Overtime spending has doubled and payroll errors are causing costly corrections. Which HR risk category is this?","choices":["Strategic risk","Compliance risk","Financial risk","Operational risk"],"correct":2,"explanation":"Pay, overtime, turnover costs, and costly errors are financial risk: the direct money impact of people practices.","subtitle":"Ch 1.12 Apply · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-045","type":"scenario","front":"A budget airline competes on the lowest fares. Which HR approach fits its strategy best?","choices":["Premium pay to lure star talent","Tight cost control, standard procedures, and teamwork","Hire creative risk-takers and fund experiments","Deep client knowledge and custom service"],"correct":1,"explanation":"Low fares mean an operational excellence strategy: lean costs, consistent procedures, and teamwork on thin margins.","subtitle":"Ch 1.15 Apply · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM"},{"id":"c202-ch01-046","type":"scenario","front":"A biotech wants to beat rivals with breakthrough therapies. Which hiring focus fits?","choices":["Analytical and creative people who persist through failure","The lowest-cost workers available","Staff who follow rigid scripts","Short-term contractors only"],"correct":0,"explanation":"A product innovation strategy needs an innovative culture and people with analytical and creative ability who keep going through setbacks.","subtitle":"Ch 1.15 Apply · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM"},{"id":"c202-ch01-047","type":"scenario","front":"A boutique wealth-management firm wins clients by tailoring advice to each family's situation. Which competitive strategy is this?","choices":["Operational excellence","Growth through acquisition","Product innovation","Customer intimacy (customization)"],"correct":3,"explanation":"Customization depends on knowing customers deeply and flexing service, so HR invests in hiring and developing people with strong client skills.","subtitle":"Ch 1.15 Apply · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM"},{"id":"c202-ch01-048","type":"scenario","front":"A manager ignores the structured interview guide HR provided and hires on gut feel. The hire flops. Who is most directly responsible?","choices":["The manager, because managers carry out HRM day to day","The HR department, since it owns hiring","The recruiting vendor","Nobody; bad hires are random"],"correct":0,"explanation":"HR supplies tools, but they only add value if supervising managers use them. Every manager owns part of HRM.","subtitle":"Ch 1.16 Apply · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?"},{"id":"c202-ch01-049","type":"scenario","front":"A 40-person landscaping company has no HR staff. It wants payroll, benefits, and workers' comp handled, plus the flexibility to shrink its workforce in winter. Best option?","choices":["A professional employer organization (PEO)","A shared service center","Building an in-house HR department","An HRMS by itself"],"correct":0,"explanation":"A PEO becomes the legal employer, handles payroll, benefits, and admin, and lets the client simply not renew leased workers in a downturn.","subtitle":"Ch 1.16 Apply · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?"},{"id":"c202-ch01-050","type":"scenario","front":"A 30,000-employee retailer has every store handling its own payroll and benefits questions, with inconsistent results. They want to keep the work in-house. Best fix?","choices":["Hire a PEO","Let each store manager decide","Outsource all of HR","Create a shared service center"],"correct":3,"explanation":"Shared service centers centralize routine HR transactions in-house, cutting redundancy and cost while improving consistency.","subtitle":"Ch 1.16 Apply · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?"},{"id":"c202-ch01-051","type":"scenario","front":"A VP pressures an HR manager to quietly bury an employee's safety complaint. What do SHRM's ethical standards point toward?","choices":["Comply, since the VP outranks HR","Refuse and raise it through proper channels, protecting legal compliance and fair treatment","Leak it to the media right away","Drop it, since safety isn't an HR issue"],"correct":1,"explanation":"SHRM's code calls for obeying the law, high ethical standards, and openly advocating for proper treatment of people through appropriate forums.","subtitle":"Ch 1.18 Apply · Strategic HRM","note":"Read more: 1.18 Ethics in HRM"},{"id":"c202-ch01-052","type":"scenario","front":"A U.S. firm opens an office in a high power-distance country and launches a 'challenge your boss' empowerment program. Few employees take part. Likely reason?","choices":["Pay is too low","Employees need more technical training","The program clashes with local norms about hierarchy","The office needs an HRMS"],"correct":2,"explanation":"In high power-distance cultures, people expect clear hierarchy, so empowerment programs can feel inappropriate. Fit HR practices to the local culture.","subtitle":"Ch 1.14 Apply · Strategic HRM","note":"Read more: 1.14 Global Issues"},{"id":"c202-ch01-053","type":"scenario","front":"A company is choosing an HRMS. Which factor should matter most?","choices":["Whichever has the most features","Whatever competitors use","The lowest price","How the firm will actually use it and how easy it is for managers and employees"],"correct":3,"explanation":"Pick an HRMS for its real intended use and ease of use. Unused features add cost without adding value.","subtitle":"Ch 1.19 Apply · Strategic HRM","note":"Read more: 1.19 Human Resource Management Systems"},{"id":"c202-ch01-054","type":"scenario","front":"A CEO worries that fast growth has weakened the company's ethics and culture. Which category of HR risk is this?","choices":["Operational","Financial","Strategic","Compliance"],"correct":2,"explanation":"Talent strategy, culture, ethics awareness, and change all fall under strategic risk.","subtitle":"Ch 1.12 Practice · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-055","type":"scenario","front":"For HR functions to support rather than undermine each other, they need to be consistent in...","choices":["How much they cost","What behaviors they reinforce","How they're applied across countries","How long they've been in place"],"correct":1,"explanation":"Alignment means every function, from hiring and training to pay and reviews, pushes toward the same behaviors.","subtitle":"Ch 1.11 Practice · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations"},{"id":"c202-ch01-056","type":"scenario","front":"Small businesses most often report which two areas as their biggest management problems?","choices":["Stress and feedback","Performance management and rewards","Recruitment and training","Compensation and training"],"correct":2,"explanation":"Recruitment and training are top problems, especially for small firms with no HR budget. That's why HR is an investment, not just a cost.","subtitle":"Ch 1.7 Practice · Strategic HRM","note":"Read more: 1.7 Training and Development; 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-057","type":"scenario","front":"A company is restructuring and downsizing. Which group is usually expected to lead the organizational change?","choices":["Front-line supervisors","HR professionals","Executive recruiters","Outside vendors"],"correct":1,"explanation":"HR professionals lead organizational change like expansion, restructuring, and downsizing, using communication, influence, and leadership skills.","subtitle":"Ch 1.16 Practice · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?"},{"id":"c202-ch01-058","type":"scenario","front":"When you boil it down, what is HRM ultimately trying to do for a company?","choices":["Be the main contact for shareholders","Reduce people-related risk and keep strong performers","Make product testing more efficient","Attract and hold investment capital"],"correct":1,"explanation":"HRM manages people risk (legal, financial, strategic) and builds a talent system that keeps great employees. The other options belong to other functions.","subtitle":"Ch 1 Quiz Q1 · Strategic HRM","note":"Read more: 1.4 What Is HRM?"},{"id":"c202-ch01-059","type":"scenario","front":"A CFO asks how HR actually creates value. What's the best answer?","choices":["Leasing employees to cut costs","Hiring only people with advanced degrees","Helping the company carry out its business strategy","Keeping pay as low as possible"],"correct":2,"explanation":"HRM creates value by helping execute business strategy, getting the right people with the right skills and motivation in place.","subtitle":"Ch 1 Quiz Q2 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy; 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-060","type":"scenario","front":"Which sequence best captures HRM's core purpose across the employee life cycle?","choices":["Detain, hire, develop, rework, retain","Attract, hire, develop, reward, retain","Attract, hire, devise, rework, refresh","Detain, hire, devise, reward, refresh"],"correct":1,"explanation":"HRM attracts, hires, develops, rewards, and retains talent. Each verb maps to an HR function.","subtitle":"Ch 1 Quiz Q3 · Strategic HRM","note":"Read more: 1.4 What Is HRM?"},{"id":"c202-ch01-061","type":"scenario","front":"A plant switches to a new assembly process, and workers need new skills to run it. Which HR function steps in?","choices":["Employee-management relations","Staffing","Performance management","Training and development"],"correct":3,"explanation":"Building current employees' skills for new methods is training and development. Staffing would bring in new people instead.","subtitle":"Ch 1 Quiz Q4 · Strategic HRM","note":"Read more: 1.7 Training and Development"},{"id":"c202-ch01-062","type":"scenario","front":"Staffing isn't just filling seats. It exists to help the company carry out its ___ strategy.","choices":["management","executive","business","employee"],"correct":2,"explanation":"Staffing plans, acquires, deploys, and retains talent so the firm can execute its business strategy.","subtitle":"Ch 1 Quiz Q5 · Strategic HRM","note":"Read more: 1.6 Staffing"},{"id":"c202-ch01-063","type":"scenario","front":"Layoffs, resignations, and firings for poor performance fall under which HR function?","choices":["Staffing","Training and development","Employee-management relations","Performance management"],"correct":0,"explanation":"Staffing moves talent into, through, AND out of the organization, so separations are part of it.","subtitle":"Ch 1 Quiz Q6 · Strategic HRM","note":"Read more: 1.6 Staffing"},{"id":"c202-ch01-064","type":"scenario","front":"A company grooms several high-potential managers years in advance so it's ready if the COO leaves. What is this called?","choices":["Strategic planning","Change planning","Succession planning","Performance planning"],"correct":2,"explanation":"Succession planning prepares people to fill key positions and reduces disruption during transitions (think Google and Pichai).","subtitle":"Ch 1 Quiz Q7 · Strategic HRM","note":"Read more: 1.7 Training and Development"},{"id":"c202-ch01-065","type":"scenario","front":"Which HR function makes sure what individual employees aim for lines up with what the organization is trying to achieve?","choices":["Succession planning","Compensation and benefits","Training and development","Performance management"],"correct":3,"explanation":"Performance management aligns employee goal
