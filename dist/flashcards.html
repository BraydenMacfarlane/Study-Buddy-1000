 Before hiring, they meet each finalist to judge communication style and how the person handles conflict. Which fit are they assessing?","choices":["Person-job","Person-organization","Person-strategy","Person-group"],"correct":3,"explanation":"Fit with coworkers and the supervisor is person-group fit, which matters most when work is interdependent.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-125","type":"scenario","front":"Raj wants flexible hours and project variety; the role offers both, plus the pay he needs. Which fit does this describe?","choices":["Person-group: he likes the coworkers","Person-organization: he shares the values","Person-supervisor: he likes the boss","Person-job: his needs match the job's rewards"],"correct":3,"explanation":"Person-job fit includes needs and motivations matching the job's attributes and rewards, not just ability matching demands.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-126","type":"scenario","front":"A firm hires mostly for culture fit. What outcome should it expect P-O fit to improve most?","choices":["Cognitive test scores on future assessments","Speed of learning complex new tasks","Satisfaction, commitment, and intent to stay","Meeting the job's technical requirements"],"correct":2,"explanation":"P-O fit strongly predicts attitudes and retention but has little effect on meeting job requirements, so pair it with person-job assessment.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-127","type":"scenario","front":"A manager says, \"For culture fit, I hire people who went to my college and share my hobbies.\" What's the problem?","choices":["Nothing; shared hobbies are the core of P-O fit","It measures person-job fit, not culture fit","It's fine as long as the questions are structured","That's similarity, not fit, and risks discrimination"],"correct":3,"explanation":"Hiring for fit isn't hiring people you're comfortable with. Fit should be defined by job-related values, or it slides into stereotyping.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-128","type":"scenario","front":"A resort asks housekeeping applicants, \"What does a truly clean room mean to you?\" and screens for warmth before teaching skills. Whose approach is this modeled on, and what fit?","choices":["Zappos, screening for job knowledge first","MITRE, screening for technical skills first","Body Shop, hiring with no screening at all","Hilton, screening for culture fit first"],"correct":3,"explanation":"Hilton screens first for brand and culture fit (hospitality as a calling) and trains skills later.","subtitle":"Ch 6.5 Apply · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-129","type":"scenario","front":"A software company wants to protect its collaborative culture without sacrificing skills. Which process mirrors Zappos?","choices":["Assess values only and skip skills entirely","Assess skills only and let culture sort itself out","Hire everyone and fire whoever doesn't fit","Assess skills first, then values in a second interview"],"correct":3,"explanation":"Zappos uses two steps: job fit (skills, experience), then culture fit (attitudes, values, personality).","subtitle":"Ch 6.22 Apply · Effective HRM","note":"Read more: 6.22 Real World Response: How Zappos Hires the Right People"},{"id":"c202-ch06-130","type":"scenario","front":"A hospital hires a surgeon who later causes several serious errors. Which selection outcome is this?","choices":["False negative","True positive","True negative","False positive"],"correct":3,"explanation":"Hired but unsuccessful is a false positive, the costliest error in high-risk jobs.","subtitle":"Ch 6.4 Apply · Effective HRM","note":"Read more: 6.4 Assessment Goals"},{"id":"c202-ch06-131","type":"scenario","front":"A tech firm rejects a programmer who joins a rival and builds its best-selling product. Which outcome is this?","choices":["False negative","False positive","True negative","True positive"],"correct":0,"explanation":"Rejected but would have succeeded is a false negative, costly when talent strengthens a competitor.","subtitle":"Ch 6.4 Apply · Effective HRM","note":"Read more: 6.4 Assessment Goals"},{"id":"c202-ch06-132","type":"scenario","front":"After a contingent offer, a delivery company runs a drug screen and a driving-record check. Which kind of assessment is this?","choices":["Evaluative","Compensatory","Contingent","Screening"],"correct":2,"explanation":"Checks run after a contingent offer, where passing leads to the final offer, are contingent methods.","subtitle":"Ch 6.7 Apply · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-133","type":"scenario","front":"A recruiter reviews 600 applications to find the 40 who meet minimum requirements. Which kind of method is she using?","choices":["Evaluative","Contingent","Multiple hurdles","Screening"],"correct":3,"explanation":"Screening methods narrow applicants down to candidates against minimum qualifications.","subtitle":"Ch 6.7 Apply · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-134","type":"scenario","front":"The 40 remaining candidates take a job simulation and a structured interview so the firm can decide whom to hire. What kind of methods are these?","choices":["Evaluative","Screening","Contingent","Compensatory"],"correct":0,"explanation":"In-depth tools used to decide whom to hire are evaluative methods.","subtitle":"Ch 6.7 Apply · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-135","type":"scenario","front":"A manager wants every applicant to take a medical exam on day one, before interviews. What's the problem?","choices":["Medical exams can only be given to current employees","Medical exams are allowed only for executive-level roles","Nothing; earlier exams save everyone time","Medical exams must wait until after a contingent offer"],"correct":3,"explanation":"Under the ADA, medical exams come only after a contingent offer and must be given to everyone entering the job.","subtitle":"Ch 6.13 Apply · Legal & Regulatory","note":"Read more: 6.13 Contingent Assessment Methods: Reference Checks and Medical and Drug Tests"},{"id":"c202-ch06-136","type":"scenario","front":"To be hired as firefighters, candidates must first pass a strength test, then a written test, then an interview, failing out at any step. Which approach is this?","choices":["Rank ordering only","Unstructured selection","Multiple hurdles","Compensatory"],"correct":2,"explanation":"Having to pass each assessment to advance is multiple hurdles, used when a minimum level is essential.","subtitle":"Ch 6.16 Apply · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire"},{"id":"c202-ch06-137","type":"scenario","front":"A school lets a teacher candidate's outstanding classroom demo make up for a mediocre written exam. Which approach is this?","choices":["Multiple hurdles","Cut score only","Contingent assessment","Compensatory"],"correct":3,"explanation":"Letting high scores offset low ones is the compensatory approach.","subtitle":"Ch 6.16 Apply · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire"},{"id":"c202-ch06-138","type":"scenario","front":"A pharmacy must ensure every hire can count medications with zero errors, but other skills can trade off. Which design fits best?","choices":["Compensatory scoring for all skills, accuracy included","Rank ordering with no minimum score set","Hiring whoever applies first","A hurdle for accuracy, then compensatory scoring"],"correct":3,"explanation":"Use a hurdle for must-have minimums, then let the remaining scores compensate for one another.","subtitle":"Ch 6.16 Apply · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire"},{"id":"c202-ch06-139","type":"scenario","front":"HR ranks 12 finalists by total score. The top three all fall below the minimum acceptable score. What should HR do?","choices":["Average the top three into a single hire","Lower the job's requirements to fit them","Offer only to candidates above the cut score","Offer to the top three because they ranked first"],"correct":2,"explanation":"Rank ordering doesn't guarantee minimum standards. Best practice is the highest-ranked candidates who are above the cut score.","subtitle":"Ch 6.16 Apply · Effective HRM","note":"Read more: 6.16 Choosing Whom to Hire"},{"id":"c202-ch06-140","type":"scenario","front":"A low-cost retailer needs to fill 200 seasonal jobs within two weeks. How should its cut score compare to a firm that hires 'only the best'?","choices":["Identical, since cut scores never vary","No cut score at all, just rank ordering","Lower, to fit urgency and target pay","Higher, to make up for the rushed timeline"],"correct":2,"explanation":"Cut scores reflect strategy: urgent fills and cost leadership use lower cut scores; 'hire only the best' uses higher ones.","subtitle":"Ch 6.16 Apply · Strategic HRM","note":"Read more: 6.16 Choosing Whom to Hire"},{"id":"c202-ch06-141","type":"scenario","front":"A firm wants the single best predictor of performance for complex analyst roles at moderate cost. Which choice does Table 6.3 support?","choices":["A personality test used by itself","A structured interview or cognitive test","An unstructured interview by the CEO","Reference checks from former employers"],"correct":1,"explanation":"Structured interviews (0.51-0.63) and cognitive tests (0.51) top the table; unstructured interviews and references are among the weakest.","subtitle":"Ch 6.7 Apply · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-142","type":"scenario","front":"A city uses only a cognitive ability test to hire, and pass rates differ sharply by race. What's the best fix?","choices":["Combine it with other valid assessments","Drop all testing and interview on gut feel","Keep it as the only tool; it's highly valid","Raise the cut score to screen out more people"],"correct":0,"explanation":"Cognitive tests predict well but tend to cause disparate impact. Combining them with other tools reduces adverse impact while keeping prediction.","subtitle":"Ch 6.9 Apply · Legal & Regulatory","note":"Read more: 6.9 Evaluative Assessment Methods: Cognitive and Noncognitive Ability Tests"},{"id":"c202-ch06-143","type":"scenario","front":"A jewelry store wants a cheap test that predicts theft, adds to its cognitive test, and has little adverse impact. Which fits?","choices":["An integrity test","A psychomotor test","An unstructured interview","A credit check"],"correct":0,"explanation":"Integrity tests are inexpensive, predict theft and counterproductive behavior, have low adverse impact, and are unrelated to cognitive ability.","subtitle":"Ch 6.10 Apply · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests"},{"id":"c202-ch06-144","type":"scenario","front":"A company wants one personality trait that predicts performance across all its very different jobs. Which should it measure?","choices":["Conscientiousness","Extraversion","Openness to experience","Agreeableness"],"correct":0,"explanation":"Conscientiousness predicts performance in all occupations; the others predict only specific jobs.","subtitle":"Ch 6.10 Apply · Effective HRM","note":"Read more: 6.10 Evaluative Assessment Methods: Personality and Values Assessments and Integrity Tests"},{"id":"c202-ch06-145","type":"scenario","front":"A 911 center has applicants handle recorded mock emergency calls while being scored. What method is this?","choices":["Reference check","Simulation","Situational interview","Case interview"],"correct":1,"explanation":"Giving real tasks or recreating critical job events is a simulation, a type of work sample (validity 0.54).","subtitle":"Ch 6.12 Apply · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)"},{"id":"c202-ch06-146","type":"scenario","front":"Six management candidates spend two days handling an in-basket, leading a group discussion, and presenting, while trained raters rotate observing. What is this?","choices":["A multiple-hurdle test","An assessment center","A case interview","A structured interview"],"correct":1,"explanation":"A battery of exercises scored by multiple trained assessors is an assessment center.","subtitle":"Ch 6.12 Apply · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)"},{"id":"c202-ch06-147","type":"scenario","front":"A firm's Table 6.3 copy lists job knowledge test validity as .048, and a manager concludes the tests are useless. What's the right response?","choices":["It means they predict only 48% of hires","It's 4.8, the highest value in the table","It's a typo for 0.48, a good predictor","Correct; .048 means the tests don't predict"],"correct":2,"explanation":"Erratum: the book prints '.048', but the validity is 0.48. Job knowledge tests predict well, especially for complex jobs.","subtitle":"Ch 6.11 Apply · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-148","type":"scenario","front":"A bathroom scale shows 150, 162, and 141 lb for the same person within one minute. What's wrong, and can it be valid?","choices":["It's valid as long as the average is right","It's reliable because it gives numbers","It's unreliable, so it can't be valid","It's reliable but simply not valid"],"correct":2,"explanation":"Wildly inconsistent results mean low reliability, and an unreliable measure cannot be valid.","subtitle":"Ch 6.25 Apply · Effective HRM","note":"Read more: 6.25 Appendix: Reliability and Validity"},{"id":"c202-ch06-149","type":"scenario","front":"A test gives very consistent scores but doesn't predict who succeeds on the job. How would you describe it?","choices":["Valid but not reliable","Both reliable and valid","Neither, by definition","Reliable but not valid"],"correct":3,"explanation":"Consistency (reliability) is necessary but not sufficient; prediction for the purpose is validity. Height is reliable but not valid.","subtitle":"Ch 6.25 Apply · Effective HRM","note":"Read more: 6.25 Appendix: Reliability and Validity"},{"id":"c202-ch06-150","type":"scenario","front":"A background check turns up a negative credit item that will cost Tanya the offer. What must the employer give her?","choices":["A copy of other applicants' reports","An automatic second interview","An adverse action notice and the right to dispute","Nothing; credit results are confidential"],"correct":2,"explanation":"Under the FCRA process, she gets the report, the screener's contact information, and fair time to dispute errors.","subtitle":"Ch 6.14 Apply · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks"},{"id":"c202-ch06-151","type":"scenario","front":"A state contractor's application asks, \"Have you ever been convicted of a crime?\" before anyone is screened. Which kind of law targets this practice?","choices":["The FCRA","UGESP","The ADA","Ban the box"],"correct":3,"explanation":"Ban-the-box laws delay criminal-history questions until after initial qualification (federal: after a conditional offer).","subtitle":"Ch 6.14 Apply · Legal & Regulatory","note":"Read more: 6.14 Contingent Assessment Methods: Background Checks"},{"id":"c202-ch06-152","type":"scenario","front":"A startup can't match a bank's salary, so it highlights equity, remote work, and fast skill growth. What is it maximizing?","choices":["The cut score","The compensatory approach","The employee value proposition","Distributive fairness"],"correct":2,"explanation":"The employee value proposition is the full mix of intrinsic and extrinsic rewards, not just salary.","subtitle":"Ch 6.17 Apply · Effective HRM","note":"Read more: 6.17 Making the Job Offer"},{"id":"c202-ch06-153","type":"scenario","front":"A manager wants to offer a new hire $15K more than three current team members doing the same job. Which offer factor is at risk?","choices":["EEO goals, a legal factor","Internal equity, an organizational factor","Labor market tightness, an external factor","Competing offers, a finalist factor"],"correct":1,"explanation":"Internal equity is an organizational factor; above-market new-hire pay can backfire when incumbents demand matching.","subtitle":"Ch 6.17 Apply · Effective HRM","note":"Read more: 6.17 Making the Job Offer"},{"id":"c202-ch06-154","type":"scenario","front":"Kim's other offer pays $72K. Her preferred employer stops at $68K with no other perks. Using BATNA logic, what should she do?","choices":["Ignore the other offer when deciding","Take the $72K offer, since it beats this one","Accept $68K because negotiating looks bad","Keep negotiating forever until they say yes"],"correct":1,"explanation":"Your BATNA is your best alternative; decline offers worse than it (assuming pay is what matters most to her).","subtitle":"Ch 6.19 Apply · Effective HRM","note":"Read more: 6.19 Negotiating Employment Contracts"},{"id":"c202-ch06-155","type":"scenario","front":"An employer offers Ben $80K; he replies, \"I accept at $85K.\" What is the legal status?","choices":["A binding acceptance at $80K","Consideration, which closes the deal","A counteroffer, not an acceptance","A binding acceptance at $85K"],"correct":2,"explanation":"Acceptance must match the offer exactly; adding terms makes it a counteroffer.","subtitle":"Ch 6.20 Apply · Legal & Regulatory","note":"Read more: 6.20 The Employment Contract"},{"id":"c202-ch06-156","type":"scenario","front":"A small bakery owner tells a new baker, \"You'll work mornings and get $18 an hour,\" with nothing written. What kind of contract is this?","choices":["A written contract under the FCRA","A counteroffer awaiting acceptance","An implicit contract, the norm for most jobs","An invalid arrangement with no legal effect"],"correct":2,"explanation":"Most jobs run on an implicit employment contract, an understanding not formalized in a written contract.","subtitle":"Ch 6.20 Apply · Effective HRM","note":"Read more: 6.20 The Employment Contract"},{"id":"c202-ch06-157","type":"scenario","front":"A $60K-midpoint job's range is $48K-$72K. Using the book's own example as the model, how is the range described?","choices":["Fixed with no flexibility","About ±20% of the midpoint","About ±5% of the midpoint","About ±50% of the midpoint"],"correct":1,"explanation":"The book's example ($40K-$60K on $50K) is ±20%; this range follows the same pattern. Note the book's text says 10-20%, which its example contradicts.","subtitle":"Ch 6.19 Apply · Effective HRM","note":"Read more: 6.19 Negotiating Employment Contracts"},{"id":"c202-ch06-158","type":"scenario","front":"Most hiring assessment focuses primarily on which kind of fit?","choices":["Person-organization fit","Person-group fit","Person-job fit","Person-attitude fit"],"correct":2,"explanation":"Person-job fit is the primary focus because it drives performance.","subtitle":"Ch 6.5 Practice · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-159","type":"scenario","front":"When employees' work is highly interdependent, which fit becomes most important?","choices":["Person-group fit","Person-job fit","Person-attitude fit","Person-organization fit"],"correct":0,"explanation":"Person-group fit matters most in interdependent work such as teams.","subtitle":"Ch 6.5 Practice · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-160","type":"scenario","front":"Per the text's wording, which fit influences satisfaction, performance, commitment, and retention?","choices":["Person-job fit","Person-group fit","Person-attitude fit","Person-organization fit"],"correct":3,"explanation":"Likely per text: person-organization fit. Moderate confidence: the same section says P-O fit has little effect on meeting job requirements, so 'performance' is loose wording. Its strong links are satisfaction, commitment, and intent to stay.","subtitle":"Ch 6.5 Practice · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-161","type":"scenario","front":"A candidate who passes a background check, drug screen, and medical exam receives a formal offer. Those checks are which kind of assessment?","choices":["Evaluative","Contingent","Screening","Strategic"],"correct":1,"explanation":"Contingent methods follow a contingent offer; passing leads to the formal offer.","subtitle":"Ch 6.7 Practice · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-162","type":"scenario","front":"Which methods narrow the applicant pool down to candidates?","choices":["Contingent","Screening","Strategic","Evaluative"],"correct":1,"explanation":"Screening methods check minimum qualifications to turn applicants into candidates.","subtitle":"Ch 6.7 Practice · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-163","type":"scenario","front":"Which methods are used to decide whom to hire from among candidates?","choices":["Evaluative","Screening","Strategic","Contingent"],"correct":0,"explanation":"Evaluative methods assess candidates in depth to choose hires.","subtitle":"Ch 6.7 Practice · Effective HRM","note":"Read more: 6.7 Assessment Methods"},{"id":"c202-ch06-164","type":"scenario","front":"Which interview is inconsistent across candidates and makes answers hard to compare?","choices":["Structured","Behavioral","Situational","Unstructured"],"correct":3,"explanation":"Unstructured interviews vary questions and lack answer standards.","subtitle":"Ch 6.11 Practice · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-165","type":"scenario","front":"Which interview type assumes that past actions predict future behavior?","choices":["Behavioral","Unstructured","Situational","Structured"],"correct":0,"explanation":"Behavioral interviews ask about real past situations, actions, and results.","subtitle":"Ch 6.11 Practice · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-166","type":"scenario","front":"\"How would you handle a conflict with a customer?\" is an example of which interview type?","choices":["Situational","Case","Behavioral","Unstructured"],"correct":0,"explanation":"A hypothetical 'how would you' question is situational.","subtitle":"Ch 6.11 Practice · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-167","type":"scenario","front":"Which interview uses the same questions for everyone and a scoring system?","choices":["Structured","Unstructured","Behavioral","Case"],"correct":0,"explanation":"Same questions plus formal scoring define a structured interview.","subtitle":"Ch 6.11 Practice · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-168","type":"scenario","front":"Which kind of work sample gives applicants real tasks or recreates critical job events?","choices":["Simulations","Situational interviews","Case interviews","Behavioral interviews"],"correct":0,"explanation":"Simulations present real tasks or critical events.","subtitle":"Ch 6.12 Practice · Effective HRM","note":"Read more: 6.12 Evaluative Assessment Methods: Work Samples and Interviews (Work Samples & Assessment Centers)"},{"id":"c202-ch06-169","type":"scenario","front":"Fairness of hiring outcomes is called...","choices":["Procedural fairness","Distributive fairness","Interactional fairness","Perceived fairness"],"correct":1,"explanation":"Distributive fairness concerns outcomes.","subtitle":"Ch 6.18 Practice · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-170","type":"scenario","front":"Fairness of hiring policies and procedures is called...","choices":["Distributive fairness","Perceived fairness","Interactional fairness","Procedural fairness"],"correct":3,"explanation":"Procedural fairness concerns the process.","subtitle":"Ch 6.18 Practice · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-171","type":"scenario","front":"Rude or unprepared interviewers damage which kind of fairness?","choices":["Interactional","Distributive","Procedural","Perceived"],"correct":0,"explanation":"Interactional fairness concerns respectful interpersonal treatment.","subtitle":"Ch 6.18 Practice · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-172","type":"scenario","front":"Sometimes ___ a poor fit is worth more than ___ good performers.","choices":["Hiring; hiring","Not hiring; not hiring","Hiring; not hiring","Not hiring; hiring"],"correct":3,"explanation":"Likely per text: not hiring a poor fit can be worth more than hiring good performers, because one bad hire can do great damage.","subtitle":"Ch 6 Quiz Q1 · Effective HRM","note":"Read more: 6.4 Assessment Goals"},{"id":"c202-ch06-173","type":"scenario","front":"Fit between a person's desires and motivations and a job's attributes and rewards is...","choices":["Person-organization fit","Person-job fit","Person-group fit","Person-attitude fit"],"correct":1,"explanation":"Likely per text: person-job fit covers both abilities vs. demands and needs vs. rewards.","subtitle":"Ch 6 Quiz Q2 · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-174","type":"scenario","front":"The match between a person and their workgroup and supervisor is...","choices":["Person-group fit","Person-job fit","Person-attitude fit","Person-organization fit"],"correct":0,"explanation":"Likely per text: person-group fit includes coworkers and the supervisor.","subtitle":"Ch 6 Quiz Q3 · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-175","type":"scenario","front":"The match between a person's values, attitudes, and personality and an organization's values, norms, and culture is...","choices":["Person-organization fit","Person-group fit","Person-attitude fit","Person-job fit"],"correct":0,"explanation":"Likely per text: that's the definition of P-O fit.","subtitle":"Ch 6 Quiz Q4 · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-176","type":"scenario","front":"Which fit is based partly on a person's motivations matching the job's rewards?","choices":["Person-organization fit","Person-group fit","Person-job fit","Person-attitude fit"],"correct":2,"explanation":"Likely per text: person-job fit includes needs and motivations vs. job rewards.","subtitle":"Ch 6 Quiz Q5 · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-177","type":"scenario","front":"Which type of fit includes the relationship with one's supervisor?","choices":["Person-job fit","Person-group fit","Person-organization fit","Person-attitude fit"],"correct":1,"explanation":"Likely per text: person-group fit covers the workgroup and supervisor.","subtitle":"Ch 6 Quiz Q6 · Effective HRM","note":"Read more: 6.5 Fit"},{"id":"c202-ch06-178","type":"scenario","front":"Which interview asks candidates different questions with no standard for evaluating answers?","choices":["Structured","Behavioral","Unstructured","Situational"],"correct":2,"explanation":"Likely per text: unstructured interviews vary questions and lack answer standards.","subtitle":"Ch 6 Quiz Q7 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-179","type":"scenario","front":"Which interview uses consistent, job-related questions with predetermined scoring keys?","choices":["Structured","Unstructured","Situational","Behavioral"],"correct":0,"explanation":"Likely per text: structured interviews use the same job-based questions and formal scoring.","subtitle":"Ch 6 Quiz Q8 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-180","type":"scenario","front":"Which interview type is not recommended because of its expense and legal risk?","choices":["Unstructured","Situational","Behavioral","Structured"],"correct":0,"explanation":"Likely per text: unstructured interviews are costly, legally risky, and weak predictors.","subtitle":"Ch 6 Quiz Q9 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-181","type":"scenario","front":"Which interview presents a hypothetical scenario and asks how the candidate would react?","choices":["Behavioral","Situational","Unstructured","Structured"],"correct":1,"explanation":"Likely per text: hypotheticals define situational interviews.","subtitle":"Ch 6 Quiz Q10 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-182","type":"scenario","front":"Well-developed ___ interviews are good predictors of job performance.","choices":["Unstructured","Situational","Structured","Behavioral"],"correct":2,"explanation":"Likely per text: structured. Moderate confidence: situational and behavioral interviews are both types of structured interview and also predict well, but the text's general statement is about structured interviews.","subtitle":"Ch 6 Quiz Q11 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-183","type":"scenario","front":"\"Tell me about a time you had to write up an employee\" is from which interview type?","choices":["Situational","Behavioral","Unstructured","Case"],"correct":1,"explanation":"Likely per text: 'tell me about a time' asks about past behavior, so behavioral.","subtitle":"Ch 6 Quiz Q12 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-184","type":"scenario","front":"In which interview does the candidate get a business problem and present a solution?","choices":["Case","Simulation","Situational","Work sample"],"correct":0,"explanation":"Likely per text: that's a case interview.","subtitle":"Ch 6 Quiz Q13 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-185","type":"scenario","front":"Which interview assesses business knowledge, reasoning, and presentation skills and is common in consulting and banking?","choices":["Situational","Case","Simulation","Work sample"],"correct":1,"explanation":"Likely per text: case interviews.","subtitle":"Ch 6 Quiz Q14 · Effective HRM","note":"Read more: 6.11 Evaluative Assessment Methods: Job Knowledge Tests and Interviews"},{"id":"c202-ch06-186","type":"scenario","front":"Perceived respect and quality of interpersonal treatment is which type of fairness?","choices":["Interactional","Procedural","Distributive","Perceived"],"correct":0,"explanation":"Likely per text: interactional fairness.","subtitle":"Ch 6 Quiz Q15 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-187","type":"scenario","front":"Judy thinks the manager had a favorite all along, and she never got a chance to show her skills. Which fairness is in question?","choices":["Distributive","Procedural","Perceived","Interactional"],"correct":1,"explanation":"Likely per text: a biased process with no chance to demonstrate abilities is procedural unfairness.","subtitle":"Ch 6 Quiz Q16 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-188","type":"scenario","front":"Rude interviewers, last-minute cancellations, and an unhelpful negotiator signal low ___ fairness.","choices":["Distributive","Procedural","Interactional","Perceived"],"correct":2,"explanation":"Likely per text: interactional fairness.","subtitle":"Ch 6 Quiz Q17 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"},{"id":"c202-ch06-189","type":"scenario","front":"Because most applicants don't get the job, ___ fairness is often low.","choices":["Procedural","Distributive","Interactional","Perceived"],"correct":1,"explanation":"Likely per text: distributive (outcome) fairness.","subtitle":"Ch 6 Quiz Q18 · Effective HRM","note":"Read more: 6.18 Fairness Perceptions"}]},{"id":"c202-ch07","folder":"C202 Ch 7: Training and Development","course":"C202","order":7,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 7 Study Guide: Training and Development\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter belongs to **Effective Human Resource Management**: *evaluating strategies, policies, and procedures for effective HRM within an organization*. Effective HRM is the heaviest area on the Objective Assessment (OA), about **52%**, covering Chapters 4-8, 12, and 13. WGU's checklist for this chapter has four items: the steps to build a training program, training methods, why learning style matters, and Kirkpatrick's four levels.\n\nWGU's study guide uses the fictional new hire Antonio to show the OA's style: put the five steps in order, name the training method in a short scenario, and label an evaluation result as Reaction, Learning, Behavior, or Results. The deck's Apply cards test the same skills with new situations. A few ideas touch other competencies: reinforcement (**Motivational Concepts**) and Sarbanes-Oxley and the Federal Sentencing Guidelines (**Legal and Regulatory**).\n\nChapter 7 is part of **Quarter 2** (Chapters 5-8). WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n---\n\n## 7.1-7.4 Training vs. development, and why both matter\n\n- **Training** covers formal or informal activities that improve competencies for an employee's **current** job.\n- **Development** builds competencies needed in the **future**.\n\nU.S. organizations with 100 or more employees spend more than $50 billion a year on training and development, and over 90% of organizations rank building future capabilities as a top-10 priority. Vanguard fills about 80% of front-line leader roles internally through a nine-week Launch to Leadership program. The **Association for Talent Development (ATD)** is the world's largest professional association for the field. Like staffing, training shapes what employees **can** do.\n\nTraining supports strategy: new and promoted employees learn expectations and processes, managers learn to coach and give feedback, and everyone learns their role in the strategy. Company-specific knowledge is hard for competitors to copy, so it supports sustainable competitive advantage. Some jobs, like firefighting or power-line maintenance, depend almost entirely on company training for safety.\n\n*Opening case:* McDonald's competes on low cost, but it still depends on consistent quality, service, cleanliness, and value. The challenge was how to make its management training as effective as possible.\n\n## 7.5 The five steps to effective training\n\nThis is the first checklist item. The order matters, and the cycle repeats:\n\n1. **Conduct a needs assessment**\n2. **Develop learning objectives**\n3. **Design the training program**\n4. **Implement the training**\n5. **Evaluate the training**, which feeds the next needs assessment\n\n*Memory hook:* Need, Objective, Design, Implement, Evaluate. You can't write objectives before you know the need, you can't design before you know the objectives, and you can't evaluate before anything has run. The quiz asks what comes right after objectives (**design**), and which phase uses objectives and learners' sensory preferences (**design**).\n\n## 7.6 Step 1: Needs assessment\n\nA **needs assessment** is the first step. It identifies what training must accomplish, and its main output is the training's objectives and ultimate goals. It works at three levels:\n\n- **Organizational analysis:** where are the improvement opportunities across the company (strategy, new laws, technology change, restructuring)? Sources include strategic plans, employee and customer surveys, and efficiency measures.\n- **Task analysis:** which jobs, competencies, and behaviors should training target? Sources include job analysis, observation, and quality-control data.\n- **Person analysis:** which individuals need what training? Sources include performance appraisals, skill inventories, and individual assessments.\n\n*Example:* ADP interviewed its top service associates and analyzed client calls, then built a shorter blended program with peer mentors and gamification. Calls got shorter and satisfaction rose.\n\n**Training isn't always the answer.** If the problem is an aging machine, poor resources, the wrong hires, or misaligned pay, fix that instead. Prioritize legally required and strategy-critical training first.\n\n## 7.7 Step 2: Learning objectives\n\n**Learning objectives** describe the desired learning outcomes. They come from the needs assessment, guide content and delivery methods, and are what evaluation later checks against. There are three types:\n\n- **Cognitive:** increase knowledge (accounting rules)\n- **Affective:** change attitudes or appreciation (diversity and inclusion training)\n- **Psychomotor:** build physical skill (driving, a machine procedure)\n\nEach type has a ladder from simple to complex:\n\n- **Cognitive (Bloom's taxonomy):** Remembering, Understanding, Applying, Analyzing, Evaluating, Creating. *Note:* this six-verb version is the **revised** Bloom's taxonomy (Anderson and Krathwohl, 2001); the book just calls it \"Bloom's.\" The 1956 original used nouns (Knowledge, Comprehension, Application, Analysis, Synthesis, Evaluation), with Evaluation at the top.\n- **Affective (Krathwohl and Bloom):** Receiving, Responding, Valuing, Organization, Characterization (acting consistently on the new value).\n- **Psychomotor:** Observing, Imitating, Practicing, Adapting, Originating.\n\n## 7.8-7.9 Step 3: Design, and the training methods\n\nDesign means choosing the developer, content, methods, materials, setting, and instructors. This is the second checklist item, and the guide's activity asks you to name the method in a scenario:\n\n- **Classroom training:** a face-to-face trainer with a group or individual, as in a workshop, lecture, or corporate university. *Cue:* an instructor-led session in a room.\n- **On-the-job training (OJT):** learning while doing the real work through instructions, observation, imitation, and practice, with a supervisor or coworker answering questions and giving feedback. **Structured** OJT is formal, like an apprenticeship. **Unstructured** OJT is casual and inconsistent, and it happens even without a program. *Cue:* real tasks with someone showing you.\n- **Virtual training:** online tools such as webinars, eLearning, VR, and apps. BNSF Railway used a 3-D avatar brake-inspection simulation, and injuries fell 17%. *Cue:* logging in, or employees spread across locations.\n- **Experiential training:** learning by experience through **role plays**, action learning, solving real problems, or adventure learning like ropes courses. *Cue:* acting out a situation, such as police cadets role-playing an arrest.\n- **Training games:** game-based learning. Cold Stone Creamery's video game taught correct scoop sizes. Game users gained 11% in factual knowledge and 14% in skills. *Cue:* points, levels, or competition.\n- **Simulations:** low-risk hands-on practice of realistic situations.\n\n*Telling OJT from experiential:* OJT uses the **real job** with real tasks. Experiential uses **structured experiences** like role plays that recreate the job. *Telling games from simulations:* games add scoring, points, or competition.\n\n**Lifelong learning** is a formal commitment to keep employees' skills current, through in-house courses and tuition reimbursement.\n\n## 7.9 Learning style: what the book says, and what research says\n\nThis is the third checklist item, so know it two ways.\n\n**The book's position.** A **learning style** is how a person's information processing differs during learning and problem solving. **Aptitude-treatment interaction** says training effectiveness depends on learners' abilities, personality, and other traits, so outcomes improve when methods match the learner. A **sensory modality** is the sense someone prefers to learn through:\n\n- **Visual:** seeing (diagrams, demonstrations)\n- **Auditory:** hearing (lectures, podcasts)\n- **Tactile:** touching\n- **Kinesthetic:** doing (hands-on practice)\n\nTowler and Dipboye describe five learning preferences: discovery, experiential, observational, structured, and group learning. **Adaptive learning** uses software and AI to adjust material and pace to each learner. Farmers Insurance delivers content in many formats: face-to-face, print, video, audio, and coaching.\n\n**The research caution.** Studies generally **don't support** the \"meshing\" idea that matching instruction to someone's preferred style improves learning. People do have preferences, but teaching to them doesn't reliably help. What holds up: use **multiple modalities**, match the method to the **content** (a physical skill needs hands-on practice whatever your preference), and account for real learner differences like prior knowledge, ability, and motivation.\n\n**For the OA, answer per the text.** A model answer to the guide's question: *Learning style matters because training that matches how a person best takes in information, such as visual examples and hands-on practice, keeps them engaged and helps them learn and transfer the skills.* A more defensible version you can also give: *Considering learners' preferences and offering several formats boosts engagement, but the method should fit the skill being taught.*\n## 7.10 Step 4: Implement\n\nImplementation means scheduling sessions, inviting participants, booking instructors, preparing materials, and delivering the training. Two practices the quiz singles out: **avoid information overload** and **allow time for practice**. Split long sessions into shorter ones, check progress before people leave, and give supervisors materials to support transfer back on the job. Aetna's short mobile \"learning bites\" raised satisfaction by 30%. The chapter's sample learning bite on email covers informative subject lines, no all caps, care with reply-all, and never sending sensitive data.\n\n## 7.11-7.12 Step 5: Evaluate, Kirkpatrick, and ROI\n\n**Training evaluation** systematically collects information to decide whether to adopt, improve, or continue a program. Many firms skip it, but without it you can't know whether to improve or continue the training. Pre- and post-tests, surveys after each segment, and follow-ups at 60 or 90 days are common. Results feed the next needs assessment.\n\n**Kirkpatrick's four levels** are the fourth checklist item:\n\n1. **Reaction:** how participants **felt** about the training (satisfaction, engagement). Measured by feedback forms and surveys. Fast, easy, and cheap. *Example:* a trainee rates how engaging a session was.\n2. **Learning:** the change in **knowledge, skills, or attitudes**. Measured by pre- and post-tests, observation, and simulations. *Example:* a high score on a post-training test. Dunkin' trainees must bake 140 dozen donuts in eight hours.\n3. **Behavior:** whether people **use the learning on the job**, also called transfer. Measured by observation over time; supervisor support makes it easier. *Example:* a rep starts using the new software correctly at work. Verizon tracked new hires' metrics at 30, 60, and 90 days.\n4. **Results:** the **business impact** (sales, quality, safety, turnover, ROI). It's the hardest to isolate. *Example:* the hospital's patient satisfaction rises 22%, matching the training's objectives.\n\nEach level feeds the next: no enjoyment means less learning, no learning means no behavior change, and no behavior change means no results. **Cost and difficulty rise with each level.** Measure against the original goals (for a retailer, sales and conversion rates, not training hours). *Quick labeling:* survey = Reaction; test = Learning; doing it on the job = Behavior; company numbers = Results.\n\n**Return on investment:** ROI% = (benefits minus costs) divided by costs, times 100. *Example:* a $40,000 safety program yields $200,000 in first-year benefits. (200,000 minus 40,000) divided by 40,000 = 4, so ROI is **400%**. *What that means:* a **$4 net gain for every $1 invested**, or $5 back in total. The book's phrasing (\"a return of 400 percent, or $4\") is easy to misread. A positive ROI suggests continuing the program; a negative one suggests changing or dropping it, unless it has unmeasured benefits like morale or trust.\n\n## 7.13 Informal learning and gamification\n\n**Informal learning** happens without a formal curriculum or trainer: learning from experience or from a coworker's help. It's the most common kind of learning and rarely evaluated. **Training gamification** applies game design to training: points, leaderboards, levels, and simulations. McDonald's ordering-system game drew 145,000 visits in its first year; Western Union and Heineken award points and prizes.\n\n## 7.14 Reinforcing training and transfer\n\n**Training transfer** is applying what was learned back on the job, and it's the biggest challenge. **Closed skills (near transfer)** are applied exactly as taught, like a phone-sales script. **Open skills (far transfer)** are principles applied flexibly, like leadership. The best predictors of transfer are cognitive ability, conscientiousness, voluntary participation, and a **supportive transfer climate**. A supervisor who says \"forget that, do it the old way\" kills transfer. **Self-management strategies** help trainees control their own motivation and set goals to use their new skills.\n\n**Reinforcers** make a behavior more likely to recur; they work best when immediate, sincere, and specific:\n\n- **Positive reinforcement:** add something good (praise or a bonus for using the new skill)\n- **Negative reinforcement:** remove something unpleasant to **increase** a behavior (no repeat training while performance stays high). It is not punishment.\n- **Punishment:** add a negative outcome to **decrease** a behavior\n- **Extinction:** remove all reinforcement to decrease a behavior (stop laughing at a coworker who mocks the training)\n\n## 7.15 Ethics, global leadership, and diversity training\n\n**Ethics training** prepares people for likely dilemmas; a code alone isn't enough (Enron had a 64-page code). The **Sarbanes-Oxley Act (2002)** strengthened accountability and whistleblower protections at SEC-registered companies, and the **Federal Sentencing Guidelines** urge employers to run effective ethics and compliance programs that train all employees, including executives.\n\n**Global leadership training** builds cross-cultural skills: understanding your own cultural preferences and those of others, and managing multicultural teams. People high in openness benefit most.\n\n**Diversity training** fails when it's driven only by legal pressure, is off-the-shelf, seems irrelevant to the job, or lacks on-the-job support. It succeeds with enthusiastic leader support, links to the mission, mandatory attendance for managers, long-term evaluation, and an inclusive framing such as \"Inclusive Leadership.\"\n\n## 7.16-7.20 Socialization and onboarding\n\n**Orientation (onboarding)** handles the practical start: paperwork, ID cards, accounts, introductions, policies, and benefits. It shortens the time to the hire's break-even point. **Socialization** is the longer process through which a newcomer gains the attitudes, behaviors, and knowledge to participate as a member, including adjusting to the **organizational culture**. Good socialization speeds productivity, raises commitment and retention, and reduces **reality shock**. Farmers Insurance's onboarding program cut new-hire turnover by 57%.\n\n**Three phases:** **anticipatory** (before entry: expectations formed with recruiters), **encounter** (starting work and learning the culture; Google's \"Nooglers\" wear propeller caps), and **settling in** (comfortable; the focus shifts to performance and career).\n\n**Socialization options** come in pairs: one-time vs. staggered (staggered reduces overload); **collective** (group) vs. **individual** (one-on-one, like an apprenticeship); formal vs. informal; sequential vs. random; fixed vs. variable timing; tournament (elimination rounds) vs. contest (build a track record); serial (role models) vs. disjunctive (on your own); and investiture (values who you are) vs. divestiture (strips identity, like boot camp, and is inappropriate in most workplaces). *Erratum:* the book says collective socialization is **more** expensive than individual. That's likely backwards, since one-on-one approaches usually cost more per person. Rely on the benefits instead: collective socialization builds cohort identity and embeddedness and cuts turnover.\n\n**Four loyalty enhancers:** socialize as a group; formal activities in a set order within a set time frame; access to role models and mentors; and social support. Include families, key coworkers, and top leaders. Technology helps with paperwork and checklists, but computer-only orientation socializes people less well on people, politics, and values. Useful metrics: email ready on day one, onboarding satisfaction, and new-hire attrition.\n\n*Facebook Bootcamp:* new engineers spend six weeks fixing bugs across the code base with mentors, which teaches the code, the habits, and the culture while building a network. Then they interview teams and **choose** where to go, so teams get engineers who actually want to be there.\n\n## 7.22-7.24 The trainee, McDonald's, and Apple\n\nThe trainee strongly shapes results. **Learning agility** is learning from experience and applying it to new situations. **Motivation to transfer** is the willingness to use new skills on the job. **Self-regulation** guides goal-directed effort over time and is crucial in self-paced eLearning. McDonald's **Hamburger University** ties training to career paths and offers college credit. Apple trains through podcasts and peer observation, teaching that selling means solving problems. Keep your own skills current with a **continuous learning plan**.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Describe steps to create an effective training program.\n2. Describe various training methods.\n3. Explain why learning style is important for training effectiveness.\n4. Explain Kirkpatrick’s four levels of training evaluation\n\nTo get there, make sure you can also explain:\n\n- The five steps in order, and what happens in each\n- Organizational vs. task vs. person analysis\n- Cognitive vs. affective vs. psychomotor objectives\n- Classroom vs. OJT vs. virtual vs. experiential vs. games, from a scenario\n- The book's learning-style claim and the research caution\n- Reaction, Learning, Behavior, and Results from an example\n- How to calculate ROI, and what 400% means\n- The four reinforcers, especially negative reinforcement vs. punishment\n","cards":[{"id":"c202-ch07-001","front":"What is training?","answer":"Formal or informal activities that improve competencies for an employee's current job.","subtitle":"Ch 7.2 · Effective HRM","note":"Read more: 7.2 Introduction","points":["Development builds competencies for the future","Both shape what employees CAN do"]},{"id":"c202-ch07-002","front":"What is development?","answer":"Building the competencies an employee will need in the future.","subtitle":"Ch 7.2 · Effective HRM","note":"Read more: 7.2 Introduction","points":["Example: Vanguard's 9-week Launch to Leadership program","Builds the leadership pipeline"]},{"id":"c202-ch07-003","front":"What is the Association for Talent Development (ATD)?","answer":"The world's largest professional association for training and development, with local chapters.","subtitle":"Ch 7.2 · Effective HRM","note":"Read more: 7.2 Introduction","points":["U.S. firms with 100+ employees spend $50B+ a year on T&D"]},{"id":"c202-ch07-004","front":"How does training support competitive advantage?","answer":"It helps execute strategy, and company-specific knowledge is hard for competitors to copy.","subtitle":"Ch 7.4 · Strategic HRM","note":"Read more: 7.4 Developing a Competitive Advantage Through Training","points":["New hires learn expectations; managers learn coaching; all learn their role","Essential for safety-critical jobs (firefighter, line maintenance)"]},{"id":"c202-ch07-005","front":"What are the five steps to effective training, in order?","answer":"Needs assessment, learning objectives, design, implementation, evaluation.","subtitle":"Ch 7.5 · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training","points":["Evaluation feeds the next needs assessment: it's a cycle","Hook: Need, Objective, Design, Implement, Evaluate"]},{"id":"c202-ch07-006","front":"Which step comes right after developing learning objectives?","answer":"Designing the training program.","subtitle":"Ch 7.5 · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training","points":["Objectives guide the content and methods chosen in design"]},{"id":"c202-ch07-007","front":"Why is effective training described as a cycle?","answer":"Evaluation results feed the next needs assessment, so training keeps improving.","subtitle":"Ch 7.5 · Effective HRM","note":"Read more: 7.5 Five Steps to Effective Training; 7.11 Evaluate the Training","points":["Figure 7.1"]},{"id":"c202-ch07-008","front":"What is a needs assessment?","answer":"The first training step: identifying what training must accomplish; its main output is the objectives.","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Addresses performance, retention, business goals, and change","Three levels: organizational, task, person"]},{"id":"c202-ch07-009","front":"What does organizational analysis ask in a needs assessment?","answer":"Where in the company are there opportunities for development or improvement?","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Triggers: strategy, new laws, technology, restructuring","Sources: strategic plans, employee and customer surveys, efficiency measures"]},{"id":"c202-ch07-010","front":"What does task analysis ask in a needs assessment?","answer":"Which jobs, competencies, abilities, and behaviors should training target?","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Sources: job analysis, observation, appraisals, quality-control data"]},{"id":"c202-ch07-011","front":"What does person analysis ask in a needs assessment?","answer":"Which individuals need training, and what kind?","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Sources: appraisals, skill inventories, individual assessments"]},{"id":"c202-ch07-012","front":"Why isn't training always the answer to a performance problem?","answer":"The cause may be equipment, resources, staffing, or pay, so fix the system instead.","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Example: replace an aging machine rather than retrain operators","Prioritize legally required and strategy-critical training"]},{"id":"c202-ch07-013","front":"How did ADP use a needs assessment?","answer":"It studied top associates and client calls, then built a shorter blended program with peer mentors and games.","subtitle":"Ch 7.6 · Effective HRM","note":"Read more: 7.6 Conduct a Needs Assessment","points":["Result: shorter calls, higher satisfaction, lower training cost"]},{"id":"c202-ch07-014","front":"What are learning objectives?","answer":"Desired learning outcomes, drawn from the needs assessment, that guide content and delivery methods.","subtitle":"Ch 7.7 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives","points":["Evaluation later checks whether they were met"]},{"id":"c202-ch07-015","front":"What are the three types of learning objectives?","answer":"Cognitive (knowledge), affective (attitudes), and psychomotor (physical skills).","subtitle":"Ch 7.7 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives","points":["Cognitive: accounting rules","Affective: D&I training","Psychomotor: driving, dance"]},{"id":"c202-ch07-016","front":"What are the six levels of Bloom's cognitive taxonomy, low to high?","answer":"Remembering, understanding, applying, analyzing, evaluating, creating.","subtitle":"Ch 7.7 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives","points":["This verb version is the 2001 revised taxonomy (Anderson & Krathwohl)","The book just calls it 'Bloom's'; the 1956 original ended with synthesis, then evaluation"]},{"id":"c202-ch07-017","front":"What are the five levels of the affective taxonomy, low to high?","answer":"Receiving, responding, valuing, organization, characterization.","subtitle":"Ch 7.7 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives","points":["Krathwohl & Bloom","Characterization: acting consistently on the new value"]},{"id":"c202-ch07-018","front":"What are the five levels of the psychomotor taxonomy, low to high?","answer":"Observing, imitating, practicing, adapting, originating.","subtitle":"Ch 7.7 · Effective HRM","note":"Read more: 7.7 Develop Learning Objectives","points":["Originating: creating new movements for novel situations"]},{"id":"c202-ch07-019","front":"What happens in the design step?","answer":"Choosing the developer, content, methods, materials, setting, and instructors.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Uses the learning objectives (and, per text, learners' sensory preferences)"]},{"id":"c202-ch07-020","front":"What is classroom training?","answer":"A face-to-face trainer working with a group or individual, such as a workshop or lecture.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Includes corporate universities (GE, Intel, Dell)","Cue: instructor-led session in a room"]},{"id":"c202-ch07-021","front":"What is on-the-job training (OJT)?","answer":"Learning while doing the real job through instructions, observation, imitation, and practice.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Supervisor or coworker answers questions and gives feedback","Cue: real tasks with someone showing you"]},{"id":"c202-ch07-022","front":"What is the difference between structured and unstructured OJT?","answer":"Structured OJT is formal, like an apprenticeship; unstructured is casual and often inconsistent.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Unstructured OJT happens even without a formal program"]},{"id":"c202-ch07-023","front":"What is virtual training?","answer":"Training delivered with online tools: webinars, eLearning, VR, and apps.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Reaches employees spread across locations","BNSF's 3-D brake-inspection simulation cut injuries 17%"]},{"id":"c202-ch07-024","front":"What is experiential training?","answer":"Learning through experience: role plays, action learning, real problems, and adventure learning.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["Ropes courses build trust","IBM made most of its training experiential"]},{"id":"c202-ch07-025","front":"How do you tell OJT from experiential training in a scenario?","answer":"OJT uses the real job and real tasks; experiential uses structured experiences like role plays.","subtitle":"Ch 7.8 · Effective HRM","note":"Read more: 7.8 Design the Training Program: Classroom to Experiential Training","points":["A role play that recreates a client crisis is experiential"]},{"id":"c202-ch07-026","front":"What are training games, and what do they achieve?","answer":"Game-based learning, e.g., Cold Stone's scoop-size game; users gained 11% in facts and 14% in skills.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Must engage learners, not just instruct passively","Cue: points, levels, or competition"]},{"id":"c202-ch07-027","front":"What are training simulations?","answer":"Low-risk, hands-on practice of realistic situations.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Aon: a 3-day simulation teaching VPs to advise CEOs"]},{"id":"c202-ch07-028","front":"What is lifelong learning?","answer":"A formal commitment to ensure employees have and develop the skills needed now and in the future.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["In-house courses plus tuition reimbursement","Goldman Sachs University"]},{"id":"c202-ch07-029","front":"What is adaptive learning?","answer":"Software or AI that adjusts material and pace to each learner's needs, like a personal tutor.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Correct answers move the learner ahead faster","Collects data to measure impact"]},{"id":"c202-ch07-030","front":"What is a learning style?","answer":"How a person's information processing differs during learning and problem solving.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Text: matching methods to style improves outcomes","Research caution: matching ('meshing') isn't well supported"]},{"id":"c202-ch07-031","front":"Per the text, why is learning style important for training effectiveness?","answer":"Methods that fit how learners take in information keep them engaged and help them learn and transfer.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["This is the book's claim; answer it this way on the OA","Research doesn't support matching per se; varied formats and fitting the method to the skill hold up"]},{"id":"c202-ch07-032","front":"What does research say about matching instruction to learning styles?","answer":"It generally doesn't support 'meshing'; teaching to a preferred style doesn't reliably improve learning.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["People do have preferences","Use multiple modalities and fit the method to the content","The book presents matching as established"]},{"id":"c202-ch07-033","front":"What is aptitude-treatment interaction?","answer":"The idea that training effectiveness depends on learners' abilities, personality, and other traits.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Text: outcomes are best when methods match the learner"]},{"id":"c202-ch07-034","front":"What is a sensory modality?","answer":"The sense a person uses to take in information: visual, auditory, tactile, or kinesthetic.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Text: about 40% of U.S. students visual, 20-30% auditory, 30-40% tactual/kinesthetic"]},{"id":"c202-ch07-035","front":"What are the four sensory modalities?","answer":"Visual (seeing), auditory (hearing), tactile (touching), and kinesthetic (doing).","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Kinesthetic = learning by actually doing"]},{"id":"c202-ch07-036","front":"What are Towler and Dipboye's five learning preferences?","answer":"Discovery, experiential, observational, structured, and group learning.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Observational: demonstrations and diagrams","Structured: notes and written steps"]},{"id":"c202-ch07-037","front":"How does Farmers Insurance address learning differences?","answer":"It delivers content in many formats: face-to-face, print, online, video, audio, virtual, and coaching.","subtitle":"Ch 7.9 · Effective HRM","note":"Read more: 7.9 Design the Training Program: Games to Learning Styles","points":["Multiple modalities is the research-friendly takeaway"]},{"id":"c202-ch07-038","front":"What happens in the implementation step?","answer":"Scheduling, inviting participants, booking instructors, preparing materials, and delivering the training.","subtitle":"Ch 7.10 · Effective HRM","note":"Read more: 7.10 Implement the Training","points":["Avoid information overload; allow time for practice"]},{"id":"c202-ch07-039","front":"What two practices does the text stress when implementing training?","answer":"Prevent information overload and allow time for practice.","subtitle":"Ch 7.10 · Effective HRM","note":"Read more: 7.10 Implement the Training","points":["Split long sessions; check progress before trainees leave","Give supervisors materials to support transfer"]},{"id":"c202-ch07-040","front":"What are key rules from the chapter's email learning bite?","answer":"Use informative subject lines, avoid all caps, be careful with reply-all, and never send sensitive data.","subtitle":"Ch 7.10 · Effective HRM","note":"Read more: 7.10 Implement the Training","points":["Don't reply when upset","Assume anything could be read company-wide"]},{"id":"c202-ch07-041","front":"What is training evaluation?","answer":"Systematically collecting information to decide whether to adopt, improve, value, or continue training.","subtitle":"Ch 7.11 · Effective HRM","note":"Read more: 7.11 Evaluate the Training","points":["Many firms skip it","Without it you can't know whether to improve or continue"]},{"id":"c202-ch07-042","front":"What common tools are used to evaluate training?","answer":"Pre- and post-tests, surveys after each segment, and follow-ups 60 or 90 days later.","subtitle":"Ch 7.11 · Effective HRM","note":"Read more: 7.11 Evaluate the Training","points":["Results feed the next needs assessment"]},{"id":"c202-ch07-043","front":"What are Kirkpatrick's four levels of training evaluation?","answer":"Reaction, learning, behavior, and results.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Each level feeds the next","Cost and difficulty rise with each level"]},{"id":"c202-ch07-044","front":"What does Kirkpatrick's reaction level measure?","answer":"How participants felt about the training, such as satisfaction and engagement.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Feedback forms and surveys","Fast, easy, cheap"]},{"id":"c202-ch07-045","front":"What does Kirkpatrick's learning level measure?","answer":"The change in participants' knowledge, skills, or attitudes.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Pre/post tests, observation, simulations","Dunkin': bake 140 dozen donuts in 8 hours"]},{"id":"c202-ch07-046","front":"What does Kirkpatrick's behavior level measure?","answer":"Whether people use what they learned on the job (transfer).","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Long-term observation; supervisor support makes it easier","Verizon: new-hire metrics at 30/60/90 days"]},{"id":"c202-ch07-047","front":"What does Kirkpatrick's results level measure?","answer":"The training's business impact, such as sales, quality, safety, or ROI.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Hardest to isolate","CarMax checks whether trained behaviors drive performance"]},{"id":"c202-ch07-048","front":"Why does each Kirkpatrick level depend on the one before it?","answer":"No enjoyment means less learning, no learning means no behavior change, and no change means no results.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Evaluate against the original goals"]},{"id":"c202-ch07-049","front":"How do cost and difficulty change across Kirkpatrick's levels?","answer":"They rise with each level: reaction is cheapest and easiest, results the hardest to measure.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Measure multiple outcomes where you can"]},{"id":"c202-ch07-050","front":"What's a quick way to label a Kirkpatrick level from an example?","answer":"Survey = reaction; test = learning; doing it on the job = behavior; company numbers = results.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Retailer results: sales and conversion, not hours trained"]},{"id":"c202-ch07-051","front":"What is the training ROI formula?","answer":"ROI% = (training benefits − training costs) ÷ training costs × 100.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Positive: continue, maybe improve","Negative: change or drop, unless unmeasured benefits like morale"]},{"id":"c202-ch07-052","front":"A $40,000 program yields $200,000 in benefits. What is the ROI, and what does it mean?","answer":"400%: (200,000 − 40,000) ÷ 40,000. That's a $4 net gain per $1 invested, or $5 back in total.","subtitle":"Ch 7.12 · Effective HRM","note":"Read more: 7.12 Evaluate the Training: Kirkpatrick's Model and Return on Investment","points":["Book: 'a return of 400 percent, or $4' means net gain, not total returned"]},{"id":"c202-ch07-053","front":"What is informal learning?","answer":"Learning without a formal structure, curriculum, or trainer, such as from experience or coworkers.","subtitle":"Ch 7.13 · Effective HRM","note":"Read more: 7.13 Informal Learning and Gamification","points":["Most common form; unplanned and rarely evaluated","Key for bringing underperformers up to speed"]},{"id":"c202-ch07-054","front":"What is training gamification?","answer":"Applying game design to training: points, levels, leaderboards, and simulations with learner control.","subtitle":"Ch 7.13 · Effective HRM","note":"Read more: 7.13 Informal Learning and Gamification","points":["McDonald's ordering game: 145,000 visits in year 1","Heineken, Western Union, BBC also use it"]},{"id":"c202-ch07-055","front":"What is training transfer?","answer":"Effectively using what was learned in training back on the job.","subtitle":"Ch 7.14 · Effective HRM","note":"Read more: 7.14 Reinforcing Training","points":["The major challenge in training","Same idea as Kirkpatrick's behavior level"]},{"id":"c202-ch07-056","front":"What is the difference between near and far transfer?","answer":"Near (closed skills): applied exactly as taught. Far (open skills): principles applied flexibly.","subtitle":"Ch 7.14 · Effective HRM","note":"Read more: 7.14 Reinforcing Training","points":["Near: a phone-sales protocol","Far: leadership"]},{"id":"c202-ch07-057","front":"What best predicts training transfer?","answer":"Cognitive ability, conscientiousness, voluntary participation, and a supportive transfer climate.","subtitle":"Ch 7.14 · Effective HRM","note":"Read more: 7.14 Reinforcing Training","points":["A boss saying 'do it the old way' kills transfer","Also: pre-training motivation and learner confidence"]},{"id":"c202-ch07-058","front":"What are self-management strategies in training?","answer":"Ways trainees control their own motivation, emotions, and decisions to apply what they learned.","subtitle":"Ch 7.14 · Effective HRM","note":"Read more: 7.14 Reinforcing Training","points":["Includes setting goals for using skills and overcoming obstacles"]},{"id":"c202-ch07-059","front":"What is a reinforcer, and when does it work best?","answer":"Anything that makes a behavior more likely to recur; best when immediate, sincere, and specific.","subtitle":"Ch 7.14 · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training","points":["Four types: positive, negative, punishment, extinction"]},{"id":"c202-ch07-060","front":"What is positive reinforcement?","answer":"Adding a desirable consequence, like praise or a bonus, to increase a behavior.","subtitle":"Ch 7.14 · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training","points":["Example: praising an employee for applying training"]},{"id":"c202-ch07-061","front":"What is negative reinforcement?","answer":"Removing an unpleasant consequence to increase a behavior. It is not punishment.","subtitle":"Ch 7.14 · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training","points":["Example: no repeat training while performance stays high"]},{"id":"c202-ch07-062","front":"What is punishment in reinforcement terms?","answer":"Adding a negative outcome to decrease a behavior.","subtitle":"Ch 7.14 · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training","points":["Example: cutting hours for those who won't use the training"]},{"id":"c202-ch07-063","front":"What is extinction?","answer":"Removing all reinforcement so an unwanted behavior fades.","subtitle":"Ch 7.14 · Motivational Concepts","note":"Read more: 7.14 Reinforcing Training","points":["Example: coworkers stop laughing at someone who mocks the training"]},{"id":"c202-ch07-064","front":"Why isn't a code of ethics enough on its own?","answer":"Employees need training to recognize and practice handling likely dilemmas; Enron had a 64-page code.","subtitle":"Ch 7.15 · Effective HRM","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["Also: hire ethical people, clear standards, reporting channels","Ethics training should be ongoing"]},{"id":"c202-ch07-065","front":"How does the Sarbanes-Oxley Act relate to training?","answer":"It strengthened accountability and whistleblower protections at SEC-registered firms; train staff on their rights.","subtitle":"Ch 7.15 · Legal & Regulatory","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["2002; criminal penalties for retaliation against whistleblowers"]},{"id":"c202-ch07-066","front":"What do the Federal Sentencing Guidelines urge employers to do?","answer":"Run effective ethics and compliance programs and train all employees, including high-level officials.","subtitle":"Ch 7.15 · Legal & Regulatory","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["Apply to corporations, unions, nonprofits, government, and more"]},{"id":"c202-ch07-067","front":"What does global leadership training develop?","answer":"Understanding of one's own and other cultures' preferences and how to manage multicultural workplaces.","subtitle":"Ch 7.15 · Effective HRM","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["High openness predicts the most development abroad","Methods: cross-cultural, language, immersion, mentoring"]},{"id":"c202-ch07-068","front":"Why do diversity training programs fail?","answer":"They're driven only by legal pressure, off-the-shelf, seen as irrelevant, or lack on-the-job support.","subtitle":"Ch 7.15 · Effective HRM","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["Fails without leadership and cultural support"]},{"id":"c202-ch07-069","front":"What makes diversity training succeed?","answer":"Enthusiastic leader support, links to the mission, mandatory for managers, and long-term evaluation.","subtitle":"Ch 7.15 · Effective HRM","note":"Read more: 7.15 Training in Ethics, Global Leadership, and Diversity","points":["Reward managers for increasing diversity","Broad framing, e.g., 'Inclusive Leadership'"]},{"id":"c202-ch07-070","front":"What is the difference between training and orientation?","answer":"Training builds job knowledge and skills; orientation helps a newcomer fit in as a member.","subtitle":"Ch 7.16 · Effective HRM","note":"Read more: 7.16 Socialization","points":["Orientation: paperwork, IDs, accounts, introductions, policies"]},{"id":"c202-ch07-071","front":"What is orientation (onboarding), and why does it matter?","answer":"The practical start (paperwork, accounts, introductions, policies) that shortens time to break-even.","subtitle":"Ch 7.16 · Effective HRM","note":"Read more: 7.16 Socialization","points":["Farmers Insurance Power Up!: new-hire turnover −57%, $9M saved"]},{"id":"c202-ch07-072","front":"What is socialization?","answer":"The long-term process through which a newcomer gains the attitudes, behaviors, and knowledge to be a member.","subtitle":"Ch 7.16 · Effective HRM","note":"Read more: 7.16 Socialization","points":["Formal and informal, planned and unplanned","Speeds ramp-up; raises commitment and retention; reduces reality shock"]},{"id":"c202-ch07-073","front":"What is reality shock?","answer":"The jolt when a new job doesn't match a newcomer's expectations; good socialization reduces it.","subtitle":"Ch 7.16 · Effective HRM","note":"Read more: 7.16 Socialization","points":["Also helped by realistic job previews (Ch 5)"]},{"id":"c202-ch07-074","front":"What are the three phases of socialization?","answer":"Anticipatory (before entry), encounter (starting work), and settling in (comfortable in the role).","subtitle":"Ch 7.17 · Effective HRM","note":"Read more: 7.17 Phases of Socialization","points":["Can last a year","Google's 'Nooglers' wear propeller caps in the encounter phase"]},{"id":"c202-ch07-075","front":"What is the difference between collective and individual socialization?","answer":"Collective puts newcomers through common group experiences; individual is one-on-one, like an apprenticeship.","subtitle":"Ch 7.18 · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture","points":["Collective builds cohort identity and cuts turnover","Erratum: book says collective costs more; individual is usually costlier"]},{"id":"c202-ch07-076","front":"What is the difference between tournament and contest socialization?","answer":"Tournament makes each stage an elimination round; contest lets newcomers build a track record.","subtitle":"Ch 7.18 · Effective HRM","note":"Read more: 7.18 Socialization Options: One-Time or Staggered to Investiture or Divestiture","points":["Tournament breeds risk aversion and stifles innovation"]},{"id":"c202-ch07-077","front":"What is the difference between investiture and divestiture socialization?","answer":"Investiture values th
