surface past candidates, and flag signals that someone may be open to moving. Automating routine sourcing frees recruiters to build relationships, cuts time to fill, and can reduce bias.\n\n## 5.6 Recruiting sources: internal vs. external\n\nThis is where the second checklist item starts. Judge any source on **speed, cost, applicant quantity, quality, diversity, culture fit, and offer acceptance rates**. Quality beats quantity: one great-fit applicant who accepts at a fair salary and performs well is success.\n\n- An **internal recruiting source** finds current employees who fit another role.\n- An **external recruiting source** targets people outside the organization.\n\n### Benefits and drawbacks\n\n*Internal benefits:* faster and cheaper; candidates already know the culture and business, so onboarding is shorter; it rewards and **retains** talented employees by showing a career path; and you already know their performance. PNC found internal hires in key jobs were significantly more productive in year one than experienced outsiders.\n\n*Internal drawbacks:* a smaller pool, and relying only on insiders, especially for senior roles, limits new insights and can lead to **groupthink**.\n\n*External benefits:* **fresh ideas and perspectives**, a much **larger and more diverse pool**, skills the company doesn't have, and leaders who may drive change better.\n\n*External drawbacks:* it typically **takes longer to hire and train** outsiders, and research finds external hires perform worse in their first two years, leave more often, and are paid 18-20% more.\n\n*Rule of thumb:* use internal sources when culture and business knowledge are key; use external sources when you need new skills, new thinking, or volume. Promote-from-within firms try internal sources first. Recruit more applicants than you need, assess them, and hire the best fits.\n\n## 5.7 Internal recruiting sources\n\n1. **Succession management** is the ongoing process of preparing employees to step into other positions, especially key leadership roles, when they open. It keeps the pipeline full and rests on long-term strategy. Delays naming a successor after a CEO's death hurt future earnings, and insider successors generally outperform outsiders. Dow Chemical and Eli Lilly develop successors through mentoring, coaching, job rotation, and 360-degree feedback.\n2. A **talent inventory** is a manual or computerized record of employees' characteristics, experience, and competencies. It's fast and cheap to search, but if it's out of date, good candidates get overlooked.\n3. An **internal job posting system** announces openings to current employees (intranet, bulletin board), and anyone interested can apply. It's fast, cheap, and fair, but it misses people who aren't looking, so combine it with a talent inventory.\n\n## 5.8-5.11 External recruiting sources\n\nThe book lists many external sources. For each one, know what it is and when it's the best fit.\n\n- **Careers site:** the jobs section of the company website, showing culture, openings, and how to apply. Very cost-effective, and it lets applicants self-select.\n- **Creative sourcing:** new ways to reach qualified people, like coding contests with job prizes (Google Code Jam) or TokBox parking a free taco truck outside a downsizing Yahoo. Creativity must reach better candidates, not just be novel.\n- **Employee referrals:** employees recommend people they know. Good employees tend to refer good recruits, and referred hires get realistic information, so they stay longer and perform well. Fast and cheap; bonuses are paid only on hire. *Caution:* people refer people like themselves, so a homogeneous workforce stays that way, which can adversely affect women and minorities (a Chapter 3 adverse impact risk).\n- **Job fairs:** many employers meet many recruits at once, in person or virtually. Best for active and semipassive seekers.\n- **LinkedIn:** a major source of active and passive candidates, used by over 90% of recruiters.\n- **Military transition services:** help place separating service members, veterans, and military spouses. Home Depot's military recruiting improved diversity and lowered turnover.\n- **Non-U.S. citizens:** global recruiting widens the talent pool but requires visa sponsorship (the H-1B is the most common work visa), paying at least the prevailing U.S. wage, and sometimes Department of Labor certification that qualified U.S. workers aren't available. The process can take up to two years.\n- **Observation:** watching people do similar jobs elsewhere, like Nucor recruiting construction workers who build its plants. Good for passive seekers.\n- **Offshoring:** moving work abroad cuts labor costs and reaches talent anywhere, but brings cultural, legal, and intellectual property risks.\n\n- **Online job boards:** general boards (Indeed, ZipRecruiter) and niche ones (Dice for tech). They reach many active seekers fast.\n- **Outsourcing:** contracting another firm or individual to do the work, a fast talent solution. The **gig economy** (Upwork, TaskRabbit) replaces some traditional jobs with short-term contracts.\n- **Previous (\"boomerang\") employees:** they know the job and the company, and their fit is known. Apple rehired Steve Jobs. *Cautions:* confirm they were good performers, and know that promoting returnees can signal that people have to leave to get ahead.\n- **Résumé databases:** searchable files of past applicants, including finalists you didn't hire.\n- **Schools and internships:** colleges and community colleges supply entry-level talent. Internships are a two-way trial, and many banks hire most new graduates from their intern pools.\n- **Search firms:** specialists that find hard-to-find talent, especially executives. High quality, but slow and expensive (often a large share of first-year salary), and they can't poach from their own clients. Coca-Cola's search-firm hires turned over twice as much as in-house recruits.\n- **Social media:** Zappos used Instagram and JPMorgan used Snapchat to reach younger candidates.\n- **State employment agencies:** free public services offering counseling, testing, and training, with special help for veterans, people with disabilities, and older workers.\n- **Temporary staffing agencies:** provide nonpermanent workers who are the agency's employees, and a good way to source people with disabilities through temp assignments.\n- **Walk-ins:** people who apply from a help-wanted sign. Put the position and hours on the sign.\n- **Written advertisements:** newspapers and trade journals. Best for active seekers, and still common for lower-level jobs.\n\n*Research takeaway:* **informal sources** (referrals, rehires) beat **formal sources** (print ads, internet postings) on new-hire performance and tenure, probably because they give more realistic information.\n\n### The I-9 retention rule (book vs. federal law)\n\nEvery new hire must complete **Form I-9** to prove identity and work authorization. *Here the textbook's wording differs from federal rules.* The book says to keep the I-9 for 3 years after hire or 1 year after employment ends, \"whichever is **less**.\" The federal rule (USCIS) is **whichever is later**. *Example:* an employee hired in 2020 who leaves in 2026 has passed the 3-year mark, so you keep the form until 2027, one year after she leaves. Learn the federal rule for real work. If a quiz item follows the book's wording, recognize it, but know that it isn't the actual legal requirement.\n\n## 5.12 Recruiting and spillover effects\n\nGood recruiting produces enough quality applicants, positive applicant impressions, new hires who perform and stay, good fit, and rejected applicants who still feel respected. **Recruitment spillover effects** are the unintended consequences of recruiting. A rude or slow process spreads by word of mouth and can hurt sales and future recruiting, while fair, respectful, on-time treatment builds goodwill. Valero treats every prospect as a customer, sending updates and a respectful note to every rejected candidate.\n\n## 5.13 Recruiters, signaling, and technology\n\nRecruiters matter a lot: their skills and attitudes drive much of the variation in quality of hire, and many graduates name the recruiter as a main reason they chose a company. **Signaling** means candidates read the recruiter's professionalism and timeliness as clues about what the company is like. Select and train recruiters who know the job, communicate well, and seem trustworthy.\n\nTechnology helps: **chatbots** answer questions around the clock (IBM's assistant tripled the share of site visitors who applied), **gamification** uses game elements to attract and assess candidates (France's postal service used a mail-carrier game that cut trainee dropout from 25% to 8%), and an **applicant tracking system (ATS)** manages applications and reports on time to fill, cost per hire, and source effectiveness.\n\n## 5.14 Recruiting metrics\n\n- **Efficiency-oriented metrics:** time to fill, number of applicants, number of hires, and cost per hire. Useful, but they can cut costs without improving performance.\n- **Strategic metrics:** hiring-manager and new-hire satisfaction, training success, time to productivity, performance 6-12 months after hire, failure rate, and first-year voluntary turnover.\n\nTrack metrics by source and recruiter to learn what works, and reward recruiters for quality hires who stay, not just fast ones.\n\n## 5.15-5.17 The recruiting message and realistic job previews\n\nThe **recruiting message** should be specific and informative: location, job level, pay range, and what the work is really like. Specific messages let unqualified people screen themselves out; general ads attract lots of unqualified applicants and drive up screening costs.\n\nA **realistic job preview (RJP)** gives candidates both the positive and the potentially negative aspects of a job, honestly and objectively. It isn't meant to scare people off; it's balanced information. It works three ways:\n\n1. **Self-selection:** poor fits opt out on their own.\n2. **Vaccination:** lower expectations let new hires prepare to cope with the tough parts.\n3. **Commitment:** people who accept knowing the downsides are more committed to the choice.\n\nBuild an RJP by surveying current employees about what they like and dislike, and focus on what outsiders don't know, like pace, hours, and conditions. Describe facts (\"requires attention to detail and fast turnaround\") instead of labels (\"high pressure\"). *But:* an RJP is no substitute for fixing a bad job.\n\n*Case:* Arvato's customer support centers lost over half of new hires within three months because the job didn't match expectations. Situational judgment games and preview videos cut turnover by 63% and raised the share of hirable interviewees from 45% to 85%. They could do even more by improving the job itself: better schedules, supervisor support, and early coaching.\n\n## 5.18-5.19 Applicant attraction, image, and employer brand\n\nJob seekers judge rewards, fit, and culture before applying.\n\n- **Organizational image** is people's general impression of a company, based on feelings and facts. It exists whether or not the company manages it.\n- **Employer image** is the company's reputation *as an employer*. Students' employer images are flexible, so even lesser-known firms can compete with good recruiting messages.\n- **Employer brand** is what the employer deliberately creates: a summary of what it offers employees, answering \"Why should I work here?\" *Key distinction:* individuals hold the image; the organization creates the brand.\n\nA strong employer brand differentiates you from talent competitors, but it must be true. Glassdoor exposes empty promises, and unmet expectations drive quits. \"Best employer\" lists raise application volume, though not always quality.\n\n## 5.20 Ethical issues\n\nRecruiters face pressure to mislead candidates about the job or their chances, to share confidential information, and to poach. Quotas with punishment push numbers over ethics; in one hidden-camera test, over half of Army recruiters lied to prospects. Because no agency regulates recruiting, companies should write a **recruiter code of ethics**, put hiring agreements in writing, and give recruiters a channel for questions. Ethical recruiting builds trust with passive candidates and brings more referrals.\n\n## 5.21-5.22 IBM's response and the CIA preview\n\nIBM shifted to sourcing for skills shared across units, used AI to find overlooked talent and reduce interview bias, treated candidates like customers, and let new hires customize parts of their offer. The CIA, whose analysts can't discuss their work, runs a campus crisis simulation as a realistic job preview that shows the critical thinking and teamwork the job demands.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Explain the difference between sourcing and recruiting.\n2. Identify types and benefits of internal and external recruiting sources.\n\nTo get there, make sure you can also explain:\n\n- How sourcing and recruiting are alike, not just how they differ\n- Active vs. semipassive vs. passive job seekers, and how to reach each\n- The three internal sources: succession management, talent inventory, and internal job posting\n- Which external source fits a hiring goal, and each source's main drawback\n- Why referrals produce good hires, and their diversity risk\n- The federal I-9 retention rule, and how the book's wording differs\n- Efficiency vs. strategic recruiting metrics\n- The three functions of a realistic job preview\n- Organizational image vs. employer image vs. employer brand\n","cards":[{"id":"c202-ch05-001","front":"Why is recruiting called the foundation of HRM?","answer":"It decides who your future employees are, which shapes training, pay, and performance from then on.","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.23 Summary and Application","points":["Watson Wyatt: an excellent recruiting function lifted market value 18%+","Fast growers and promote-from-within firms (P&G, Enterprise) depend on strong pipelines","Training can't instill what people can't learn; pay can't motivate the unable"]},{"id":"c202-ch05-002","front":"What is sourcing?","answer":"Identifying qualified people and the labor markets to recruit them from; analytical work that generates leads.","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.4 Sourcing","points":["Like marketing research for talent: who's likely interested and how to reach them","Follows job analysis"]},{"id":"c202-ch05-003","front":"What is recruiting?","answer":"Activities that affect how many and what kind of people are willing to apply for and accept job offers.","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.12 Recruiting","points":["Interpersonal: converts leads to applicants, keeps them engaged, persuades them to accept","Lasts until the candidate starts work or leaves the process"]},{"id":"c202-ch05-004","front":"What is the core difference between sourcing and recruiting?","answer":"Sourcing identifies potential talent (analytical); recruiting attracts and persuades it (interpersonal).","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.12 Recruiting","points":["One line: sourcing identifies talent that recruiting attracts","Sourcing comes first; recruiting carries through to acceptance"]},{"id":"c202-ch05-005","front":"How are sourcing and recruiting alike? (Venn overlap)","answer":"Both aim to bring in qualified, well-fitting people, follow job analysis, and shape what employees can do.","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction; 5.12 Recruiting","points":["Sourcing only: research, finding names and labor markets, generating leads, analytical","Recruiting only: relationships, messaging, persuading, keeping candidates engaged, interpersonal","Both: support strategy, rely on technology and knowing the target talent, aim for fit and acceptance"]},{"id":"c202-ch05-006","front":"What makes a recruit desirable?","answer":"Fit with both the job and the company, plus a good chance of accepting an offer.","subtitle":"Ch 5.2 · Effective HRM","note":"Read more: 5.2 Introduction"},{"id":"c202-ch05-007","front":"What recruiting challenge did IBM face?","answer":"Top performers can be 800% more productive, and many units need the same scarce AI, cloud, and Agile skills.","subtitle":"Ch 5.3 · Effective HRM","note":"Read more: 5.3 Real World Challenge: Leveraging Technology for Effective Sourcing and Recruiting at IBM; 5.21 Real World Response: Leveraging Technology for Effective Sourcing and Recruiting at IBM","points":["Challenge: use technology, AI, and cloud to speed and improve hiring"]},{"id":"c202-ch05-008","front":"Who are active job seekers?","answer":"People looking right now; easy to reach with ads, but the pool's average quality can be lower.","subtitle":"Ch 5.4 · Effective HRM","note":"Read more: 5.4 Sourcing","points":["Includes the recently fired and job hoppers","Exceptions: new college graduates and good people displaced in downturns"]},{"id":"c202-ch05-009","front":"Who are semipassive job seekers?","answer":"People comfortable in their jobs but open to better ones who look only now and then.","subtitle":"Ch 5.4 · Effective HRM","note":"Read more: 5.4 Sourcing","points":["May miss postings, so they need proactive outreach","More high-quality people here than among active seekers"]},{"id":"c202-ch05-010","front":"Who are passive job seekers?","answer":"People not looking but open to the right offer; often top quality but hardest to find and persuade.","subtitle":"Ch 5.4 · Effective HRM","note":"Read more: 5.4 Sourcing","points":["Need the most proactive, strategic effort and the most time and information","Microsoft: about 5% of desired talent is active, 95% passive"]},{"id":"c202-ch05-011","front":"Why must sourcers keep finding new sources?","answer":"The same channels keep yielding the same active seekers, so new sources reach untapped talent.","subtitle":"Ch 5.4 · Effective HRM","note":"Read more: 5.4 Sourcing","points":["McAfee focused on high-value prospects: time to fill critical roles fell from 35 to 11 days"]},{"id":"c202-ch05-012","front":"How has technology changed sourcing?","answer":"Social media widens both sides' view, AI flags people open to moving, and automation frees recruiters for people.","subtitle":"Ch 5.5 · Effective HRM","note":"Read more: 5.5 Recruiting Technology","points":["Videos: day in the life, testimonials, virtual tours","Google Hire resurfaces past candidates; underdog.io taps employees' networks","Automation cuts time to fill and can reduce bias"]},{"id":"c202-ch05-013","front":"What criteria judge a recruiting source's effectiveness?","answer":"Speed, cost, applicant quantity, quality, diversity, culture fit, and offer acceptance rates.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources","points":["Quality beats quantity; promotion rates matter when entry jobs feed future leaders"]},{"id":"c202-ch05-014","front":"How do internal and external recruiting sources differ?","answer":"Internal sources find current employees for other roles; external sources target people outside the company.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-015","front":"What are the main benefits of internal recruiting?","answer":"Faster and cheaper, shorter onboarding, known performance, and it retains talent by showing a career path.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources; 5.7 Internal Recruiting Sources","points":["PNC: internal hires in key jobs were more productive in year one than experienced outsiders"]},{"id":"c202-ch05-016","front":"What are the main benefits of external recruiting?","answer":"Fresh ideas, a larger and more diverse pool, new skills, and leaders who may drive change better.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-017","front":"What are the drawbacks of external hires, per research?","answer":"They take longer to hire and train, perform worse their first two years, leave more, and cost 18-20% more.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-018","front":"What is the risk of filling senior roles only from inside?","answer":"It limits fresh insight and can breed groupthink, since everyone shares the same experience.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-019","front":"When is internal recruiting usually the better choice?","answer":"When culture and business knowledge are key to the role; promote-from-within firms try insiders first.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-020","front":"Why recruit more applicants than you need?","answer":"So you can assess them and hire the best fits; one great-fit hire who stays and performs is success.","subtitle":"Ch 5.6 · Effective HRM","note":"Read more: 5.6 Recruiting Sources","points":["Ads aimed at active seekers are fastest but not always highest quality; keep multiple methods"]},{"id":"c202-ch05-021","front":"What is succession management?","answer":"Ongoing preparation of employees to fill other positions, especially key leadership roles, when they open.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources","points":["Keeps the pipeline full; based on long-term strategy","Insider CEO successors generally outperform outsiders"]},{"id":"c202-ch05-022","front":"What is a talent inventory in recruiting?","answer":"A manual or computerized record of employees' traits, experience, and competencies, searched for internal fits.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources","points":["Fast and cheap; inaccurate records mean overlooked candidates","Employees and managers keep it updated"]},{"id":"c202-ch05-023","front":"What is an internal job posting system?","answer":"A way to announce openings to current employees so anyone interested can apply.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources","points":["Bulletin board or intranet; HR checks that applicants meet requirements"]},{"id":"c202-ch05-024","front":"Why pair internal job postings with a talent inventory?","answer":"Postings miss good people who aren't looking; the inventory finds them, so fewer insiders are overlooked.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-025","front":"Why does lacking a succession plan hurt a company?","answer":"Replacing key talent takes months, and delays naming successors hurt results, as with CEO deaths.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources","points":["Boomer retirements, talent competition, and leadership diversity goals raise the priority"]},{"id":"c202-ch05-026","front":"How do companies develop internal successors?","answer":"Through mentoring, coaching, development plans, job rotation, 360-degree feedback, and training.","subtitle":"Ch 5.7 · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources","points":["Dow Chemical: mentoring, coaching, on-the-job, online and university learning","Eli Lilly: individual development plans, formal mentoring, 360 feedback, rotation"]},{"id":"c202-ch05-027","front":"What is a careers site, and what's its benefit?","answer":"The jobs section of a company's website; very cost-effective and lets applicants self-select on culture.","subtitle":"Ch 5.8 · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals","points":["Some firms route all applications through it for a searchable database and EEO compliance"]},{"id":"c202-ch05-028","front":"What is creative sourcing?","answer":"Finding qualified people in new ways, like coding contests with job prizes; it must reach talent, not just be novel.","subtitle":"Ch 5.8 · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals","points":["Google Code Jam; TokBox's free taco truck outside downsizing Yahoo","Advantages fade or get copied"]},{"id":"c202-ch05-029","front":"Why do employee referrals tend to produce good hires?","answer":"Good employees tend to refer good people and give them realistic info, so referred hires perform and stay.","subtitle":"Ch 5.8 · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals","points":["Relatively fast and cheap; bonuses paid only on hire","Up to 45% of new hires overall; 55%+ at Booz Allen"]},{"id":"c202-ch05-030","front":"What is the main risk of relying on employee referrals?","answer":"People refer people like themselves, so a homogeneous workforce stays that way, hurting women and minorities.","subtitle":"Ch 5.8 · Legal & Regulatory","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals","points":["Ties to Chapter 3 adverse impact; unhappy employees also won't refer","Fix: balance referrals with diverse sources"]},{"id":"c202-ch05-031","front":"When are job fairs most useful?","answer":"When the attendees are qualified; they work best for active and semipassive seekers, in person or virtual.","subtitle":"Ch 5.9 · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Some fairs target veterans or people with disabilities"]},{"id":"c202-ch05-032","front":"Why is LinkedIn a major recruiting source?","answer":"It reaches active and passive candidates worldwide, and over 90% of recruiters use it to search and reach out.","subtitle":"Ch 5.9 · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Tactics: postings, searching by employer, InMail, mutual-connection intros, saved-search alerts"]},{"id":"c202-ch05-033","front":"What do military transition services offer recruiters?","answer":"Access to capable separating service members, veterans, and military spouses, including veterans with disabilities.","subtitle":"Ch 5.9 · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Home Depot's military recruiting improved diversity and lowered turnover"]},{"id":"c202-ch05-034","front":"What does hiring non-U.S. citizens require?","answer":"Visa sponsorship (often H-1B), paying the prevailing wage, and sometimes DOL labor certification.","subtitle":"Ch 5.9 · Legal & Regulatory","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Labor certification: qualified U.S. workers unavailable, and similar U.S. workers' wages not harmed","The process can take up to 2 years; H-1B slots are limited"]},{"id":"c202-ch05-035","front":"How long must an employer keep a Form I-9 under federal rules?","answer":"3 years after hire or 1 year after employment ends, whichever is LATER (the textbook says 'less').","subtitle":"Ch 5.9 · Legal & Regulatory","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Federal rule (USCIS): whichever is later; the book's 'whichever is less' wording is wrong for real work","Example: hired 2020, leaves 2026 -> keep until 2027","Every new hire completes an I-9 proving identity and work authorization"]},{"id":"c202-ch05-036","front":"What is observation as a recruiting source?","answer":"Watching people do similar jobs elsewhere to spot good fits; useful for reaching passive seekers.","subtitle":"Ch 5.9 · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Nucor recruits construction workers who build its plants","Consider the ethics of costing the other firm time and money"]},{"id":"c202-ch05-037","front":"What are the tradeoffs of offshoring work?","answer":"Lower labor costs and global talent, but cultural, legal, and intellectual property risks, and it isn't fast.","subtitle":"Ch 5.9 · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation","points":["Suits projects and intermittent work; protect key secrets (Symantec won't offshore virus definitions)"]},{"id":"c202-ch05-038","front":"How do general and specialty job boards differ?","answer":"General boards (Indeed) reach many active seekers fast; specialty boards (Dice) target one field's talent.","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases","points":["Also diversity boards and USAJOBS.gov for federal jobs"]},{"id":"c202-ch05-039","front":"What is outsourcing as a talent source?","answer":"Contracting another firm or individual to do work, a fast way to add capacity without hiring.","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases","points":["Amazon fulfillment services; freelancer platforms"]},{"id":"c202-ch05-040","front":"What is the gig economy?","answer":"Short-term contract work replacing traditional jobs, matched through platforms like Upwork and TaskRabbit.","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases"},{"id":"c202-ch05-041","front":"What are the pros and cautions of boomerang (former) employees?","answer":"They know the job and their fit is known; confirm they were good, and beware signaling 'leave to get ahead.'","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases","points":["Apple rehired Steve Jobs; IBM and KPMG run alumni sites","Learn what they did while away and how they feel about the company"]},{"id":"c202-ch05-042","front":"What is a résumé database?","answer":"A searchable file of past applicants, including unhired finalists, to re-contact for new openings.","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases","points":["Microsoft made re-contacting past decliners a core sourcing strategy"]},{"id":"c202-ch05-043","front":"What is the top résumé tip from the chapter?","answer":"State achievements with numbers, like 'cut shrinkage 12%,' instead of just listing duties.","subtitle":"Ch 5.10 · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases","points":["Also: tailor to each posting, use its keywords, action words, 1-2 pages, no typos, be honest"]},{"id":"c202-ch05-044","front":"Why are schools and internships valuable sources?","answer":"They supply entry-level talent, and internships are a two-way trial that feeds full-time hiring.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["Internships yield about 30% of new college hires; Merrill Lynch offers jobs to 75% of interns","Community college partnerships address skill shortages"]},{"id":"c202-ch05-045","front":"What are the pros and cons of search firms?","answer":"They find hard-to-find, often executive talent, but are slow, costly, and can't poach from their own clients.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["Often a large share of first-year salary; check placement and retention rates","Coca-Cola: search-firm senior hires turned over twice as much as in-house recruits"]},{"id":"c202-ch05-046","front":"What do state employment agencies provide?","answer":"Free public matching, counseling, testing, and training, with special help for veterans, disabled, and older workers.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-047","front":"How do temporary staffing agencies work?","answer":"They supply nonpermanent workers who stay the agency's employees; the agency recruits, trains, and places them.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["A form of outsourcing; good for sourcing people with disabilities"]},{"id":"c202-ch05-048","front":"How can walk-in recruiting be improved?","answer":"List the position and hours on the help-wanted sign; a bare sign draws poorly fitting applicants.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["Walk-ins usually get an application and a quick interview"]},{"id":"c202-ch05-049","front":"Who do written advertisements reach best?","answer":"Mainly active seekers and some semipassive ones; still common for lower-level jobs.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["Place ads near content passive and semipassive seekers read"]},{"id":"c202-ch05-050","front":"Do informal or formal recruiting sources produce better hires?","answer":"Informal ones (referrals, rehires) beat formal ones (ads, postings) on performance and tenure.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements; 5.16 Realistic Job Previews","points":["Likely because informal sources give more realistic information"]},{"id":"c202-ch05-051","front":"How can social media support recruiting?","answer":"It shows culture to targeted groups and spreads openings through networks, like Zappos' internship Instagram.","subtitle":"Ch 5.11 · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements","points":["JPMorgan used Snapchat ads for younger seekers; Jobvite broadcasts across platforms"]},{"id":"c202-ch05-052","front":"What outcomes should recruiting achieve?","answer":"Enough quality applicants, positive impressions, new hires who perform and stay, good fit, and respected rejects.","subtitle":"Ch 5.12 · Effective HRM","note":"Read more: 5.12 Recruiting","points":["Rejected applicants invested time and money, so treat them with respect"]},{"id":"c202-ch05-053","front":"What are recruitment spillover effects?","answer":"Unintended effects of recruiting, like poor treatment spreading by word of mouth and hurting sales and hiring.","subtitle":"Ch 5.12 · Effective HRM","note":"Read more: 5.12 Recruiting","points":["Respectful, timely, fair treatment builds patronage and reapplications"]},{"id":"c202-ch05-054","front":"What does treating every candidate like a customer look like?","answer":"Prompt updates, respect, and a courteous close for everyone, including rejected applicants.","subtitle":"Ch 5.12 · Effective HRM","note":"Read more: 5.12 Recruiting","points":["Valero: 3+ personalized emails and a postcard to every rejected candidate","Raytheon: a 'brag-worthy' experience for every candidate"]},{"id":"c202-ch05-055","front":"Why do recruiter characteristics matter so much?","answer":"Recruiters' skills and attitudes drive much of the variation in quality of hire and sway candidates' choices.","subtitle":"Ch 5.13 · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics","points":["About 80% of variation in quality of hire tied to recruiters","A third of business and engineering grads chose a company mainly because of the recruiter"]},{"id":"c202-ch05-056","front":"What is signaling in recruiting?","answer":"Candidates read a recruiter's professionalism and timeliness as clues about what the company is like.","subtitle":"Ch 5.13 · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics","points":["Weaker when candidates are well informed or the recruiter is from HR rather than their field","Hiring manager or CEO involvement signals that talent is valued"]},{"id":"c202-ch05-057","front":"How do chatbots help recruiting?","answer":"They answer candidate questions 24/7 and update status, escalating to humans when needed.","subtitle":"Ch 5.13 · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics","points":["IBM's Watson assistant: 36% of visitors moved from exploring to applying vs 12% on a static site"]},{"id":"c202-ch05-058","front":"What is recruitment gamification?","answer":"Using game elements like points, badges, and simulations to attract, engage, and assess candidates.","subtitle":"Ch 5.13 · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics","points":["France's postal service game cut trainee dropout from 25% to 8%; Pymetrics games aim to reduce bias"]},{"id":"c202-ch05-059","front":"What is an applicant tracking system (ATS)?","answer":"Software that processes applications, tracks candidate status, and reports cost per hire and time to fill.","subtitle":"Ch 5.13 · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics","points":["Personal data protection laws may bar storing applicant data offshore"]},{"id":"c202-ch05-060","front":"What are efficiency-oriented recruiting metrics?","answer":"Measures of hiring speed and cost: time to fill, number of applicants and hires, and cost per hire.","subtitle":"Ch 5.14 · Effective HRM","note":"Read more: 5.14 Recruiting Metrics","points":["Useful but not tied to strategy, so they may cut costs without improving performance"]},{"id":"c202-ch05-061","front":"What are strategic recruiting metrics?","answer":"Measures tied to performance: manager satisfaction, time to productivity, new-hire performance, first-year turnover.","subtitle":"Ch 5.14 · Effective HRM","note":"Read more: 5.14 Recruiting Metrics","points":["Also new-hire satisfaction, training success, failure rate in key jobs"]},{"id":"c202-ch05-062","front":"Why tie recruiter rewards to strategic metrics?","answer":"Rewarding quality hires who stay and perform, not just speed, pushes recruiters toward what the business needs.","subtitle":"Ch 5.14 · Effective HRM","note":"Read more: 5.14 Recruiting Metrics","points":["Adjust for things recruiters can't control, like tight labor markets"]},{"id":"c202-ch05-063","front":"What makes an effective recruiting message?","answer":"Specific, informative details like location, level, pay range, and real job features, so applicants self-select.","subtitle":"Ch 5.15 · Effective HRM","note":"Read more: 5.15 The Recruiting Message","points":["General ads raise quantity but lower quality and screening costs rise"]},{"id":"c202-ch05-064","front":"What is a realistic job preview (RJP)?","answer":"Honest, objective information about a job's positives and potential negatives, given before or after hire.","subtitle":"Ch 5.16 · Effective HRM","note":"Read more: 5.16 Realistic Job Previews","points":["Not meant to paint the worst picture; balanced information to judge fit"]},{"id":"c202-ch05-065","front":"What are the three functions of a realistic job preview?","answer":"Self-selection (poor fits opt out), vaccination (expectations lowered), and commitment to the choice.","subtitle":"Ch 5.16 · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-066","front":"What is the most common mistake when building an RJP?","answer":"Stressing only the negatives; describe facts objectively and let applicants interpret them.","subtitle":"Ch 5.16 · Effective HRM","note":"Read more: 5.16 Realistic Job Previews","points":["Say 'requires attention to detail and time urgency' rather than 'high-pressure'"]},{"id":"c202-ch05-067","front":"How do you build a realistic job preview?","answer":"Survey employees on likes and dislikes, use exit data, and cover what outsiders don't know, like pace and hours.","subtitle":"Ch 5.16 · Effective HRM","note":"Read more: 5.16 Realistic Job Previews","points":["Post-hire RJPs may be most effective for turnover, signaling honesty"]},{"id":"c202-ch05-068","front":"Can a realistic job preview fix a bad job?","answer":"No; improve the job first (supervisors, pay, conditions), since honesty about a bad job doesn't make it better.","subtitle":"Ch 5.16 · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-069","front":"What else could Arvato do to cut customer service turnover? (model answer)","answer":"Improve the job itself with steadier schedules, supervisor support, stress coaching, and early check-ins.","subtitle":"Ch 5.17 · Effective HRM","note":"Read more: 5.17 Case Study: Realistic Job Previews at Arvato; 5.16 Realistic Job Previews","points":["Arvato's RJP games and videos cut turnover 63% and raised hirable interviewees from 45% to 85%","Model answer: also offer a post-hire RJP, peer mentors, and recognition for handling tough calls"]},{"id":"c202-ch05-070","front":"What does the applicant attraction model say job seekers weigh?","answer":"The rewards offered, whether their skills match, and culture signals about fit.","subtitle":"Ch 5.18 · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies"},{"id":"c202-ch05-071","front":"What is organizational image?","answer":"People's general impression of a company based on feelings and facts; it exists whether managed or not.","subtitle":"Ch 5.18 · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies","points":["Can be inaccurate or lag reality; shaped by ethics scandals, philanthropy, community involvement"]},{"id":"c202-ch05-072","front":"How does employer image differ from organizational image?","answer":"Employer image is the company's reputation specifically as an employer; organizational image is the overall impression.","subtitle":"Ch 5.18 · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies","points":["Students' employer images are malleable, so low-profile firms can compete through recruiting messages"]},{"id":"c202-ch05-073","front":"What is an employer brand?","answer":"What the employer deliberately communicates it offers employees, answering 'Why should I work here?'","subtitle":"Ch 5.19 · Effective HRM","note":"Read more: 5.19 Employer Brand","points":["Image is held by individuals; the brand is created by the organization"]},{"id":"c202-ch05-074","front":"Why must an employer brand be truthful?","answer":"Sites like Glassdoor expose the gap, and hires whose expectations aren't met tend to quit.","subtitle":"Ch 5.19 · Effective HRM","note":"Read more: 5.19 Employer Brand","points":["Translate real purpose and values into messages; don't invent values"]},{"id":"c202-ch05-075","front":"What's the catch with making 'best employer' lists?","answer":"They raise application volume but not necessarily quality, adding screening burden.","subtitle":"Ch 5.19 · Effective HRM","note":"Read more: 5.19 Employer Brand"},{"id":"c202-ch05-076","front":"What are the main ethical issues in recruiting?","answer":"Sharing inappropriate info, breaching confidentiality, slow feedback, poaching, and misleading recruits.","subtitle":"Ch 5.20 · Effective HRM","note":"Read more: 5.20 Ethical Issues","points":["ABC test: over half of Army recruiters visited lied to prospects under quota pressure"]},{"id":"c202-ch05-077","front":"How should firms promote ethical recruiting?","answer":"Write a recruiter code of ethics, put hiring agreements in writing, and give recruiters a channel for issues.","subtitle":"Ch 5.20 · Effective HRM","note":"Read more: 5.20 Ethical Issues","points":["No agency regulates recruiting; benefits include fewer lawsuits, more trust and referrals"]},{"id":"c202-ch05-078","front":"How did IBM use technology to improve recruiting?","answer":"It sourced for shared skills, used AI to surface overlooked talent and cut bias, and personalized offers.","subtitle":"Ch 5.21 · Effective HRM","note":"Read more: 5.21 Real World Response: Leveraging Technology for Effective Sourcing and Recruiting at IBM","points":["SkillsBuild values skills over degrees; new hires customize up to 3 benefits on mobile"]},{"id":"c202-ch05-079","front":"How does the CIA's crisis simulation work as an RJP?","answer":"It lets students experience analysts' real pressures, showing the skills needed when analysts can't discuss work.","subtitle":"Ch 5.22 · Effective HRM","note":"Read more: 5.22 Strategic HRM Exercise: What Is It Like to Work for the CIA?; 5.16 Realistic Job Previews","points":["Skills shown: critical thinking, concision, improvising, teamwork"]},{"id":"c202-ch05-080","type":"scenario","front":"Dana spends her mornings searching LinkedIn and conference speaker lists to build a list of cloud engineers who might fit future openings. What is she doing?","choices":["Sourcing","Recruiting","Selection","Onboarding"],"correct":0,"explanation":"Identifying qualified people and where to find them is sourcing: analytical work that generates leads.","subtitle":"Ch 5.2 Apply · Effective HRM","note":"Read more: 5.2 Introduction"},{"id":"c202-ch05-081","type":"scenario","front":"Marcus calls a promising candidate, explains the role, answers her questions about the team, and checks in weekly to keep her interested until she accepts. What is he doing?","choices":["Sourcing","Job analysis","Succession management","Recruiting"],"correct":3,"explanation":"Activities that affect whether people apply for and accept offers are recruiting: interpersonal work that turns leads into hires.","subtitle":"Ch 5.12 Apply · Effective HRM","note":"Read more: 5.12 Recruiting"},{"id":"c202-ch05-082","type":"scenario","front":"A hospital's talent team analyzes which nursing schools, regions, and online communities produce its best nurses, to decide where to look next year. Which activity is this?","choices":["Recruiting","Realistic job preview","Workflow analysis","Sourcing"],"correct":3,"explanation":"Deciding which labor markets and channels to target is sourcing. It parallels marketing research, but for talent.","subtitle":"Ch 5.4 Apply · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-083","type":"scenario","front":"A company's sourcers have built a strong list of passive candidates, but few ever apply. Which function needs work?","choices":["Succession management, which develops internal talent","Recruiting, which turns leads into applicants and persuades them","Sourcing, which should find more and better names","Job analysis, which defines the role's requirements"],"correct":1,"explanation":"Sourcing identifies talent; recruiting attracts it. A strong lead list with few applicants points to weak recruiting.","subtitle":"Ch 5.2 Apply · Effective HRM","note":"Read more: 5.2 Introduction"},{"id":"c202-ch05-084","type":"scenario","front":"Priya checks job boards daily, has sent out 15 résumés this week, and messages LinkedIn contacts about openings. What kind of job seeker is she?","choices":["Boomerang","Active","Semipassive","Passive"],"correct":1,"explanation":"Active job seekers are looking right now and can be reached with ads.","subtitle":"Ch 5.4 Apply · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-085","type":"scenario","front":"Ken likes his job but browses postings every couple of months in case something better comes up. What kind of job seeker is he, and how should recruiters reach him?","choices":["Passive; only observation or search firms will work","Active; his pool's quality is lower, so skip him","Semipassive; proactive outreach, since he may miss postings","Active; standard job ads will reach him reliably"],"correct":2,"explanation":"Semipassive seekers are comfortable but open, and look only occasionally, so they need more proactive outreach.","subtitle":"Ch 5.4 Apply · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-086","type":"scenario","front":"A firm wants to hire a top-performing data scientist who is happy at a competitor and isn't looking. Which approach fits best?","choices":["Waiting for her to apply on the careers site","Proactive, personalized outreach with rich detail on the role","A newspaper ad in the local business section","A general posting on several large job boards"],"correct":1,"explanation":"Passive seekers are often top quality but hardest to reach. They need the most proactive effort, time, and information.","subtitle":"Ch 5.4 Apply · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-087","type":"scenario","front":"A leadership team that has promoted only from within for 20 years keeps making the same strategic mistakes, and no one challenges ideas. Which sourcing shift fits best?","choices":["Rely more on employee referrals from the team","Use the talent inventory only","Recruit some leaders externally to bring fresh perspectives","Promote from within even faster"],"correct":2,"explanation":"External recruiting brings new ideas and reduces groupthink. Relying only on insiders for senior roles limits fresh insight.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-088","type":"scenario","front":"A firm's best analysts keep leaving because they see no path to advancement. Which recruiting approach most directly helps retain them?","choices":["Hire more experienced outside managers above them","Use executive search firms for every senior opening","Rely on walk-ins and print ads for new roles","Fill more openings internally and post them for employees first"],"correct":3,"explanation":"Internal recruiting shows employees a career path, which helps retain talented people.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-089","type":"scenario","front":"A manager needs a team lead in three weeks, on a tight budget, who already knows the company's systems and culture. Which source is likely best?","choices":["Global recruiting with visa sponsorship","Print advertising","Internal recruiting","A retained executive search firm"],"correct":2,"explanation":"Internal sources are usually faster and cheaper and need less onboarding because insiders know the culture and business.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-090","type":"scenario","front":"A company is launching a machine-learning product, and no current employee has the needed skills. Which source makes the most sense?","choices":["Succession management for the product team","External recruiting to reach a larger pool with the new skills","An internal job posting only, to reward loyalty","Promoting the most senior engineer to lead it"],"correct":1,"explanation":"External sources give access to a larger pool and skills the company doesn't have inside.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-091","type":"scenario","front":"A board is choosing between an internal candidate and an outside star for a division head role. What does research suggest about the outside hire?","choices":["Likely higher pay, a slower start, and a higher chance of leaving","Better performance from day one, since stars transfer easily","Lower pay and faster onboarding than the insider","No meaningful difference from an internal hire"],"correct":0,"explanation":"Research finds external hires are paid 18-20% more, perform worse in their first two years, and leave more often.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-092","type":"scenario","front":"Which statement correctly pairs a benefit with its source?","choices":["External: shorter onboarding; internal: larger pool","Internal: reduces groupthink; external: faster hiring","External: access to a larger applicant pool; internal: shorter onboarding","Internal: fresh perspectives; external: lower cost"],"correct":2,"explanation":"External sources widen the pool and bring new ideas. Internal sources are faster and cheaper, retain talent, and need less onboarding.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-093","type":"scenario","front":"A recruiting director compares sources on time to fill, cost, applicant diversity, quality, culture fit, and offer acceptance. What is she doing?","choices":["Evaluating source effectiveness against staffing goals","Writing a person specification for the role","Running a realistic job preview for each source","Building a succession management plan"],"correct":0,"explanation":"Sources are judged on speed, cost, quantity, quality, diversity, fit, and acceptance rates, with quality usually mattering most.","subtitle":"Ch 5.6 Apply · Effective HRM","note":"Read more: 5.6 Recruiting Sources"},{"id":"c202-ch05-094","type":"scenario","front":"A CEO plans to retire in three years. The board wants two internal candidates identified and developed through stretch assignments and mentoring. Which internal source is this?","choices":["Talent inventory","Employee referral","Succession management","Internal job posting"],"correct":2,"explanation":"Succession management prepares employees in advance to step into key roles when they open.","subtitle":"Ch 5.7 Apply · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-095","type":"scenario","front":"HR needs every employee with Mandarin fluency and supply-chain experience for a new Shanghai office, including people who aren't job hunting. Which tool fits?","choices":["Internal job posting","Search firm","Job fair","Talent inventory"],"correct":3,"explanation":"A talent inventory records employees' skills and experience, so HR can find fits even among people not looking.","subtitle":"Ch 5.7 Apply · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-096","type":"scenario","front":"A company wants every interested employee to have a fair chance at a new project manager role. Which internal source fits?","choices":["Internal job posting system","Succession management","Talent inventory alone","Observation"],"correct":0,"explanation":"Internal job postings announce openings to all employees so anyone interested can apply.","subtitle":"Ch 5.7 Apply · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-097","type":"scenario","front":"A firm relies only on internal job postings and keeps missing strong employees who never check the board. What's the fix?","choices":["Require employees to apply monthly","Combine postings with a talent inventory search","Stop posting jobs internally and rely on managers' picks","Hire externally for every role going forward"],"correct":1,"explanation":"Postings miss people who aren't looking. Pairing them with a talent inventory catches overlooked candidates.","subtitle":"Ch 5.7 Apply · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-098","type":"scenario","front":"A firm's top priority is new hires who perform well and stay, and it wants a fast, low-cost source. Which source fits best?","choices":["Employee referrals","Print advertisements","Walk-ins","General job boards"],"correct":0,"explanation":"Referrals are fast and cheap, and referred hires get realistic information, so they tend to perform well and stay longer.","subtitle":"Ch 5.8 Apply · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals"},{"id":"c202-ch05-099","type":"scenario","front":"A small company fills almost every role through employee referrals, and its workforce has become nearly all one demographic. What's the risk, and the fix?","choices":["No risk, since referrals are always the best source","Rising cost per hire; switch to executive search firms","Referral programs are illegal; stop them entirely","Homogeneity that may harm women and minorities; add diverse sources"],"correct":3,"explanation":"People refer people like themselves. Over-reliance on referrals can create adverse impact, so balance them with diverse sources.","subtitle":"Ch 5.8 Apply · Legal & Regulatory","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals"},{"id":"c202-ch05-100","type":"scenario","front":"A company needs a new chief financial officer with rare industry experience and is willing to pay for quality. Which source fits best?","choices":["A general job fair","A help-wanted sign","An executive search firm","Walk-ins"],"correct":2,"explanation":"Search firms specialize in hard-to-find, often executive talent. They're costly and slow but yield quality, and they can't poach from their own clients.","subtitle":"Ch 5.11 Apply · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-101","type":"scenario","front":"A seasonal garden center needs 25 cashiers within two weeks. Which combination fits best?","choices":["Specific help-wanted signs plus general job boards","A retained executive search firm for retail roles","Succession management of current part-timers","Global recruiting with seasonal visa sponsorship"],"correct":0,"explanation":"Fast, high-volume, lower-level hiring suits sources that reach active seekers, like specific help-wanted signs and job boards.","subtitle":"Ch 5.11 Apply · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-102","type":"scenario","front":"A logistics company wants disciplined, team-oriented workers with leadership experience and is committed to hiring veterans. Which source fits best?","choices":["Offshoring","Military transition services","Résumé databases of past applicants","Boomerang employees"],"correct":1,"explanation":"Military transition services connect employers with separating service members, veterans, and military spouses.","subtitle":"Ch 5.9 Apply · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation"},{"id":"c202-ch05-103","type":"scenario","front":"A firm wants to rehire a former engineer who left two years ago for a startup. What should it check first?","choices":["Only her new salary demands and start date","Whether she'll accept her old title and pay","Her past performance, what she did while away, and her view of the firm","Nothing; former employees are always a safe, known fit"],"correct":2,"explanation":"Boomerang employees know the job and their fit is known, but confirm they were good and why they left. Promoting returnees can signal that leaving pays.","subtitle":"Ch 5.10 Apply · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases"},{"id":"c202-ch05-104","type":"scenario","front":"A recruiter has a new opening identical to one filled three months ago, when two strong finalists weren't hired. What's the fastest source?","choices":["The résumé database of past applicants","A new print ad in a trade journal","A job fair scheduled for next quarter","An executive search firm"],"correct":0,"explanation":"Résumé databases keep prescreened candidates, including unhired finalists, who can be re-contacted quickly.","subtitle":"Ch 5.10 Apply · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases"},{"id":"c202-ch05-105","type":"scenario","front":"A software firm needs experienced back-end developers. Which job board approach is most targeted?","choices":["A state employment agency only","A specialty tech board such as Dice","A general newspaper classified","A walk-in sign"],"correct":1,"explanation":"Specialty boards concentrate one field's talent, while general boards reach many active seekers across fields.","subtitle":"Ch 5.10 Apply · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases"},{"id":"c202-ch05-106","type":"scenario","front":"A company needs extra customer-support capacity for a six-month product launch and doesn't want to add permanent headcount. Which source fits best?","choices":["Succession management of current staff","An internal job posting for permanent roles","An executive search firm on retainer","A temporary staffing agency or outsourcing"],"correct":3,"explanation":"Temporary agencies and outsourcing provide nonpermanent talent quickly; temp workers remain the agency's employees.","subtitle":"Ch 5.10 Apply · Effective HRM","note":"Read more: 5.10 External Recruiting Sources: Job Boards to Résumé Databases; 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-107","type":"scenario","front":"A firm wants a steady pipeline of entry-level analysts it can try out before offering full-time jobs. Which source fits best?","choices":["Boomerang employees","Observation","A college internship program","An executive search firm"],"correct":2,"explanation":"Internships are a two-way trial; many firms hire most new graduates from their intern pools.","subtitle":"Ch 5.11 Apply · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-108","type":"scenario","front":"A company wants applicants to learn about its culture and openings on their own and self-select before applying, at very low cost. Which source fits best?","choices":["Observation","Gig platforms","Its careers site","A search firm"],"correct":2,"explanation":"A careers site is very cost-effective and lets applicants judge culture fit before applying.","subtitle":"Ch 5.8 Apply · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals"},{"id":"c202-ch05-109","type":"scenario","front":"A nonprofit wants free help finding workers, including older workers and people with disabilities, along with applicant testing. Which source fits best?","choices":["A boomerang program","A state employment agency","An executive search firm","Offshoring"],"correct":1,"explanation":"State employment agencies offer free matching, counseling, testing, and training, with special services for veterans, people with disabilities, and older workers.","subtitle":"Ch 5.11 Apply · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-110","type":"scenario","front":"A construction firm notices a crew on another company's site that works safely, efficiently, and as a team, and it later recruits several of them. Which source is this, and what's the caution?","choices":["Observation; consider the ethics of costing the other firm","Employee referrals; risk of a homogeneous workforce","Walk-ins; applicants may be poorly fitting","Job fairs; only active seekers attend"],"correct":0,"explanation":"Observation means watching people do similar work elsewhere. It reaches passive seekers but raises ethical questions about poaching.","subtitle":"Ch 5.9 Apply · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation"},{"id":"c202-ch05-111","type":"scenario","front":"A tech company hosts an online coding contest whose winners get cash and job interviews. What kind of source is this?","choices":["Written advertising","State employment agency","Succession management","Creative sourcing"],"correct":3,"explanation":"Creative sourcing finds qualified people in new ways. It must actually reach better candidates, not just be novel.","subtitle":"Ch 5.8 Apply · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals"},{"id":"c202-ch05-112","type":"scenario","front":"A U.S. firm wants to hire a software engineer who is a citizen of another country and lives abroad. What does it need to plan for?","choices":["Only a signed offer letter and a background check","Visa sponsorship such as H-1B, the prevailing wage, and a long process","Nothing; any foreign national can start immediately","Paying below the prevailing wage to offset sponsorship costs"],"correct":1,"explanation":"Hiring non-U.S. citizens requires work authorization, often H-1B sponsorship, at least the prevailing wage, and possibly DOL certification.","subtitle":"Ch 5.9 Apply · Legal & Regulatory","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation"},{"id":"c202-ch05-113","type":"scenario","front":"An employee hired in March 2019 leaves in June 2026. Under federal rules, how long must the employer keep her Form I-9?","choices":["Forever","Until June 2027, one year after she leaves, because the later date controls","Until March 2022, three years after hire, because the earlier date controls","Only until her last day"],"correct":1,"explanation":"Federal rules (USCIS) require keeping the I-9 for 3 years after hire or 1 year after employment ends, whichever is LATER. Here that's June 2027. Note: the textbook says 'whichever is less,' which would wrongly point to March 2022; follow the federal rule at work.","subtitle":"Ch 5.9 Apply · Legal & Regulatory","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation"},{"id":"c202-ch05-114","type":"scenario","front":"An HR manager wants new hires with the longest tenure. Based on research, which sources should she favor?","choices":["Only search firms","Only walk-ins","Informal sources such as referrals and rehires","Formal sources such as print ads and internet postings"],"correct":2,"explanation":"Informal sources tend to beat formal ones on performance and tenure, likely because they give more realistic information.","subtitle":"Ch 5.11 Apply · Effective HRM","note":"Read more: 5.11 External Recruiting Sources: Schools to Advertisements"},{"id":"c202-ch05-115","type":"scenario","front":"A company considers offshoring its core product's source code development to cut costs. What's the biggest concern?","choices":["Offshoring will move faster than hiring domestically","Offshoring software work is illegal under U.S. law","It guarantees higher quality at a lower cost","Protecting intellectual property and managing legal and cultural risks"],"correct":3,"explanation":"Offshoring cuts labor costs but brings IP, legal, and cultural risks. Firms like Symantec keep core secrets in-house.","subtitle":"Ch 5.9 Apply · Effective HRM","note":"Read more: 5.9 External Recruiting Sources: Job Fairs to Observation"},{"id":"c202-ch05-116","type":"scenario","front":"A company ignores most applicants after they apply and never tells rejected candidates anything. Several post about it online, and some say they'll stop buying its products. What is this?","choices":["A realistic job preview","Strategic recruiting metrics","A negative recruitment spillover effect","Signaling"],"correct":2,"explanation":"Recruitment spillover effects are unintended consequences of recruiting. Poor treatment spreads and can hurt sales and future recruiting.","subtitle":"Ch 5.12 Apply · Effective HRM","note":"Read more: 5.12 Recruiting"},{"id":"c202-ch05-117","type":"scenario","front":"A recruiter shows up late to a campus interview, can't answer questions about the job, and never follows up. What will candidates likely conclude?","choices":["That the company itself is disorganized","Nothing; candidates judge only the job and its pay","That the company is busy and growing quickly","That the job must pay well to make up for it"],"correct":0,"explanation":"Signaling: candidates read a recruiter's professionalism and timeliness as clues about the organization.","subtitle":"Ch 5.13 Apply · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics"},{"id":"c202-ch05-118","type":"scenario","front":"A recruiting team is rewarded only for filling jobs fast and cheaply. New hires leave within months. What should change?","choices":["Add strategic metrics, like 6-12 month performance, to recruiter rewards","Track cost per hire and time to fill more closely","Fill jobs even faster to reduce vacancy costs","Stop measuring recruiting so recruiters aren't rushed"],"correct":0,"explanation":"Efficiency metrics can cut costs without improving performance. Strategic metrics tie recruiting to quality hires who stay and perform.","subtitle":"Ch 5.14 Apply · Effective HRM","note":"Read more: 5.14 Recruiting Metrics"},{"id":"c202-ch05-119","type":"scenario","front":"Which of these is a strategic recruiting metric rather than an efficiency metric?","choices":["Number of applicants per posting","Job performance of new hires 6-12 months after hire","Average cost per hire across all sources","Average time to fill each open position"],"correct":1,"explanation":"Strategic metrics track outcomes tied to performance and strategy. Cost, speed, and applicant counts are efficiency metrics.","subtitle":"Ch 5.14 Apply · Effective HRM","note":"Read more: 5.14 Recruiting Metrics"},{"id":"c202-ch05-120","type":"scenario","front":"A posting simply says 'Great opportunity! Apply now!' and draws 2,000 applicants, most unqualified. What should the company change?","choices":["Make it specific: location, level, pay range, and requirements","Make it even more general so it reaches more people","Remove pay details so applicants aren't scared off","Post it on more job boards to widen the pool"],"correct":0,"explanation":"Specific, informative messages help people self-select out, cutting screening costs. General ads raise quantity but lower quality.","subtitle":"Ch 5.15 Apply · Effective HRM","note":"Read more: 5.15 The Recruiting Message"},{"id":"c202-ch05-121","type":"scenario","front":"Call center hires keep quitting within weeks, saying the job wasn't what they expected. What low-cost step most directly addresses this?","choices":["Hiding the difficult parts until after the first month","A realistic job preview showing both the good and hard parts of the job","Bigger signing bonuses","More general job ads"],"correct":1,"explanation":"When leavers say 'not what I expected,' an RJP is a cheap way to cut turnover by setting accurate expectations.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-122","type":"scenario","front":"After watching a candid video about night shifts and demanding customers, several applicants withdraw. Which RJP function is at work?","choices":["Vaccination","Commitment to the choice","Signaling","Self-selection"],"correct":3,"explanation":"Self-selection: with a balanced picture, people who would be poor fits opt out on their own.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-123","type":"scenario","front":"A new hire who saw an honest preview of how frustrating some customers can be copies coping tips from it and handles her first angry caller calmly. Which RJP function is this?","choices":["Vaccination","Self-selection","Commitment to the choice","Spillover"],"correct":0,"explanation":"Vaccination: lowering inflated expectations lets new hires prepare coping strategies for the job's tough parts.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-124","type":"scenario","front":"A candidate accepts an offer knowing the job involves frequent travel and tight deadlines, and later says, 'I knew what I signed up for.' Which RJP function does this reflect?","choices":["Self-selection","Vaccination","Signaling","Commitment to the choice"],"correct":3,"explanation":"Knowingly accepting a job's downsides increases commitment to the decision.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-125","type":"scenario","front":"A manager drafting an RJP wants to warn applicants the job is 'extremely stressful and chaotic.' What's the better approach?","choices":["Skip the RJP and raise starting pay instead","State the facts objectively and let applicants judge for themselves","Emphasize only the negatives so no one is surprised","Leave out anything negative so good applicants aren't lost"],"correct":1,"explanation":"RJPs give balanced, objective information. A common mistake is stressing only negatives or using loaded labels.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-126","type":"scenario","front":"A warehouse with abusive supervisors and unsafe conditions wants an RJP to reduce turnover. What should it do first?","choices":["Screen for applicants who are less likely to complain","Raise recruiting ad spending to replace leavers faster","Fix the job first, such as retraining supervisors and improving safety","Launch the RJP right away, since honesty fixes turnover"],"correct":2,"explanation":"Realistic information about a bad job is no substitute for a better job. Improve the job first.","subtitle":"Ch 5.16 Apply · Effective HRM","note":"Read more: 5.16 Realistic Job Previews"},{"id":"c202-ch05-127","type":"scenario","front":"A student says, 'I think of that company as the one with the oil spill a few years ago.' What is she describing?","choices":["Recruitment metrics","Signaling","Organizational image","Employer brand"],"correct":2,"explanation":"Organizational image is a general impression based on feelings and facts, and it exists whether or not the company manages it.","subtitle":"Ch 5.18 Apply · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies"},{"id":"c202-ch05-128","type":"scenario","front":"A company launches a campaign, 'Grow your career with us,' with employee stories and a clear statement of what it offers staff. What is it building?","choices":["An organizational image","A talent inventory","A replacement chart","An employer brand"],"correct":3,"explanation":"The employer brand is what the company deliberately communicates it offers employees. Image is what individuals hold; brand is what the organization creates.","subtitle":"Ch 5.19 Apply · Effective HRM","note":"Read more: 5.19 Employer Brand"},{"id":"c202-ch05-129","type":"scenario","front":"A firm's ads promise 'work-life balance,' but Glassdoor reviews describe 70-hour weeks. What's the most likely result?","choices":["Applicants will ignore the reviews","The brand will succeed because ads matter most","Higher offer acceptance with no downside","New hires' expectations go unmet and turnover rises"],"correct":3,"explanation":"An employer brand must be true. Review sites expose gaps, and unmet expectations drive quits.","subtitle":"Ch 5.19 Apply · Effective HRM","note":"Read more: 5.19 Employer Brand"},{"id":"c202-ch05-130","type":"scenario","front":"Recruiters face strict monthly quotas with penalties, and some start telling recruits the job has 'almost no travel' when it has a lot. What should leadership do?","choices":["Rescind offers to recruits who complain about the travel","Adopt a recruiter ethics code, put agreements in writing, and rethink quotas","Raise quotas and add bonuses so recruiters feel less pressure","Nothing, since no agency regulates recruiting practices"],"correct":1,"explanation":"Punitive quotas push numbers over ethics. With no agency regulating recruiting, firms need codes of ethics, written agreements, and channels for issues.","subtitle":"Ch 5.20 Apply · Effective HRM","note":"Read more: 5.20 Ethical Issues"},{"id":"c202-ch05-131","type":"scenario","front":"A company receives 5,000 applications a week and candidates complain they never hear back. Which tools help most?","choices":["A bigger print advertising budget","Fewer recruiters, each with more requisitions","An applicant tracking system plus a chatbot for updates","More paper applications to slow the volume"],"correct":2,"explanation":"ATS software manages volume and tracks status; chatbots answer questions 24/7, improving speed and the candidate experience.","subtitle":"Ch 5.13 Apply · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics"},{"id":"c202-ch05-132","type":"scenario","front":"A postal service has new carriers play a simulation of their first week before they start, and trainee dropout falls sharply. What is this?","choices":["Creative sourcing through observation of carriers","Recruitment gamification that also works as a realistic preview","Succession management for future carriers","An efficiency metric for time to productivity"],"correct":1,"explanation":"Gamification uses game elements to attract, engage, and assess candidates; a job simulation also previews the work realistically.","subtitle":"Ch 5.13 Apply · Effective HRM","note":"Read more: 5.13 Important Recruiter Characteristics"},{"id":"c202-ch05-133","type":"scenario","front":"Someone who scans job postings, sends out résumés, and messages LinkedIn contacts about openings is what kind of job seeker?","choices":["Passive","Semipassive","Active","Passive-aggressive"],"correct":2,"explanation":"Active seekers are looking right now.","subtitle":"Ch 5.4 Practice · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-134","type":"scenario","front":"Which description fits a semipassive job seeker?","choices":["Not looking at all, but could be tempted","Comfortable in the current job but interested in a new one","Actively sending out résumés","Browsing job boards to apply today"],"correct":1,"explanation":"Semipassive seekers are content but open, looking only occasionally.","subtitle":"Ch 5.4 Practice · Effective HRM","note":"Read more: 5.4 Sourcing"},{"id":"c202-ch05-135","type":"scenario","front":"Preparing employees to become managers if those jobs open up is called...","choices":["Talent inventory","External recruiting","Succession management","Organizational design"],"correct":2,"explanation":"Succession management prepares employees in advance for key roles.","subtitle":"Ch 5.7 Practice · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-136","type":"scenario","front":"Which internal source communicates job openings to current employees?","choices":["Succession management","Talent inventory","Internal management","Internal job posting systems"],"correct":3,"explanation":"Internal job postings let any interested employee apply.","subtitle":"Ch 5.7 Practice · Effective HRM","note":"Read more: 5.7 Internal Recruiting Sources"},{"id":"c202-ch05-137","type":"scenario","front":"Why do employee referrals tend to be high-quality recruits?","choices":["Good employees tend to refer good recruits","Referrals are inexpensive","Referrals are demographically similar","Employees receive referral bonuses"],"correct":0,"explanation":"Top performers tend to know and recommend other strong performers. Being cheap or similar doesn't make referrals good.","subtitle":"Ch 5.8 Practice · Effective HRM","note":"Read more: 5.8 External Recruiting Sources: Careers Sites to Referrals"},{"id":"c202-ch05-138","type":"scenario","front":"Fill in the blanks: ___ identifies the talent that ___ attracts.","choices":["Recruiting; sourcing","HRM; succession management","HRM; sourcing","Sourcing; recruiting"],"correct":3,"explanation":"Sourcing finds the talent; recruiting attracts it.","subtitle":"Ch 5.12 Practice · Effective HRM","note":"Read more: 5.12 Recruiting"},{"id":"c202-ch05-139","type":"scenario","front":"A general impression of a company based on both feelings and facts is its...","choices":["Employer image","Organizational image","Organizational design","Organizational metrics"],"correct":1,"explanation":"Organizational image is the overall impression. Employer image is reputation as an employer specifically.","subtitle":"Ch 5.18 Practice · Effective HRM","note":"Read more: 5.18 Applicant Attraction Strategies"},{"id":"c202-ch05-140","type":"scenario","front":"A company's reputation specifically as a place to work is its...","choices":["Employer image","Organizational image","Organizational design","Organizational metrics"],"correct":0,"explanation":"Employer image is how people see the company as an employer.","subtitle":"Ch
