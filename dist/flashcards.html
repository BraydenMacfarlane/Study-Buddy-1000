f HRM in High-Performance Work Systems?"},{"id":"c202-ch02-087","type":"scenario","front":"The moral standards that define socially accepted right and wrong behavior are called...","choices":["Policies","Laws","Ethics","Strategies"],"correct":2,"explanation":"Ethics are moral standards of right and wrong. Laws are legal requirements, and the two don't always match.","subtitle":"Ch 2 Quiz Q6 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-088","type":"scenario","front":"A company's ethics policy stresses respect and compassion for everyone, especially its most vulnerable stakeholders. Which standard is that?","choices":["Rights","Fairness","Utilitarian","Common good"],"correct":3,"explanation":"The common good standard emphasizes respect and compassion for all, especially the vulnerable.","subtitle":"Ch 2 Quiz Q7 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-089","type":"scenario","front":"Which ethical standard asks whether an action is consistent with ideals like civility, compassion, and benevolence?","choices":["Virtue","Rights","Utilitarian","Fairness"],"correct":0,"explanation":"The virtue standard judges actions by whether they reflect ideal character traits.","subtitle":"Ch 2 Quiz Q8 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-090","type":"scenario","front":"Rolling out a new benefits program is an example of what HR commonly manages?","choices":["Theories","Concepts","Strategies","Changes"],"correct":3,"explanation":"New benefits programs, processes, locations, HRIS upgrades, and international expansion are common HR-managed changes.","subtitle":"Ch 2 Quiz Q9 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-091","type":"scenario","front":"What keeps employees committed when an organization is going through change?","choices":["Diversity","Trust","Performance","Ethics"],"correct":1,"explanation":"Trust is the glue that holds commitment together during uncertainty.","subtitle":"Ch 2 Quiz Q10 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-092","type":"scenario","front":"Two firms announce a merger. In the early phase, which pair of activities should HR focus on?","choices":["Ethics and diversity","Staffing and performance management","Talent planning and retention","Language and policy"],"correct":2,"explanation":"HR should start talent planning and retention early so key people don't leave during the uncertainty.","subtitle":"Ch 2 Quiz Q11 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-093","type":"scenario","front":"Involving employees in managing which of these increases their commitment?","choices":["Culture","Change","Control","Concepts"],"correct":1,"explanation":"Employee participation in change management reduces resistance and builds commitment.","subtitle":"Ch 2 Quiz Q12 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-094","type":"scenario","front":"A strategy can be strengthened or sabotaged depending on its fit with the organization's...","choices":["Values","Approach","Strategy","Culture"],"correct":3,"explanation":"Culture reinforces or undermines strategy depending on the fit.","subtitle":"Ch 2 Quiz Q13 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-095","type":"scenario","front":"What should be tied to business goals and used to drive the right behaviors?","choices":["Vacancy rates","Revenue","Metrics","Rates"],"correct":2,"explanation":"Effective HR metrics tie to business goals, drive behavior, link to rewards, and guide decisions.","subtitle":"Ch 2 Quiz Q14 · Strategic HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-096","type":"scenario","front":"HR needs to deal with culture issues before, during, and after a...","choices":["Training program","Merger","Performance review","Planning cycle"],"correct":1,"explanation":"Culture problems sink mergers, so HR addresses them in every phase: due diligence, integration, and post-close.","subtitle":"Ch 2 Quiz Q15 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-097","type":"scenario","front":"A company built on formal structures and detailed procedures has which type of culture?","choices":["Consensual","Competitive","Entrepreneurial","Bureaucratic"],"correct":3,"explanation":"Bureaucratic cultures value formal structure, correct procedures, and consistency.","subtitle":"Ch 2 Quiz Q16 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-098","type":"scenario","front":"For a merger or acquisition to succeed, which type of planning is essential?","choices":["Diversity planning","Succession planning","Performance planning","Talent planning"],"correct":3,"explanation":"Talent planning identifies the people the combined firm needs and how to keep them, which is critical when talent drives deal value.","subtitle":"Ch 2 Quiz Q17 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-099","type":"scenario","front":"Facing a revenue drop, a CEO cuts every employee's pay by 8% instead of laying off 10% of staff, reasoning it does the most good and the least harm overall. Which standard is she applying?","choices":["Fairness","Rights","Utilitarian","Common good"],"correct":2,"explanation":"Weighing total benefits against total harms (spreading a small cut over everyone instead of a big loss for a few) is the utilitarian standard.","subtitle":"Ch 2 Quiz Q18 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-100","type":"scenario","front":"Companies are often acquired because the buyer needs the target's...","choices":["Culture","Talent and skills","Diversity","Culture and diversity"],"correct":1,"explanation":"Acquiring talent is a common motive, which is why retaining key people after the deal is critical.","subtitle":"Ch 2 Quiz Q19 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-101","type":"scenario","front":"For an organizational change to succeed, what must employees change?","choices":["Their objectives and goals","Their behaviors and conduct","Their behaviors and goals","Their objectives and conduct"],"correct":2,"explanation":"Change requires new behaviors and aligned goals; HR supports it with training, feedback, and rewards tied to the new behaviors.","subtitle":"Ch 2 Quiz Q20 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"}]},{"id":"c202-ch03","folder":"C202 Ch 3: The Legal Context of HRM","course":"C202","order":3,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 3 Study Guide: The Legal Context of HRM\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter. This is a study aid, not legal advice.*\n\n## How this chapter maps to your competencies\n\nThis chapter is the core of **Legal and Regulatory Requirements**: *analyzing applicable legal and regulatory requirements to determine whether organizations meet legal responsibilities*. It makes up about 13% of the Objective Assessment (OA), almost all from this one chapter, so it's worth extra time. Expect scenario questions like: Which law applies? Is this question legal to ask? Is the company compliant? Is this disparate treatment or adverse impact? The diversity-and-performance material (3.6) also supports **Strategic HRM**.\n\nChapter 3 is part of **Quarter 1** (Chapters 1-4), which ends with a quarterly quiz. WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n## 3.1-3.3 Why the legal context matters\n\nFollowing employment law is the ethical thing to do, and it's good business. It avoids lawsuits, legal costs, and bad publicity. More importantly, it pushes companies to make decisions based on job-relevant information (skills, performance, merit) instead of traits like race, gender, or disability, and that produces better hires. In the Chapter 1 model, laws and diversity shape what employees **should** do.\n\nLaws come from federal, state, and local governments, and court rulings keep changing them, so HR has to keep managers current and know when to call an employment lawyer.\n\n*Opening case:* Merck treats diverse, engaged talent (minorities, women, veterans, LGBT employees, people with disabilities) as essential to its global success. Its diversity leader argues that diversity and inclusion aren't box-checking; they drive the bottom line.\n\n## 3.4 HRM and risk management\n\n**Risk management** means identifying, assessing, and resolving risks before they become serious threats. HR risks include turnover, low morale, misunderstandings that lead to lawsuits, and bad publicity.\n\n- **Risk assessment:** identify risks (law changes, talent shortages), analyze them, and prioritize by likelihood and impact.\n- **Risk control:** plan and monitor. HR tools include good screening, sourcing talent ahead of demand, succession planning, training hiring managers on bias and employment law, and compliance audits.\n\n### Four ways to handle a risk\n\n1. **Avoidance:** withdraw from it (skip an acquisition with a bad culture fit).\n2. **Reduction:** mitigate it (train recruiters on employment law).\n3. **Sharing:** transfer it through outsourcing or insurance (outsource background checks).\n4. **Retention:** accept it and budget for it (reserve funds for settlements or severance).\n\n*Sarbanes-Oxley Section 409* requires public companies to disclose material changes in real time, including executive departures, employment lawsuits, and new labor contracts. Executives are personally responsible for accurate reports, which raised HR's role in managing risk.\n\n## 3.5 Why employment laws exist\n\nEmployers hold more **power** than employees over pay, promotion, and working conditions. Laws limit that power, reduce unfair discrimination, and provide equal opportunity.\n\n### Fair vs. unfair vs. unlawful\n\n- **Fair discrimination** uses only objective, merit-based, job-related characteristics. Choosing the most skilled candidate is fair, legal, and strategic.\n- **Unfair discrimination** uses anything else.\n- An **unlawful employment practice** violates a federal, state, or local law, such as rejecting someone because of pregnancy, religion, or age.\n\n*Key distinction:* unfair isn't automatically unlawful. Firing employees for wearing a rival sports team's colors is unfair, but it's legal unless it targets or disproportionately harms a protected group.\n\n**Equal employment opportunity (EEO)** means practices designed to treat applicants and employees consistently regardless of protected characteristics. Laws alone don't remove barriers, so companies have to manage diversity proactively.\n\n## 3.6 Diversity, inclusion, and performance\n\nThis is the first item on WGU's checklist. **Diversity** is the mix of people; **inclusion** means everyone feels respected and heard and can contribute fully.\n\n*Why it matters:*\n\n- Diversity fuels **creativity and innovation** because people bring different ideas.\n- It widens the talent pool and helps hire, retain, and motivate top performers.\n- A positive diversity climate is linked to **customer satisfaction**, and diverse consumer markets are worth trillions.\n\n*The catch:* having a diverse staff isn't enough. People need positive attitudes toward working with differences, and inclusion is what unlocks diversity's value. Coca-Cola, for example, aims for its workforce to mirror its diverse marketplace.\n\n## 3.7 Kinds of law and the role of states\n\n- **Constitutional law** overrides all others and matters most for public employees' due process rights.\n- **Common law** is built case by case from court decisions.\n- A **workplace tort** is a civil wrong where an employer breaches a duty to employees or customers, handled at the state level. Using an employee's photo in an ad without consent is an example.\n\n*States can go further than federal law.* They can cover smaller employers or protect extra groups. New York protects parental status, Washington protects obesity, and New Jersey's age law covers ages 18-70. Agencies like the Department of Labor and the EEOC interpret and enforce the laws.\n\n## 3.8-3.10 The major federal employment laws\n\nThe quick reference below has the full list. Here are the ideas you most need to understand, not just memorize.\n\n### Title VII and protected classes\n\n**Title VII of the Civil Rights Act (1964)** bars discrimination based on **race, color, religion, sex, and national origin**. A 2020 Supreme Court ruling held that \"sex\" includes **sexual orientation and transgender status**. Persistently refusing to use an employee's stated name or pronouns can be treated as sex discrimination. Title VII covers both intentional discrimination and practices with discriminatory effects, and it created the **EEOC**.\n\n*What Title VII does NOT cover:* age (ADEA), disability (ADA and Rehabilitation Act), veteran status (USERRA and VEVRAA), and genetic information (GINA). Pregnancy was added to Title VII by the Pregnancy Discrimination Act. Marital status isn't federally protected, though some states add groups.\n\n### BFOQ\n\nA **bona fide occupational qualification (BFOQ)** is a protected trait that is truly essential to the job, so that the business would be undermined without it. It's the only defense to obvious disparate treatment. Same-gender officers for certain duties on gender-segregated prison wards can qualify. **Race and color are never BFOQs**, and customer preference never justifies one. A club that hires only young women because customers like it has no BFOQ.\n\n### Disability law in practice\n\nThe **ADA** protects qualified people who have, have a record of, or are regarded as having a **disability**: an impairment that substantially limits a major life activity. A **qualified individual** can perform the job's essential functions with **reasonable accommodation**, which employers must provide unless it causes **undue hardship**. You can't ask applicants about disabilities or medical history before a job offer. *Example:* a deaf applicant may need an interpreter at the interview.\n\n### Leave, pay, and benefits laws\n\nThe **FMLA** gives eligible employees at worksites with 50+ employees up to **12 workweeks** of unpaid, job-protected leave a year, with health coverage continued. Military caregiver leave allows up to **26 workweeks**. Managers can be personally liable for FMLA violations. **USERRA** protects service members and guarantees reemployment with the seniority and pay they would have earned; Target lost a USERRA case that included $900,000 in punitive damages. The **ACA** requires employers with 50+ full-time employees to offer insurance.\n\n### Genetic information and interview questions\n\n**GINA** bars using, or even acquiring, genetic information, including **family medical history**. That makes social media screening risky: a candidate's post about a parent's hereditary illness is genetic information. Train recruiters not to ask about family health.\n\n*A key insight:* no interview question is illegal in itself. What's illegal is using protected information from the answer in a decision, so smart employers avoid those questions entirely.\n\n### Immigration\n\n**IRCA** requires a **Form I-9** for every new hire within **3 days**, verifying identity and work authorization. Make offers contingent on eligibility instead of asking about citizenship, which could suggest national origin bias. E-Verify checks eligibility online.\n\n### Global note\n\nEmployment laws vary widely by country. Some countries require government permission for layoffs, and the EU's GDPR changed how companies can contact European candidates. U.S. multinationals must follow host-country laws.\n\n## Law quick reference (3.8-3.10)\n\nEach entry gives the year, purpose, who's protected or covered, and the key numbers.\n\n- **NLRA (Wagner Act), 1935:** protects the right to unionize and bargain collectively, and bars employer interference and retaliation against organizing.\n- **FLSA, 1938:** sets the minimum wage, overtime, recordkeeping, and youth employment rules for private and government employers. Some jobs are exempt, such as salaried executives, commissioned salespeople, and farm workers.\n- **Equal Pay Act, 1963:** equal pay for equal work regardless of sex, meaning substantially the same skill, effort, responsibility, and conditions in the same establishment. Seniority, merit, and quality or quantity of output can justify differences. The fix is raising the lower pay, never cutting the higher.\n- **Title VII, 1964:** bars discrimination based on race, color, religion, sex (including sexual orientation and gender identity), and national origin. It covers employers with 15+ employees and created the EEOC.\n- **ADEA, 1967:** bars age discrimination against workers **40 and older**.\n- **Rehabilitation Act, 1973:** federal contractors must take affirmative action to hire people with disabilities. Section 503 sets a **7%** utilization goal, and missing it isn't a violation by itself.\n- **VEVRAA, 1974:** federal contractors with contracts of **$25,000+** must take affirmative action for protected veterans.\n- **Pregnancy Discrimination Act, 1978:** an amendment to Title VII. Pregnancy, childbirth, and related conditions must be treated like other temporary conditions.\n- **COBRA, 1986:** lets workers and families continue group health coverage for a limited time after job loss, reduced hours, divorce, or death. It applies to employers with **20+ employees**.\n- **IRCA, 1986:** requires a Form I-9 verifying identity and work authorization for every new hire within **3 days**. It's enforced aggressively, including criminal charges against managers.\n- **WARN Act, 1988:** employers with **100+ full-time workers** must give **60 days' notice** of plant closings and mass layoffs.\n- **ADA, 1990 (amended 2008):** equal opportunity for people with actual, past, or perceived disabilities. It requires reasonable accommodation short of undue hardship and bars medical questions before a job offer.\n- **Civil Rights Act of 1991:** strengthened Title VII. It added compensatory and punitive damages for intentional discrimination, made a protected trait being a **motivating factor** enough for liability, and banned **race norming**.\n- **OSH Act, 1970:** created OSHA in the Department of Labor. Employers must provide a workplace free of recognized hazards and meet safety standards. *The notes barely cover it, so know its purpose.*\n- **FMLA, 1993:** at worksites with **50+ employees**, eligible workers get up to **12 workweeks** of unpaid, job-protected leave a year for a new child, their own or a family member's serious health condition, or a military exigency. Military caregiver leave allows **26 workweeks**. Health coverage continues, and managers can be personally liable.\n- **USERRA, 1994:** protects current, future, and returning service members from discrimination and guarantees reemployment with the seniority, status, and pay they would have earned.\n- **HIPAA, 1996:** protects the privacy and security of health information, with standards set by HHS.\n- **GINA, 2008:** bars acquiring or using genetic information, including family medical history, in employment decisions.\n- **ACA, 2010:** employers with **50+ full-time employees** must offer health insurance. Firms under 25 employees can get tax breaks.\n- **Executive Order 11246:** federal contractors with **$50,000+** in contracts and **50+ employees** need written affirmative action plans. The OFCCP enforces it.\n\n## 3.11 Affirmative action\n\nWGU asks you to define it: **affirmative action** is proactive effort to eliminate discrimination and its past effects by expanding opportunity for protected classes. Examples include actively recruiting women and minorities, outreach to diverse schools, and mentoring programs.\n\n*What it is NOT:* quotas, hiring unqualified people, or firing anyone to make room. Goals require only a good-faith effort. Simply obeying Title VII isn't affirmative action either, because it isn't proactive. **Preferential treatment**, meaning a hiring preference for a protected-group member, is allowed only temporarily under a court-ordered settlement.\n\n*Who must do it:* federal contractors under EO 11246, Section 503, and VEVRAA. A defensible plan is remedial, includes nonminorities, is temporary, and is formal and written. Affirmative action ties diversity (3.6) to the law.\n\n## 3.12 Independent contractors\n\nAn **independent contractor** is a person or business where the client controls only the **result**. If the company controls *what* is done *and how*, the worker is legally an employee, whatever the contract says. *Example:* an electrician bids a fixed price for a job, gets paid on schedule no matter the hours worked, and advertises to other clients, so they're a contractor. Contractors offer flexibility and cost savings, but **misclassification** means back employment taxes plus penalties, and cash-strapped states pursue it aggressively.\n\n## 3.13-3.14 Sexual harassment\n\n- **Quid pro quo:** a job outcome (hiring, a raise, keeping the job) is made conditional on sexual favors. One incident is enough.\n- **Hostile environment:** unwelcome conduct such as jokes, comments, whistling, or offensive images that makes work intimidating or offensive.\n\nAnyone of any sex can be a victim or a harasser. The employer is liable when a supervisor's harassment ends in a tangible action such as firing or demotion. Otherwise, it can defend itself only if it used **reasonable care** to prevent and promptly correct harassment and the employee unreasonably failed to complain. A strong **policy** defines harassment, commits to zero tolerance, offers several reporting channels, explains investigations, bans retaliation, and is backed by annual training.\n\n## 3.15 Disparate treatment vs. adverse impact\n\nThis is the third checklist item and a guaranteed exam topic.\n\n- **Disparate treatment** is *intentional*: different standards based on a protected trait, such as asking only women about childcare. A prima facie case shows the person is in a protected group, applied and was qualified, was rejected, and the job stayed open. The employer's defenses are a **BFOQ** or a legitimate, nondiscriminatory reason.\n- **Adverse impact** (disparate impact) is about *effect*: a neutral-looking rule that disproportionately screens out a protected group, such as a height requirement that excludes more women. The employer's defense is that the rule is **job-related and a business necessity**.\n\n*Griggs v. Duke Power (1971)* established adverse impact: diploma and test requirements that screened out Black workers without being job-related were illegal. *Ricci v. DeStefano (2009)* held that a company can't throw out valid test results just because of adverse impact.\n\n**The four-fifths rule:** divide each group's selection rate by the highest group's rate. A ratio below 0.80 signals adverse impact. *Worked example:* 60 of 100 men pass (60%) and 20 of 50 women pass (40%). 40 ÷ 60 = 0.67, below 0.80, so the test should be examined.\n\n## 3.16 Fraudulent recruitment, negligent hiring, retaliation\n\n- **Fraudulent recruitment** means misrepresenting the job or company to land a hire. Even oral promises can bind you, so don't create a false impression.\n- **Negligent hiring** means hiring someone the employer knew or *should have known* could harm others. Skipping reference or background checks for jobs with customer, child, or in-home contact is the classic trap.\n- **Retaliation** is an adverse action against someone for protected activity: complaining, filing a charge, testifying, or opposing illegal practices. The test is whether it would deter a reasonable employee, such as a smaller raise or exclusion from training. It is illegal even if the original complaint fails, and it's among the most common charges.\n\n## 3.17 Enforcement agencies\n\nThe **EEOC** enforces Title VII, the ADEA, the ADA, the Equal Pay Act, the Rehabilitation Act, and the Civil Rights Act of 1991. Remedies include reinstatement, **back pay**, **front pay**, and compensatory and punitive damages for intentional discrimination. Employers with 15+ employees must keep employment records. The Labor Department's **OFCCP** enforces affirmative action duties for federal contractors (EO 11246, Section 503, VEVRAA) through plan reviews and audits.\n\n## 3.18-3.19 Barriers to equal treatment and the four biases\n\n**Structural barriers** show up in recruiting (relying on referrals), advancement (unequal access to visible assignments), terms and conditions (unequal pay, inflexible hours), and termination (unfair layoff criteria). This is the sixth checklist item. Biases create barriers because biased judgments replace job-related facts:\n\n1. **Stereotyping:** assuming everyone in a group shares traits (\"overqualified people get bored\").\n2. **Prejudice:** outright bigotry toward a group.\n3. **Perception of possible personal loss:** fearing diversity will cost you opportunities, so you withhold help.\n4. **Ignorance:** not knowing what the law requires. It's never a legal defense.\n\n## 3.20 Ethical traps\n\nKnowing what's right isn't the same as doing it. Watch for **fear of retaliation**, **motivated blindness** (overlooking what you'd rather not see), **lowered thresholds** (small lapses make bigger ones easier), **rationalization** (\"everyone does it\"), **overvaluing money**, and a **lack of moral courage**.\n\n## 3.21 Algorithmic bias\n\n**Algorithmic bias** happens when an AI tool trained on biased past decisions reproduces that bias, creating adverse impact risk. Don't use protected traits or their proxies, audit results regularly with the four-fifths rule, and run AI tools separately so problems can be spotted and fixed.\n\n## 3.22-3.24 Merck, interview questions, and unconscious bias\n\nMerck backs diversity with a Global D&I Center of Excellence, employee resource groups, and outreach such as scholarships and partnerships with veterans groups. In interviews, ask only **job-related** questions:\n\n- *Avoid:* date of birth, birthplace, citizenship, marital status, Miss/Mrs./Ms., owning a home, commute distance, height and weight, discharge type, working on Christmas.\n- *Ask instead:* \"Are you legally authorized to work in the U.S.?\", \"Can you arrive by 8 a.m.?\", \"Can you meet the required schedule?\", and education or military experience *when job-relevant*.\n\n**Unconscious biases** are automatic attitudes that shape decisions without our awareness. Structured processes and diverse panels help counter them.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Explain how diversity and inclusion benefit organizational performance.\n2. Define affirmative action.\n3. Describe the differences between adverse impact and disparate treatment.\n4. Identify the protected classes and the laws that protect them.\n5. Identify the key purposes of the following employment laws: ADA, ADEA, Equal Pay Act, Title VII of the Civil Rights Act, Pregnancy Discrimination Act, the Civil Rights Act of 1991, Fair Labor Standards Act (FLSA), ACA, HIPAA, OSH Act, FMLA, USERRA, and IRCA.\n6. Explain how biases can create barriers to equal treatment in the organization.\n\nTo get there, make sure you can also explain:\n\n- Which law applies to a given scenario, and whether the company is compliant\n- Why unfair isn't always unlawful, and when a BFOQ applies\n- How to run a four-fifths calculation\n- Quid pro quo vs. hostile environment, and when the employer is liable\n- Contractor vs. employee, negligent hiring, and retaliation\n- What the EEOC and OFCCP each enforce\n- Which interview questions to avoid, and what to ask instead\n","cards":[{"id":"c202-ch03-001","front":"Why is legal compliance good business, not just a legal duty?","answer":"It avoids lawsuits and bad press, and merit-based decisions attract better talent and motivate people.","subtitle":"Ch 3.2 · Legal & Regulatory","note":"Read more: 3.2 Introduction","points":["Decisions based on job-relevant information, not protected traits, improve performance","Turnover intentions are lowest where employees see a pro-diversity AND ethical climate","Proactive firms go beyond compliance; know when to call an employment lawyer"]},{"id":"c202-ch03-002","front":"What does HR risk management involve?","answer":"Identifying, assessing, and resolving people risks such as turnover, lawsuits, and compliance gaps before they grow.","subtitle":"Ch 3.4 · Strategic HRM","note":"Read more: 3.4 The Role of HRM in Risk Management","points":["Risk assessment: identify, analyze, prioritize (likelihood x impact)","Risk control: plan, monitor, resolve (screening tools, succession plans, bias and law training, compliance audits)","Top HR risks: leadership pipeline, compliance violations, ethics and culture, skill shortages, M&A"]},{"id":"c202-ch03-003","front":"What are the four risk management strategies?","answer":"Avoid it (withdraw), reduce it (mitigate), share it (outsource or insure), or retain it (accept and budget for it).","subtitle":"Ch 3.4 · Strategic HRM","note":"Read more: 3.4 The Role of HRM in Risk Management","points":["Avoid: skip an acquisition with a poor culture fit","Reduce: train recruiters on bias and employment law","Share: outsource background checks","Retain: reserve funds for EEO fines, severance, settlements"]},{"id":"c202-ch03-004","front":"What does Sarbanes-Oxley Section 409 require that affects HR?","answer":"Public firms must quickly disclose material changes, like executive exits, employment lawsuits, and labor contracts.","subtitle":"Ch 3.4 · Legal & Regulatory","note":"Read more: 3.4 The Role of HRM in Risk Management","points":["Senior executives are personally responsible for accurate reports","Weak HR processes can cause SOX noncompliance"]},{"id":"c202-ch03-005","front":"Why do employment laws exist?","answer":"Employers hold more power over pay, promotion, and conditions, so laws limit that power and ensure equal opportunity.","subtitle":"Ch 3.5 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws","points":["Many employment laws arose from social pressure"]},{"id":"c202-ch03-006","front":"How do fair and unfair discrimination differ?","answer":"Fair discrimination uses only objective, job-related, merit-based traits; unfair discrimination uses anything else.","subtitle":"Ch 3.5 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws","points":["Choosing the candidate with the best skills is fair, legal, and strategic"]},{"id":"c202-ch03-007","front":"When is an unfair employment decision also unlawful?","answer":"Only when it breaks a law, e.g., it targets a protected trait or disproportionately harms a protected group.","subtitle":"Ch 3.5 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws","points":["Example: firing fans of a rival sports team is unfair but legal unless it hits a protected group harder","Unlawful employment practice = violates federal, state, or local employment law"]},{"id":"c202-ch03-008","front":"What is equal employment opportunity (EEO)?","answer":"Practices designed to treat applicants and employees consistently regardless of protected characteristics.","subtitle":"Ch 3.5 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws","points":["Laws alone don't break down barriers; diversity must be managed proactively","Resource: the U.S. EEOC website"]},{"id":"c202-ch03-009","front":"How do diversity and inclusion differ?","answer":"Diversity is the mix of people; inclusion means everyone feels respected, heard, and able to contribute fully.","subtitle":"Ch 3.6 · Strategic HRM","note":"Read more: 3.6 The Importance of Diversity and Inclusion to Business Performance; 3.22 Real World Response: Merck's Commitment to Diversity and Inclusion","points":["Having a diverse staff isn't enough; people need positive attitudes toward working with differences","Merck: resource groups and a D&I Center of Excellence weave inclusion into the business"]},{"id":"c202-ch03-010","front":"How do diversity and inclusion improve organizational performance?","answer":"They fuel creativity and innovation, widen the talent pool, and raise customer satisfaction in diverse markets.","subtitle":"Ch 3.6 · Strategic HRM","note":"Read more: 3.6 The Importance of Diversity and Inclusion to Business Performance; 3.22 Real World Response: Merck's Commitment to Diversity and Inclusion","points":["Positive diversity climate is linked to customer satisfaction","Diverse consumer markets are worth trillions","Merck: diverse teams solve problems from multiple viewpoints"]},{"id":"c202-ch03-011","front":"How can state employment laws differ from federal ones?","answer":"States can add protections, cover smaller employers, or protect extra groups that federal law doesn't.","subtitle":"Ch 3.7 · Legal & Regulatory","note":"Read more: 3.7 Laws and Definitions","points":["New York protects parental status; Washington protects obesity; New Jersey age law covers 18-70","Workplace tort: a civil wrong (like using an employee's photo in an ad without consent) handled under state law","Constitutional law overrides all others; common law is built from court decisions"]},{"id":"c202-ch03-012","front":"What does the National Labor Relations Act (1935) protect?","answer":"Employees' right to unionize and bargain collectively, and it bars employer retaliation for organizing.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Also called the Wagner Act","Created a system to arbitrate disputes"]},{"id":"c202-ch03-013","front":"What does the Fair Labor Standards Act (1938) require?","answer":"A federal minimum wage, overtime pay, recordkeeping, and child labor limits, with some jobs exempt.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Covers private employers and federal, state, and local governments","Exempt examples: commissioned salespeople, farm workers, salaried executives"]},{"id":"c202-ch03-014","front":"What does the Equal Pay Act (1963) require?","answer":"Men and women doing substantially equal work in the same establishment must get equal pay and benefits.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Equal = same skill, effort, responsibility, similar conditions","Allowed differences: seniority, merit, quantity or quality of work","Fix = raise the underpaid group's pay; never cut the other's"]},{"id":"c202-ch03-015","front":"What does Title VII of the Civil Rights Act (1964) prohibit?","answer":"Job discrimination based on race, color, religion, sex (incl. orientation and gender identity), or national origin.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Covers intentional acts and practices with discriminatory effects","2020 Supreme Court ruling added sexual orientation and transgender status under 'sex'","Persistently refusing to use an employee's stated name or pronouns can be sex discrimination","Created the EEOC"]},{"id":"c202-ch03-016","front":"Which traits does Title VII NOT cover, and which laws fill the gaps?","answer":"Age (ADEA), disability (ADA, Rehabilitation Act), veteran status (USERRA, VEVRAA), and genetic info (GINA).","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Pregnancy was added to Title VII by the Pregnancy Discrimination Act","Marital status and rival-team fandom aren't federally protected (some states add groups)"]},{"id":"c202-ch03-017","front":"What is a bona fide occupational qualification (BFOQ)?","answer":"A protected trait that is truly essential to the job; it can never be race or color, or rest on customer preference.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Example: same-gender officers for certain duties on gender-segregated prison wards","Must reflect actual inability to do the job, not stereotypes","The only defense to obvious disparate treatment"]},{"id":"c202-ch03-018","front":"What does the Age Discrimination in Employment Act (1967) protect?","answer":"Workers age 40 and older from discrimination in hiring, pay, and other terms of employment.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Google paid $11M in 2019 over bias against applicants 40+","Affirmative action does NOT cover the 40+ group; ADEA does"]},{"id":"c202-ch03-019","front":"What does the Rehabilitation Act (1973) require?","answer":"Federal contractors can't discriminate against people with disabilities and must take affirmative action to hire them.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Section 503: 7% utilization goal for people with disabilities; missing it alone isn't a violation","Enforced by the OFCCP"]},{"id":"c202-ch03-020","front":"Who is a qualified individual with a disability, and what is reasonable accommodation?","answer":"Someone who can do the job's essential functions with reasonable accommodation, required unless it's an undue hardship.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974); 3.9 Major Federal Employment Laws (1978–1990)","points":["Accommodation examples: interpreters, modified schedules, accessible equipment"]},{"id":"c202-ch03-021","front":"What does VEVRAA (1974) require?","answer":"No discrimination against protected veterans, and affirmative action by federal contractors with $25,000+ contracts.","subtitle":"Ch 3.8 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)","points":["Amended by the Jobs for Veterans Act (2002)"]},{"id":"c202-ch03-022","front":"What does the Pregnancy Discrimination Act (1978) require?","answer":"Pregnancy and related conditions must be treated like any other temporary condition in all job decisions.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["Amended Title VII","Young v. UPS: a driver denied light duty given to others could sue"]},{"id":"c202-ch03-023","front":"What does COBRA (1986) provide?","answer":"Workers who lose group health coverage can keep it for a limited time, at employers with 20+ employees.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["Triggers: job loss, reduced hours, death, divorce, other life events"]},{"id":"c202-ch03-024","front":"What does the Immigration Reform and Control Act (1986) require?","answer":"Verify each new hire's identity and work authorization on Form I-9; never knowingly hire unauthorized workers.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["Complete the I-9 within 3 days of hire; keep it private","Make offers contingent on eligibility rather than asking about citizenship","E-Verify checks eligibility online; ICE now prosecutes managers"]},{"id":"c202-ch03-025","front":"What does the WARN Act (1988) require?","answer":"Employers with 100+ full-time workers must give 60 days' notice of plant closings or mass layoffs.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["Some states go further (Illinois: 75+ employees)"]},{"id":"c202-ch03-026","front":"What does the Americans with Disabilities Act (1990) require?","answer":"No discrimination against qualified people with, or regarded as having, a disability, plus reasonable accommodation.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["Disability: an impairment substantially limiting a major life activity, a record of one, or being regarded as having one","Judged without mitigating devices (except ordinary glasses)","Lowe's paid $8.6M for failing to accommodate"]},{"id":"c202-ch03-027","front":"When can an employer ask about an applicant's disability or medical history?","answer":"Not before a job offer; asking applicants about disabilities or medical history pre-offer violates the ADA.","subtitle":"Ch 3.9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)","points":["After an offer, medical exams must be job-related and applied consistently"]},{"id":"c202-ch03-028","front":"How did the Civil Rights Act of 1991 strengthen Title VII?","answer":"It allowed damages for intentional bias, made a 'motivating factor' enough for liability, and banned race norming.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact; 3.8 Major Federal Employment Laws (1935–1974); 3.17 Enforcement Agencies","points":["Compensatory and punitive damages for intentional discrimination","Discrimination is proven if a protected trait was a motivating factor, even with other reasons","Enforced by the EEOC"]},{"id":"c202-ch03-029","front":"What does the Occupational Safety and Health Act (OSH Act) require?","answer":"Employers must provide a workplace free of recognized hazards and follow safety standards set by OSHA.","subtitle":"Ch 3.2 · Legal & Regulatory","note":"Read more: 3.2 Introduction; 3.1 Topic 3: The Legal Context of HRM","points":["Passed in 1970; OSHA sits in the Department of Labor","Covered in depth in Chapter 12 (Health and Safety)"]},{"id":"c202-ch03-030","front":"What does the Family and Medical Leave Act (1993) provide?","answer":"Eligible employees at 50+ employee worksites get up to 12 weeks of unpaid, job-protected leave with health coverage.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["Reasons: birth or adoption, a family member's serious health condition, your own, military exigencies","Managers can be personally liable for FMLA retaliation"]},{"id":"c202-ch03-031","front":"How long is FMLA military caregiver leave?","answer":"Up to 26 workweeks in 12 months to care for a seriously ill or injured service member who is family or next of kin.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["Added by the 2008 amendment (with the NDAA)"]},{"id":"c202-ch03-032","front":"What does USERRA (1994) protect?","answer":"Service members' jobs: no discrimination for service, and reemployment with the seniority and pay they'd have earned.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["Covers present AND future service (applicants who may be called up)","Target lost a USERRA case with $900,000 in punitive damages"]},{"id":"c202-ch03-033","front":"What does HIPAA (1996) require of employers?","answer":"Protecting the privacy and security of employees' health information under federal standards.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["HHS sets standards for electronic exchange of health data"]},{"id":"c202-ch03-034","front":"What does the Genetic Information Nondiscrimination Act (2008) prohibit?","answer":"Using, or even acquiring, genetic information, including family medical history, in employment decisions.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["Train recruiters not to ask about family health","Social media can expose genetic info (a candidate posting a parent's diagnosis)","Store any genetic info in a separate confidential medical file"]},{"id":"c202-ch03-035","front":"What does the Affordable Care Act (2010) require of employers?","answer":"Employers with 50+ full-time employees must offer health insurance; smaller firms may get incentives instead.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)","points":["Under 50 full-time employees: not required to insure","Under 25 employees: tax breaks for providing coverage; SHOP marketplace"]},{"id":"c202-ch03-036","front":"Is any interview question illegal by itself?","answer":"No; what's illegal is using protected information from the answer in a decision, so risky questions invite claims.","subtitle":"Ch 3.10 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010); 3.23 Strategic HRM Exercise: Troublesome Interview Questions","points":["Discrimination requires concrete harm: not hired, passed over, harassed","Safer swaps: 'Are you authorized to work in the U.S.?' instead of 'Are you a citizen?'"]},{"id":"c202-ch03-037","front":"What is affirmative action?","answer":"Proactive efforts to eliminate discrimination and its past effects by expanding opportunity for protected classes.","subtitle":"Ch 3.11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action","points":["Executive Order 11246 (1965) required federal contractors to take affirmative action","Protected classes for AA: women and minorities; also disabled and protected veterans under other laws"]},{"id":"c202-ch03-038","front":"What is affirmative action NOT?","answer":"Not quotas, not hiring or promoting unqualified people, and not firing others; goals need only good-faith effort.","subtitle":"Ch 3.11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action","points":["Numerical benchmarks reflect the availability of qualified applicants","Missing a goal isn't a violation; failing to make a good-faith effort is"]},{"id":"c202-ch03-039","front":"Who must have a written affirmative action plan?","answer":"Federal contractors with contracts of $50,000+ and 50+ employees, under Executive Order 11246.","subtitle":"Ch 3.11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action","points":["Plans detail recruiting, training, promotion steps, records, and internal audits","Other reasons: voluntary, court order, or a remedy for past discrimination"]},{"id":"c202-ch03-040","front":"What makes an affirmative action plan legally defensible?","answer":"It's remedial, includes nonminorities, is temporary, and is formal and written.","subtitle":"Ch 3.11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action","points":["Remedial: fixes an actual imbalance","Temporary: ends when goals are met","Cases: Steelworkers v. Weber, Wygant v. Jackson Board of Education"]},{"id":"c202-ch03-041","front":"What is preferential treatment, and when is it allowed?","answer":"Giving a protected-group member an employment preference; allowed only temporarily under a court settlement.","subtitle":"Ch 3.11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action","points":["A company can't decide on its own to give preferences","Better: hire for the business-related trait (e.g., ties to a community), not the protected trait"]},{"id":"c202-ch03-042","front":"What makes a worker an independent contractor rather than an employee?","answer":"The client controls only the result; if the company controls what and how the work is done, it's an employee.","subtitle":"Ch 3.12 · Legal & Regulatory","note":"Read more: 3.12 Independent Contractors","points":["Contractors pay their own Social Security and employment taxes","Misclassification = back taxes plus penalties (Illinois fined one firm $328,500)"]},{"id":"c202-ch03-043","front":"How do quid pro quo and hostile environment harassment differ?","answer":"Quid pro quo ties job outcomes to sexual favors; hostile environment is conduct making work intimidating or offensive.","subtitle":"Ch 3.13 · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment","points":["Hostile environment victims need not be the target","Harassers can be supervisors, coworkers, clients, or customers; anyone can be a victim","Minor teasing or isolated incidents usually aren't illegal; frequent or severe conduct is"]},{"id":"c202-ch03-044","front":"When is an employer liable for harassment?","answer":"If supervisor harassment caused a tangible action; else, unless it used reasonable care and the victim didn't report.","subtitle":"Ch 3.13 · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment","points":["Reasonable care = prevent and promptly correct","Remedies: back pay, reinstatement, compensatory and punitive damages, attorney fees"]},{"id":"c202-ch03-045","front":"What should an effective harassment policy include?","answer":"A clear definition and zero tolerance, how to report, how investigations work, plus annual training and audits.","subtitle":"Ch 3.14 · Legal & Regulatory","note":"Read more: 3.14 Case Study: Developing a Sexual Harassment Policy","points":["Extra training for supervisors on handling complaints","Keep training records to show good-faith prevention in court"]},{"id":"c202-ch03-046","front":"How do disparate treatment and adverse impact differ?","answer":"Disparate treatment is intentional, using different standards; adverse impact is a neutral rule with unequal results.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["Disparate treatment: the decision would change if the person's protected trait were different","Adverse impact: same standards, unequal consequences, intent doesn't matter"]},{"id":"c202-ch03-047","front":"What must a plaintiff show for a prima facie disparate treatment case?","answer":"Protected group member, applied and qualified, rejected anyway, and the job stayed open to similar applicants.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["From McDonnell Douglas v. Green (1973)","Then the employer must give a legitimate, nondiscriminatory reason; the plaintiff can show it's a pretext"]},{"id":"c202-ch03-048","front":"What defense fits each type of discrimination claim?","answer":"Disparate treatment: a BFOQ or legitimate nondiscriminatory reason; adverse impact: job-related business necessity.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["Job-related assessment = one that predicts performance in that job","Keep protected-trait records away from decision makers"]},{"id":"c202-ch03-049","front":"What is the four-fifths (80%) rule?","answer":"Adverse impact is indicated if a group's selection rate is below 80% of the most-selected group's rate.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["Example: 50% pass rate x 0.8 = 40% threshold; a 30% rate falls below it","A guideline, not formal law; courts also use 2-3 standard deviations"]},{"id":"c202-ch03-050","front":"Why is Griggs v. Duke Power Co. (1971) important?","answer":"It set up adverse impact: diploma and test rules that screened out Black workers without business need broke Title VII.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["Vulnerable practices: written tests, education requirements, height and weight rules, broad criminal background checks"]},{"id":"c202-ch03-051","front":"What did Ricci v. DeStefano (2009) decide?","answer":"An employer can't throw out valid test results just because they produce adverse impact.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact","points":["New Haven discarded a firefighter promotion test","Lesson: use valid, job-related assessments from the start"]},{"id":"c202-ch03-052","front":"What is race norming, and is it legal?","answer":"Adjusting scores or cutoffs by race or another protected group; the Civil Rights Act of 1991 bans it.","subtitle":"Ch 3.15 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-053","front":"What is fraudulent recruitment?","answer":"Misrepresenting the job or company to win a recruit; even oral promises can lead to a lawsuit.","subtitle":"Ch 3.16 · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation","points":["A tort claim: needs a false material fact, knowledge, intended and justified reliance, and damages","A Colorado court upheld $250,000 for hiding layoff risk","Qualify positive statements so they aren't guarantees"]},{"id":"c202-ch03-054","front":"What is negligent hiring?","answer":"Hiring someone you knew or should have known could harm others, without using reasonable care in screening.","subtitle":"Ch 3.16 · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation","points":["Riskiest jobs: customer, child, or in-home contact (installers, delivery drivers)","Check references, criminal records, and employment gaps"]},{"id":"c202-ch03-055","front":"What is retaliation, and why does it matter?","answer":"Punishing someone for protected activity like complaining, filing a charge, or testifying; it's illegal and common.","subtitle":"Ch 3.16 · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation","points":["Test: would it dissuade a reasonable employee? (refused references, excluded from training, undeserved bad review)","Petty slights usually don't count","Covers employees, applicants, and former employees"]},{"id":"c202-ch03-056","front":"What does the EEOC enforce?","answer":"Title VII, the ADEA, ADA, Equal Pay Act, Rehabilitation Act, and Civil Rights Act of 1991.","subtitle":"Ch 3.17 · Legal & Regulatory","note":"Read more: 3.17 Enforcement Agencies","points":["Created by Title VII; enforcement power added in 1972","Remedies: hiring or reinstatement, back pay (to judgment), front pay (after judgment), damages","Employers with 15+ employees must keep employment records; some file EEO-1 reports"]},{"id":"c202-ch03-057","front":"What does the OFCCP do?","answer":"A Labor Department office that enforces federal contractors' affirmative action duties (EO 11246, Section 503, VEVRAA).","subtitle":"Ch 3.17 · Legal & Regulatory","note":"Read more: 3.17 Enforcement Agencies","points":["Covers contractors with 50+ employees and $50,000+ in federal business","Reviews triggered by data flags, random selection, or complaints; tries conciliation first"]},{"id":"c202-ch03-058","front":"Where do structural barriers to equal opportunity show up?","answer":"In recruiting, advancement, terms and conditions, and termination, e.g., referral-only hiring or unequal pay.","subtitle":"Ch 3.18 · Legal & Regulatory","note":"Read more: 3.18 Legal Compliance Obstacles","points":["Recruiting: narrow advertising, over-reliance on referrals","Advancement: unequal access to visible assignments and networks","Terms: unequal pay, inflexible policies, no accommodation","Termination: unfair downsizing standards"]},{"id":"c202-ch03-059","front":"What is stereotyping, and how does it block equal treatment?","answer":"Assuming everyone in a group shares the same traits, so people are judged by group rather than by their own merit.","subtitle":"Ch 3.19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases","points":["Example: 'young people are lazy'","Rejecting someone as 'overqualified' is stereotyping; courts treat overqualified as qualified"]},{"id":"c202-ch03-060","front":"What is prejudice in the workplace?","answer":"Outright bigotry toward a group, which can clash with company values and lead to discrimination.","subtitle":"Ch 3.19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases","points":["Reduce it through careful selection, training, and tracking each manager's diversity results"]},{"id":"c202-ch03-061","front":"What is perception of possible personal loss?","answer":"Fear that diversity efforts will cost you opportunities, which leads people to withhold help from diverse colleagues.","subtitle":"Ch 3.19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases","points":["They may refer, evaluate, train, or develop others less fairly","Counter it by stressing that the focus is objectivity and EEO, not preferences"]},{"id":"c202-ch03-062","front":"What is ignorance as an EEO barrier?","answer":"Not knowing what employment law requires; it's never a legal defense, and it feeds stereotyping.","subtitle":"Ch 3.19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases","points":["Common in small firms and with untrained managers","Mathis v. Phillips Chevrolet: untrained hiring managers were an 'extraordinary mistake'"]},{"id":"c202-ch03-063","front":"How can bias create barriers to equal treatment? (model answer)","answer":"Biased judgments replace job-related facts, so qualified people get passed over, rated unfairly, or left undeveloped.","subtitle":"Ch 3.19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases; 3.23 Strategic HRM Exercise: Troublesome Interview Questions","points":["Model sentence: 'Stereotyping leads a manager to judge an applicant by assumptions about her group instead of her skills.'","Fixes: structured, job-related criteria; bias training; diversity scorecards for managers (Salesforce)"]},{"id":"c202-ch03-064","front":"What are unconscious biases?","answer":"Involuntary favorable or unfavorable attitudes and stereotypes that shape decisions without our awareness.","subtitle":"Ch 3.23 · Legal & Regulatory","note":"Read more: 3.23 Strategic HRM Exercise: Troublesome Interview Questions","points":["Tools: implicit bias tests, the Stroop effect","Counter with diverse leadership and senior advocates for diverse employees"]},{"id":"c202-ch03-065","front":"How do motivated blindness and rationalization differ?","answer":"Motivated blindness ignores inconvenient facts; rationalization excuses wrongdoing because 'everyone does it.'","subtitle":"Ch 3.20 · Strategic HRM","note":"Read more: 3.20 Barriers to Ethical HRM","points":["Euphemisms like 'creative accounting' are warning signs of rationalization"]},{"id":"c202-ch03-066","front":"How do lowered thresholds and a lack of moral courage lead to unethical HR decisions?","answer":"Small lapses make bigger ones easier, and people who know what's right still don't act because of the risks.","subtitle":"Ch 3.20 · Strategic HRM","note":"Read more: 3.20 Barriers to Ethical HRM","points":["Other traps: fear of retaliation, overvaluing money","Moral courage can be developed"]},{"id":"c202-ch03-067","front":"What is algorithmic bias?","answer":"An AI tool trained on biased past decisions reproduces that bias, creating disparate impact risk.","subtitle":"Ch 3.21 · Legal & Regulatory","note":"Read more: 3.21 Algorithmic Bias","points":["Don't use protected traits or their proxies as predictors","Audit algorithms regularly; run them separately so bias can be caught and fixed"]},{"id":"c202-ch03-068","type":"scenario","front":"An hourly, non-exempt warehouse worker logs 48 hours in a week but is paid straight time for all of it. Which law is the company violating?","choices":["Equal Pay Act","Fair Labor Standards Act","WARN Act","NLRA"],"correct":1,"explanation":"The FLSA requires overtime pay for non-exempt workers who exceed 40 hours in a week, along with minimum wage and recordkeeping.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-069","type":"scenario","front":"A female and a male lab technician do the same work with the same skill and responsibility, but he earns $6,000 more and no seniority or merit system explains it. What law applies, and what's the fix?","choices":["Equal Pay Act; lower his pay to match hers","Title VII only; give her a one-time bonus","FLSA; pay her overtime","Equal Pay Act; raise her pay to match his"],"correct":3,"explanation":"The Equal Pay Act requires equal pay for substantially equal work. Employers must raise the underpaid employee's pay, never cut the other's.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-070","type":"scenario","front":"A manager posts that he wants 'digital natives' and rejects a well-qualified 58-year-old applicant. Which law is most directly at risk?","choices":["ADEA","Equal Pay Act","Title VII","ADA"],"correct":0,"explanation":"The ADEA protects workers 40 and older. Code words like 'digital natives' can signal age bias. Title VII doesn't cover age.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-071","type":"scenario","front":"An employee is fired shortly after his manager learns he is gay. Under current federal law, which statute protects him?","choices":["Title VII, which covers sexual orientation as sex discrimination","The ADA","Only state law can apply","None; sexual orientation isn't federally protected"],"correct":0,"explanation":"A 2020 Supreme Court ruling held that Title VII's ban on sex discrimination covers sexual orientation and transgender status.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-072","type":"scenario","front":"A pregnant delivery driver's doctor limits her lifting. The company gives light duty to employees with temporary injuries but refuses her. Is it compliant?","choices":["No; the Pregnancy Discrimination Act requires treating pregnancy like other temporary conditions","No, but only under OSH Act","Yes; pregnancy isn't an injury","Yes, if it pays her FMLA leave"],"correct":0,"explanation":"The PDA (an amendment to Title VII) requires pregnancy to be treated like other temporary conditions, as in Young v. UPS.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-073","type":"scenario","front":"A company's promotion test uses a different passing cutoff for each racial group to balance results. Which law does this violate?","choices":["ADEA","It's legal if it improves diversity","Civil Rights Act of 1991","Equal Pay Act"],"correct":2,"explanation":"Race norming, adjusting scores or cutoffs by race, color, religion, sex, or national origin, is banned by the Civil Rights Act of 1991.","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-074","type":"scenario","front":"A company with 70 full-time employees offers no health insurance, assuming it's too small to be required. Is it compliant with the ACA?","choices":["No; employers with 50+ full-time employees must offer coverage","Yes, as long as it pays COBRA","No; every employer of any size must insure","Yes; only firms with 500+ must offer coverage"],"correct":0,"explanation":"Under the ACA's employer mandate, firms with 50 or more full-time employees must provide insurance. Firms under 25 can get tax breaks for coverage.","subtitle":"Ch 3.10 Apply · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-075","type":"scenario","front":"A supervisor tells the team that a coworker's health plan claims show a cancer diagnosis. Which law is most directly violated?","choices":["FLSA","WARN Act","HIPAA","COBRA"],"correct":2,"explanation":"HIPAA sets privacy and security standards for health information, and employers must protect employees' medical data.","subtitle":"Ch 3.10 Apply · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-076","type":"scenario","front":"Inspectors find blocked fire exits and unguarded machinery at a plant. Which law sets the employer's duty here?","choices":["IRCA","FMLA","OSH Act","NLRA"],"correct":2,"explanation":"The OSH Act requires employers to provide a workplace free of recognized hazards and to follow OSHA safety standards.","subtitle":"Ch 3.2 Apply · Legal & Regulatory","note":"Read more: 3.2 Introduction; 3.1 Topic 3: The Legal Context of HRM"},{"id":"c202-ch03-077","type":"scenario","front":"An eligible employee at a 200-person company asks for 10 weeks off to care for her father after heart surgery. What does the law require?","choices":["Two weeks off, then termination is allowed","Nothing; parents aren't covered","Paid leave for the full 10 weeks","Unpaid, job-protected FMLA leave with health coverage continued"],"correct":3,"explanation":"FMLA gives eligible employees up to 12 workweeks of unpaid, job-protected leave to care for a parent with a serious health condition.","subtitle":"Ch 3.10 Apply · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-078","type":"scenario","front":"A reservist returns from a nine-month deployment and is offered a lower-paying role with less seniority than before. Which law applies?","choices":["VEVRAA","FMLA","USERRA","Title VII"],"correct":2,"explanation":"USERRA requires reemployment with the seniority, status, and pay the service member would have had if continuously employed.","subtitle":"Ch 3.10 Apply · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-079","type":"scenario","front":"Two weeks after a new hire starts, HR realizes no one completed her Form I-9. Which law, and what deadline was missed?","choices":["HIPAA; within 3 days","IRCA; the I-9 is due within 3 days of hire","FLSA; within 30 days","IRCA; before the first annual review"],"correct":1,"explanation":"IRCA requires employers to verify every new hire's identity and work authorization on Form I-9 within 3 days of hire.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-080","type":"scenario","front":"A deaf applicant asks for a sign language interpreter at her interview. Which law requires the employer to consider this?","choices":["Equal Pay Act","ADA","GINA","FLSA"],"correct":1,"explanation":"The ADA requires reasonable accommodation during hiring and employment unless it would cause undue hardship.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-081","type":"scenario","front":"An interviewer asks, 'Does heart disease run in your family?' Which law makes this risky?","choices":["GINA","HIPAA","ADEA","COBRA"],"correct":0,"explanation":"GINA bars acquiring or using genetic information, which includes family medical history, in employment decisions.","subtitle":"Ch 3.10 Apply · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-082","type":"scenario","front":"A laid-off employee at a 300-person company wants to keep her family on the company health plan for a while. Which law gives her that option?","choices":["USERRA","ACA","COBRA","FMLA"],"correct":2,"explanation":"COBRA lets workers who lose coverage continue group health benefits for a limited time at employers with 20+ employees.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-083","type":"scenario","front":"A company with 400 full-time workers closes a plant and gives employees two weeks' notice. Which law did it likely violate?","choices":["COBRA","NLRA","WARN Act","FLSA"],"correct":2,"explanation":"WARN requires employers with 100+ full-time workers to give 60 days' notice of plant closings or mass layoffs.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-084","type":"scenario","front":"Employees who met after work to discuss forming a union are fired the next week. Which law protects them?","choices":["Title VII","FLSA","Equal Pay Act","NLRA"],"correct":3,"explanation":"The NLRA protects the right to organize and bargain collectively and bars employer retaliation for union activity.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-085","type":"scenario","front":"A federal contractor with a $200,000 contract does no outreach to protected veterans. Which law requires it to?","choices":["FMLA","USERRA","ADEA","VEVRAA"],"correct":3,"explanation":"VEVRAA requires federal contractors with contracts of $25,000+ to take affirmative action to employ and promote protected veterans.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-086","type":"scenario","front":"A federal contractor is asked about its progress toward a 7% utilization goal for employees with disabilities. Which law sets that goal?","choices":["Rehabilitation Act, Section 503","Title VII","ACA","ADA"],"correct":0,"explanation":"Section 503 of the Rehabilitation Act sets a 7% utilization goal for federal contractors. Missing it alone isn't a violation.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-087","type":"scenario","front":"A job application asks applicants to list all medical conditions and past surgeries. Is this compliant?","choices":["No, but only under HIPAA","Yes, if answers stay confidential","Yes, for jobs with physical tasks","No; the ADA bars disability and medical questions before a job offer"],"correct":3,"explanation":"The ADA prohibits asking applicants about disabilities or medical history before an offer is made.","subtitle":"Ch 3.9 Apply · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-088","type":"scenario","front":"A public company's CEO and CFO abruptly resign, and it faces a major employment lawsuit. What does Sarbanes-Oxley Section 409 require?","choices":["Prompt public disclosure of these material changes","Only notifying the EEOC","Disclosure only if the lawsuit is lost","Nothing until the annual report"],"correct":0,"explanation":"SOX Section 409 requires real-time disclosure of material changes such as executive departures and employment lawsuits.","subtitle":"Ch 3.4 Apply · Legal & Regulatory","note":"Read more: 3.4 The Role of HRM in Risk Management"},{"id":"c202-ch03-089","type":"scenario","front":"A New York employee says she was denied promotion because she's a parent. Federal law doesn't list parental status. What's the best analysis?","choices":["Only the FMLA applies","She has no claim anywhere","State law may protect her even though federal law doesn't","Title VII covers all family status"],"correct":2,"explanation":"States can protect additional groups. New York, for example, protects parental status, so check state law wherever you operate.","subtitle":"Ch 3.7 Apply · Legal & Regulatory","note":"Read more: 3.7 Laws and Definitions"},{"id":"c202-ch03-090","type":"scenario","front":"A 62-year-old applicant says Title VII protects her from age discrimination. Is she right?","choices":["No; age isn't protected by any federal law","Yes, but only for promotions","Yes; age is a Title VII class","No; age is protected by the ADEA, not Title VII"],"correct":3,"explanation":"Title VII covers race, color, religion, sex, and national origin. Workers 40+ are protected by the ADEA.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-091","type":"scenario","front":"An HR manager repeatedly and deliberately refuses to use a transgender employee's stated name and pronouns in records and meetings. How do the EEOC and courts view this?","choices":["A personal choice with no legal risk","Possible sex discrimination under Title VII","Only a policy violation","Covered only by the ADA"],"correct":1,"explanation":"Intentional, persistent refusal to use an employee's communicated name or pronouns has been treated as sex discrimination under Title VII.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-092","type":"scenario","front":"A nightclub hires only young women as bartenders, saying customers prefer it. Is this a valid BFOQ?","choices":["Yes, if it's in writing","No; customer preference can't justify a BFOQ","No, but only because age is involved","Yes; customer preference is a business need"],"correct":1,"explanation":"A BFOQ must be essential to doing the job. Customer preferences and stereotypes never qualify.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-093","type":"scenario","front":"A correctional facility requires same-gender officers to conduct strip searches on a gender-segregated unit. How should this be analyzed?","choices":["Covered by the Equal Pay Act","A likely valid BFOQ, since the protected trait is essential to that duty","Illegal sex discrimination in every case","Allowed only for race"],"correct":1,"explanation":"A BFOQ applies when a protected trait is essential to the job, such as same-gender staffing for certain duties on segregated prison wards. Race and color are never BFOQs.","subtitle":"Ch 3.8 Apply · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-094","type":"scenario","front":"A company hired 60 of 100 male applicants and 20 of 50 female applicants. Under the four-fifths rule, is there evidence of adverse impact?","choices":["Yes; any difference counts","No; women's rate is 80% of men's","Yes; women's rate (40%) is about 67% of men's (60%)","No; more men applied"],"correct":2,"explanation":"Selection rates: men 60%, women 40%. 40 ÷ 60 = 0.67, below 0.80, so adverse impact is indicated.","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-095","type":"scenario","front":"On a hiring test, 50% of one group passes and 45% of another passes. Does the four-fifths rule flag adverse impact?","choices":["It can't be determined","Yes; the rates differ","Yes; 45% is below 50%","No; 45 ÷ 50 = 90%, above the 80% threshold"],"correct":3,"explanation":"The threshold is 0.8 × 50% = 40%. A 45% pass rate is above it, so the guideline doesn't flag adverse impact.","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-096","type":"scenario","front":"A warehouse requires every applicant to lift 100 pounds, though the job only involves 30-pound boxes. Far fewer women qualify. Which claim fits best?","choices":["Quid pro quo","Retaliation","Disparate treatment","Adverse impact"],"correct":3,"explanation":"A neutral rule applied to everyone that disproportionately excludes a protected group, without business necessity, is adverse impact.","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-097","type":"scenario","front":"A recruiter secretly flags résumés with foreign-sounding names so they won't get interviews. Which type of discrimination is this?","choices":["Fair discrimination","Adverse impact","Disparate treatment","Algorithmic bias"],"correct":2,"explanation":"Deliberately treating applicants differently because of national origin is intentional, so it's disparate treatment.","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-098","type":"scenario","front":"An employer is sued because its college-degree requirement screens out a protected group. What defense must it show?","choices":["That the group is a minority of applicants","That it didn't intend to discriminate","That the requirement is job-related and consistent with business necessity","That competitors use the same requirement"],"correct":2,"explanation":"Intent doesn't matter in adverse impact cases. The only defense is that the practice is job-related and a business necessity (Griggs).","subtitle":"Ch 3.15 Apply · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-099","type":"scenario","front":"An AI résumé screener trained on ten years of a mostly male workforce starts downgrading applicants from women's colleges. What's happening, and what should HR do?","choices":["Nothing; algorithms are neutral","Algorithmic bias; audit the tool, remove proxy variables, and monitor results","Disparate treatment by the vendor only","Use the tool but hide its output"],"correct":1,"explanation":"Training data that reflects past bias makes the model reproduce it, creating disparate impact risk. Audit regularly and drop proxies for protected traits.","subtitle":"Ch 3.21 Apply · Legal & Regulatory","note":"Read more: 3.21 Algorithmic Bias"},{"id":"c202-ch03-100","type":"scenario","front":"Which action is a legitimate example of affirmative action?","choices":["Recruiting at women's engineering societies and minority-serving colleges to widen the pool","Promoting underrepresented employees regardless of performance","Laying off current staff to make room for diverse hires","Reserving 30% of openings for minorities"],"correct":0,"explanation":"Affirmative action expands the pool of qualified applicants and removes barriers. Quotas, unqualified preferences, and firing others are not affirmative action.","subtitle":"Ch 3.11 Apply · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-101","type":"scenario","front":"A company's informal affirmative action program excludes all nonminority candidates from a training program and has no end date. Is it defensible?","choices":["Yes; any diversity effort is protected","No; plans should include nonminorities, be temporary, and be formal and written","Yes, if leadership approves","No, because training can't be part of affirmative action"],"correct":1,"explanation":"Defensible plans are remedial, include nonminorities, are temporary, and are written. Excluding all nonminorities and having no end date make this one risky.","subtitle":"Ch 3.11 Apply · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-102","type":"scenario","front":"A federal contractor misses its hiring goal for women this y
