"points":["Enrichment: a salesperson also manages inventory","Enlargement: a receptionist also types and sorts mail; less boredom, no more responsibility"]},{"id":"c202-ch04-054","front":"What is job rotation?","answer":"Moving employees among different jobs; it requires cross-training and builds skills.","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design","points":["A horizontal form of job enlargement"]},{"id":"c202-ch04-055","front":"When is job enrichment most likely to succeed?","answer":"When workers welcome it, benefits beat lost efficiency, changes aren't too costly, and payoff is expected in 1-3 years.","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design","points":["Also: satisfaction relates to productivity and managers have enrichment experience","Don't overload: UPS split loading from driving after loading drove turnover"]},{"id":"c202-ch04-056","front":"What is job analysis?","answer":"A systematic study of a job's tasks, conditions, and tools and the worker traits needed to succeed in it.","subtitle":"Ch 4.13 · Effective HRM","note":"Read more: 4.13 Job Analysis","points":["Judged in light of the company's strategy and culture"]},{"id":"c202-ch04-057","front":"How is job analysis data used?","answer":"To set hiring requirements, plan recruiting, select applicants, and build training, pay, and appraisal systems.","subtitle":"Ch 4.13 · Effective HRM","note":"Read more: 4.13 Job Analysis","points":["It's the first step for staffing, training, performance management, and pay","Firms that use it well financially outperform competitors"]},{"id":"c202-ch04-058","front":"How does job analysis connect hiring to strategy?","answer":"It defines requirements in light of strategy and future needs, so firms hire for what the business will need.","subtitle":"Ch 4.13 · Effective HRM","note":"Read more: 4.13 Job Analysis","points":["Medical-device retailer needs specialized education; a low-cost retailer hires efficiency-minded people","Future-proofing: a 1990s marketer who couldn't use the Internet was a poor choice"]},{"id":"c202-ch04-059","front":"Why does job analysis matter legally?","answer":"It documents job-related requirements, a defense against failure-to-hire and wrongful discharge claims.","subtitle":"Ch 4.13 · Legal & Regulatory","note":"Read more: 4.13 Job Analysis; 4.17 Job Elements Method (and other methods)","points":["Ties to Chapter 3: job-related, business-necessary criteria defend against adverse impact claims","Follow the Uniform Guidelines on Employee Selection Procedures (1978)"]},{"id":"c202-ch04-060","front":"How can job analysis improve how a job is designed?","answer":"It shows where time actually goes so wasted effort can be cut, like GE salespeople's 80% on paperwork.","subtitle":"Ch 4.13 · Effective HRM","note":"Read more: 4.13 Job Analysis","points":["For fast-changing jobs, focus analysis on key jobs for ROI"]},{"id":"c202-ch04-061","front":"What is a job description?","answer":"A written summary of a job's duties and responsibilities, plus its title, reporting lines, and conditions.","subtitle":"Ch 4.14 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes"},{"id":"c202-ch04-062","front":"What does a typical job description include?","answer":"Title, department, pay range and grade, reporting lines, main and occasional duties, equipment, special conditions.","subtitle":"Ch 4.14 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes","points":["Plus a flexibility clause: 'other duties as assigned'"]},{"id":"c202-ch04-063","front":"What makes a good task statement?","answer":"It specifically states what is done, how, and why, and avoids vague verbs like 'handles' or 'prepares.'","subtitle":"Ch 4.14 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes","points":["Weak: 'accounts for inventory quarterly'","Better: counts merchandise, compares counts with accounting totals, corrects errors so books balance"]},{"id":"c202-ch04-064","front":"How should task statements be written with the ADA in mind?","answer":"Emphasize what must be accomplished rather than how, so people with disabilities aren't screened out needlessly.","subtitle":"Ch 4.14 · Legal & Regulatory","note":"Read more: 4.14 Job Analysis Outcomes","points":["'Moves 50-pound boxes to shelves' rather than 'lifts boxes by hand'"]},{"id":"c202-ch04-065","front":"How can a job description promote ethical behavior?","answer":"By stating legal and ethical expectations, like refusing bribes and protecting employees who raise concerns.","subtitle":"Ch 4.14 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes","points":["Follow U.S. law even where rule of law is weak","Resist pressure to compromise values to hit sales targets"]},{"id":"c202-ch04-066","front":"Why should job descriptions be engaging?","answer":"They double as recruiting ads, so selling the mission and values attracts better-fit applicants.","subtitle":"Ch 4.14 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes","points":["Red Lobster weaves its values into lively descriptions of essential functions","Make titles descriptive, accurate, and interesting"]},{"id":"c202-ch04-067","front":"What is a person specification?","answer":"The minimum worker characteristics needed for a job's core duties, built from the job description.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification","points":["Drives where and how to recruit and which screening criteria to use"]},{"id":"c202-ch04-068","front":"How does a job description differ from a person specification?","answer":"A description lists the job's duties; a specification lists the qualities a person needs to perform them.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-069","front":"How do essential and desirable criteria differ?","answer":"Essential criteria are required to perform adequately; desirable ones help compare candidates who meet essentials.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification","points":["Don't describe a mythical perfect employee; prioritize"]},{"id":"c202-ch04-070","front":"How do knowledge and skill differ in KSAOs?","answer":"Knowledge is knowing the information; skill is applying it to perform a task to a standard.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification","points":["A child who knows bike parts but can't ride has knowledge without skill","Skill examples: truck driving, manual dexterity, folding two shirts a minute"]},{"id":"c202-ch04-071","front":"What are abilities and 'other characteristics' in KSAOs?","answer":"Abilities are stable, partly innate capacities used across tasks; 'other' covers personality, values, and experience.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification","points":["Ability examples: quantitative, sensory, physical capacities","Other: education, work experience, extraversion"]},{"id":"c202-ch04-072","front":"Must new hires already have every KSAO?","answer":"No; decide which must exist on day one and which can be trained, then hire for ability and motivation to learn.","subtitle":"Ch 4.15 · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-073","front":"What makes a job analysis reliable versus valid?","answer":"Reliable: the same results across analysts, experts, and times; valid: captures the job without gaps or extras.","subtitle":"Ch 4.16 · Effective HRM","note":"Read more: 4.16 Job Analysis Methods"},{"id":"c202-ch04-074","front":"What is the critical incidents technique?","answer":"Experts describe examples of very effective and very ineffective behavior: the situation, action, and result.","subtitle":"Ch 4.16 · Effective HRM","note":"Read more: 4.16 Job Analysis Methods","points":["Strengths: catches rare but important events, separates superior from average, feeds interview questions","Weaknesses: narrative data, time to collect enough incidents, focuses on extremes so rarely used alone"]},{"id":"c202-ch04-075","front":"What is the job elements method?","answer":"An expert group lists and weights the worker traits needed, mostly for industrial and lower-skill jobs.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods); 4.16 Job Analysis Methods","points":["Weights: share of barely acceptable workers with it, usefulness for spotting superior workers, problems if ignored, practicality","Pros: expert ownership, efficient; con: method hard to communicate"]},{"id":"c202-ch04-076","front":"What is the structured interview technique for job analysis?","answer":"Experts answer set questions about duties; quick and cheap, but it needs a skilled interviewer to limit bias.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods); 4.16 Job Analysis Methods","points":["Good when there are few experts or little time; data can be hard to analyze"]},{"id":"c202-ch04-077","front":"What is the task inventory approach?","answer":"Experts list 50-200 tasks grouped into functions; objective and reliable, but it misses rare tasks and star traits.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods); 4.16 Job Analysis Methods","points":["Usually collected by survey; combine with other methods"]},{"id":"c202-ch04-078","front":"What is the Position Analysis Questionnaire (PAQ)?","answer":"A standardized questionnaire for almost any job that's fast and comparable but needs a high reading level.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods); 4.16 Job Analysis Methods","points":["Covers information input, mental processes, work output, job context","Estimates mental, perceptual, psychomotor, and physical requirements"]},{"id":"c202-ch04-079","front":"Why combine job analysis methods?","answer":"Each method has blind spots, so combining them offsets weaknesses and improves accuracy and legal defense.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)"},{"id":"c202-ch04-080","front":"Why might job experts give biased job analysis input?","answer":"Results affect pay and promotion, so experts may stress their own strengths; multiple sources keep it honest.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)","points":["A relationship-strong salesperson stresses relationships; a records-strong one stresses recordkeeping"]},{"id":"c202-ch04-081","front":"What is O*NET, and how should it be used?","answer":"The government's online job classification database; a good starting point to adapt, not copy.","subtitle":"Ch 4.17 · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods); 4.23 Strategic HRM Exercise: Using O*NET","points":["Generic downloaded job descriptions are a weak legal defense and a poor strategy fit"]},{"id":"c202-ch04-082","front":"What is competency modeling?","answer":"A job analysis method that identifies broad traits of high performers, tied to strategy and values.","subtitle":"Ch 4.18 · Effective HRM","note":"Read more: 4.18 Competency Modeling","points":["Common competencies: results focus, customer service, leadership, emotional intelligence, communication, teamwork"]},{"id":"c202-ch04-083","front":"How do competencies differ from KSAOs?","answer":"Competencies are broad, cross-job traits that reinforce culture; KSAOs are specific to a single job.","subtitle":"Ch 4.18 · Effective HRM","note":"Read more: 4.18 Competency Modeling","points":["Competency-based descriptions last longer and let similar jobs be grouped"]},{"id":"c202-ch04-084","front":"How many competencies should a model include?","answer":"Usually 6-12; too many blur focus, so keep the ones data show matter most.","subtitle":"Ch 4.18 · Effective HRM","note":"Read more: 4.18 Competency Modeling","points":["Dell's five executive competencies: learn fast, thrive amid change, deliver results, solve problems, build teams"]},{"id":"c202-ch04-085","front":"What are the limits of competency modeling?","answer":"It's less rigorous and documented, so legal defensibility is uncertain; pair it with traditional job analysis.","subtitle":"Ch 4.18 · Effective HRM","note":"Read more: 4.18 Competency Modeling","points":["Can miss rare-but-important traits"]},{"id":"c202-ch04-086","front":"What's the risk of using AI to define an ideal employee profile?","answer":"It learns patterns from biased past data and can repeat them, as Amazon's résumé tool did against women.","subtitle":"Ch 4.18 · Effective HRM","note":"Read more: 4.18 Competency Modeling","points":["Amazon trained on 10 years of mostly male résumés, used it only in trial, then dropped it"]},{"id":"c202-ch04-087","front":"What is job rewards analysis?","answer":"Identifying a job's intrinsic rewards (from the work) and extrinsic rewards (pay, bonuses, benefits).","subtitle":"Ch 4.18 · Motivational Concepts","note":"Read more: 4.18 Competency Modeling","points":["Intrinsic + extrinsic = total rewards; a bonus is extrinsic"]},{"id":"c202-ch04-088","front":"How is job rewards information used in recruiting?","answer":"Match what you highlight to the candidate: pay for money-driven people, growth for development-driven ones.","subtitle":"Ch 4.18 · Motivational Concepts","note":"Read more: 4.18 Competency Modeling","points":["Barclays touts expert colleagues, facilities, progression, and training"]},{"id":"c202-ch04-089","front":"How does organizational design differ from organizational structure?","answer":"Design is the process of choosing and managing structure; structure is the formal task, power, and reporting system.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Structure coordinates, controls, and motivates; redesign aids survival amid change"]},{"id":"c202-ch04-090","front":"What does an organizational chart show?","answer":"The chain of command: who reports to whom and who is responsible for whom.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Position isn't importance; a FedEx executive said drivers matter more than he does"]},{"id":"c202-ch04-091","front":"What is a policy?","answer":"A broad guiding principle that sets direction; in effect, a decision already made.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Example: 'We reimburse reasonable business travel to serve clients'","Directs and limits actions toward long-term goals"]},{"id":"c202-ch04-092","front":"What is a procedure?","answer":"A how-to sequence of steps for carrying out a task in line with policy.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Example: photograph the receipt, upload within 30 days, get manager approval"]},{"id":"c202-ch04-093","front":"What is a rule?","answer":"A specific statement of what employees may or may not do, with little room for discretion.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Example: 'Safety glasses must be worn on the production floor'"]},{"id":"c202-ch04-094","front":"How do policies, procedures, and rules work together?","answer":"Policies set direction, procedures say how to do it, and rules set the musts; together they guide daily work.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Memory trick: policy = why/direction, procedure = how, rule = must or must not","They support vision and goals, compliance, and safety"]},{"id":"c202-ch04-095","front":"What is an employee handbook?","answer":"A document, often online, that collects the organization's policies, procedures, and rules for employees.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Typical contents: discipline rules, ethics code, at-will statement, confidentiality agreement, benefits, complaint steps"]},{"id":"c202-ch04-096","front":"How does the employee handbook protect the organization?","answer":"It documents expectations and notice, supports consistent enforcement, and records at-will and confidentiality terms.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Signed acknowledgments prove employees received the rules","Consistent enforcement lowers discrimination and wrongful discharge risk","Standard practice: a disclaimer that the handbook isn't a contract"]},{"id":"c202-ch04-097","front":"How does the employee handbook protect employees?","answer":"It spells out rights, benefits, and complaint channels so everyone is held to the same known rules.","subtitle":"Ch 4.19 · Effective HRM","note":"Read more: 4.19 Organizational Structure","points":["Model answer (remote-work-style policy): protects the firm by setting clear expectations it can enforce;","protects the employee by defining hours, equipment, and reimbursement so they aren't judged by unwritten rules","Anti-harassment and anti-retaliation policies give a safe way to report"]},{"id":"c202-ch04-098","front":"What is formalization?","answer":"How much an organization's rules, procedures, and communications are written down.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure","points":["High formalization: little discretion, more role clarity and commitment"]},{"id":"c202-ch04-099","front":"How do centralization and decentralization differ?","answer":"Centralization keeps decision authority at the top; decentralization pushes it down for speed and innovation.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure","points":["Centralized: new firms, simple stable environments, clear lines of responsibility","Decentralized: flatter, fewer middle managers, best for nonroutine work in complex environments"]},{"id":"c202-ch04-100","front":"What is division of labor?","answer":"The degree of specialization in jobs; it boosts efficiency and learning but can isolate units.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure","points":["Generalists are cheaper but slower to decide"]},{"id":"c202-ch04-101","front":"When is a narrow vs. wide span of control best?","answer":"Narrow suits complex, novel work needing coaching; wide suits routine work and similar jobs, and costs less.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure","points":["Span of control = number of direct reports; more than about 9 is often too many"]},{"id":"c202-ch04-102","front":"What are the risks of too many or too few hierarchy levels?","answer":"Too many raise cost and slow decisions; too few weaken coordination and control.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure","points":["Tall = many layers; flat = few. HP ran tens of thousands of people with about 8 levels"]},{"id":"c202-ch04-103","front":"How does structure affect career fit?","answer":"People who like predictability fit bureaucracies; those who like flexibility fit less formal, decentralized firms.","subtitle":"Ch 4.20 · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-104","front":"What is workflow analysis?","answer":"Tracing how work moves from a customer's request through value-adding steps to delivery, to cut or combine steps.","subtitle":"Ch 4.21 · Effective HRM","note":"Read more: 4.21 Workflow Analysis","points":["Workflow = how work is organized to meet goals; regular analysis boosts efficiency and satisfaction"]},{"id":"c202-ch04-105","front":"How does business process reengineering differ from workflow analysis?","answer":"BPR is a radical, clean-slate redesign for big gains; workflow analysis improves the existing process step by step.","subtitle":"Ch 4.21 · Effective HRM","note":"Read more: 4.21 Workflow Analysis","points":["Taco Bell centralized ingredient prep: higher quality and morale, fewer injuries, lower cost"]},{"id":"c202-ch04-106","front":"What are the risks of business process reengineering?","answer":"It can hurt morale, often brings layoffs, and may not fix the real problem; it needs a long-term, people-aware view.","subtitle":"Ch 4.21 · Effective HRM","note":"Read more: 4.21 Workflow Analysis"},{"id":"c202-ch04-107","front":"How did airlines respond to the pilot shortage before 2020?","answer":"Higher pilot pay, signing and retention bonuses, and paid training pipelines such as JetBlue's.","subtitle":"Ch 4.22 · Effective HRM","note":"Read more: 4.22 Real World Response: Managing a Pilot Shortage at American Airlines","points":["American's average pilot pay: $229K (2018) vs $138K a decade earlier","Raising pay partly shifted the shortage to lower-paying regional carriers"]},{"id":"c202-ch04-108","front":"How did COVID-19 change the pilot labor picture?","answer":"The shortage became a surplus, met with pay cuts, early retirements, buyouts, leaves, and hiring pauses.","subtitle":"Ch 4.22 · Effective HRM","note":"Read more: 4.22 Real World Response: Managing a Pilot Shortage at American Airlines","points":["Furloughs were a last resort, to avoid a future shortfall"]},{"id":"c202-ch04-109","type":"scenario","front":"A hospital opening a new wing expects 15% more patients next year. Which approach best aligns its performance metrics, action plans, and HR planning?","choices":["Wait until units report vacancies, then post openings and fill them as fast as the budget allows","Set next year's nurse headcount from the finance budget alone, since labor is the largest cost","Repeat last year's hiring plan and staffing levels, since turnover was acceptable then","Forecast nurse need from patient volume and staffing ratios, compare it with supply, and set a hiring plan tracked quarterly"],"correct":3,"explanation":"Alignment means using metrics and past results to forecast the gap, then building proactive action plans with targets you keep measuring. Reacting, budget-only planning, and copying old plans skip the data.","subtitle":"Ch 4.4 Apply · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-110","type":"scenario","front":"A retailer's hiring plan for its new distribution center has been running for six months. How should managers judge whether the action plan is working?","choices":["Track the plan's own performance metrics, like time to fill, turnover, and productivity, and adjust","Assume it's working as long as the hiring budget hasn't been exceeded so far","Wait for the next annual strategic planning cycle before reviewing any results","Survey new hires about whether they like the building and break rooms"],"correct":0,"explanation":"Action plans carry performance metrics so managers can see progress and revise the plan as conditions change.","subtitle":"Ch 4.4 Apply · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-111","type":"scenario","front":"A toy maker needs 30% more warehouse workers for an eight-week holiday rush. Which response fits a short-term shortage?","choices":["Early retirement incentives to open spots for seasonal hires","Salary cuts across the warehouse to fund overtime","Leaving vacated positions unfilled until the rush ends","Hiring incentives, retention bonuses, and reassigning staff from slower areas"],"correct":3,"explanation":"Short-term shortages call for quick fixes like hiring incentives, retention bonuses, and reassignment. The other options are surplus responses.","subtitle":"Ch 4.4 Apply · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-112","type":"scenario","front":"A manufacturer will phase out a product line over three years, leaving about 80 more workers than it needs. Which response best fits this long-term surplus?","choices":["Signing bonuses to bring in workers for the next product line","Business process outsourcing of the remaining work","Early retirement incentives, attrition, and not refilling vacated positions","Retention bonuses so the affected workers stay through the phase-out"],"correct":2,"explanation":"Long-term surpluses call for early retirement incentives, leaving positions unfilled, and if needed layoffs. A gradual plan costs less and protects top talent.","subtitle":"Ch 4.4 Apply · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-113","type":"scenario","front":"A firm whose talent philosophy treats employees as long-term investors faces a two-month dip in orders. What response best fits its philosophy?","choices":["Temporarily reduce hours for everyone rather than lay people off","Lay off the newest 20% of staff immediately to protect margins","Offer permanent early retirement packages to senior staff","Freeze all training and development permanently"],"correct":0,"explanation":"Action plans must fit the talent philosophy. A short-term surplus at a firm that values employees as investors suggests sharing the cut through reduced hours.","subtitle":"Ch 4.9 Apply · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-114","type":"scenario","front":"A software firm forecasts a shortage of data engineers lasting at least five years. Which response fits a long-term shortage?","choices":["Cut salaries for current engineers to free budget for recruiting","Lay off staff in other units and fund overtime for current engineers","Reduce labor demand through automation, outsource some processes, and build a training pipeline","Pay one-time retention bonuses and wait for the market to loosen"],"correct":2,"explanation":"Long-term shortages call for reducing labor demand or business process outsourcing. Pipelines with schools also build supply over time.","subtitle":"Ch 4.4 Apply · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-115","type":"scenario","front":"A utility forecasts demand for 120 line technicians next year and an internal supply of 100. What has gap analysis shown, and what comes next?","choices":["Balance, since the gap is small; no action plan needed","No real gap yet; wait until vacancies appear before acting","A shortage of 20; build an action plan such as recruiting, training, or retention incentives","A surplus of 20; plan early retirements and leave openings unfilled"],"correct":2,"explanation":"Gap analysis compares forecasted demand with supply. Demand above supply is a shortage, and the next step is an action plan with metrics.","subtitle":"Ch 4.9 Apply · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-116","type":"scenario","front":"Only one accountant understands a company's legacy payroll system, and she just gave notice. What risk is this, and what should have prevented it?","choices":["Manpower understaffing; hiring more general clerks","A labor surplus; early retirement offers","Adverse impact; a four-fifths analysis","Expertise understaffing; cross-training and a ready successor"],"correct":3,"explanation":"Missing knowledge that no one else can cover is expertise understaffing, which hurts even short term. Cross-training and keeping successors in the pipeline prevent it.","subtitle":"Ch 4.9 Apply · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-117","type":"scenario","front":"A restaurant has run its dinner shift with two servers instead of four for six months to save money. What is the most likely result?","choices":["Higher commitment and morale because each server earns more tips","An expertise gap, since no one can cover the missing knowledge","Rising stress, absenteeism, and turnover from long-term manpower understaffing","No lasting effect, since manpower gaps are harmless if pay is good"],"correct":2,"explanation":"Manpower understaffing is manageable briefly, but long term it hurts well-being and commitment and raises absenteeism, stress, and turnover.","subtitle":"Ch 4.9 Apply · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-118","type":"scenario","front":"A global health crisis suddenly shuts down travel, and every economic forecast changes week to week. How should a hotel chain approach labor planning?","choices":["Commit to one optimistic forecast so managers have a single target","Plan for several scenarios, re-check its predictors often, and revise plans as data arrives","Stick with last year's trend analysis, since history is the best guide","Freeze all planning until the crisis ends and data stabilizes"],"correct":1,"explanation":"Rare shocks break old predictors. In fast, unfamiliar change, forecasts are close to guesses, so plan for a range of outcomes and revisit often.","subtitle":"Ch 4.6 Apply · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand"},{"id":"c202-ch04-119","type":"scenario","front":"Interest rates are forecast to rise sharply next year. How should a home builder adjust its labor demand forecast?","choices":["Lower it, since higher borrowing costs reduce home buying and construction work","Raise it, since higher rates usually signal a growing economy","Leave it unchanged; interest rates don't affect labor","Raise it only for mortgage specialists, who process more loans"],"correct":0,"explanation":"Higher rates raise borrowing costs for firms and customers, so demand and labor needs fall, especially in housing and the trades.","subtitle":"Ch 4.6 Apply · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand"},{"id":"c202-ch04-120","type":"scenario","front":"The U.S. dollar strengthens a lot against other currencies. What does that suggest for a U.S. manufacturer that exports most of its products?","choices":["Lower labor demand, because its exports become more expensive abroad","Higher labor demand, because foreign imports become more expensive","No change, since currency shifts only affect banks and investors","Higher demand for domestic sales staff only"],"correct":0,"explanation":"A stronger home currency makes exports pricier and imports cheaper, which tends to lower demand and labor needs for exporters.","subtitle":"Ch 4.6 Apply · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand"},{"id":"c202-ch04-121","type":"scenario","front":"A forecasting analyst wants a monthly survey of how secure adults feel in their jobs and how willing they are to spend. Which indicator fits?","choices":["Consumer Confidence Index","Leading Economic Index","Purchasing Managers Index","Exchange rate trends"],"correct":0,"explanation":"The Conference Board's Consumer Confidence Index surveys adults on job security and spending plans, which predicts demand and labor needs.","subtitle":"Ch 4.6 Apply · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand"},{"id":"c202-ch04-122","type":"scenario","front":"A call center keeps one supervisor for every 12 agents. It plans to grow to 96 agents. Using ratio analysis, how many supervisors will it need?","choices":["6","10","8","12"],"correct":2,"explanation":"Ratio analysis applies the staffing ratio to expected activity: 96 ÷ 12 = 8 supervisors. Adjust the ratio if productivity changes.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-123","type":"scenario","front":"A clinic staffs 3 medical assistants for every 2 physicians. It is adding 4 physicians. How many additional medical assistants does the ratio call for?","choices":["8","6","4","3"],"correct":1,"explanation":"3 assistants per 2 physicians is 1.5 per physician. Four new physicians × 1.5 = 6 more assistants.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-124","type":"scenario","front":"A bank's headcount has grown about 8% a year for five years, and HR projects the same growth for next year. Which method is this?","choices":["Trend analysis","Ratio analysis","Bottom-up judgmental forecasting","Gap analysis"],"correct":0,"explanation":"Projecting past employment patterns forward is trend analysis. Its weakness is assuming the past will continue.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-125","type":"scenario","front":"Each store manager estimates next year's staffing needs, regional directors combine the estimates, and executives review them. Which forecasting approach is this?","choices":["Trend analysis","Ratio analysis","Bottom-up judgmental forecasting","Top-down judgmental forecasting"],"correct":2,"explanation":"Bottom-up forecasting consolidates lower-level managers' estimates upward for top managers to review and formalize.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-126","type":"scenario","front":"The CEO announces that headcount will fall 5% next year, and each division receives a target to meet it. Which forecasting approach is this?","choices":["Top-down judgmental forecasting","Bottom-up judgmental forecasting","Trend analysis","Regression analysis"],"correct":0,"explanation":"In top-down forecasting, leaders' predictions or budgets become the goals for lower levels.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-127","type":"scenario","front":"A warehouse used to need one picker per 400 orders a day. It just installed scanners that make pickers 25% faster. How should HR use its old staffing ratio?","choices":["Apply the old ratio unchanged, since ratios are stable over time","Drop ratio forecasting until a new multiyear trend appears","Hire extra pickers to be safe while workers learn the scanners","Adjust the ratio for the productivity gain, using managers' judgment"],"correct":3,"explanation":"Staffing ratios assume stable productivity. New technology, training, or incentives mean the ratio should be adjusted.","subtitle":"Ch 4.7 Apply · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-128","type":"scenario","front":"A plant has 50 technicians. Next year it expects 6 retirements, 4 resignations, and 3 promotions out, plus 2 transfers in. What is its forecasted internal supply?","choices":["41","35","39","37"],"correct":2,"explanation":"Internal supply = current staff − expected losses + expected gains: 50 − 13 + 2 = 39.","subtitle":"Ch 4.8 Apply · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-129","type":"scenario","front":"A VP wants one page showing who could replace each of her directors and how ready each candidate is. Which tool fits?","choices":["Talent inventory","Trend analysis","Job description","Replacement chart"],"correct":3,"explanation":"A replacement chart shows jobholders, possible successors, and each successor's readiness, performance, and development needs.","subtitle":"Ch 4.8 Apply · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-130","type":"scenario","front":"HR needs to find every employee who speaks Portuguese and holds a project management certification for a new Brazil project. Which tool helps most?","choices":["Organizational chart","Ratio analysis","Talent inventory","Replacement chart"],"correct":2,"explanation":"A talent inventory records each employee's competencies and qualifications so HR can match people to needs quickly.","subtitle":"Ch 4.8 Apply · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-131","type":"scenario","front":"A company runs a program that identifies high-potential managers, gives them stretch assignments and mentoring, and tracks their progress toward executive roles. What is this?","choices":["Succession planning","Talent inventory","Job rotation","Workflow analysis"],"correct":0,"explanation":"Succession planning identifies, develops, and tracks employees so they can move into higher positions.","subtitle":"Ch 4.8 Apply · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-132","type":"scenario","front":"A bank lets its tellers resolve fee disputes and approve small refunds on their own instead of calling a supervisor. What redesign is this?","choices":["Scientific management","Job enrichment","Job enlargement","Job rotation"],"correct":1,"explanation":"Adding responsibility and decision authority is vertical expansion, which is job enrichment.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-133","type":"scenario","front":"A warehouse packer is now also asked to print labels and scan outgoing boxes, all at the same skill level. What redesign is this?","choices":["Job rotation","Business process reengineering","Job enlargement","Job enrichment"],"correct":2,"explanation":"Adding more tasks at the same level is horizontal expansion, which is job enlargement. It reduces boredom but not responsibility.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-134","type":"scenario","front":"New analysts spend three months each in finance, marketing, operations, and sales before choosing a home team. What is this?","choices":["Division of labor","Job rotation","Job enrichment","Succession planning"],"correct":1,"explanation":"Moving employees among jobs is job rotation. It requires cross-training and builds broad skills.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-135","type":"scenario","front":"A bike company switches from having each worker attach one part to having small teams build a whole bicycle from start to finish. Which core job characteristic rises most?","choices":["Feedback","Task identity","Task significance","Autonomy"],"correct":1,"explanation":"Task identity is completing a whole, identifiable piece of work from beginning to end.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-136","type":"scenario","front":"A hospital lab tech starts receiving notes on how her test results helped doctors save patients. Which job characteristic does this highlight?","choices":["Task identity","Autonomy","Task significance","Skill variety"],"correct":2,"explanation":"Task significance is the job's impact on other people's lives or work. Seeing that impact raises experienced meaningfulness.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-137","type":"scenario","front":"A manager plans to enrich every clerk's job. One reliable clerk says she likes her simple, predictable routine. What should the manager consider?","choices":["Move her to a job with less pay","Task identity is the only factor that matters","Growth need strength; not everyone is motivated by an enriched job","Enrich it anyway, since complex work motivates everyone"],"correct":2,"explanation":"Growth need strength moderates the job characteristics model. People with low growth needs may prefer simpler, stable jobs.","subtitle":"Ch 4.12 Apply · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-138","type":"scenario","front":"A factory films workers packing boxes, finds the fastest set of motions, and trains everyone to use exactly that method. What approach is this, and what's its main risk?","choices":["Competency modeling; weak legal defense","Job rotation; too much cross-training cost","Scientific management; monotony and loss of initiative","Job enrichment; too much responsibility"],"correct":2,"explanation":"Time-and-motion studies and precise methods are scientific management. It raises efficiency but can feel monotonous and dehumanizing.","subtitle":"Ch 4.11 Apply · Effective HRM","note":"Read more: 4.11 Job Design"},{"id":"c202-ch04-139","type":"scenario","front":"A manager just finished a job analysis for a lab technician role. Which of these is NOT a typical use of that data?","choices":["Setting the minimum qualifications for applicants","Choosing the colors for the company's new logo","Writing the technician training plan","Setting the job's pay grade relative to similar jobs"],"correct":1,"explanation":"Job analysis data supports hiring requirements, recruiting, selection, training plans, pay systems, and performance appraisals. Branding decisions aren't based on it.","subtitle":"Ch 4.13 Apply · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-140","type":"scenario","front":"A rejected applicant sues, claiming the company's requirement of two years' forklift experience was arbitrary. What best supports the company's defense?","choices":["A documented job analysis showing the requirement is tied to essential job duties","Evidence that most competitors use the same experience requirement","A statement that the hiring manager had no intent to discriminate","Proof that many qualified people applied and were considered"],"correct":0,"explanation":"Job analysis documents job-related requirements, which is the legal foundation against failure-to-hire claims (and adverse impact claims from Chapter 3).","subtitle":"Ch 4.13 Apply · Legal & Regulatory","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-141","type":"scenario","front":"A firm is shifting from in-store sales to e-commerce. Before rewriting its customer service job requirements, what should it do?","choices":["Analyze the job in light of the new strategy and future skill needs","Reuse the current job description, since the customers haven't changed","Download a generic e-commerce job description and use it as is","Let each manager set requirements from past hiring experience"],"correct":0,"explanation":"Job analysis should align requirements with strategy and future needs, so hires fit where the business is going.","subtitle":"Ch 4.13 Apply · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-142","type":"scenario","front":"Sales are flat, and a job analysis reveals that account reps spend 70% of their time on internal paperwork. How should the company use this finding?","choices":["Redesign the job to cut paperwork and free time for selling","Hire more reps without changing anything","Raise sales quotas","Ignore it, since job analysis is only for hiring"],"correct":0,"explanation":"Job analysis also supports job redesign. GE found its salespeople spent 80% of their time on non-sales work.","subtitle":"Ch 4.13 Apply · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-143","type":"scenario","front":"Which statement belongs in a person specification rather than a job description?","choices":["Reports to the operations manager and supervises two helpers","Plans daily delivery routes, loads the truck, and logs each stop","Works some weekends and holidays during the peak shipping season","Holds a commercial driver's license and has two years of delivery experience"],"correct":3,"explanation":"A person specification lists the worker characteristics needed. Reporting lines, duties, and conditions belong in the job description.","subtitle":"Ch 4.15 Apply · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-144","type":"scenario","front":"A posting reads: 'Schedules patient appointments, verifies insurance, and reports to the clinic manager. Some Saturdays required.' What document is this drawn from?","choices":["Replacement chart","Talent inventory","Job description","Person specification"],"correct":2,"explanation":"Duties, reporting relationships, and special conditions are the content of a job description.","subtitle":"Ch 4.14 Apply · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes"},{"id":"c202-ch04-145","type":"scenario","front":"A posting for an accountant lists a CPA license as required and 'fluency in Spanish a plus.' How should the Spanish fluency be treated?","choices":["As a job duty to list in the job description","As an innate ability that can't be assessed before hire","As a desirable criterion for comparing candidates who meet the essentials","As an essential criterion used to screen out applicants who lack it"],"correct":2,"explanation":"Desirable criteria boost success but aren't required. Screen on essential criteria first, then compare on desirable ones.","subtitle":"Ch 4.15 Apply · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-146","type":"scenario","front":"A data-entry job requires typing 60 accurate words per minute. In KSAO terms, what is this?","choices":["An 'other' characteristic","A skill","Knowledge","An ability"],"correct":1,"explanation":"A skill is applying knowledge to perform a task to a measurable standard, like typing speed.","subtitle":"Ch 4.15 Apply · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-147","type":"scenario","front":"A safety coordinator must know OSHA's recordkeeping requirements. In KSAO terms, what is this?","choices":["An 'other' characteristic","Knowledge","A skill","An ability"],"correct":1,"explanation":"Knowledge is organized factual or procedural information. State it specifically, such as named regulations rather than 'safety rules.'","subtitle":"Ch 4.15 Apply · Effective HRM","note":"Read more: 4.15 Person Specification"},{"id":"c202-ch04-148","type":"scenario","front":"Which task statement is written best?","choices":["Prepares and conducts inventory on a regular basis","Counts stock monthly, compares counts with accounting records, and fixes discrepancies","Handles all inventory matters for the store as needed","Is responsible for inventory accuracy and other duties as assigned"],"correct":1,"explanation":"Good task statements say what is done, how, and why. Vague verbs like 'handles' or 'prepares' tell applicants and analysts little.","subtitle":"Ch 4.14 Apply · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes"},{"id":"c202-ch04-149","type":"scenario","front":"With the ADA in mind, which task statement is better for a stock associate?","choices":["Lifts 40-pound cartons by hand and carries them up a ladder","Must be physically strong","Handles stock","Moves 40-pound cartons from the loading dock to storage shelves"],"correct":3,"explanation":"Under the ADA, task statements should emphasize what must be accomplished, not how, so a person who could do it another way isn't screened out.","subtitle":"Ch 4.14 Apply · Legal & Regulatory","note":"Read more: 4.14 Job Analysis Outcomes"},{"id":"c202-ch04-150","type":"scenario","front":"A hiring manager wants job analysis data built from real stories of excellent and poor performance so she can turn them into interview questions. Which method fits best?","choices":["Task inventory approach","Position Analysis Questionnaire","Ratio analysis","Critical incidents technique"],"correct":3,"explanation":"Critical incidents capture concrete examples of very effective and ineffective behavior, which convert well into behavioral interview questions.","subtitle":"Ch 4.16 Apply · Effective HRM","note":"Read more: 4.16 Job Analysis Methods"},{"id":"c202-ch04-151","type":"scenario","front":"A small firm has only two experts on a specialized role and needs a job analysis within a week. Which method fits best?","choices":["A task inventory survey of 200 tasks sent to all staff","Competency modeling across every job in the company","Business process reengineering of the role's workflow","Structured interview technique with a skilled interviewer"],"correct":3,"explanation":"The structured interview technique needs minimal time and resources and suits situations with few experts, but a professional should run it to limit bias.","subtitle":"Ch 4.17 Apply · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)"},{"id":"c202-ch04-152","type":"scenario","front":"A large employer needs standardized, quantitative data to compare 40 different jobs quickly and cheaply. Which method fits best?","choices":["Observation of top performers only","A structured questionnaire such as the PAQ","Critical incidents technique","Structured interviews with each incumbent"],"correct":1,"explanation":"Structured questionnaires like the PAQ are fast, cheap, usable for nearly any job, and standardized for comparison.","subtitle":"Ch 4.17 Apply · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)"},{"id":"c202-ch04-153","type":"scenario","front":"An analyst surveys experts to list and group about 150 tasks for a technician job. What is the main limitation of this approach?","choices":["It can miss rare but important tasks and what makes top performers","It's too subjective to give reliable, repeatable results","It needs a professional interviewer to limit bias in the data","It only works for executive and professional jobs"],"correct":0,"explanation":"The task inventory approach is objective and reliable but can miss infrequent, important tasks and superior-performer traits, so combine it with other methods.","subtitle":"Ch 4.17 Apply · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)"},{"id":"c202-ch04-154","type":"scenario","front":"A fast-growing tech company with constantly changing roles wants a list of broad traits shared by its best performers across many jobs. What approach fits, and what's the caution?","choices":["Task inventory; it may be too objective for fast-changing roles","Scientific management; workers may resist the time studies","Ratio analysis; staffing ratios may shift as the firm grows","Competency modeling; pair it with traditional job analysis"],"correct":3,"explanation":"Competency modeling suits fast-changing jobs and small firms, but it's less rigorous and documented, so combine it with traditional methods.","subtitle":"Ch 4.18 Apply · Effective HRM","note":"Read more: 4.18 Competency Modeling"},{"id":"c202-ch04-155","type":"scenario","front":"A small business owner downloads a generic job description for 'office manager' and uses it unchanged. What's the main problem?","choices":["Generic job descriptions are illegal to use for hiring","It will make the job too enriched for most applicants","No problem, since O*NET-style descriptions are meant to be copied","It may not reflect the actual job or strategy and is a weak legal defense"],"correct":3,"explanation":"Generic descriptions are a fine starting point but must be adapted. Unchanged, they fit the strategy poorly and defend weakly against legal claims.","subtitle":"Ch 4.17 Apply · Effective HRM","note":"Read more: 4.17 Job Elements Method (and other methods)"},{"id":"c202-ch04-156","type":"scenario","front":"A recruiter learns that a top candidate cares most about learning and advancement. Based on job rewards analysis, what should she emphasize?","choices":["The job's routine, predictable tasks","Training, development, and progression opportunities","The signing bonus and annual cash incentives","The company's strong stock price and profits"],"correct":1,"explanation":"Job rewards analysis identifies intrinsic and extrinsic rewards so recruiters can match what they emphasize to what a candidate values.","subtitle":"Ch 4.18 Apply · Motivational Concepts","note":"Read more: 4.18 Competency Modeling"},{"id":"c202-ch04-157","type":"scenario","front":"A plant posts this sign: 'Safety glasses must be worn at all times on the production floor.' What type of statement is this?","choices":["Procedure","Mission","Rule","Policy"],"correct":2,"explanation":"A rule states exactly what employees must or must not do, with no room for discretion.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-158","type":"scenario","front":"A company's handbook says: 'We reimburse reasonable business travel expenses so our people can serve clients well.' What type of statement is this?","choices":["Rule","Job description","Policy","Procedure"],"correct":2,"explanation":"A policy is a broad guiding principle that sets direction and reflects the company's values.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-159","type":"scenario","front":"An expense guide reads: '1. Photograph your receipt. 2. Upload it in the app within 30 days. 3. Your manager approves it in the portal.' What type of statement is this?","choices":["Rule","Core value","Procedure","Policy"],"correct":2,"explanation":"A procedure is the step-by-step sequence for carrying out a task in line with policy.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-160","type":"scenario","front":"A company states, 'We offer eight weeks of paid parental leave to support families,' then adds, 'Submit your request in the HR portal at least 30 days before leave begins.' How should these two statements be classified?","choices":["The first is a procedure; the second is a policy","Both are policies","The first is a policy; the second is a procedure","Both are rules"],"correct":2,"explanation":"The first sets direction (policy). The second gives the how-to steps to use it (procedure).","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-161","type":"scenario","front":"An employee fired for sharing confidential client data claims no one ever told her the rule. The company has her signed acknowledgment of the handbook, which includes its confidentiality policy. How did the handbook protect the company?","choices":["It doesn't help, since handbooks have no legal value","It documents that she was told the rule, supporting consistent enforcement","It makes any firing automatically legal, whatever the reason","It shifts legal liability for the leak to the client"],"correct":1,"explanation":"A handbook with signed acknowledgment proves employees were told the rules, which supports consistent discipline and defends the organization.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-162","type":"scenario","front":"An employee is harassed by her supervisor. The handbook gives her a second reporting channel that bypasses the supervisor and promises no retaliation. How does the handbook protect her?","choices":["It doesn't; handbooks protect only the company, not employees","It requires her to resolve it with the supervisor before reporting","It guarantees her a transfer and a promotion if she reports","It spells out her rights and a safe way to report without retaliation"],"correct":3,"explanation":"Handbooks protect employees by clarifying rights, complaint channels, and protections like anti-retaliation, so treatment is consistent and fair.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-163","type":"scenario","front":"A growing company has no handbook, and each manager enforces attendance rules differently. One employee is fired for lateness that others get away with. What's the biggest risk, and what's the fix?","choices":["Inconsistent treatment invites discrimination claims; publish a handbook","No real risk, since managers have full discretion over discipline","Low morale only; the fix is training managers to be stricter","Overtime costs; the fix is a new time-tracking system"],"correct":0,"explanation":"Without documented rules, enforcement varies by manager. A handbook protects the organization through consistency and employees through clear, shared expectations.","subtitle":"Ch 4.19 Apply · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-164","type":"scenario","front":"One manager oversees 20 agents handling routine billing calls. Another oversees 4 engineers doing novel research. Is each span of control appropriate?","choices":["No; the research team needs the wider span for autonomy","Yes, but only because wide spans always cost less","Yes; wide spans suit routine work, and narrow spans suit complex, novel work","No; both managers should have exactly nine direct reports"],"correct":2,"explanation":"Routine, similar work allows wide spans and more autonomy. Complex, novel work needs narrow spans and closer coaching.","subtitle":"Ch 4.20 Apply · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-165","type":"scenario","front":"A startup's founder makes every decision. The company now operates in several complex, fast-changing markets, and decisions are piling up. What structural change fits?","choices":["Increase formalization only","Decentralize so lower-level managers can make decisions faster","Centralize further so the founder controls everything","Add more layers of hierarchy"],"correct":1,"explanation":"Centralization suits new firms in simple, stable settings. Complex, nonroutine environments favor decentralization, which is faster and more innovative.","subtitle":"Ch 4.20 Apply · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-166","type":"scenario","front":"A request at a firm passes through seven management layers before anyone can approve it, and competitors move faster. What structural problem is most likely?","choices":["Too little formalization","Too little division of labor","Too much hierarchy","Too wide a span of control"],"correct":2,"explanation":"Each layer adds cost and delay. Organizations should have only as many levels as they need.","subtitle":"Ch 4.20 Apply · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-167","type":"scenario","front":"A lender maps each step a loan application takes from request to approval and removes two duplicate sign-offs. What is this?","choices":["Workflow analysis","Business process reengineering","Job enrichment","Trend analysis"],"correct":0,"explanation":"Workflow analysis traces how work moves to find steps to cut, simplify, or combine. It improves the existing process incrementally.","subtitle":"Ch 4.21 Apply · Effective HRM","note":"Read more: 4.21 Workflow Analysis"},{"id":"c202-ch04-168","type":"scenario","front":"A restaurant chain scraps its in-store food prep entirely and moves it to central kitchens, so stores only assemble orders. What is this?","choices":["Job rotation","Ratio analysis","Business process reengineering","Workflow analysis"],"correct":2,"explanation":"A radical, clean-slate redesign of how work gets done for big gains in cost, quality, and speed is BPR, as Taco Bell did.","subtitle":"Ch 4.21 Apply · Effective HRM","note":"Read more: 4.21 Workflow Analysis"},{"id":"c202-ch04-169","type":"scenario","front":"A major airline raises new-pilot pay to end its pilot shortage. From an industry-wide view, what's the main limitation of this fix?","choices":["It creates an immediate surplus of new pilots","It violates the Equal Pay Act for senior pilots","It mostly shifts the shortage to lower-paying regional carriers","It has no effect, since pilots don't respond to pay"],"correct":2,"explanation":"Higher pay helped American recruit, but it pulled pilots from lower-paying carriers. Growing total supply takes pipelines like training programs.","subtitle":"Ch 4.22 Apply · Effective HRM","note":"Read more: 4.22 Real World Response: Managing a Pilot Shortage at American Airlines"},{"id":"c202-ch04-170","type":"scenario","front":"An organization's long-term goals, describing the ideal future it wants to reach, make up its...","choices":["Vision","Strategy","Mission","Values"],"correct":0,"explanation":"A vision describes what the organization wants to become. A mission states its current purpose and scope.","subtitle":"Ch 4.4 Practice · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-171","type":"scenario","front":"Which process develops action plans to deal with forecasted labor surpluses and shortages?","choices":["Labor supply forecasting","Human resource planning","Business strategy development","Human resource management"],"correct":1,"explanation":"HR planning reconciles demand and supply forecasts through action plans. Supply forecasting is only one input.","subtitle":"Ch 4.4 Practice · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-172","type":"scenario","front":"Identifying, developing, and tracking employees so they can move into higher positions is called...","choices":["A replacement chart","Trend analysis","A talent inventory","Succession planning"],"correct":3,"explanation":"Succession planning is the ongoing process. A replacement chart is one tool it uses.","subtitle":"Ch 4.8 Practice · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-173","type":"scenario","front":"Which redesign raises a job's complexity to give employees more responsibility and a sense of achievement?","choices":["Job enlargement","Job enrichment","Job rotation","Cross-training"],"correct":1,"explanation":"Enrichment is vertical expansion that adds responsibility and autonomy.","subtitle":"Ch 4.12 Practice · Effective HRM","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-174","type":"scenario","front":"Adding more tasks at the same level of responsibility is called...","choices":["Job rotation","Worker autonomy","Job enrichment","Job enlargement"],"correct":3,"explanation":"Enlargement is horizontal: more tasks, same level, same responsibility.","subtitle":"Ch 4.12 Practice · Effective HRM","note":"Read more: 4.12 Increasing Motivation Through Job Design"},{"id":"c202-ch04-175","type":"scenario","front":"Which process helps align a job's requirements with the company's strategy?","choices":["Job analysis","Job enlargement","Job rotation","Job enrichment"],"correct":0,"explanation":"Job analysis identifies the tasks and worker traits a job needs in light of strategy and culture.","subtitle":"Ch 4.13 Practice · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-176","type":"scenario","front":"A performance bonus is what kind of reward?","choices":["Extrinsic","Intrinsic","Total","Competency"],"correct":0,"explanation":"Extrinsic rewards are monetary, like pay and bonuses. Intrinsic rewards come from the work itself.","subtitle":"Ch 4.18 Practice · Effective HRM","note":"Read more: 4.18 Competency Modeling"},{"id":"c202-ch04-177","type":"scenario","front":"The formal system of task, power, and reporting relationships in a company is its organizational...","choices":["Chart","Structure","Design","Style"],"correct":1,"explanation":"Structure is the system itself. A chart is the diagram of it, and design is the process of choosing it.","subtitle":"Ch 4.19 Practice · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-178","type":"scenario","front":"A diagram showing a company's chain of command is an organizational...","choices":["Structure","Style","Design","Chart"],"correct":3,"explanation":"An organizational chart shows who reports to whom.","subtitle":"Ch 4.19 Practice · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-179","type":"scenario","front":"Selecting and managing aspects of structure to achieve the company's goals is called organizational...","choices":["Policy","Design","Procedure","Chart"],"correct":1,"explanation":"Organizational design is the process of choosing and managing structure.","subtitle":"Ch 4.19 Practice · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-180","type":"scenario","front":"A guiding principle that sets the direction for an organization is a...","choices":["Rule","Procedure","Process","Policy"],"correct":3,"explanation":"A policy sets direction. Procedures give the steps, and rules state what's allowed.","subtitle":"Ch 4.19 Practice · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-181","type":"scenario","front":"How concentrated decision-making authority is at the top of an organization is called...","choices":["Formalization","Span of control","Division of labor","Centralization"],"correct":3,"explanation":"Centralization is concentrated authority. Decentralization pushes decisions down.","subtitle":"Ch 4.20 Practice · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-182","type":"scenario","front":"The number of people who report directly to a manager is the manager's...","choices":["Hierarchy","Span of control","Centralization","Formalization"],"correct":1,"explanation":"Span of control counts direct reports. Hierarchy is the number of layers.","subtitle":"Ch 4.20 Practice · Effective HRM","note":"Read more: 4.20 Characteristics of Organizational Structure"},{"id":"c202-ch04-183","type":"scenario","front":"A company's basic purpose and the scope of its operations are captured in its...","choices":["Mission","Vision","Values","Strategy"],"correct":0,"explanation":"Likely per text: a mission states purpose and scope. A vision is the ideal future.","subtitle":"Ch 4 Quiz Q1 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-184","type":"scenario","front":"A guiding belief such as 'always take care of our employees' that shapes decisions is a core...","choices":["Value","Strategy","Mission","Vision"],"correct":0,"explanation":"Likely per text: core values are enduring beliefs that guide decisions.","subtitle":"Ch 4 Quiz Q2 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-185","type":"scenario","front":"Which HR process reconciles gaps between labor supply and demand by creating action plans?","choices":["HR forecasting","HR strategy","HR management","HR planning"],"correct":3,"explanation":"Likely per text: HR planning uses forecasts to build action plans that close gaps.","subtitle":"Ch 4 Quiz Q3 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-186","type":"scenario","front":"The systematic process of describing a job's key aspects and the worker characteristics needed is...","choices":["Job enrichment","Job analysis","Job rotation","Job enlargement"],"correct":1,"explanation":"Likely per text: job analysis identifies tasks, conditions, and required worker traits.","subtitle":"Ch 4 Quiz Q4 · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-187","type":"scenario","front":"Research on companies that use job analysis effectively finds that they...","choices":["Financially outperform their competitors","Find job analysis isn't worth the cost","Mainly use it to give employees more responsibility","Use it chiefly to motivate goal attainment"],"correct":0,"explanation":"Likely per text: firms that use job analysis well outperform competitors financially.","subtitle":"Ch 4 Quiz Q5 · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-188","type":"scenario","front":"A written document listing a job's duties and responsibilities is a...","choices":["Job description","Job task","Job preview","Job statement"],"correct":0,"explanation":"Likely per text: a job description summarizes duties and responsibilities.","subtitle":"Ch 4 Quiz Q6 · Effective HRM","note":"Read more: 4.14 Job Analysis Outcomes"},{"id":"c202-ch04-189","type":"scenario","front":"To build action plans for an imbalance between labor supply and demand, managers use which kind of metrics?","choices":["Training metrics","Performance metrics","Job metrics","Business metrics"],"correct":1,"explanation":"Likely per text: in the HR planning model (Figure 4.1), action plans are built with performance metrics. Moderate confidence; 'business metrics' is the closest distractor.","subtitle":"Ch 4 Quiz Q7 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-190","type":"scenario","front":"Discipline rules, the code of ethics, an at-will statement, and a confidentiality agreement are usually found in the...","choices":["Collective bargaining agreement","Standard operating procedures","Job description","Employee handbook"],"correct":3,"explanation":"Likely per text: the employee handbook documents policies, procedures, and rules like these.","subtitle":"Ch 4 Quiz Q8 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-191","type":"scenario","front":"An organizational chart depicts the formal system called...","choices":["Organizational structure","Organizational design","Job design","Job analysis"],"correct":0,"explanation":"Likely per text: the chart diagrams the organizational structure (task, power, and reporting relationships).","subtitle":"Ch 4 Quiz Q9 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-192","type":"scenario","front":"A basic guideline that directs and limits actions in pursuit of long-term goals is a...","choices":["Procedure","Process","Protocol","Policy"],"correct":3,"explanation":"Likely per text: a policy is a guiding principle that sets direction.","subtitle":"Ch 4 Quiz Q10 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-193","type":"scenario","front":"A directive that spells out the specific actions to take to reach an objective is a...","choices":["Policy","Procedure","Protocol","Process"],"correct":1,"explanation":"Likely per text: a procedure is the how-to sequence of steps.","subtitle":"Ch 4 Quiz Q11 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-194","type":"scenario","front":"Which of these is a use of job analysis?","choices":["Creating employee training plans","Developing core values","Studying workflow","Facilitating goal accomplishment"],"correct":0,"explanation":"Likely per text: job analysis feeds training plans, along with hiring, selection, pay, and appraisals.","subtitle":"Ch 4 Quiz Q12 · Effective HRM","note":"Read more: 4.13 Job Analysis"},{"id":"c202-ch04-195","type":"scenario","front":"Where is the most reasonable place to publish company policies, procedures, and rules?","choices":["Job description","Employee handbook","Code of conduct","Company website"],"correct":1,"explanation":"Likely per text: the employee handbook collects policies, procedures, and rules.","subtitle":"Ch 4 Quiz Q13 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-196","type":"scenario","front":"Which best defines a policy?","choices":["A sequence of steps","A statement of what's permitted","A process for ensuring consistency","A guiding principle that sets direction"],"correct":3,"explanation":"Likely per text: a policy is a guiding principle setting direction.","subtitle":"Ch 4 Quiz Q14 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-197","type":"scenario","front":"Which best defines a procedure?","choices":["A how-to sequence of steps for applying guidelines to a task","A guiding principle","A process for ensuring consistency","A statement of what's permitted"],"correct":0,"explanation":"Likely per text: a procedure is a step-by-step sequence for doing a task.","subtitle":"Ch 4 Quiz Q15 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-198","type":"scenario","front":"Which best defines a rule?","choices":["A sequence of steps","A process for ensuring consistency","A guiding principle","A statement of what employees may or may not do"],"correct":3,"explanation":"Likely per text: a rule says what is or isn't permitted.","subtitle":"Ch 4 Quiz Q16 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-199","type":"scenario","front":"Which of the following is a rule?","choices":["A commitment to transparent communication","No personal cell phone use while on the job","401(k) eligibility after 90 days","A restroom-cleaning rotation"],"correct":1,"explanation":"Likely per text: a rule states a must or must-not. Transparency is a value or policy, 401(k) eligibility is a policy, and a rotation is a procedure or schedule.","subtitle":"Ch 4 Quiz Q17 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-200","type":"scenario","front":"Employees accrue 2.15 hours of emergency personal time each pay period, up to 56 hours a year. This statement is a...","choices":["Procedure","Process","Protocol","Policy"],"correct":3,"explanation":"Likely per text: it's a standing decision about a benefit, which makes it a policy. Moderate confidence, since it reads like a rule too, but 'rule' isn't a choice.","subtitle":"Ch 4 Quiz Q18 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-201","type":"scenario","front":"Employees using emergency time must call their supervisor within one hour of their shift start. This statement is a...","choices":["Policy","Protocol","Procedure","Process"],"correct":2,"explanation":"Likely per text: it tells employees how to carry out the policy, which makes it a procedure.","subtitle":"Ch 4 Quiz Q19 · Effective HRM","note":"Read more: 4.19 Organizational Structure"},{"id":"c202-ch04-202","type":"scenario","front":"Fill in the blanks: a ___ is a decision already made, and a ___ is how to complete an action.","choices":["Rule; procedure","Policy; procedure","Procedure; policy","Policy; rule"],"correct":1,"explanation":"Likely per text: a policy reflects a decision already made; a procedure describes how to act. Moderate confidence, since a rule could also be called a decision made.","subtitle":"Ch 4 Quiz Q20 · Effective HRM","note":"Read more: 4.19 Organizational Structure"}]},{"id":"c202-ch05","folder":"C202 Ch 5: Sourcing and Recruiting","course":"C202","order":5,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 5 Study Guide: Sourcing and Recruiting\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter belongs to **Effective Human Resource Management**: *evaluating strategies, policies, and procedures for effective HRM within an organization*. Effective HRM is the heaviest area on the Objective Assessment (OA), about **52%**, covering Chapters 4-8, 12, and 13. WGU's checklist for this chapter is short (two items), but both are classic OA material: sourcing vs. recruiting, and the types and benefits of internal and external recruiting sources.\n\nExpect questions framed like: Is this person sourcing or recruiting? Which source fits this hiring goal? What's a benefit or drawback of hiring internally vs. externally? Which type of job seeker is this? What is a realistic job preview supposed to do? Two topics preview **Legal and Regulatory** ideas from Chapter 3: hiring non-U.S. citizens (Form I-9 and work authorization) and the risk that employee referrals keep a workforce homogeneous.\n\nChapter 5 opens **Quarter 2** (Chapters 5-8). WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n---\n\n## 5.1-5.3 Why sourcing and recruiting matter\n\nRecruiting is the foundation of HRM. It decides who your future employees are, and that shapes everything after: training, pay, and performance management. In the book's model, staffing shapes what employees **can** do. Training can't teach what people can't or won't learn, and pay can't motivate people who are unable or unmotivated. One study found that an excellent recruiting function lifted a firm's market value by 18% or more. Companies that grow fast or promote from within, like P&G and Enterprise, depend on a strong pipeline.\n\n*Opening case:* IBM's top performers can be up to 800% more productive than average, and many business lines need the same scarce skills in AI, cloud, and Agile development. The challenge: use technology to recruit faster and better.\n\n## 5.2 and 5.12 Sourcing vs. recruiting\n\nThis is the first checklist item, so know it cold.\n\n- **Sourcing** is identifying qualified people and the labor markets to recruit them from. It's **analytical**: it generates leads. Think of it like marketing research for talent: who might be interested, and how do we reach them?\n- **Recruiting** is the set of activities that affect the **number and type of people willing to apply for and accept** job offers. It's **interpersonal**: it converts leads into applicants and applicants into hires, builds interest, keeps candidates engaged through the process, and persuades them to accept.\n\n*One-line version:* **sourcing identifies talent that recruiting attracts.**\n\n*How they're alike:* both aim to bring qualified, well-fitting people into the organization, both follow job analysis and support the business strategy, both influence what employees **can** do, and both rely on technology and on knowing the target talent. *How they differ:* sourcing comes first and is research-focused (finding names, markets, and channels), while recruiting is relationship-focused and lasts until the candidate starts work or drops out. *Example:* a sourcer who spends the morning searching LinkedIn for engineers with cloud certifications is sourcing; the recruiter who calls them, explains the role, and keeps them excited through interviews is recruiting.\n\n## 5.4 Sourcing and the three types of job seekers\n\nSourcing strategy depends on the job and on the type of job seeker:\n\n- **Active job seekers** are looking right now: checking postings, sending résumés, messaging contacts. They're easy to reach with ads, but the pool includes people recently fired and frequent job hoppers, so average quality can be lower. Exceptions: new college graduates and good people displaced in downturns.\n- **Semipassive job seekers** are comfortable in their jobs but open to something better and look only now and then. They may miss postings, so they need more proactive outreach. This group has more high-quality people than the active pool.\n- **Passive job seekers** aren't looking but could be tempted by the right opportunity. Many top performers are here, but they're the hardest to find and persuade, and they take the most time and information.\n\nMicrosoft's sourcers estimate that only about 5% of the talent they want is active. McAfee focused on high-value passive prospects and cut time to fill critical roles from 35 days to 11. *Lesson:* the same channels keep producing the same active seekers, so keep finding new sources.\n\n## 5.5 Recruiting technology\n\nSocial media (LinkedIn, Glassdoor, Facebook, and others) widens what sourcers can see about candidates and what candidates can see about employers. Videos (\"day in the life,\" employee testimonials, virtual tours) build excitement. **AI** can define what a good hire looks like, re
