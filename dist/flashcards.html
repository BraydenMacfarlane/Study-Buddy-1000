        const pct = Math.round((view.score / view.asked) * 100);
        if (folder && (typeof folder.quizBest !== "number" || pct > folder.quizBest)) { folder.quizBest = pct; save(); }
      }
      if (view.index < view.quizTotal) {
        const card = currentCard();
        view.choices = card ? makeChoices(card) : [];
      }
      render();
    }

    function startBoss() {
      const cards = shuffle(cardsIn(view.folderId));
      if (cards.length < 2) { alert("Add at least 2 cards to this folder for a boss quiz."); return; }
      if (cards.some((c) => !isScenario(c) && distractorPool(c).length < 1)) {
        alert("Add at least 2 regular (non-scenario) cards in this folder so the quiz can invent wrong answers.");
        return;
      }
      view.page = "boss";
      view.boss = { folderId: view.folderId, ids: cards.map((c) => c.id), index: 0, sel: null, choices: makeChoices(cards[0]), answers: [], result: null };
      render();
    }

    function renderBoss() {
      const b = view.boss;
      const folder = folderById(view.folderId);
      if (!b || !folder) { view.page = "folder"; return render(); }
      headerSub.textContent = folder.name + " · boss quiz";
      headerActions.innerHTML = `<button class="secondary" id="exitBoss">${b.result ? "Back to folder" : "Quit boss"}</button>`;
      document.getElementById("exitBoss").onclick = () => {
        if (!b.result && b.answers.length && !confirm("Quit the boss quiz? This attempt won't count.")) return;
        backToFolder();
      };
      if (b.result) return renderBossResults(b, folder);

      const card = state.cards.find((c) => c.id === b.ids[b.index]);
      if (!card) { b.ids.splice(b.index, 1); if (b.index >= b.ids.length) finishBoss(); else { b.choices = makeChoices(state.cards.find((c) => c.id === b.ids[b.index])); render(); } return; }
      const total = b.ids.length;
      const pct = Math.round((b.index / total) * 100);
      const prompt = isScenario(card) ? scenarioPrompt(card, `Boss quiz · pass mark ${BOSS_PASS}%`) : `
          <div class="flash quiz">
            <div class="hint">Boss quiz · pass mark ${BOSS_PASS}%</div>
            <h2>${escaped(card.front)}</h2>
            ${card.subtitle || card.year ? `<div class="subtitle">${escaped(card.subtitle || card.year)}</div>` : ""}
          </div>`;
      app.innerHTML = `
        <div class="study-wrap">
          <div>
            <div class="row" style="justify-content:space-between">
              <span class="muted">Question ${b.index + 1} of ${total}</span>
              <span class="muted">No feedback until the end · no skipping</span>
            </div>
            <div class="progress-bar" style="margin-top:8px"><span style="width:${pct}%"></span></div>
          </div>
          ${prompt}
          <div class="choices">${b.choices.map((ch, i) => `<button class="choice ${b.sel === i ? "selected" : ""}" data-bpick="${i}">${escaped(ch.text)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center">
            <button class="gold" id="bossNext" ${b.sel === null ? "disabled" : ""}>${b.index + 1 >= total ? "Lock in & finish" : "Lock in & next"}</button>
          </div>
        </div>`;
      app.querySelectorAll("[data-bpick]").forEach((btn) => {
        btn.onclick = () => { b.sel = Number(btn.dataset.bpick); render(); };
      });
      document.getElementById("bossNext").onclick = () => {
        if (b.sel === null) return;
        b.answers.push({ id: card.id, choices: b.choices, picked: b.sel, ok: !!b.choices[b.sel].correct });
        b.index += 1;
        b.sel = null;
        if (b.index >= b.ids.length) return finishBoss();
        b.choices = makeChoices(state.cards.find((c) => c.id === b.ids[b.index]) || card);
        render();
        window.scrollTo(0, 0);
      };
    }

    function finishBoss() {
      const b = view.boss;
      const folder = folderById(b.folderId);
      const total = b.answers.length;
      const correct = b.answers.filter((a) => a.ok).length;
      const pct = total ? Math.round((correct / total) * 100) : 0;
      const passed = pct >= BOSS_PASS;
      const prevBest = folder.bestBoss;
      const today = todayISO();
      const newBest = !prevBest || pct > (Number(prevBest.pct) || 0);
      if (newBest) folder.bestBoss = { pct, passed: passed || !!(prevBest && prevBest.passed), date: today };
      else if (passed && !prevBest.passed) folder.bestBoss.passed = true;
      folder.lastBoss = { pct, passed, date: today };
      const next = nextChapter(folder);
      b.result = { pct, passed, correct, total, newBest: newBest && !!prevBest, unlocked: passed && next && !(prevBest && prevBest.passed) ? next.id : null };
      save();
      render();
      window.scrollTo(0, 0);
    }

    function renderBossResults(b, folder) {
      const r = b.result;
      const missed = b.answers.filter((a) => !a.ok);
      const next = nextChapter(folder);
      const review = missed.map((a) => {
        const card = state.cards.find((c) => c.id === a.id);
        if (!card) return "";
        const right = a.choices.find((c) => c.correct);
        const why = isScenario(card) ? (cleanStr(card.explanation) || cleanStr(card.answer)) : "";
        const pts = !isScenario(card) ? (card.points || card.protections || []) : [];
        return `
          <div class="review-item">
            <div class="review-q">${escaped(card.front)}</div>
            <div class="review-a bad">✗ Your answer: ${escaped(a.choices[a.picked].text)}</div>
            <div class="review-a ok">✓ Correct: ${escaped(right ? right.text : cardAnswerText(card))}</div>
            ${why ? `<div class="muted" style="margin-top:4px">${escaped(why)}</div>` : ""}
            ${pts.length ? `<ul class="muted" style="margin:4px 0 0;padding-left:18px">${pts.map((x) => `<li>${escaped(x)}</li>`).join("")}</ul>` : ""}
            ${readMoreHtml(card)}
          </div>`;
      }).join("");
      app.innerHTML = `
        <div class="card boss-result ${r.passed ? "pass" : "fail"}" id="bossResult">
          <div class="boss-badge">${r.passed ? "Boss defeated" : "Not yet"}</div>
          <div class="boss-score">${r.pct}%</div>
          <div class="muted">${r.correct} of ${r.total} correct · pass mark ${BOSS_PASS}%${folder.bestBoss ? ` · best ${Math.round(folder.bestBoss.pct)}%` : ""}${r.newBest ? " · new best!" : ""}</div>
          ${r.passed && next ? `<p style="margin:10px 0 0"><strong>${escaped(next.name)}</strong> is ${r.unlocked ? "now unlocked" : "open"}.</p>` : ""}
          ${!r.passed ? `<p style="margin:10px 0 0" class="muted">Review the misses below, practice them, then try again.</p>` : ""}
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="${r.passed ? "secondary" : "gold"}" id="bossPractice" ${missed.length ? "" : "disabled"}>Practice missed (${missed.length})</button>
            <button class="secondary" id="bossRetake">Retake boss</button>
            ${r.passed && next ? `<button class="gold" id="bossNextCh">Go to ${escaped(chLabel(next))}</button>` : ""}
          </div>
        </div>
        ${missed.length ? `<div class="card" style="margin-top:12px"><h3 style="margin:0 0 6px">Review missed questions</h3>${review}</div>` : ""}
      `;
      document.getElementById("bossPractice").onclick = () => startQuiz(missed.map((a) => a.id));
      document.getElementById("bossRetake").onclick = startBoss;
      const go = document.getElementById("bossNextCh");
      if (go) go.onclick = () => { view.folderId = next.id; view.page = "folder"; render(); };
    }

    /* ---------- Matching game ---------- */
    const MATCH_PAIRS = 6;
    const MATCH_PENALTY_MS = 2000;
    function matchableCards(folderId) {
      return cardsIn(folderId).filter((c) => !isScenario(c) && cleanStr(c.front) && cardAnswerText(c));
    }

    function startMatch() {
      const picked = [];
      const seenA = new Set(), seenF = new Set();
      shuffle(matchableCards(view.folderId)).forEach((c) => {
        const a = cardAnswerText(c), f = cleanStr(c.front);
        if (picked.length >= MATCH_PAIRS || seenA.has(a) || seenF.has(f)) return;
        seenA.add(a); seenF.add(f);
        picked.push({ id: c.id, term: truncate(f, 70), def: truncate(a, 110), full: a });
      });
      if (picked.length < 3) { alert("Matching needs at least 3 regular (non-scenario) cards with different answers."); return; }
      view.page = "match";
      view.match = { folderId: view.folderId, pairs: picked, defs: shuffle(picked.map((x) => x.id)), matched: [], selTerm: null, selDef: null, start: Date.now(), penalty: 0, misses: 0, result: null };
      render();
    }

    function matchElapsed(m) { return Date.now() - m.start + m.penalty; }

    function renderMatch() {
      const m = view.match;
      const folder = folderById(view.folderId);
      if (!m || !folder) { view.page = "folder"; return render(); }
      headerSub.textContent = folder.name + " · match";
      headerActions.innerHTML = `<button class="secondary" id="exitMatch">Back to folder</button>`;
      document.getElementById("exitMatch").onclick = backToFolder;
      if (m.result) return renderMatchResult(m, folder);
      const byId = (id) => m.pairs.find((x) => x.id === id);
      app.innerHTML = `
        <div class="study-wrap" style="min-height:0">
          <div class="row" style="justify-content:space-between">
            <span class="match-timer"><span id="matchTime">${fmtTime(matchElapsed(m))}</span> <span id="penaltyFlash" class="penalty"></span></span>
            <span class="muted" id="matchStatus">Matched ${m.matched.length} of ${m.pairs.length}${m.misses ? ` · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s)` : ""}</span>
          </div>
          <div class="muted">Tap a term, then its definition. Wrong pairs add ${MATCH_PENALTY_MS / 1000} seconds.${folder.bestMatch ? ` Best: ${fmtTime(folder.bestMatch.ms)}` : ""}</div>
          <div class="match-grid">
            <div class="match-col">${m.pairs.map((x) => `<button class="match-tile term" data-term="${escaped(x.id)}">${escaped(x.term)}</button>`).join("")}</div>
            <div class="match-col">${m.defs.map((id) => { const x = byId(id); return `<button class="match-tile def" data-def="${escaped(x.id)}" title="${escaped(x.full)}">${escaped(x.def)}</button>`; }).join("")}</div>
          </div>
        </div>`;
      const tiles = (attr) => Array.from(app.querySelectorAll(`[data-${attr}]`));
      const paint = () => {
        tiles("term").forEach((el) => el.classList.toggle("sel", el.dataset.term === m.selTerm));
        tiles("def").forEach((el) => el.classList.toggle("sel", el.dataset.def === m.selDef));
      };
      const status = () => {
        document.getElementById("matchStatus").textContent = `Matched ${m.matched.length} of ${m.pairs.length}` +
          (m.misses ? ` · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s)` : "");
      };
      const check = () => {
        if (m.selTerm === null || m.selDef === null) return paint();
        const t = app.querySelector(`[data-term="${CSS.escape(m.selTerm)}"]`);
        const d = app.querySelector(`[data-def="${CSS.escape(m.selDef)}"]`);
        if (m.selTerm === m.selDef) {
          m.matched.push(m.selTerm);
          [t, d].forEach((el) => { el.classList.remove("sel"); el.classList.add("matched"); el.disabled = true; });
        } else {
          m.misses += 1;
          m.penalty += MATCH_PENALTY_MS;
          [t, d].forEach((el) => { el.classList.remove("sel"); el.classList.add("wrong"); setTimeout(() => el.classList.remove("wrong"), 600); });
          const pf = document.getElementById("penaltyFlash");
          pf.textContent = `+${MATCH_PENALTY_MS / 1000}s`;
          pf.classList.remove("show"); void pf.offsetWidth; pf.classList.add("show");
        }
        m.selTerm = m.selDef = null;
        status();
        paint();
        if (m.matched.length === m.pairs.length) finishMatch();
      };
      tiles("term").forEach((el) => {
        if (m.matched.includes(el.dataset.term)) { el.classList.add("matched"); el.disabled = true; }
        el.onclick = () => { if (el.disabled) return; m.selTerm = m.selTerm === el.dataset.term ? null : el.dataset.term; check(); };
      });
      tiles("def").forEach((el) => {
        if (m.matched.includes(el.dataset.def)) { el.classList.add("matched"); el.disabled = true; }
        el.onclick = () => { if (el.disabled) return; m.selDef = m.selDef === el.dataset.def ? null : el.dataset.def; check(); };
      });
      paint();
      if (matchTimer) clearInterval(matchTimer);
      matchTimer = setInterval(() => {
        const el = document.getElementById("matchTime");
        if (!el || view.page !== "match" || view.match !== m || m.result) { clearInterval(matchTimer); matchTimer = null; return; }
        el.textContent = fmtTime(matchElapsed(m));
      }, 100);
    }

    function finishMatch() {
      const m = view.match;
      if (matchTimer) { clearInterval(matchTimer); matchTimer = null; }
      const folder = folderById(m.folderId);
      const ms = matchElapsed(m);
      const prev = folder.bestMatch;
      const pairs = m.pairs.length;
      const isBest = !prev || prev.pairs !== pairs || ms < prev.ms;
      if (isBest) folder.bestMatch = { ms, pairs, date: todayISO() };
      m.result = { ms, isBest: isBest && !!prev && prev.pairs === pairs, first: !prev };
      save();
      setTimeout(() => { if (view.page === "match" && view.match === m) render(); }, 450);
    }

    function renderMatchResult(m, folder) {
      const r = m.result;
      app.innerHTML = `
        <div class="card boss-result pass" id="matchResult">
          <div class="boss-badge">${r.isBest ? "New best time!" : "All matched"}</div>
          <div class="boss-score">${fmtTime(r.ms)}</div>
          <div class="muted">${m.pairs.length} pairs · ${m.misses} miss${m.misses === 1 ? "" : "es"} (+${m.misses * MATCH_PENALTY_MS / 1000}s penalty)</div>
          <div class="muted" style="margin-top:4px">Best for this folder: <strong id="matchBest">${folder.bestMatch ? fmtTime(folder.bestMatch.ms) : "-"}</strong></div>
          <div class="row" style="justify-content:center;margin-top:14px">
            <button class="gold" id="matchAgain">Play again</button>
            <button class="secondary" id="matchBack">Back to folder</button>
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <h3 style="margin:0 0 6px">The pairs</h3>
          ${m.pairs.map((x) => { const c = state.cards.find((k) => k.id === x.id); return `
            <div class="review-item">
              <div class="review-q" style="margin-bottom:2px">${escaped(c ? c.front : x.term)}</div>
              <div class="muted">${escaped(x.full)}</div>
              ${c ? readMoreHtml(c) : ""}
            </div>`; }).join("")}
        </div>`;
      document.getElementById("matchAgain").onclick = startMatch;
      document.getElementById("matchBack").onclick = backToFolder;
    }

    function markResult(correct) {
      const card = currentCard();
      if (!card) return;
      const p = prog(card.id);
      if (correct) {
        p.streak += 1;
        if (p.streak >= RETIRE_AFTER) p.retired = true;
      } else {
        p.streak = 0;
        p.retired = false;
      }
      save();
    }

    function grade(correct) {
      const card = currentCard();
      markResult(correct);
      if (card && !isScenario(card)) noteConceptSeen(card.id);
      advanceStudy();
    }

    function noteConceptSeen(id) {
      const folder = folderById(view.folderId);
      if (!folder || !view.studyTargets || !view.studyTargets.length) return;
      if (!view.studySeen.includes(id)) view.studySeen.push(id);
      if (!folder.conceptPass && view.studyTargets.every((t) => view.studySeen.includes(t) || !state.cards.some((c) => c.id === t))) {
        folder.conceptPass = todayISO();
        save();
        toast("Full pass through the concept cards ✓");
      }
    }

    function advanceStudy() {
      const remainingIds = view.queue.filter((id, i) => i !== view.index && !prog(id).retired);
      if (!remainingIds.length) {
        view.queue = shuffle(activeStudy(view.folderId, view.studyMode || "mixed")).map((c) => c.id);
        view.index = 0;
      } else {
        view.queue = remainingIds;
        view.index = view.index >= view.queue.length ? 0 : view.index;
      }
      view.flipped = false;
      view.studyPicked = null;
      render();
    }

    function backToFolder() {
      view.page = "folder";
      render();
    }
    function resetAndStay() {
      studyPool(view.folderId, view.studyMode || "mixed").forEach((c) => { state.progress[c.id] = { streak: 0, retired: false }; });
      save();
      startStudy(view.studyMode);
    }

    function openFolderForm(folder) {
      modal.innerHTML = `
        <div class="dialog-head">${folder ? "Rename folder" : "New folder"}</div>
        <div class="dialog-body">
          <label>Folder name</label>
          <input id="folderName" type="text" value="${escaped(folder ? folder.name : "")}" />
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveFolder">Save</button>
          </div>
        </div>
      `;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("saveFolder").onclick = () => {
        const name = document.getElementById("folderName").value.trim();
        if (!name) return;
        if (folder) folder.name = name;
        else state.folders.push({ id: uid(), name });
        save();
        modal.close();
        render();
      };
    }

    function openCardForm(card) {
      const scen = !!(card && isScenario(card));
      const subtitle = card ? (card.subtitle || card.year || "") : "";
      const note = card ? (card.note || card.extra || "") : "";
      const answer = card ? (card.answer || card.purpose || "") : "";
      const points = card ? (card.points || card.protections || []) : [];
      const choices = scen ? card.choices : [];
      modal.innerHTML = `
        <div class="dialog-head">${card ? "Edit card" : "New card"}</div>
        <div class="dialog-body">
          <label for="cardType">Card type</label>
          <select id="cardType">
            <option value="basic" ${scen ? "" : "selected"}>Flash card (flip to see answer)</option>
            <option value="scenario" ${scen ? "selected" : ""}>Scenario (pick the right answer)</option>
          </select>
          <label id="frontLabel" for="cardFront">Front (prompt or question)</label>
          <textarea id="cardFront" class="short">${escaped(card ? card.front : "")}</textarea>
          <label>Subtitle (optional)</label>
          <input id="cardSubtitle" type="text" value="${escaped(subtitle)}" placeholder="Year, unit, topic..." />
          <label>Read more / source note (optional, shown after answering)</label>
          <input id="cardNote" type="text" value="${escaped(note)}" />
          <div id="basicFields">
            <label>Back (answer)</label>
            <textarea id="cardAnswer">${escaped(answer)}</textarea>
            <label>Extra points on the back (optional, one per line)</label>
            <textarea id="cardPoints">${escaped(points.join("\n"))}</textarea>
          </div>
          <div id="scenarioFields">
            <label>Choices (one per line, 2–5)</label>
            <textarea id="cardChoices" class="short" placeholder="Legal&#10;Illegal&#10;Depends">${escaped(choices.join("\n"))}</textarea>
            <label for="cardCorrect">Correct choice</label>
            <select id="cardCorrect"></select>
            <label>Explanation (shown after answering)</label>
            <textarea id="cardExplanation" class="short">${escaped(scen ? card.explanation || "" : "")}</textarea>
            <label>Short answer (optional, used in reviews)</label>
            <input id="cardScenarioAnswer" type="text" value="${escaped(scen ? card.answer || "" : "")}" />
          </div>
          <div id="formError" class="muted" style="color:var(--bad);margin-top:8px"></div>
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="secondary" id="cancelModal">Cancel</button>
            <button class="gold" id="saveCard">Save card</button>
          </div>
        </div>
      `;
      modal.showModal();
      const $ = (id) => document.getElementById(id);
      const choiceLines = () => $("cardChoices").value.split("\n").map((s) => s.trim()).filter(Boolean);
      let selected = scen ? Number(card.correct) : 0;
      const fillCorrect = () => {
        const lines = choiceLines();
        if (selected >= lines.length) selected = 0;
        $("cardCorrect").innerHTML = lines.length
          ? lines.map((t, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${i + 1}. ${escaped(truncate(t, 60))}</option>`).join("")
          : `<option value="0">Type the choices above first</option>`;
      };
      const syncType = () => {
        const isScen = $("cardType").value === "scenario";
        $("basicFields").style.display = isScen ? "none" : "";
        $("scenarioFields").style.display = isScen ? "" : "none";
        $("frontLabel").textContent = isScen ? "Scenario (what happens?)" : "Front (prompt or question)";
      };
      fillCorrect();
      syncType();
      $("cardType").onchange = syncType;
      $("cardChoices").oninput = fillCorrect;
      $("cardCorrect").onchange = () => { selected = Number($("cardCorrect").value); };
      $("cancelModal").onclick = () => modal.close();
      $("saveCard").onclick = () => {
        const err = (m) => { $("formError").textContent = m; };
        const front = $("cardFront").value.trim();
        const subtitle = $("cardSubtitle").value.trim();
        const note = $("cardNote").value.trim();
        let payload;
        if ($("cardType").value === "scenario") {
          const lines = choiceLines();
          const correct = Number($("cardCorrect").value);
          if (!front) return err("Write the scenario first.");
          if (lines.length < 2 || lines.length > 5) return err("A scenario needs 2 to 5 choices, one per line.");
          if (!Number.isInteger(correct) || correct < 0 || correct >= lines.length) return err("Pick the correct choice.");
          payload = { type: "scenario", front, subtitle, note, choices: lines, correct, explanation: $("cardExplanation").value.trim(), answer: $("cardScenarioAnswer").value.trim(), points: [] };
        } else {
          const answer = $("cardAnswer").value.trim();
          const points = $("cardPoints").value.split("\n").map((s) => s.trim()).filter(Boolean);
          if (!front || !answer) return err("A flash card needs a front and an answer.");
          payload = { front, subtitle, note, answer, points, year: subtitle, extra: note, purpose: answer, protections: points };
        }
        if (card) {
          if (payload.type === "scenario") { delete card.year; delete card.extra; delete card.purpose; delete card.protections; }
          else { delete card.type; delete card.choices; delete card.correct; delete card.explanation; }
          Object.assign(card, payload);
        } else {
          state.cards.push({ id: uid(), folderId: view.folderId, ...payload });
        }
        save();
        modal.close();
        render();
      };
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "flashcards-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function readJsonFile(file, cb) {
      const reader = new FileReader();
      reader.onload = () => {
        let data;
        try { data = JSON.parse(reader.result); }
        catch { alert("That file isn't valid JSON, so it could not be imported."); return; }
        cb(data);
      };
      reader.readAsText(file);
    }

    function openImportDialog() {
      modal.innerHTML = `
        <div class="dialog-head">Import</div>
        <div class="dialog-body">
          <p style="margin-top:0">Add a deck file (new chapters or updated cards) or merge in a backup. Nothing you already have is deleted, and your progress is kept.</p>
          <button class="gold" id="pickMerge">Choose file to add / merge</button>
          <input id="mergeFile" type="file" accept="application/json,.json" hidden />
          <div style="border-top:1px solid var(--line);margin:18px 0 12px"></div>
          <div class="muted">Moving to a new device? Restoring replaces everything in this browser with the backup.</div>
          <div class="row" style="justify-content:space-between;margin-top:10px">
            <button class="danger" id="pickRestore">Restore backup (replaces everything)</button>
            <button class="secondary" id="cancelModal">Cancel</button>
          </div>
          <input id="restoreFile" type="file" accept="application/json,.json" hidden />
        </div>`;
      modal.showModal();
      document.getElementById("cancelModal").onclick = () => modal.close();
      document.getElementById("pickMerge").onclick = () => document.getElementById("mergeFile").click();
      document.getElementById("pickRestore").onclick = () => document.getElementById("restoreFile").click();
      document.getElementById("mergeFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importMerge);
        e.target.value = "";
      };
      document.getElementById("restoreFile").onchange = (e) => {
        const file = e.target.files[0];
        if (file) readJsonFile(file, importRestore);
        e.target.value = "";
      };
    }

    function importMerge(data) {
      let sum;
      try { sum = mergeImport(data); }
      catch (err) { alert("That file could not be imported. " + (err && err.message ? err.message : "")); return; }
      showSummary("Import complete", sum);
    }

    function importRestore(data) {
      if (!data || Array.isArray(data) || !Array.isArray(data.folders) || !Array.isArray(data.cards)) {
        alert("Restore needs a full backup file (made with Export). To add a deck, use \"Choose file to add / merge\" instead.");
        return;
      }
      if (!confirm("Replace ALL folders, cards and progress in this browser with this backup?\n\nThis can't be undone. Tip: Export first if you might want your current data.")) return;
      state = migrate(JSON.parse(JSON.stringify(data)));
      applyBundledDecks();
      save();
      modal.close();
      view.page = "home";
      render();
      toast(`Backup restored: ${state.folders.length} folders, ${state.cards.length} cards.`);
    }

    function showSummary(title, sum) {
      modal.innerHTML = `
        <div class="dialog-head">${escaped(title)}</div>
        <div class="dialog-body">
          <p style="margin-top:0"><strong id="importSummary">${escaped(summaryText(sum))}</strong></p>
          ${sum.decks.length ? `<div class="muted">Decks: ${sum.decks.map(escaped).join(", ")}</div>` : ""}
          ${sum.problems.length ? `<div class="muted" style="margin-top:8px;color:var(--bad)">${sum.problems.slice(0, 8).map(escaped).join("<br>")}${sum.problems.length > 8 ? "<br>…" : ""}</div>` : ""}
          <div class="row" style="justify-content:flex-end;margin-top:14px">
            <button class="gold" id="closeSummary">Done</button>
          </div>
        </div>`;
      if (!modal.open) modal.showModal();
      document.getElementById("closeSummary").onclick = () => modal.close();
      view.page = view.page === "home" || view.page === "folder" ? view.page : "home";
      render();
    }

    let matchTimer = null;
    let toastTimer = null;
    function toast(msg) {
      let el = document.getElementById("toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "toast";
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 4500);
    }

    window.onerror = function(msg) {
      const app = document.getElementById("app");
      if (app) app.innerHTML = "<div class=\"card\"><strong>Something broke.</strong><div class=\"muted\">"+String(msg)+"</div></div>";
    };
    try { render(); } catch (err) { window.onerror(err && err.message ? err.message : err); }
    if (bundledSummary && (bundledSummary.foldersAdded || bundledSummary.cardsAdded || bundledSummary.cardsUpdated)) {
      toast(`New study material: ${bundledSummary.decks.join(", ")} (${bundledSummary.cardsAdded} new, ${bundledSummary.cardsUpdated} updated cards)`);
    }
  </script>
</body>
</html>
