ear despite documented outreach. Has it violated its affirmative action obligations?","choices":["Yes; goals are binding quotas","No; missing a goal isn't a violation if it made a good-faith effort","Yes, unless it hires men less","No, because goals don't apply to contractors"],"correct":1,"explanation":"Affirmative action goals aren't quotas. Contractors must make good-faith efforts; failing to try, not missing a number, is the violation.","subtitle":"Ch 3.11 Apply · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-103","type":"scenario","front":"A software company with federal contracts is flagged for below-average hiring of women and gets a compliance review of its affirmative action plan. Which agency is reviewing it?","choices":["NLRB","EEOC","OSHA","OFCCP"],"correct":3,"explanation":"The Labor Department's OFCCP enforces affirmative action duties for federal contractors, and data flags can trigger reviews.","subtitle":"Ch 3.17 Apply · Legal & Regulatory","note":"Read more: 3.17 Enforcement Agencies"},{"id":"c202-ch03-104","type":"scenario","front":"A private employer with 200 workers receives a charge alleging it fired a worker because of her religion. Which agency handles it?","choices":["EEOC","Department of Homeland Security","SEC","OFCCP"],"correct":0,"explanation":"The EEOC enforces Title VII and other anti-discrimination laws for most employers with 15+ employees.","subtitle":"Ch 3.17 Apply · Legal & Regulatory","note":"Read more: 3.17 Enforcement Agencies"},{"id":"c202-ch03-105","type":"scenario","front":"A delivery firm calls its drivers 'independent contractors' but sets their hours, assigns routes, dictates procedures, and supplies the vans. How are they likely to be classified legally?","choices":["Contractors, because the contract says so","Employees, because the company controls what and how the work is done","Contractors, if paid per delivery","Either; it's the drivers' choice"],"correct":1,"explanation":"Control is the test. Controlling both the result and the method makes workers employees, and misclassification brings back taxes and penalties.","subtitle":"Ch 3.12 Apply · Legal & Regulatory","note":"Read more: 3.12 Independent Contractors"},{"id":"c202-ch03-106","type":"scenario","front":"A web designer bids a fixed fee for a project, uses her own equipment, sets her own hours, and advertises to other clients. How is she likely classified?","choices":["Employee","Independent contractor","Temporary employee","Leased worker"],"correct":1,"explanation":"When the client controls only the result and the worker runs her own business, she is an independent contractor.","subtitle":"Ch 3.12 Apply · Legal & Regulatory","note":"Read more: 3.12 Independent Contractors"},{"id":"c202-ch03-107","type":"scenario","front":"A supervisor hints that an employee's promotion depends on whether she goes on dates with him. What type of harassment is this?","choices":["Hostile environment","Quid pro quo","Adverse impact","Retaliation"],"correct":1,"explanation":"Making a job benefit depend on submitting to sexual conduct is quid pro quo harassment.","subtitle":"Ch 3.13 Apply · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-108","type":"scenario","front":"Coworkers circulate crude sexual jokes by email. An employee who was never the target finds them offensive and humiliating. Can she have a claim?","choices":["Only if a supervisor sent them","No; only targets can complain","Yes; a hostile environment claim doesn't require being the target","No; jokes are protected speech"],"correct":2,"explanation":"Hostile environment harassment covers conduct that makes work intimidating or offensive, even for people who aren't the direct target.","subtitle":"Ch 3.13 Apply · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-109","type":"scenario","front":"An employee reports harassment by a coworker. Her manager decides to 'see how it plays out.' What's the legal problem?","choices":["None; managers have discretion","The employer may be liable for failing to take prompt corrective action","Only the coworker is liable","The employee should have gone to the police"],"correct":1,"explanation":"Employers must exercise reasonable care to prevent and promptly correct harassment. Waiting exposes the company to liability.","subtitle":"Ch 3.13 Apply · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-110","type":"scenario","front":"After filing an EEOC charge, an employee is dropped from a training program, left out of team meetings, and given an undeserved poor review. What is this?","choices":["Adverse impact","A petty slight that isn't actionable","Normal performance management","Retaliation"],"correct":3,"explanation":"Adverse actions that would dissuade a reasonable employee from protected activity are retaliation, which is illegal.","subtitle":"Ch 3.16 Apply · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation"},{"id":"c202-ch03-111","type":"scenario","front":"A home-repair company skips background checks to hire fast. A technician with a violent record assaults a customer in her home. What claim does the company face?","choices":["Negligent hiring","Fraudulent recruitment","Disparate treatment","Quid pro quo"],"correct":0,"explanation":"Employers can be liable for hiring someone they knew or should have known could harm others. Skipping checks can count as constructive knowledge.","subtitle":"Ch 3.16 Apply · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation"},{"id":"c202-ch03-112","type":"scenario","front":"A recruiter assures a candidate the company is 'rock solid' while knowing layoffs are planned. The candidate relocates and is laid off a month later. What claim fits?","choices":["WARN violation only","Retaliation","Negligent hiring","Fraudulent recruitment"],"correct":3,"explanation":"Misrepresenting material facts to induce someone to take a job is fraudulent recruitment, even if the promise was oral.","subtitle":"Ch 3.16 Apply · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation"},{"id":"c202-ch03-113","type":"scenario","front":"Which interview question is the safest to ask?","choices":["Are you a U.S. citizen?","Are you legally authorized to work in the United States?","Where were you born?","How long have you lived in this country?"],"correct":1,"explanation":"Asking about work authorization is job-related. Citizenship, birthplace, and residency questions risk national origin discrimination.","subtitle":"Ch 3.23 Apply · Legal & Regulatory","note":"Read more: 3.23 Strategic HRM Exercise: Troublesome Interview Questions; 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-114","type":"scenario","front":"A retailer needs staff for some Sunday and holiday shifts. Which question should the interviewer ask?","choices":["Do you attend church on Sundays?","Will you need Christmas off?","Can you work the required schedule, including some weekends and holidays?","What religion do you practice?"],"correct":2,"explanation":"Ask about the job's actual requirements. Questions about religious practice invite religious discrimination claims.","subtitle":"Ch 3.23 Apply · Legal & Regulatory","note":"Read more: 3.23 Strategic HRM Exercise: Troublesome Interview Questions; 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-115","type":"scenario","front":"An interviewer wants to know if a candidate can make 7 a.m. shifts. Which question is best?","choices":["Do you have kids to drop off?","How far away do you live?","Do you own or rent your home?","Can you reliably arrive by the 7 a.m. start time?"],"correct":3,"explanation":"Ask directly about the job requirement. Commute, housing, and family questions aren't job-related and can lead to discrimination claims.","subtitle":"Ch 3.23 Apply · Legal & Regulatory","note":"Read more: 3.23 Strategic HRM Exercise: Troublesome Interview Questions; 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-116","type":"scenario","front":"For a logistics coordinator job, which military-related question is appropriate before hiring?","choices":["What type of discharge did you receive?","Do you expect to be deployed soon?","Do you have military logistics experience relevant to this role?","Which branch are your parents from?"],"correct":2,"explanation":"Ask about service only when the experience is job-related. Discharge type can wait until after hire, and asking about future deployments risks USERRA claims.","subtitle":"Ch 3.23 Apply · Legal & Regulatory","note":"Read more: 3.23 Strategic HRM Exercise: Troublesome Interview Questions; 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-117","type":"scenario","front":"A hiring manager skips every applicant under 25, saying 'young people don't stick around.' Which bias is this?","choices":["Perception of personal loss","Prejudice","Ignorance","Stereotyping"],"correct":3,"explanation":"Assuming all members of a group share the same traits is stereotyping. It judges people by group instead of individual evidence.","subtitle":"Ch 3.19 Apply · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-118","type":"scenario","front":"A senior engineer stops referring diverse candidates because he worries they'll compete with him for promotion. Which barrier is this?","choices":["Ignorance","Algorithmic bias","Perception of possible personal loss","Stereotyping"],"correct":2,"explanation":"Fear that diversity will cost you opportunities leads people to withhold referrals, training, and fair evaluations.","subtitle":"Ch 3.19 Apply · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-119","type":"scenario","front":"A small-business owner rejects a pregnant applicant and later says he didn't know it was illegal. How does the law view his defense?","choices":["Valid, since small firms are exempt","Ignorance isn't a legal defense","Valid, if he apologizes","Valid under the BFOQ rule"],"correct":1,"explanation":"Ignorance of employment law is a common EEO barrier, especially in small firms, but it never excuses a violation.","subtitle":"Ch 3.19 Apply · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-120","type":"scenario","front":"A hiring manager overlooks clear signs that his star hire is padding expense reports, because admitting it would make his hiring look bad. Which ethical trap is this?","choices":["Lowered thresholds","Motivated blindness","Overvaluing money","Fear of retaliation"],"correct":1,"explanation":"Motivated blindness is overlooking information we don't want to see when ignorance serves our interests.","subtitle":"Ch 3.20 Apply · Strategic HRM","note":"Read more: 3.20 Barriers to Ethical HRM"},{"id":"c202-ch03-121","type":"scenario","front":"A manager refuses to promote anyone who drives a pickup truck. Is this unlawful?","choices":["Probably not, unless it disproportionately harms a protected group","Yes, under the Equal Pay Act","No; managers can never be sued for promotions","Yes; it's unfair, so it's illegal"],"correct":0,"explanation":"Unfair isn't the same as unlawful. A non-job-related rule becomes illegal if it targets or disproportionately harms a protected group.","subtitle":"Ch 3.5 Apply · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-122","type":"scenario","front":"To limit hiring risk, a company outsources background checks to a specialist firm with its own insurance. Which risk strategy is this?","choices":["Retention","Avoidance","Reduction","Sharing"],"correct":3,"explanation":"Transferring risk to another party through outsourcing or insurance is risk sharing.","subtitle":"Ch 3.4 Apply · Strategic HRM","note":"Read more: 3.4 The Role of HRM in Risk Management"},{"id":"c202-ch03-123","type":"scenario","front":"Which statement about diversity and inclusion is accurate?","choices":["Inclusion means the same thing as diversity","D&I matters only for legal compliance","Hiring a diverse workforce guarantees success","Diversity is linked to customer satisfaction and innovation when inclusion lets people contribute"],"correct":3,"explanation":"Diversity is the mix; inclusion lets everyone contribute fully. Together they drive innovation and customer satisfaction, but diversity alone isn't enough.","subtitle":"Ch 3.6 Apply · Strategic HRM","note":"Read more: 3.6 The Importance of Diversity and Inclusion to Business Performance"},{"id":"c202-ch03-124","type":"scenario","front":"A decision that isn't job-related, objective, or merit-based is what kind of discrimination?","choices":["Rational","Unfair","Authoritative","Power"],"correct":1,"explanation":"Unfair discrimination relies on anything other than objective, merit-based, job-related factors.","subtitle":"Ch 3.5 Practice · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-125","type":"scenario","front":"A manager fires several employees for wearing a rival sports team's colors to work. No protected group is disproportionately affected. What's the legal verdict?","choices":["It broke the law because it's unfair","It broke the law because it targets one demographic","It didn't break the law; sports fans aren't a protected group","It's rational employment"],"correct":2,"explanation":"Unfair isn't unlawful. Fans aren't a protected group, so it's legal unless it disproportionately harms one.","subtitle":"Ch 3.5 Practice · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-126","type":"scenario","front":"Discriminating against someone because of pregnancy, religion, or age is called a(n)...","choices":["Rational employment practice","Authoritative employment practice","Fair discrimination","Unlawful employment practice"],"correct":3,"explanation":"Violating federal, state, or local employment law is an unlawful employment practice.","subtitle":"Ch 3.5 Practice · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-127","type":"scenario","front":"Diversity helps foster creativity and what else?","choices":["Indemnity","Innovation","Invocation","Incantation"],"correct":1,"explanation":"Diverse perspectives fuel creativity and innovation.","subtitle":"Ch 3.6 Practice · Legal & Regulatory","note":"Read more: 3.6 The Importance of Diversity and Inclusion to Business Performance"},{"id":"c202-ch03-128","type":"scenario","front":"Which federal law prohibits job discrimination based on race, color, religion, sex, or national origin?","choices":["NLRA","FLSA","Title VII of the Civil Rights Act","Equal Pay Act"],"correct":2,"explanation":"Title VII (1964) covers these five protected classes.","subtitle":"Ch 3.8 Practice · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-129","type":"scenario","front":"Which law lets workers who lose their jobs keep group health benefits for a limited time?","choices":["FMLA","USERRA","FLSA","COBRA"],"correct":3,"explanation":"COBRA provides temporary continuation of group health coverage.","subtitle":"Ch 3.9 Practice · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-130","type":"scenario","front":"Which law requires employers with 100+ employees to give 60 days' notice before a plant closing?","choices":["WARN Act","NLRA","FLSA","Equal Pay Act"],"correct":0,"explanation":"The WARN Act requires 60 days' notice of closings and mass layoffs.","subtitle":"Ch 3.9 Practice · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-131","type":"scenario","front":"How much FMLA leave can an eligible employee take to care for a spouse, child, or parent with a serious health condition?","choices":["10 workdays","12 workweeks","10 weeks","12 workdays"],"correct":1,"explanation":"FMLA provides up to 12 workweeks in a 12-month period for this reason.","subtitle":"Ch 3.10 Practice · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-132","type":"scenario","front":"How much FMLA leave is available to care for a family member who is a seriously ill or injured service member?","choices":["18 workweeks","20 workweeks","26 workweeks","22 workweeks"],"correct":2,"explanation":"Military caregiver leave allows up to 26 workweeks in a 12-month period.","subtitle":"Ch 3.10 Practice · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-133","type":"scenario","front":"Demoting or firing an employee because of military service violates which law?","choices":["FMLA","VEVRAA","FLSA","USERRA"],"correct":3,"explanation":"USERRA protects service members from discrimination and guarantees reemployment. VEVRAA covers contractor affirmative action for veterans.","subtitle":"Ch 3.10 Practice · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-134","type":"scenario","front":"Proactive efforts to eliminate discrimination and its past effects are called...","choices":["A diversity action plan","Affirmative action","Diversity awareness","An affirmative action plan"],"correct":1,"explanation":"Affirmative action is the effort itself; an affirmative action plan is the written document detailing it.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-135","type":"scenario","front":"A group that has been underrepresented in employment is known as a ___ class.","choices":["Preferential","Affirmative","Protected","Desperate"],"correct":2,"explanation":"Protected classes are groups historically underrepresented in employment.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-136","type":"scenario","front":"Which group is NOT covered by affirmative action requirements?","choices":["Disabled veterans","People age 40 and older","Native Americans","Black Americans"],"correct":1,"explanation":"Workers 40+ are protected from discrimination by the ADEA, but affirmative action doesn't cover them.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-137","type":"scenario","front":"Executive Order 11246 requires federal contractors to...","choices":["Have a BFOQ","Provide reasonable accommodation","Hire disabled veterans","Have an affirmative action plan"],"correct":3,"explanation":"EO 11246 requires covered federal contractors to maintain affirmative action plans.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-138","type":"scenario","front":"Employers that discriminated in the past may adopt which of these as a remedy?","choices":["Affirmative action plans","Diversity awareness","Diversity action plans","Affirmative action awareness"],"correct":0,"explanation":"Affirmative action plans can be an agreed remedy for past discrimination.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-139","type":"scenario","front":"Giving a member of a protected group a preference in an employment decision is called...","choices":["Disparate treatment","Affirmative action","Preferential treatment","Diversity awareness"],"correct":2,"explanation":"Preferential treatment is allowed only temporarily in court-settled cases.","subtitle":"Ch 3.11 Practice · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-140","type":"scenario","front":"When sexual conduct is made a condition of employment or advancement, what type of harassment is it?","choices":["Hostile environment","Quid pro quo","Desperate","Sexual favoritism"],"correct":1,"explanation":"Quid pro quo ('this for that') ties job decisions to submitting to sexual conduct.","subtitle":"Ch 3.13 Practice · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-141","type":"scenario","front":"When conduct leaves an employee feeling fearful, demeaned, or belittled, whether or not they were the target, it's...","choices":["Quid pro quo","Adverse impact","Hostile environment harassment","Disparate treatment"],"correct":2,"explanation":"Hostile environment harassment creates an intimidating or offensive workplace.","subtitle":"Ch 3.13 Practice · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-142","type":"scenario","front":"Who is always responsible when a supervisor's harassment ends in a tangible employment action?","choices":["The employee","The court","The supervisor alone","The employer"],"correct":3,"explanation":"Employers are always liable for supervisor harassment that results in a tangible action like firing or demotion.","subtitle":"Ch 3.13 Practice · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-143","type":"scenario","front":"When an employee complains of harassment, what should the employer do?","choices":["Take immediate action","Wait and see how it plays out","Transfer the complainer","Discipline the complainer"],"correct":0,"explanation":"Prompt corrective action is both legally required and the right thing to do.","subtitle":"Ch 3.13 Practice · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-144","type":"scenario","front":"Title VII bars treating people differently because of membership in a ___ group.","choices":["Disparate","Affirmative","Preferential","Protected"],"correct":3,"explanation":"Title VII prohibits disparate treatment based on protected group membership.","subtitle":"Ch 3.15 Practice · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-145","type":"scenario","front":"If a decision would have changed had the person's race, religion, or sex been different, that is...","choices":["Disparate treatment","Adverse impact","Diverse impact","Diverse treatment"],"correct":0,"explanation":"That's the test for disparate treatment: intentional discrimination.","subtitle":"Ch 3.15 Practice · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-146","type":"scenario","front":"Which Supreme Court case is the landmark for adverse impact?","choices":["Ricci v. DeStefano","Griggs v. Duke Power Co.","Roe v. Wade","McDonnell Douglas v. Green"],"correct":1,"explanation":"Griggs (1971) established that neutral practices with disproportionate effects need business necessity.","subtitle":"Ch 3.15 Practice · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-147","type":"scenario","front":"A rule to hire only people 6 feet or taller reduces the number of women and some minorities hired. This is an example of...","choices":["Disparate treatment","Race norming","Affirmative action","Adverse impact"],"correct":3,"explanation":"A neutral height rule with disproportionate effects on protected groups is adverse impact.","subtitle":"Ch 3.15 Practice · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-148","type":"scenario","front":"Retaliating against an employee who complained about harassment is...","choices":["Acceptable if documented","Illegal","Legal for at-will employees","Merely unprofessional"],"correct":1,"explanation":"Retaliation for protected activity is illegal.","subtitle":"Ch 3.16 Practice · Legal & Regulatory","note":"Read more: 3.16 Employment Lawsuits: Fraudulent Recruitment, Negligent Hiring, and Retaliation"},{"id":"c202-ch03-149","type":"scenario","front":"Believing that all members of a group share the same traits or behaviors is called...","choices":["Prejudice","Ignorance","Stereotyping","Perception of loss"],"correct":2,"explanation":"Stereotyping judges individuals by assumptions about their group.","subtitle":"Ch 3.19 Practice · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-150","type":"scenario","front":"Which bias is often inaccurate and harmful and frequently leads to legal violations?","choices":["Inclusion","Engagement","Partiality","Stereotyping"],"correct":3,"explanation":"Stereotypes are often wrong and can drive unlawful decisions.","subtitle":"Ch 3.19 Practice · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-151","type":"scenario","front":"Outright bigotry toward a group is called...","choices":["Prejudice","Stereotyping","Ignorance","Perception of loss"],"correct":0,"explanation":"Prejudice is open bias against a group.","subtitle":"Ch 3.19 Practice · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-152","type":"scenario","front":"Being unaware of what employment laws require is which EEO barrier?","choices":["Stereotyping","Ignorance","Prejudice","Perception of loss"],"correct":1,"explanation":"Ignorance of the law is a barrier, and it isn't a legal defense.","subtitle":"Ch 3.19 Practice · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-153","type":"scenario","front":"Employment laws exist mainly because employers hold more ___ than employees.","choices":["Ethics","Bias","Money","Power"],"correct":3,"explanation":"Employers control pay, promotion, and conditions, so laws limit that power.","subtitle":"Ch 3 Quiz Q1 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-154","type":"scenario","front":"Hiring the candidate with the best job-related skills, based on objective criteria, is an example of ___ discrimination.","choices":["Fair","Rational","Power","Authoritative"],"correct":0,"explanation":"Fair discrimination uses only objective, merit-based, job-related factors.","subtitle":"Ch 3 Quiz Q2 · Legal & Regulatory","note":"Read more: 3.5 The Importance of Employment Laws"},{"id":"c202-ch03-155","type":"scenario","front":"Being mindful of differences in gender, nationality, orientation, disability, and culture is known as ___ awareness.","choices":["Innovation","Employment","Diversity","Inclusion"],"correct":2,"explanation":"Diversity awareness means understanding and valuing these differences.","subtitle":"Ch 3 Quiz Q3 · Legal & Regulatory","note":"Read more: 3.6 The Importance of Diversity and Inclusion to Business Performance"},{"id":"c202-ch03-156","type":"scenario","front":"Which law bars employers from retaliating against employees who try to unionize?","choices":["WARN Act","National Labor Relations Act (Wagner Act)","FLSA","Equal Pay Act"],"correct":1,"explanation":"The NLRA (1935) protects organizing and collective bargaining.","subtitle":"Ch 3 Quiz Q4 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-157","type":"scenario","front":"Which law sets the federal minimum wage and overtime rules?","choices":["NLRA","WARN Act","Equal Pay Act","FLSA"],"correct":3,"explanation":"The FLSA (1938) sets minimum wage, overtime, recordkeeping, and youth employment rules.","subtitle":"Ch 3 Quiz Q5 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-158","type":"scenario","front":"Which law specifically prohibits paying men and women differently for equal work?","choices":["Equal Pay Act","FLSA","NLRA","WARN Act"],"correct":0,"explanation":"The Equal Pay Act (1963) bars sex-based wage discrimination.","subtitle":"Ch 3 Quiz Q6 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-159","type":"scenario","front":"What does FMLA stand for?","choices":["Fair Medical Leave Act","Family and Medical Leave Act","Family Medicinal Leave Act","Fair Medicinal Leave Act"],"correct":1,"explanation":"The Family and Medical Leave Act (1993) provides job-protected leave.","subtitle":"Ch 3 Quiz Q7 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-160","type":"scenario","front":"A recruiter browses a candidate's social media and sees a post about her mother's hereditary illness. Using that in a hiring decision would violate which law?","choices":["Equal Pay Act","NLRA","GINA","FLSA"],"correct":2,"explanation":"GINA bars acquiring or using genetic information, including family medical history, in employment decisions, which is why social media screening is risky.","subtitle":"Ch 3 Quiz Q8 · Legal & Regulatory","note":"Read more: 3.10 Major Federal Employment Laws (1993–2010)"},{"id":"c202-ch03-161","type":"scenario","front":"Which law guarantees equal opportunity to people who have a disability or are perceived as having one?","choices":["FLSA","ADA","NLRA","Equal Pay Act"],"correct":1,"explanation":"The ADA (1990) protects people with actual or perceived disabilities.","subtitle":"Ch 3 Quiz Q9 · Legal & Regulatory","note":"Read more: 3.9 Major Federal Employment Laws (1978–1990)"},{"id":"c202-ch03-162","type":"scenario","front":"Which set lists exactly the classes protected under Title VII?","choices":["Race, disability, veteran status, sex","Color, sexual orientation, marital status","Color, pregnancy, national origin, religion, disability","Race, color, religion, national origin, sex"],"correct":3,"explanation":"Title VII names race, color, religion, sex, and national origin. Disability, veteran status, and marital status aren't on the list.","subtitle":"Ch 3 Quiz Q10 · Legal & Regulatory","note":"Read more: 3.8 Major Federal Employment Laws (1935–1974)"},{"id":"c202-ch03-163","type":"scenario","front":"Affirmative action aims to provide opportunity to members of a ___ class.","choices":["Proactive","Preferential","Protected","Particular"],"correct":2,"explanation":"Affirmative action expands opportunity for protected classes.","subtitle":"Ch 3 Quiz Q11 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-164","type":"scenario","front":"Which of these is an example of affirmative action?","choices":["Setting hiring quotas","Simply complying with Title VII","Actively recruiting women and minorities","Holding a D&I training session"],"correct":2,"explanation":"Affirmative action is a proactive effort, such as outreach to women and minorities. Basic compliance isn't proactive, and quotas aren't allowed.","subtitle":"Ch 3 Quiz Q12 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action"},{"id":"c202-ch03-165","type":"scenario","front":"Federal contractors maintain ___ because the law requires it.","choices":["Diversity action plans","Affirmative action plans","Diversity awareness","Affirmative action awareness"],"correct":1,"explanation":"Executive Order 11246 requires covered federal contractors to have affirmative action plans.","subtitle":"Ch 3 Quiz Q13 · Legal & Regulatory","note":"Read more: 3.11 Affirmative Action; 3.17 Enforcement Agencies"},{"id":"c202-ch03-166","type":"scenario","front":"Lewd jokes, whistling, and offensive pictures at work can create what kind of environment?","choices":["Hostile","Disparate","Quid pro quo","Distressed"],"correct":0,"explanation":"Such conduct can support a hostile environment harassment claim.","subtitle":"Ch 3 Quiz Q14 · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-167","type":"scenario","front":"Who can be the victim of sexual harassment?","choices":["Only women","Only men","Only people of the same sex as the harasser","Anyone"],"correct":3,"explanation":"Victims and harassers can be any sex; courts look at the conduct.","subtitle":"Ch 3 Quiz Q15 · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-168","type":"scenario","front":"In a harassment case without a tangible employment action, when is the employer liable?","choices":["When it had a policy and training in place","When it didn't use reasonable care to prevent and promptly correct the harassment","When it counseled managers on retaliation","When it skipped an annual questionnaire"],"correct":1,"explanation":"Employers can avoid liability only if they took reasonable care and the employee unreasonably failed to complain.","subtitle":"Ch 3 Quiz Q16 · Legal & Regulatory","note":"Read more: 3.13 Types of Employment Lawsuits: Sexual Harassment"},{"id":"c202-ch03-169","type":"scenario","front":"Intentionally treating someone differently because of a protected characteristic is...","choices":["Adverse impact","Disparate impact","Diverse impact","Disparate treatment"],"correct":3,"explanation":"Disparate treatment is intentional discrimination.","subtitle":"Ch 3 Quiz Q17 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-170","type":"scenario","front":"A practice that disproportionately harms a protected group, whether or not anyone intended it, is...","choices":["Disparate treatment","Adverse impact","Fraudulent recruitment","Diverse impact"],"correct":1,"explanation":"Adverse impact focuses on effects, not intent.","subtitle":"Ch 3 Quiz Q18 · Legal & Regulatory","note":"Read more: 3.15 Employment Lawsuits: Disparate Treatment and Adverse Impact"},{"id":"c202-ch03-171","type":"scenario","front":"Some employees fear they'll lose opportunities when the company hires for diversity. Which barrier is this?","choices":["Perception of possible personal loss","Stereotyping","Prejudice","Ignorance"],"correct":0,"explanation":"This fear can make people less willing to refer, train, or fairly evaluate diverse colleagues.","subtitle":"Ch 3 Quiz Q19 · Legal & Regulatory","note":"Read more: 3.19 Human Biases"},{"id":"c202-ch03-172","type":"scenario","front":"A hiring manager rejects a strong candidate as 'overqualified.' What bias does this often reflect?","choices":["Ignorance","Prejudice","Perception of loss","Stereotyping"],"correct":3,"explanation":"Assuming an overqualified person will be bored or leave is stereotyping. Courts treat overqualified as qualified.","subtitle":"Ch 3 Quiz Q20 · Legal & Regulatory","note":"Read more: 3.19 Human Biases"}]},{"id":"c202-ch04","folder":"C202 Ch 4: Analyzing Work and HR Planning","course":"C202","order":4,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 4 Study Guide: Analyzing Work and HR Planning\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nThis chapter belongs to **Effective Human Resource Management**: *evaluating strategies, policies, and procedures for effective HRM within an organization*. Effective HRM is the heaviest area on the Objective Assessment (OA), about **52%**, and it covers Chapters 4-8, 12, and 13. Chapter 4 is where it starts, so the planning, job analysis, and policy ideas here come back again and again.\n\nExpect questions framed like: Which forecasting method is this? Is this a shortage or a surplus, and what's the right short-term or long-term response? What is this job analysis data used for? Is this statement a policy, a procedure, or a rule? How does the employee handbook protect both sides? Mission, vision, and values tie back to **Strategic HRM**, the job characteristics model previews **Motivational Concepts**, and job analysis as a legal defense echoes Chapter 3's **Legal and Regulatory** material.\n\nChapter 4 is the last chapter of **Quarter 1** (Chapters 1-4), so the Quarter 1 quiz follows it. WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n---\n\n## 4.1-4.3 Why planning and work analysis matter\n\nStructure and workforce planning are the foundation of HR. They're how a company makes sure it has **the right talent in the right place at the right time**. In the book's model, recruiting and staffing shape what employees **can** do.\n\nMany companies just fill openings as they come up. One Cox Communications executive noticed his company spent months on budgets but almost no time on talent. **Strategic workforce planning** fixes that by focusing talent investment where it has the most impact. It helps leaders decide where to put plants or offices, what training to fund, what to outsource, and which **pivotal roles** need star performers (software developers at a tech firm, brand managers where the brand is everything).\n\n*Example:* CNA Financial discovered it would run short of underwriters within two years.\n\n*Opening case:* American Airlines faced a **pilot shortage** driven by retirements, fading interest in the career, global growth in air travel, and costly licensing. Regional airlines, which fly over half of flights, pay much less, so the shortage hit them hardest. The catch is that too many pilots is expensive too. That's the core problem of HR planning: balance supply and demand.\n\n## 4.4 The strategic planning process\n\n**Strategic planning** means deciding an organization's long-term goals and how it will reach them. It rests on three statements:\n\n- **Mission:** the organization's basic purpose and scope of operations, meaning why it exists. Coca-Cola's mission is about refreshing the world and inspiring optimism.\n- **Vision:** the long-term goals, meaning what the organization wants to *become*, its ideal future. Avon's vision was to be the company that best understands and satisfies women's needs worldwide.\n- **Core values:** enduring beliefs that guide everyday decisions, such as \"take care of employees\" or Whole Foods' commitments to quality, team member happiness, and environmental stewardship.\n\n*Memory trick:* mission = purpose now; vision = picture of the future; values = how we behave on the way.\n\nThese feed an external analysis (economy, competitors) and an internal analysis (strengths and weaknesses), which produce the **business strategy**: how the company will compete in its market.\n\n### Human resource planning and the four steps\n\n**Human resource planning** aligns the company's talent with its strategic goals. It forecasts labor needs and reconciles gaps between supply and demand with **action plans**. It's shaped by the firm's **talent philosophy**: whether it promotes from within, how much it values retention, and whether it treats employees as investors or as costs.\n\nThe process has four steps:\n\n1. **Strategic planning** decides the type, quality, and quantity of talent the strategy requires.\n2. **HR planning** aligns talent to those goals.\n3. **Forecast labor demand and labor supply**, and identify short-term and long-term gaps, using sources like the Bureau of Labor Statistics.\n4. **Develop and implement action plans** that fit the talent philosophy: recruiting, retention, compensation, succession, and training. Each plan carries **performance metrics** so you know whether it's working.\n\n### Aligning metrics, action plans, and HR planning\n\nThis is the second checklist item. Managers use **performance metrics** and past results (turnover, time to fill, productivity, staffing ratios) to **forecast future talent needs**, then build **proactive action plans** to close the gaps, and track the same metrics to see whether the plans work. They don't plan only from financial reports, wait for an emergency, or write plans without data. *Example:* a hospital that expects 15% more patients forecasts nurse demand from patient volume, compares it with expected nurse supply after retirements, sets a recruiting and retention plan, and checks hiring and turnover every quarter.\n\n### Responses to a shortage or surplus\n\nThe book's process model sorts responses by gap type and time frame:\n\n- **Shortage, short term:** hiring incentives, retention bonuses, reassigning current staff.\n- **Shortage, long term:** reduce labor demand (automate or redesign work) or use business process outsourcing.\n- **Balance:** no action plan needed.\n- **Surplus, short term:** salary cuts, fewer hours, temporary layoffs.\n- **Surplus, long term:** early retirement incentives, layoffs, and leaving vacated positions unfilled.\n\nForecast as a **range** (low, probable, high) and revise as conditions change. At a minimum, plan for strategy-critical jobs and jobs where top performers far outperform average ones, like sales.\n\n## 4.5-4.7 Forecasting labor demand\n\nThe biggest driver of how many workers a company needs is **demand for its products or services**. Demand falls, fewer workers; demand rises, more workers, unless the firm automates or outsources. Automation cuts routine jobs but raises demand for tech-skilled workers. Nabors' automated drilling rigs went from about 20 workers per site to 5, and the main tool became a laptop.\n\n### Sources for forecasting demand (4.6)\n\n- **Leading Economic Index:** a monthly composite that signals coming peaks and troughs in the business cycle. A downturn signals recession.\n- **Consumer Confidence Index:** a monthly survey of adults about job security and willingness to spend.\n- **Exchange rates:** a stronger home currency makes exports pricier and imports cheaper, which lowers demand for domestic labor. A weaker currency does the opposite.\n- **Interest rates:** higher rates raise borrowing costs and cut demand, especially in housing and construction. Lower rates boost it.\n- Others: GDP, the Purchasing Managers Index, and industry forecasts.\n\nThere's no single best metric. Test which indicators predicted your past activity, use them, and re-check them regularly. *COVID-19 lesson:* in 2020, forecasts of economic decline got worse every few days. Rare shocks break old predictors, so plan for a range of outcomes.\n\n### Forecasting methods (4.7)\n\n- **Trend analysis** uses past employment patterns to project future needs. If the company grew 8% a year for five years, project the same. Valero used five years of records to forecast three years ahead. *Weakness:* it assumes the past continues.\n- **Ratio analysis** converts expected business activity into headcount using a **staffing ratio**. *Example:* if you keep 5 assistants for every 3 accountants and plan to have 6 accountants, you need 10 assistants. Adjust the ratio when productivity changes (new technology, training), and use judgment when there's no history.\n- **Regression** combines several predictors, like mall traffic and seasonality, instead of one ratio.\n- **Judgmental forecasting** relies on managers' expertise. **Top-down:** leaders' predictions become goals for lower levels. **Bottom-up:** lower-level managers' estimates roll up for top managers to review.\n\n*Best practice:* start with quantitative estimates, then adjust them with managers' judgment. Forecasting is harder in small firms, where one hire in a 10-person company is 10% growth.\n\n## 4.8 Forecasting labor supply\n\n**Internal supply** = current employees − expected losses (quits, retirements, promotions or transfers out) + expected gains (transfers or promotions in). *Example:* 50 technicians, minus 6 retiring, 4 quitting, and 3 promoted out, plus 2 transferring in, gives 39.\n\nTools for the internal market:\n\n- A **talent inventory** is a database of each employee's competencies and qualifications, so HR can match people to needs.\n- A **replacement chart** shows each key job's holder, possible successors, and each one's readiness (performance, promotability, development needs).\n- **Succession planning** identifies, develops, and tracks employees so they can move into higher positions.\n\n**Retention** is essential, because every surprise quit shrinks internal supply. Surveys, absenteeism, and complaints help forecast turnover; For **external supply**, watch your own applicant flow (fewer or weaker applicants signal a tight market) and public data from the BLS, the Census Bureau, and the Conference Board.\n\n## 4.9-4.10 Closing the gaps\n\n**Gap analysis** compares forecasted demand with forecasted supply to find a shortage, surplus, or balance. Action plans must fit the business strategy, talent philosophy, and HR strategy. A layoff that cuts skills you'll need next year is a bad plan, and a firm that treats employees as investors might cut everyone's hours instead of laying people off. Tell lasting trends apart from short business-cycle swings, and downsize gradually when you can, since abrupt mass layoffs cost more and drive off top talent.\n\nCompanies can also build future supply, as the American Welding Society did with high school outreach that nearly doubled welding course completions.\n\nTwo kinds of understaffing matter:\n\n- **Manpower understaffing:** too few people for the work, like two servers instead of four. It's manageable briefly, but over time it raises stress, absenteeism, and turnover.\n- **Expertise understaffing:** the group is missing knowledge it needs. It's harmful even short term, because no one can cover. Prevent it with cross-training, proactive planning, and successors already in the pipeline.\n\n*Case:* the FAA's air traffic controllers hit a roughly 30-year low after a 2013 hiring freeze, with no plan for who would retire where. Overworked controllers raise safety risk. The FAA responded with targeted recruiting and by hiring above need, but training takes up to four years and many trainees wash out. If the gap persists, expect more fatigue, delays, and burnout-driven departures.\n\n## 4.11-4.12 Job design: efficiency vs. motivation\n\nJob design involves a trade-off between **efficiency** and **motivation**.\n\n**Scientific management** (Frederick Taylor, the Gilbreths) breaks work into its simplest elements and finds the best method through time-and-motion studies. Taylor's four principles: replace rules of thumb with scientific methods; scientifically select and train workers; supervise closely so methods are followed; and split the work so managers plan and workers perform. It raised productivity but created monotony and was called dehumanizing.\n\nThe **job characteristics model** (Hackman and Oldham) explains what makes work motivating. Its five core characteristics:\n\n1. **Skill variety:** the range of skills used.\n2. **Task identity:** completing a whole, identifiable piece of work.\n3. **Task significance:** impact on others' lives or work.\n4. **Autonomy:** freedom to schedule the work and choose methods.\n5. **Feedback:** the work itself shows how well you're doing.\n\nThese create three **critical psychological states** (experienced meaningfulness, responsibility for outcomes, and knowledge of results), which raise motivation, performance, and satisfaction. **Growth need strength**, a person's desire to grow and develop, moderates the effect: not everyone wants an enriched job.\n\nThree ways to redesign jobs:\n\n- **Job enrichment** (vertical): adds responsibility and autonomy, such as letting a salesperson manage inventory.\n- **Job enlargement** (horizontal): adds more tasks at the same level, such as a receptionist who also sorts mail. It reduces boredom but not responsibility.\n- **Job rotation:** moves people among jobs. It requires cross-training and builds skills.\n\nDon't overload jobs. UPS split loading from driving after finding loading drove turnover.\n\n## 4.13 Job analysis: purpose and uses\n\nThis is the first checklist item. **Job analysis** is the systematic process of identifying a job's key tasks, working conditions, and tools, and the worker characteristics needed to succeed, all in light of the company's strategy and culture.\n\n*How it's used:* setting hiring requirements, planning recruiting, selecting applicants, building training plans, designing compensation systems, and creating performance evaluation tools. It's the first step for staffing, training, performance, and pay. Firms that use job analysis well **financially outperform** their competitors.\n\n*Why it matters:*\n\n- **Strategic fit:** a medical-device retailer needs specialized education and experience, while a low-cost retailer hires efficiency-minded people.\n- **Future-proofing:** analyze what the job will need, not just what it needed.\n- **Legal defense:** documented, job-related requirements defend against failure-to-hire and wrongful discharge claims.\n- **Redesign:** GE found its salespeople spent 80% of their time on non-sales paperwork.\n\n## 4.14-4.15 Job descriptions and person specifications\n\nJob analysis produces two outcomes. The first is the **job description**, a written summary of the job's duties and responsibilities. It typically lists the title, department, salary range, grade, reporting relationships, main and occasional duties, equipment, special conditions like travel, and \"other duties as assigned.\"\n\nDuties are written as **task statements**: specific descriptions of what is done, how, and why. \"Handles inventory\" is weak; \"counts merchandise, compares counts with accounting totals, and corrects errors so the books balance\" is better. For the **ADA**, emphasize *what* must be done rather than *how* (\"moves 50-pound boxes to shelves,\" not \"lifts boxes by hand\"). Job descriptions double as recruiting ads, so make them engaging, and they can promote ethics by naming legal expectations like refusing bribes and protecting people who report concerns.\n\nThe second outcome is the **person specification**: the minimum worker characteristics needed for the core duties, built from the job description. *Key distinction:* the description is about the **job**; the specification is about the **person**.\n\n- **Essential criteria** are required for adequate performance and used to screen.\n- **Desirable criteria** help compare candidates who already meet the essentials.\n\nCharacteristics are described as **KSAOs**:\n\n- **Knowledge:** organized information, like local building codes or Mandarin.\n- **Skill:** applying knowledge to a standard, like driving a truck. A child who knows bike parts but can't ride has knowledge without skill.\n- **Ability:** a stable capacity across tasks, partly innate, like quantitative ability.\n- **Other characteristics:** personality, values, education, and experience.\n\nDecide which KSAOs new hires must already have and which you'll train.\n\n## 4.16-4.17 Job analysis methods\n\nA good analysis is **reliable** (same results across analysts, experts, and times) and **valid** (captures the job accurately, without omissions or irrelevant extras). The five methods:\n\n- **Critical incidents technique:** experts describe examples of very good and very poor performance (situation, action, result). It shows what separates superior from poor work and produces great interview questions, but it focuses on extremes and takes time.\n- **Job elements method:** an expert group lists and weights key worker traits, mostly for industrial and lower-skill jobs. It's efficient and builds expert ownership, but the method is hard to explain.\n- **Structured interview technique:** experts answer set questions. It's quick and cheap, good when experts or time are scarce, but needs a professional to limit bias.\n- **Task inventory approach:** experts list 50-200 tasks grouped into functions. It's objective and reliable, but misses rare tasks and what makes top performers.\n- **Structured questionnaires**, like the **Position Analysis Questionnaire (PAQ)**: standardized, fast, cheap, and comparable across nearly any job, but they need a high reading level and can miss unique aspects.\n\nCombine methods to offset weaknesses. Job experts may emphasize their own strengths, since results affect pay and promotion, so use several sources. **O*NET**, the government's online job database, is a good starting point, but generic downloaded descriptions are a weak legal defense. Follow the *Uniform Guidelines on Employee Selection Procedures*.\n\n## 4.18 Competency modeling and job rewards analysis\n\n**Competency modeling** identifies the broad traits of high performers, tied to strategy and values. **Competencies** (results focus, customer service, leadership, emotional intelligence, communication, teamwork) span many jobs and reinforce culture, while KSAOs are job-specific. Keep 6-12 competencies. Competency models are flexible but less rigorous, so their legal defensibility is uncertain; pair them with traditional job analysis.\n\n*AI caution:* Amazon's résumé tool learned from ten years of mostly male résumés and downgraded women, so it was dropped.\n\n**Job rewards analysis** identifies a job's **intrinsic** rewards (from the work itself, like helping others) and **extrinsic** rewards (pay, bonuses, benefits), together its total rewards. A bonus is extrinsic. Use it in recruiting: stress pay to money-motivated candidates and development to growth-motivated ones.\n\n## 4.19 Organizational structure, policies, procedures, rules, and the handbook\n\n**Organizational design** is the process of choosing and managing structure to reach goals. **Organizational structure** is the formal system of task, power, and reporting relationships. An **organizational chart** diagrams the chain of command. Chart position isn't the same as importance: a FedEx executive said drivers matter more than he does.\n\n### Policies, procedures, and rules\n\nThis is the third checklist item:\n\n- A **policy** is a broad **guiding principle that sets direction**, a decision already made. *Example:* \"We reimburse reasonable business travel to support our clients.\"\n- A **procedure** is the **how-to sequence of steps** for carrying out a task in line with policy. *Example:* \"Photograph the receipt, upload it in the expense app within 30 days, and get manager approval.\"\n- A **rule** is a specific statement of **what employees may or may not do**, with little discretion. *Example:* \"Safety glasses must be worn on the production floor.\"\n\n*Memory trick:* policy = why and what direction; procedure = how; rule = must or must not. Together they're a road map for daily operations that supports compliance and safety.\n\n### The employee handbook\n\nThis is the fourth checklist item. The **employee handbook** collects policies, procedures, and rules in one place, often online. It typically includes discipline rules, the ethics code, an at-will statement, confidentiality agreements, benefits, and complaint procedures. *The notes are thin here, so the following points come from standard HR practice.*\n\n- *It protects the organization* by documenting expectations, proving employees were told (a signed acknowledgment), supporting consistent enforcement that reduces discrimination claims, and recording at-will and confidentiality terms.\n- *It protects the employee* by spelling out rights, benefits, and rules, offering complaint and reporting channels, banning retaliation, and making treatment consistent so no one is judged by rules they never saw.\n\n## 4.20 Characteristics of structure\n\n- **Formalization:** how much is written down. High formalization increases role clarity.\n- **Centralization:** how concentrated decision authority is at the top. It works best in simple, stable settings and new firms. **Decentralization** is flatter, faster, and more innovative, and it suits complex, nonroutine work.\n- **Division of labor:** degree of specialization. It's efficient but can isolate units.\n- **Span of control:** number of direct reports. Narrow spans suit complex work and coaching; wide spans suit routine work. More than about nine is often too many.\n- **Hierarchy:** number of layers, tall or flat. Too many layers slow decisions; too few weaken coordination.\n\nPeople who like predictability fit bureaucracies; people who like flexibility fit less formal, decentralized firms.\n\n## 4.21 Workflow analysis and reengineering\n\n**Workflow analysis** traces how work moves from a customer's request, through the employees who add value, to delivery. It finds steps to cut, simplify, or combine, which makes it incremental. **Business process reengineering (BPR)** is a radical, clean-slate redesign for big gains in speed, cost, service, and quality. Taco Bell moved ingredient prep to central kitchens, which raised quality and morale. BPR can hurt morale and bring layoffs, so it needs a long-term view and attention to people.\n\n## 4.22 American Airlines' response\n\nAmerican raised new-pilot pay and gave current pilots raises over five years, though that partly shifted the shortage to lower-paying regional carriers. Other airlines used signing and retention bonuses and training pipelines like JetBlue's. Then COVID-19 flipped the **shortage into a surplus**, and airlines used pay cuts, early retirements, buyouts, voluntary leaves, and hiring pauses, with furloughs as a last resort. That's the full action plan menu in one case.\n\n## What to be able to explain\n\nThese are WGU's Learning Checklist items for this chapter:\n\n1. Describe the purpose of a job analysis and how it is used.\n2. Describe how managers align performance metrics, organizational action plans, and human resource planning.\n3. Explain the differences between rules, policies, and procedures.\n4. Explain how the employee handbook can protect the organization and the employee.\n\nTo get there, make sure you can also explain:\n\n- Mission vs. vision vs. core values\n- The four steps of HR planning, and the short- and long-term responses to shortages and surpluses\n- Trend, ratio, and judgmental (top-down and bottom-up) forecasting, with a ratio calculation\n- Talent inventory vs. replacement chart vs. succession planning\n- Manpower vs. expertise understaffing\n- The five job characteristics, and enrichment vs. enlargement vs. rotation\n- Job description vs. person specification, and essential vs. desirable criteria\n- Which job analysis method fits a situation\n- Span of control, centralization, and workflow analysis vs. BPR\n","cards":[{"id":"c202-ch04-001","front":"Why is workforce planning called the foundation of HR?","answer":"It anticipates talent challenges so the right people are in the right place at the right time.","subtitle":"Ch 4.2 · Effective HRM","note":"Read more: 4.2 Introduction","points":["Many firms just fill openings reactively; Cox's Jim Robbins saw months spent on budgets, little on talent","Small firms create most new jobs but struggle most to attract talent","Boomer retirements and lower birth rates will make talent harder to find"]},{"id":"c202-ch04-002","front":"What decisions can strategic workforce planning inform?","answer":"Where to locate facilities, what training to fund, what to outsource, and which pivotal roles need star talent.","subtitle":"Ch 4.2 · Effective HRM","note":"Read more: 4.2 Introduction","points":["Pivotal roles: software developers at tech firms, brand managers where brand matters","CNA Financial found it would run short of underwriters in 2 years; Valero built its pool ahead of shortages"]},{"id":"c202-ch04-003","front":"What drove the pilot shortage at American Airlines?","answer":"Retirements, fading career interest, global air travel growth, costly licensing, and low pay at regional carriers.","subtitle":"Ch 4.3 · Effective HRM","note":"Read more: 4.3 Real World Challenge: Managing a Pilot Shortage at American Airlines; 4.22 Real World Response: Managing a Pilot Shortage at American Airlines","points":["Regionals fly half or more of flights but pay much less","Too many pilots is costly too, so the goal is balance"]},{"id":"c202-ch04-004","front":"What is strategic planning?","answer":"Deciding an organization's long-term goals and how it will achieve them, including how it will compete.","subtitle":"Ch 4.4 · Strategic HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Covers vision, mission, values, which businesses to be in, and structure","HR leaders increasingly help create strategy, not just carry it out"]},{"id":"c202-ch04-005","front":"How does a mission differ from a vision?","answer":"A mission states the basic purpose and scope of operations; a vision describes the ideal future the firm wants.","subtitle":"Ch 4.4 · Strategic HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Mission = why we exist now (Coca-Cola: refresh the world, inspire optimism)","Vision = what we want to become (Avon: best understand and satisfy women's needs globally)"]},{"id":"c202-ch04-006","front":"What are core values?","answer":"Enduring beliefs that guide everyday decisions and behavior, such as 'take care of employees.'","subtitle":"Ch 4.4 · Strategic HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Can include social responsibility and sustainability","Whole Foods: quality products, team member happiness, community, environmental stewardship"]},{"id":"c202-ch04-007","front":"What is a business strategy?","answer":"How the company will compete in its market, built from its mission plus external and internal analysis.","subtitle":"Ch 4.4 · Strategic HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["External: economy, competitors; internal: strengths and weaknesses","Novartis: a focused medicines company powered by advanced therapies and data science"]},{"id":"c202-ch04-008","front":"What is human resource planning?","answer":"Aligning the firm's talent with its strategic goals by forecasting needs and closing gaps with action plans.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Shaped by the talent philosophy (promote from within? retention vs turnover?)","Reconciles labor supply and demand gaps"]},{"id":"c202-ch04-009","front":"What are the four steps of the HR planning process?","answer":"Strategic planning, HR planning, forecasting labor demand and supply, then building and running action plans.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["1. Strategy sets the type, quality, and quantity of talent needed","2. HR planning aligns talent to goals","3. Forecast demand and supply; find short- and long-term gaps (BLS, DOL data)","4. Action plans: recruiting, retention, compensation, succession, training"]},{"id":"c202-ch04-010","front":"How do managers align performance metrics, action plans, and HR planning?","answer":"They use metrics and past results to forecast talent gaps, then set action plans with targets to close them.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process; 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["Figure 4.1: forecasts lead to action plans that carry performance metrics","Metrics (turnover, time to fill, productivity) show whether the plan is working","Not: planning only from financial reports, without data, or only in emergencies","Model: a hospital forecasts nurse demand from patient volume, compares supply, sets a hiring plan, checks quarterly"]},{"id":"c202-ch04-011","front":"What is a talent philosophy?","answer":"The firm's stance on people, like promoting from within or treating staff as investors, which limits which fixes fit.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process; 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["Example: a firm that values employees as investors may cut everyone's hours rather than lay people off"]},{"id":"c202-ch04-012","front":"What are short-term responses to a labor shortage?","answer":"Hiring incentives, retention bonuses, and reassigning current employees.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-013","front":"What are long-term responses to a labor shortage?","answer":"Reducing labor demand through automation or redesign, or outsourcing business processes.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Building a pipeline (schools, training programs) also helps over time"]},{"id":"c202-ch04-014","front":"What are short-term responses to a labor surplus?","answer":"Salary cuts, reduced hours, and temporary layoffs.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-015","front":"What are long-term responses to a labor surplus?","answer":"Early retirement incentives, permanent layoffs, and leaving vacated positions unfilled.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process"},{"id":"c202-ch04-016","front":"Why should labor forecasts be stated as a range?","answer":"Conditions change, so low, probable, and high estimates let plans flex as new data arrives.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Revise forecasts as conditions change; check past forecast accuracy when choosing tools"]},{"id":"c202-ch04-017","front":"Which jobs deserve planning attention first?","answer":"Strategy-critical, high-value jobs and jobs where top performers far outperform average ones, like sales.","subtitle":"Ch 4.4 · Effective HRM","note":"Read more: 4.4 The Strategic Planning Process","points":["Researchers at innovators; customer-facing staff at service firms"]},{"id":"c202-ch04-018","front":"What is the best predictor of labor demand?","answer":"Demand for the company's products or services, adjusted for automation and outsourcing.","subtitle":"Ch 4.5 · Effective HRM","note":"Read more: 4.5 Forecasting Labor Demand","points":["Kimberly-Clark cut 13% of its workforce and closed 10 plants as demand fell (2018)"]},{"id":"c202-ch04-019","front":"How does automation change labor demand?","answer":"It cuts routine headcount but raises demand for tech-skilled workers.","subtitle":"Ch 4.5 · Effective HRM","note":"Read more: 4.5 Forecasting Labor Demand","points":["Nabors' automated rigs went from about 20 workers per site to 5; the main tool became a laptop"]},{"id":"c202-ch04-020","front":"What does the Leading Economic Index signal?","answer":"Coming peaks and troughs in the business cycle; a turn down signals recession and a turn up signals growth.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand","points":["Monthly composite from the Conference Board with 10 components (factory hours, stock prices, expectations)"]},{"id":"c202-ch04-021","front":"What does the Consumer Confidence Index measure?","answer":"A monthly survey of adults' job security and willingness to spend, which predicts demand for goods and labor.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand"},{"id":"c202-ch04-022","front":"How does a stronger home currency affect labor demand?","answer":"Exports get pricier and imports cheaper, so domestic demand and hiring tend to fall.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand","points":["A weaker currency makes exports cheaper, raising demand for workers","Volatile rates make forecasting harder"]},{"id":"c202-ch04-023","front":"How do rising interest rates affect labor demand?","answer":"Borrowing costs rise for firms and customers, cutting demand and hiring, especially in housing and the trades.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand","points":["Falling rates tend to raise labor demand"]},{"id":"c202-ch04-024","front":"How should a company pick its labor demand predictors?","answer":"Test which indicators predicted its past activity, use them, and re-evaluate and test new ones regularly.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand","points":["No single best metric; Whirlpool regularly recalculates its optimal sales force size","Other indicators: GDP, inventories, Purchasing Managers Index, industry forecasts"]},{"id":"c202-ch04-025","front":"What did COVID-19 teach about labor forecasting?","answer":"Rare shocks break old predictors, so re-check metrics often and plan for a range of outcomes.","subtitle":"Ch 4.6 · Effective HRM","note":"Read more: 4.6 Sources for Forecasting Labor Demand","points":["2020 forecasts got worse within days (Goldman's Q2 estimate went from -5% to -24%)","Jamie Dimon: base, adverse, and extreme cases were all possible"]},{"id":"c202-ch04-026","front":"What is trend analysis?","answer":"Using past employment patterns of the firm, industry, or nation to project future staffing needs.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods","points":["Valero used 5 years of records to forecast 3 years ahead by location, position, and tenure","Weakness: assumes the past continues despite competition, economy, technology"]},{"id":"c202-ch04-027","front":"What is ratio analysis?","answer":"Converting expected business activity into headcount using past staffing ratios.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods","points":["Staffing ratio: headcount indexed to a business metric (support staff per employee, revenue per employee)","Example: 5 assistants per 3 accountants; 6 accountants means 10 assistants"]},{"id":"c202-ch04-028","front":"When does a staffing ratio need adjusting?","answer":"When productivity changes from new tools, training, or incentives, or when no past ratio exists.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods","points":["Use managers' judgment to adjust; dramatic change (COVID) breaks trends"]},{"id":"c202-ch04-029","front":"How do top-down and bottom-up judgmental forecasts differ?","answer":"Top-down turns leaders' predictions into unit goals; bottom-up rolls lower managers' estimates up for review.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods","points":["Judgmental forecasting = managers' expertise predicts needs","Budgets may set headcount in top-down forecasting"]},{"id":"c202-ch04-030","front":"What is the best practice for forecasting labor demand?","answer":"Start with quantitative estimates such as trends, ratios, or regression, then adjust them with managers' judgment.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods","points":["Regression combines several predictors (mall traffic, seasonality) instead of one ratio","Capital One makes 3-year forecasts with proprietary models"]},{"id":"c202-ch04-031","front":"Why is labor forecasting harder in small firms?","answer":"They have less history and more variable trends; one hire in a 10-person firm is 10% growth.","subtitle":"Ch 4.7 · Effective HRM","note":"Read more: 4.7 Labor Demand Forecasting Methods"},{"id":"c202-ch04-032","front":"How is internal labor supply forecast?","answer":"Current staff minus expected losses (quits, retirements, moves out) plus expected gains (moves in).","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply","points":["Figure 4.2; managers can estimate retention percentages","Limitation: relies on history (rising unemployment lowers quits)"]},{"id":"c202-ch04-033","front":"What is a talent inventory?","answer":"A database of each employee's competencies and qualifications, used to match people to staffing needs.","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply","points":["IBM's Workforce Management Initiative gives a real-time view of its labor supply chain"]},{"id":"c202-ch04-034","front":"What is a replacement chart?","answer":"A chart of each key job's holder, possible successors, and each successor's readiness.","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply","points":["Shows strengths, performance, promotability, and development needs (Figure 4.3)"]},{"id":"c202-ch04-035","front":"What is succession planning?","answer":"Identifying, developing, and tracking employees so they can move into higher positions.","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply"},{"id":"c202-ch04-036","front":"Why is retention central to forecasting internal supply?","answer":"Each unexpected quit shrinks internal supply; surveys, absenteeism, and complaints help predict turnover.","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply","points":["Google built an algorithm using reviews, pay history, and promotions to flag likely quitters"]},{"id":"c202-ch04-037","front":"How do firms gauge external labor supply?","answer":"By watching their own applicant flow and public data from sources like the BLS, Census, and Conference Board.","subtitle":"Ch 4.8 · Effective HRM","note":"Read more: 4.8 Forecasting Labor Supply","points":["Fewer or weaker applicants signal a tighter market","BLS National Compensation Survey: wage and benefit data for 400+ occupations"]},{"id":"c202-ch04-038","front":"What is gap analysis?","answer":"Comparing forecasted labor demand with forecasted supply to find a coming shortage, surplus, or balance.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-039","front":"Why must gap action plans fit strategy and HR philosophy?","answer":"A mismatched fix backfires, like layoffs that cut skills the strategy will need next year.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["Plans must reinforce business strategy, talent philosophy, and HR strategy"]},{"id":"c202-ch04-040","front":"Why is gradual downsizing usually better than abrupt mass layoffs?","answer":"It costs less and keeps top talent; also separate lasting trends from short business-cycle swings.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts"},{"id":"c202-ch04-041","front":"How do manpower and expertise understaffing differ?","answer":"Manpower: too few people for the workload; expertise: the group lacks knowledge it needs for essential tasks.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["Manpower example: 2 servers instead of 4"]},{"id":"c202-ch04-042","front":"Why is expertise understaffing so harmful, and how is it prevented?","answer":"No one can cover the missing know-how, so key work stalls; prevent it with cross-training and ready successors.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["Manpower understaffing is tolerable briefly but long term raises stress, absenteeism, turnover"]},{"id":"c202-ch04-043","front":"How can companies build future labor supply?","answer":"By partnering with schools and training programs to grow skills before they're needed.","subtitle":"Ch 4.9 · Effective HRM","note":"Read more: 4.9 Addressing Gaps Between Labor Supply and Demand Forecasts","points":["AT&T Aspire ($350M for graduation rates)","American Welding Society high school outreach nearly doubled course completions in 2 years","Chicago Women in Trades: 12-week training"]},{"id":"c202-ch04-044","front":"What caused the U.S. air traffic controller shortage?","answer":"A 2013 hiring freeze plus no plan for which controllers would retire where, while traffic kept rising.","subtitle":"Ch 4.10 · Effective HRM","note":"Read more: 4.10 Case Study: Addressing a Shortage of U.S. Air Traffic Controllers","points":["FAA response: targeted recruiting, better location matching, hiring above need","Obstacles: up to 4 years to certify, high washout, about $78,000 lost per dropout"]},{"id":"c202-ch04-045","front":"What could happen if the controller shortage isn't fixed? (model answer)","answer":"Fatigue and overtime raise error risk, delays grow, and burnout drives even more departures.","subtitle":"Ch 4.10 · Effective HRM","note":"Read more: 4.10 Case Study: Addressing a Shortage of U.S. Air Traffic Controllers","points":["Model answer: overworked controllers make more mistakes, safety margins shrink, flights get cut or delayed,","and the cycle worsens as stressed controllers retire or quit, with trainees taking up to 4 years to replace them"]},{"id":"c202-ch04-046","front":"What trade-off sits at the core of job design?","answer":"Efficiency versus motivation: simplified jobs maximize output, enriched jobs maximize engagement.","subtitle":"Ch 4.11 · Motivational Concepts","note":"Read more: 4.11 Job Design","points":["Different job features motivate different people (social needs vs independence)"]},{"id":"c202-ch04-047","front":"What is scientific management?","answer":"Taylor's approach: break work into simple elements, find the best method, and train workers to follow it.","subtitle":"Ch 4.11 · Effective HRM","note":"Read more: 4.11 Job Design","points":["Built on time-and-motion studies (Taylor, Frank and Lillian Gilbreth)"]},{"id":"c202-ch04-048","front":"What are Taylor's four principles of scientific management?","answer":"Scientific methods, scientific selection and training, close supervision, and managers plan while workers do.","subtitle":"Ch 4.11 · Effective HRM","note":"Read more: 4.11 Job Design"},{"id":"c202-ch04-049","front":"What was the main drawback of scientific management?","answer":"Monotony and no room for initiative; workers called it dehumanizing, prompting a congressional investigation.","subtitle":"Ch 4.11 · Effective HRM","note":"Read more: 4.11 Job Design"},{"id":"c202-ch04-050","front":"What are the five core job characteristics?","answer":"Skill variety, task identity, task significance, autonomy, and feedback from the job itself.","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design","points":["Task identity = completing a whole, identifiable piece of work","Task significance = impact on others' lives or work","Together they give a job its motivating potential"]},{"id":"c202-ch04-051","front":"What are the three critical psychological states in the job characteristics model?","answer":"Experienced meaningfulness, experienced responsibility for outcomes, and knowledge of results.","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design","points":["They lead to higher motivation, performance, and satisfaction (Figure 4.4)"]},{"id":"c202-ch04-052","front":"What is growth need strength?","answer":"A person's desire to grow and develop; people high in it respond best to enriched jobs.","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design","points":["Some people prefer simpler, stable jobs; compare GNS with a job's motivating potential"]},{"id":"c202-ch04-053","front":"How do job enrichment and job enlargement differ?","answer":"Enrichment adds responsibility and autonomy (vertical); enlargement adds more same-level tasks (horizontal).","subtitle":"Ch 4.12 · Motivational Concepts","note":"Read more: 4.12 Increasing Motivation Through Job Design",
