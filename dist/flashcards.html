s and behavior with organizational goals, then appraises and improves performance.","subtitle":"Ch 1 Quiz Q8 · Effective HRM","note":"Read more: 1.8 Performance Management"},{"id":"c202-ch01-066","type":"scenario","front":"If staffing brings in the wrong people, which two other functions feel the impact most directly?","choices":["Training & development and succession management","Performance management and strategic management","Training & development and performance management","Change management and succession management"],"correct":2,"explanation":"Staffing supplies the raw talent. Development has to fill the gaps, and performance management depends on that talent being there.","subtitle":"Ch 1 Quiz Q9 · Strategic HRM","note":"Read more: 1.8 Performance Management; 1.6 Staffing"},{"id":"c202-ch01-067","type":"scenario","front":"A manager wants to reinforce ethical conduct day to day. According to the chapter, which kind of feedback serves that purpose?","choices":["Strategic feedback","Performance feedback","Critical feedback","Progressive feedback"],"correct":1,"explanation":"Performance feedback, part of performance management, tells people how they're doing, communicates expectations, and helps maintain ethical behavior.","subtitle":"Ch 1 Quiz Q10 · Effective HRM","note":"Read more: 1.8 Performance Management"},{"id":"c202-ch01-068","type":"scenario","front":"A job offer lists base salary, a signing bonus, sales commission, and stock options. Together these are...","choices":["Nonfinancial compensation","Indirect financial compensation","Direct financial compensation","Secondary compensation"],"correct":2,"explanation":"Salary, wages, commissions, bonuses, and stock options are direct financial compensation, paid directly for work.","subtitle":"Ch 1 Quiz Q11 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits"},{"id":"c202-ch01-069","type":"scenario","front":"Employer-paid health insurance, paid vacation, and a retirement plan are examples of...","choices":["Direct financial compensation","Primary compensation","Nonfinancial compensation","Indirect financial compensation"],"correct":3,"explanation":"Benefits are indirect financial compensation: they have money value but aren't paid as cash for performance.","subtitle":"Ch 1 Quiz Q12 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits"},{"id":"c202-ch01-070","type":"scenario","front":"An analyst says the best part of her job is the sense of accomplishment and feeling appreciated by her team. Which reward category is that?","choices":["Nonfinancial compensation","Direct compensation","Indirect compensation","Secondary compensation"],"correct":0,"explanation":"Intrinsic rewards from the work or environment, like feeling successful or valued, are nonfinancial compensation.","subtitle":"Ch 1 Quiz Q13 · Motivational Concepts","note":"Read more: 1.9 Rewards and Benefits"},{"id":"c202-ch01-071","type":"scenario","front":"One major way effective HRM boosts organizational performance is by building...","choices":["Efficient systems and processes","Better IT infrastructure","Stronger internal communications","Faster managerial decisions"],"correct":0,"explanation":"HRM adds value by improving efficiency (efficient systems and processes) and by contributing to revenue growth.","subtitle":"Ch 1 Quiz Q14 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-072","type":"scenario","front":"Three of these are outcomes of an effective HRM system. Which one is NOT?","choices":["Improving how change is managed","Tying rewards fairly to responsibility and performance","Reporting ethics violations to the Bureau of Labor Statistics","Contributing to revenue growth"],"correct":2,"explanation":"The BLS is a statistics agency; reporting ethics breaches to it isn't an HRM outcome. The others are listed benefits of effective HRM.","subtitle":"Ch 1 Quiz Q15 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-073","type":"scenario","front":"The strategy that defines where and how a company competes in its market is its ___ strategy.","choices":["financial","performance","business","management"],"correct":2,"explanation":"Business strategy is how a firm competes and positions itself. HR strategy must then fit it.","subtitle":"Ch 1 Quiz Q16 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy"},{"id":"c202-ch01-074","type":"scenario","front":"A founder believes employees are long-term partners worth investing in, not interchangeable parts. This set of beliefs about how people should be treated is the company's...","choices":["Strategic philosophy","Talent philosophy","Employee philosophy","Business philosophy"],"correct":1,"explanation":"A talent philosophy is the firm's beliefs about how employees should be treated. It guides the integrated HRM system. ('Employee philosophy' is the tempting wrong pick.)","subtitle":"Ch 1 Quiz Q17 · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy"},{"id":"c202-ch01-075","type":"scenario","front":"Which approach do firms commonly use to expand quickly into new countries?","choices":["Goals and ambiguity","Mergers and acquisitions","Values and achievements","Motivation and performance"],"correct":1,"explanation":"Mergers and acquisitions are a common route to growth and international expansion, and a way to acquire talent.","subtitle":"Ch 1 Quiz Q18 · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM"},{"id":"c202-ch01-076","type":"scenario","front":"Two companies merge. The deal looks great on paper but falls apart within two years. What's the most common culprit?","choices":["Financial issues","Technical issues","Culture issues","Procedural issues"],"correct":2,"explanation":"M&A deals most often fail because cultures, values, or structures clash (DaimlerChrysler, AOL-Time Warner).","subtitle":"Ch 1 Quiz Q19 · Strategic HRM","note":"Read more: 1.15 Gaining a Competitive Advantage Through HRM"},{"id":"c202-ch01-077","type":"scenario","front":"Which document is the go-to reference that helps employees understand company HR policies?","choices":["A union contract","A values statement","A code of ethics","An employee handbook"],"correct":3,"explanation":"Employee handbooks, often online, document HR policies and serve as a reference for employees.","subtitle":"Ch 1 Quiz Q20 · Strategic HRM","note":"Read more: 1.16 Who Is Responsible for HRM?"},{"id":"c202-ch01-078","front":"What are the six primary HRM functions?","answer":"Staffing, training & development, performance management, rewards & benefits, health & safety, employee relations.","subtitle":"Ch 1.5 · Strategic HRM","note":"Read more: 1.5 What Does HRM Do?; 1.6 Staffing","points":["Staffing: plan, acquire, deploy, retain, and separate talent","Training and development: build skills, careers, and successors","Performance management: align goals, appraise, give feedback","Rewards and benefits: direct pay, benefits, nonfinancial rewards","Health and safety: protect physical and mental well-being","Employee-management relations: rights, voice, unions"]},{"id":"c202-ch01-079","front":"Why is HRM a strategic investment for both small and large firms?","answer":"People are a top cost, so better hiring, training, and retention raise productivity and profit at any size.","subtitle":"Ch 1.12 · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?; 1.4 What Is HRM?","points":["Model answer: HR cuts costly turnover, lawsuits, and errors, and builds skills that improve service and quality","Large firms: efficiency and revenue growth; Moody's even weighs HR in bond ratings","Small firms: poor HR practices are a leading cause of failure, and recruiting and training are their top problems","Costco shows that spending more on people can pay for itself"]},{"id":"c202-ch01-080","type":"scenario","front":"A software company recruits and trains engineers to write secure, well-tested code, but sprint bonuses are paid only for the number of features shipped. What is the most likely result?","choices":["The bonus will quietly undo the hiring and training investment, as engineers trade quality for volume","The functions will balance out because training outweighs pay","The strategy will be carried out faster and better","Engineers will ignore the bonus because they were trained on quality"],"correct":0,"explanation":"When rewards conflict with what staffing and training aim for, people follow the rewards. Misaligned functions undermine each other and the strategy.","subtitle":"Ch 1.11 Apply · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations; 1.7 Training and Development"},{"id":"c202-ch01-081","type":"scenario","front":"A hotel chain holds monthly town halls, runs an anonymous employee survey, and sets up a joint labor-management committee to resolve complaints early. Which HR function is this?","choices":["Performance management","Employee-management relations","Staffing","Training and development"],"correct":1,"explanation":"Employee voice programs, surveys, and union or labor relations belong to employee-management relations. Good relations improve communication and problem solving.","subtitle":"Ch 1.11 Apply · Strategic HRM","note":"Read more: 1.11 Employee-Management Relations"},{"id":"c202-ch01-082","type":"scenario","front":"A distribution center installs lift-assist equipment, trains workers on safe lifting, and tracks injuries by shift. Which HR function is this, and what's the business payoff?","choices":["Rewards and benefits; higher pay satisfaction","Staffing; faster hiring","Health and safety; fewer lost workdays and lower workers' comp costs","Performance management; better appraisals"],"correct":2,"explanation":"This is health and safety. Beyond being ethical, it raises productivity and lowers insurance, workers' comp, and lost-time costs.","subtitle":"Ch 1.10 Apply · Strategic HRM","note":"Read more: 1.10 Health and Safety"},{"id":"c202-ch01-083","type":"scenario","front":"The owner of a 25-person firm calls HR 'overhead' while turnover runs 60% a year and new hires take months to get up to speed. Which argument best shows why HRM matters to performance?","choices":["HR is required by law at every firm","HR mainly helps by keeping wages low","Big companies need HR, but small ones don't","Better hiring and training would cut replacement costs and lift productivity"],"correct":3,"explanation":"HRM adds value through efficiency and revenue growth at any size. Poor people practices are a leading cause of small-firm failure, so HR is an investment.","subtitle":"Ch 1.12 Apply · Strategic HRM","note":"Read more: 1.12 How Does HRM Influence Organizational Performance?"},{"id":"c202-ch01-084","type":"scenario","front":"A retailer switches its strategy from lowest price to premium, personalized service, but keeps hiring for speed and paying the lowest wages in town. What is the most likely strategic impact?","choices":["The new strategy stalls because HR practices no longer fit it","Costs fall, so the premium strategy succeeds","Nothing changes, since strategy is set by executives, not HR","Customers notice no difference"],"correct":0,"explanation":"HR must fit the business strategy. A customer-intimacy strategy needs people with service skills and the pay and training to keep them; low-cost HR undermines it.","subtitle":"Ch 1.13 Apply · Strategic HRM","note":"Read more: 1.13 The Role of HRM in Executing Business Strategy"}]},{"id":"c202-ch02","folder":"C202 Ch 2: The Role of Human Resource Management in Business","course":"C202","order":2,"source":"WGU C202 eText (Phillips, Human Resource Management, 3rd ed.)","summary":"# C202 Chapter 2 Study Guide: The Role of Human Resource Management in Business\n\n*A 15-20 minute read, organized by the chapter's sections in order. Read it before drilling the deck. Each concept covers what it is, why it matters, an example, and how it connects to the rest of the chapter.*\n\n## How this chapter maps to your competencies\n\nLike Chapter 1, this chapter falls under **Strategic Human Resource Management**: *determining the strategic impact of HRM on the organization*. Chapters 1 and 2 together make up about 14% of the Objective Assessment (OA). Expect applied questions: which culture type is this, which ethical standard justifies a decision, what HR should do in a merger phase, or how a practice should change in another country. A few topics preview other competencies. HR metrics (2.14) lead into **Effective HRM**. The Federal Sentencing Guidelines (2.8) touch **Legal and Regulatory Requirements**. Fitting incentives to culture (2.12) previews **Motivational Concepts**.\n\nChapter 2 is part of **Quarter 1** (Chapters 1-4), which ends with a quarterly quiz. WGU's strongest readiness signal for the Pre-Assessment is scoring **80% or higher** on the final e-text quiz.\n\n## 2.1-2.3 The big picture: HRM drives results through people and culture\n\nChapter 1 argued that people are the source of competitive advantage. Chapter 2 asks *how* HRM turns that into results, and its answer is mostly **culture**, **ethics**, and **change**.\n\nPeople are among a company's biggest costs. Firms that use best practices such as selective hiring, serious training, and employment security have shown more than 50% higher market value. Companies get better results by integrating HR strategy with business strategy, using good **HR metrics**, hiring business-savvy HR staff, and delivering HR services efficiently.\n\n### Direct and indirect effects\n\nHRM affects performance in two ways:\n\n- **Directly:** building skills, aligning goals, and motivating effort.\n- **Indirectly:** shaping the culture, the work environment, and how work gets done.\n\n*Example:* Nike's founder credits the company's success to its people and how they collaborate. That collaboration comes from culture, which HR shapes.\n\n### How HRM supports leadership\n\nThis is the first item on WGU's checklist. HRM supports leaders by:\n\n1. **Reinforcing values**, so employees know how to behave and decide even when no rule covers the situation.\n2. **Providing metrics and accurate data**, without which leaders can't make good people decisions.\n3. **Coaching through change and mergers**, managing resistance and building trust.\n4. **Sharing power through high-performance work systems**, which spreads decision-making to employees (HPWS encourages power sharing; it doesn't discourage it).\n\n### The opening case: Marriott\n\nJ.W. Marriott Jr. grew a family restaurant business into thousands of hotels in more than 110 countries. His \"Spirit to Serve\" ideals put associates first: people are the top asset, they deserve development, and the workplace should feel friendly and home-like. The challenge is how HR can strengthen that culture during recovery from COVID. The chapter answers it in 2.15.\n\n## 2.4 Why organizational culture matters\n\n### What culture is\n\n**Organizational culture** is the shared **norms, values, and assumptions** of an organization's members, its \"personality,\" or \"the way we do things around here.\" Logos, ceremonies, dress codes, and even office furniture reinforce it. *Quiz trap:* culture is not the mission statement or the list of goals; it's the shared norms, values, and assumptions behind behavior.\n\n*Why it matters:* Culture guides behavior where no rule exists, and it aligns employee goals with company goals. It's linked to financial performance, customer satisfaction, and service quality.\n\n### Culture must fit strategy\n\nA strategy is reinforced or undermined by how well it fits the culture. Four Seasons believes great service comes from treating employees the way you want guests treated. A rigid bureaucracy, by contrast, smothers innovation.\n\n### The four culture types\n\n1. **Entrepreneurial:** creativity, innovation, and risk-taking (EA, IDEO).\n2. **Bureaucratic:** formal structure, correct procedures, consistency (GSK, Merck; common in regulated industries).\n3. **Consensual:** loyalty, tradition, long tenure, promoting from within (law firms, the military).\n4. **Competitive:** winning, advantage, and market superiority; often stressful (brokerages, currency trading).\n\nMost companies mix types, with one dominant. *Everyday example:* A startup that throws a party for a failed experiment is entrepreneurial. A pharmacy chain where every step follows a checklist is bureaucratic.\n\n### Performance culture\n\nIn a **performance culture**, hiring, retention, development, pay, and assignments are all driven by performance data. *Example:* a restaurant gives its best servers the busiest shifts.\n\n*Connection:* Cultures evolve, for better (adding CSR) or worse. Boeing's shift from quality and safety toward financial targets is the cautionary tale in 2.10.\n\n## 2.5 Culture and HRM: how HR practices reinforce culture\n\nThis section answers a key checklist item. HRM has the most immediate effect on behavior because it sets explicit goals and formal policies, and culture fills in the gaps. By formalizing expectations, HR creates and reinforces culture.\n\n### The levers\n\nHR shapes culture by deciding:\n\n- who is **hired** and who may be **fired**\n- what employees are **trained** to do\n- which **goals** and expectations guide the work\n- what people are held **accountable** for\n- who is **rewarded** for their behavior\n\n*Examples:* Starbucks pays above minimum wage and offers health and tuition benefits even to part-timers, which sends a people-first signal and keeps turnover below the industry norm. Pixar trains everyone together at Pixar University to build collaboration. Its leaders even attend new-hire orientation.\n\n### Strong vs. weak HR systems\n\nA **strong HR system** sends consistent signals, so employees **share the same perception** of the culture. That's the goal: employees should perceive the culture *similarly*. A **weak system** sends mixed messages and produces confusion or an unintended culture.\n\n*Cautionary examples:* Volkswagen's fear-of-failure culture and aggressive growth goals led engineers to install emissions-cheating software. Wells Fargo fired some employees who called its ethics hotline, which taught everyone to stay silent.\n\n### Culture by strategy\n\n- **Low cost** (Walmart): efficiency training, a thrift culture, a high return on wages.\n- **Quality, service, or innovation** (Lexus, Google): teamwork, extensive training, performance rewards, and creative hires.\n\n*Connection:* There is no single \"best\" HR system, only practices that fit each other and the strategy. Charles Schwab switched brokers from team to individual incentives and sent mixed messages about what it valued.\n\n## 2.6 High-performance work systems (HPWS)\n\nA **high-performance work system** (also called a high-involvement or high-commitment organization) gets performance *through* employees. Even front-line workers improve methods, solve problems, and coordinate work without controlling supervisors.\n\n### Pfeffer's seven practices\n\n1. Employment security\n2. Selective hiring\n3. Self-managed teams and decentralized decision-making\n4. Relatively high pay tied to organizational performance\n5. Extensive training\n6. Fewer status distinctions (dress, offices, language, pay gaps)\n7. Broad sharing of financial and performance information\n\n*Why it matters:* When employees have **power, information, knowledge, and rewards**, they feel responsible for success. Gains of around 40% have been reported. Employees get development, engagement, and a voice; the organization gets productivity, flexibility, quality, customer satisfaction, and lower turnover. Southwest Airlines is a classic example. Some people do find the added responsibility stressful.\n\n*Connection:* HPWS invests heavily in people, so the investment is lost if they leave. That's why practices must be aligned and focused on retention.\n\n### HR as internal consultant\n\nAnother checklist item: HR managers act as **internal consultants** to line managers. They diagnose people problems before prescribing fixes, gather individual and team **training needs**, and help managers shift from control-oriented styles to **high-involvement** organizations with **decentralized** decisions and **self-managed** teams.\n\n*Everyday example:* A manager says her team \"won't take initiative.\" A consulting HR partner first asks what decisions the team is allowed to make, what information they see, and what they're trained and rewarded for. Then it recommends changes.\n\n## 2.7 HRM, ethics, and social responsibility\n\n### Ethics vs. legality\n\n**Ethics** are the moral standards that define socially accepted right and wrong. Honesty, tolerance, and responsibility are the base values. Unethical isn't the same as illegal, so companies must define and reinforce their values. HR, through hiring, training, evaluating, and rewarding, is positioned to build an ethical culture.\n\n### The ethical behavior formula\n\n**Ethical values + clear expectations + rewards and punishments that support ethics = ethical behavior.** Remove any piece and pressure wins.\n\n### The five ethical standards\n\nThese are the main tools for *resolving* an ethical dilemma:\n\n1. **Utilitarian:** choose what produces the most good and the least harm. *Example:* cutting everyone's pay a little instead of laying off some people.\n2. **Rights:** protect the moral rights of everyone affected, such as privacy, truthful information, and safety. *Example:* refusing hazardous work without protective gear.\n3. **Fairness:** treat people equally, or fairly by a defensible standard. *Example:* debates about CEO pay versus worker pay.\n4. **Common good:** show respect and compassion for everyone, especially the vulnerable. *Example:* refusing suppliers that use child labor.\n5. **Virtue:** act consistently with ideal virtues like civility, compassion, and benevolence. *Example:* promptly recalling a dangerous product.\n\nThe standards can conflict, and reasonable people disagree. Each is a lens for evaluating a decision.\n\n## 2.8 Ethical and unethical behavior\n\n### Where unethical behavior comes from\n\nIt comes from individuals *and* from the organizational context. The strongest predictor is an emphasis on self-gain. The top cause of compromise is **pressure to hit unrealistic goals or deadlines**. Three systemic errors:\n\n- **Omission:** no written rules.\n- **Remission:** pressure to act unethically.\n- **Commission:** not following sound, established practices.\n\n### Identifying an HR ethical dilemma\n\nHR's own ethics challenges cluster in **privacy** (medical data, surveillance), **staffing** (pressure to hire friends, faked credentials, discrimination), **layoffs**, **rewards** (inflated job grades, excessive perks), **safety** (bullying, stress), **performance appraisal** (rating on non-performance factors), and **labor practices** (child labor, exploitation).\n\n*How to spot one:* A true dilemma involves pressure toward an unfair, harmful, or rule-breaking act, such as a manager asking HR to drop a qualified candidate because of a medical condition or pregnancy. Choosing fairly between two strong candidates is hard, but it isn't an ethical dilemma.\n\n### Resolving an ethical dilemma\n\n1. Name the conflict and who's affected.\n2. Apply one or more ethical standards.\n3. Choose the option you could defend openly, and back it with HR systems.\n\n*Worked example:* A manager wants to promote a long-tenured, loyal employee over a newer colleague with clearly stronger results. Applying the **fairness** standard, HR should recommend promoting on merit, a defensible, job-related criterion that treats every candidate by the same rule. The **utilitarian** standard agrees, because the strongest performer creates the most good for the team and customers. Loyalty can be recognized in other ways, such as development or a mentoring role.\n\n### Codes and programs\n\nA **code of conduct** lists specific expected and prohibited actions. A **code of ethics** describes the highest values to aspire to and guides decisions. Codes alone aren't enough; they need fair treatment, ethical leaders, and real consequences. HR supports ethics by hiring ethical people, training, holding people accountable, communicating about ethics, promptly removing violators, rewarding ethical behavior, and offering anonymous reporting.\n\nThe **Federal Sentencing Guidelines for Organizations** describe six elements of an ethics and compliance program: written standards, ethics training, a way to seek advice, anonymous misconduct reporting, discipline for violators, and ethics in performance appraisals.\n\n## 2.9 HRM and corporate social responsibility\n\n**Corporate social responsibility (CSR)** is a business's concern for the common good and human dignity. It includes philanthropy, paid volunteer time, diverse hiring, employee protection, environmental care, and safe products. How a company treats its own employees is part of CSR.\n\n*Examples:* Mars lets employees spend up to six weeks on partner projects. Marriott runs green initiatives like compostable containers.\n\nThe **stakeholder perspective** weighs the interests of everyone the organization affects, not just shareholders, which leads to broader, longer-term decisions. CSR has four categories: environment, ethics, employee and product safety, and corporate governance.\n\n*Why HR matters:* CSR lasts only when it's embedded in the **culture**, and it has the biggest impact when integrated with HRM. HR builds CSR into reviews and merit pay, trains on it, writes human rights into policy, and makes sure global contractors behave responsibly. Obstacles include a short-term earnings focus, cost, hard-to-measure ROI, and an unsupportive culture.\n\n## 2.10 Case study: Boeing 737 MAX\n\nWhen Airbus launched a more fuel-efficient jet, Boeing rushed out the 737 MAX. It pushed for lighter certification and required no additional pilot training despite major changes. Employees feared losing their jobs if they raised concerns, and proposed safety upgrades were reportedly rejected over cost. Two crashes killed more than 300 people.\n\n*Why it matters:* Boeing's stated values were integrity and safety, but cost pressure overrode them. One expert called it a textbook absence of **psychological safety**, the ability to speak up without fear. *HR fixes:* written safety standards, anonymous reporting, leaders who reward speaking up, and a stakeholder perspective.\n\n## 2.11 How HRM supports organizational change\n\nStrategic change usually requires big shifts in culture and behavior. Common HR-managed changes include new processes, new locations, new benefits programs, a new HR information system, and international expansion.\n\n### The playbook\n\n1. **Identify the key goals** of the change first, then design HR practices to fit it.\n2. Build a **culture of trust**, the glue that keeps people committed through uncertainty.\n3. **Involve employees**, since participation in change management raises commitment.\n4. Align **communication, training, goals, feedback, and rewards** with the new behaviors. Employees must change both their **behaviors and their goals**.\n5. Use coercion only when change must be fast and radical; otherwise, consult and collaborate.\n\n*Why trust matters most:* Change creates uncertainty. When employees trust leaders, they believe the reasons for change, try new behaviors, and stay instead of resisting or leaving.\n\n*Example:* HP had employees set three personal and three professional goals each year and celebrated achievements like leaving early for family. After two years, productivity held steady despite shorter hours, and retention improved.\n\n## 2.12 Global HRM: Hofstede's dimensions\n\nCulture affects which HR practices work. Hofstede's research across 40+ countries identified five dimensions:\n\n1. **Power distance:** how much inequality people accept. *High* (Philippines, Malaysia): hierarchy and big authority and pay gaps. *Low* (Austria, Denmark): flatter, more equal.\n2. **Individualism:** how loose community ties are. *High* (U.S., Australia): individual extrinsic rewards and freedom. *Low* (Guatemala, Bangladesh): harmony and collective or intrinsic rewards.\n3. **Masculinity:** assertiveness, achievement, and material reward vs. modesty, cooperation, and quality of life. *High* (Japan, Slovakia): distinct \"men's\" and \"women's\" work. *Low* (Sweden, Norway): equal opportunity, often legislated.\n4. **Uncertainty avoidance:** anxiety in unfamiliar situations. *High* (Greece, Portugal): structure and formal rules. *Low* (Singapore, Hong Kong): informal and risk-accepting.\n5. **Long-term orientation:** long-range planning, social obligations, saving face. *Long* (China, Taiwan): strong work ethic, value education and training. *Short* (Canada, West Africa): individualism, creativity, and faster change.\n\n### Applying them\n\n- High uncertainty avoidance: write detailed policies.\n- Masculine cultures: independent, achievement-oriented HR leadership; feminine cultures: collaborative leadership.\n- Individualist cultures: individual incentives; collectivist cultures: group incentives.\n- Short-term cultures accept faster change and more innovation.\n\nBalance home-country best practices with local ones, and remember that individuals don't always match their national culture.\n\n## 2.13 HRM during mergers and acquisitions\n\nUp to 85% of mergers miss their goals, usually because of culture clash and manager conflict (DaimlerChrysler eventually split). HR lays the foundation for success in three phases:\n\n1. **Due diligence:** evaluate whether the cultures are **compatible**, and start **talent planning and retention** early.\n2. **Integration:** decide who stays and who goes, retain key people, and build a **common culture**.\n3. **Post-close:** address stakeholder satisfaction, strengthen the new culture, and implement **development plans**.\n\n*Why it matters:* Employees' decisions to stay or leave determine success. Companies are often bought for their **talent and skills**, so if that talent leaves, the deal is futile. After Oracle's hostile takeover of PeopleSoft, executives left in droves. HR uses retention bonuses, raises, and promotions, communicates constantly, acts as facilitator and coach, and treats both departing and remaining employees fairly.\n\n## 2.14 HRM metrics\n\nMetrics show where HR can improve and support strategic decisions. The most important thing to measure is how well the **business strategy is executed**. Don't measure everything.\n\n### Key formulas\n\n- **Turnover rate** = employees who left ÷ average number of employees. *36 leavers ÷ 240 = 15%.*\n- **Absence rate** = absence days ÷ (average employees × workdays). *96 ÷ (40 × 20) = 12%.*\n- **ROI** = (benefits − total cost) ÷ total cost × 100. *($70K − $40K) ÷ $40K = 75%.*\n- **Revenue (or profit) per employee** = revenue (or profit) ÷ number of employees.\n- **Job offer acceptance rate** = offers accepted ÷ offers extended.\n- **Health care cost per employee** = total health care cost ÷ covered employees.\n- **Workers' comp cost per employee** = annual workers' comp cost ÷ average employees.\n- **Innovation** = percentage of sales from products introduced in the last five years.\n- **Time to fill** = days to fill a position; **tenure** = average years of service.\n- **Percentage of performance goals met** = goals met or exceeded ÷ total goals.\n\n### What makes a metric effective\n\nIt ties to business goals, drives behavior, links to rewards, uses accurate data, and guides decisions. Match metrics to strategy: a differentiation strategy calls for innovation metrics, and a low-cost strategy calls for efficiency metrics.\n\n## 2.15-2.16 Marriott's response and choosing your culture\n\nMarriott regularly appears on best-places-to-work lists. Its core values are to put people first, pursue excellence, embrace change, act with integrity, and serve the world. HR lives those values: \"**hire friendly, train technical**,\" promote from within, invest millions in training, and recognize employees through awards. Managers with strong financial results who reject the employees-first philosophy are let go. The founding motto sums it up: take care of associates, and they'll take care of customers.\n\n*For your career (2.16):* choose an industry and employer as carefully as a specialty. Regulated industries tend to be bureaucratic; creative industries are more informal. Weigh competition vs. cooperation, formal vs. flexible procedures, and individual vs. team rewards.\n\n## 2.17 Pulling it together\n\n- HR reinforces culture by signaling which values and behaviors matter.\n- HPWS runs on participation, power-sharing, information-sharing, and training.\n- Five ethical standards guide hard decisions, and HR builds ethics and CSR into culture.\n- HR supports change through trust, managing resistance, and aligning goals and behaviors.\n- Hofstede's dimensions show how culture shapes HR practices abroad.\n- In M&A, HR manages culture fit and the people who stay and leave.\n\n## What to be able to explain\n\nThese are WGU's official Chapter 2 Learning Checklist items. You should be able to explain each one in a business context:\n\n- Describe how HRM supports organizational leadership.\n- Describe how HRM can create the foundation for the success of a merger or acquisition.\n- Describe how human resource managers may serve as internal consultants for managers.\n- Identify an ethical dilemma in the area of human resource management.\n- Recommend an approach to resolve an ethical dilemma.\n- Explain how HRM practices reinforce organizational culture.\n- Describe how HRM strategy can support organizational change.\n\nTo get there, make sure you can also explain:\n\n- The four culture types and what a performance culture is\n- Pfeffer's seven HPWS practices\n- The five ethical standards, applied to a new situation\n- Omission, remission, and commission\n- Code of conduct vs. code of ethics, and the six Federal Sentencing Guidelines elements\n- Hofstede's five dimensions and how each changes HR practice\n- How to calculate turnover, absence rate, and ROI, and how to match metrics to strategy\n","cards":[{"id":"c202-ch02-001","front":"How does HRM support organizational leadership?","answer":"It reinforces values, supplies metrics for decisions, coaches people through change, and shares power via HPWS.","subtitle":"Ch 2.2 · Strategic HRM","note":"Read more: 2.2 Introduction; 2.17 Summary and Application","points":["Directly: builds skills, aligns goals, motivates","Indirectly: shapes culture and how work gets done","Firms with best practices (selective hiring, training, job security) show 50%+ higher market value","Without accurate metrics and data, leaders can't make good people decisions"]},{"id":"c202-ch02-002","front":"How does HRM affect performance directly vs. indirectly?","answer":"Directly by building skills, aligning goals, and motivating; indirectly by shaping culture and the work environment.","subtitle":"Ch 2.2 · Strategic HRM","note":"Read more: 2.2 Introduction; 2.17 Summary and Application","points":["Nike's Phil Knight credits Nike's people and how they collaborate","IBM's Thomas Watson Jr.: success depends on drawing out people's energy and talent"]},{"id":"c202-ch02-003","front":"What is organizational culture?","answer":"The shared norms, values, and assumptions that shape how people see and do things in a company.","subtitle":"Ch 2.4 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?","points":["The firm's 'personality': 'the way we do things around here'","Signaled by logos, ceremonies, dress codes, office design","Guides behavior where no rule exists"]},{"id":"c202-ch02-004","front":"Why must culture fit the business strategy?","answer":"Culture guides behavior where rules don't reach, so a culture that clashes with strategy quietly undermines it.","subtitle":"Ch 2.4 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?; 2.5 Culture and HRM","points":["Four Seasons: great service comes from treating employees as you want guests treated","Rigid bureaucracy hampers innovation (Nokia's risk-averse culture contributed to its decline)","Culture is linked to financial performance and customer satisfaction"]},{"id":"c202-ch02-005","front":"How do entrepreneurial and bureaucratic cultures differ?","answer":"Entrepreneurial cultures prize creativity and risk; bureaucratic ones prize formal rules, procedure, and consistency.","subtitle":"Ch 2.4 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?","points":["Entrepreneurial: EA, IDEO","Bureaucratic: GSK, Merck; common in regulated industries","Most firms mix types, with one dominant"]},{"id":"c202-ch02-006","front":"How do consensual and competitive cultures differ?","answer":"Consensual cultures value loyalty, tradition, and long tenure; competitive ones value winning and market dominance.","subtitle":"Ch 2.4 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?","points":["Consensual: law firms, military; promote from within","Competitive: brokerages, currency trading; often stressful"]},{"id":"c202-ch02-007","front":"What is a performance culture?","answer":"One where hiring, development, pay, and assignments are all driven by performance data.","subtitle":"Ch 2.4 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?","points":["Example: putting the best servers on the busiest shifts","Sports teams like the Yankees and Steelers"]},{"id":"c202-ch02-008","front":"How do HR practices create and reinforce culture?","answer":"Through who gets hired and fired, what's trained, which goals count, what's rewarded, and who's held accountable.","subtitle":"Ch 2.5 · Strategic HRM","note":"Read more: 2.5 Culture and HRM","points":["HRM has the most immediate effect on behavior; culture fills the gaps","Starbucks: above-minimum pay and benefits for part-timers send a people-first signal","Pixar University trains everyone together to build a collaborative creative culture"]},{"id":"c202-ch02-009","front":"Why does a strong HR system matter for culture?","answer":"Consistent HR signals lead employees to perceive the same culture; a weak system sends mixed, confusing messages.","subtitle":"Ch 2.5 · Strategic HRM","note":"Read more: 2.5 Culture and HRM","points":["Volkswagen: a fear-of-failure culture plus aggressive goals led to emissions-cheating software","Wells Fargo fired some hotline callers, which killed trust in reporting","Charles Schwab's switch from team to individual incentives sent mixed messages"]},{"id":"c202-ch02-010","front":"What is a high-performance work system (HPWS)?","answer":"A workplace where front-line employees improve methods, solve problems, and coordinate work without tight supervision.","subtitle":"Ch 2.6 · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?","points":["Also called high-involvement or high-commitment organizations","Built on sharing power, rewards, information, and training (Pfeffer: about 40% performance gains)","Southwest Airlines is a classic example"]},{"id":"c202-ch02-011","front":"What are Pfeffer's seven HPWS practices?","answer":"Job security, selective hiring, self-managed teams, performance-based pay, training, few status gaps, open information.","subtitle":"Ch 2.6 · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?","points":["Self-managed teams also means decentralized decision-making","Fewer status distinctions: dress, language, offices, pay gaps","Practices must be internally consistent and reinforce each other"]},{"id":"c202-ch02-012","front":"Why must HPWS practices be aligned and retention-focused?","answer":"HPWS invests heavily in people, so the payoff is lost if practices conflict or the talent walks out the door.","subtitle":"Ch 2.6 · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?","points":["Employee benefits: development, engagement, involvement, quality of life","Org benefits: productivity, flexibility, customer satisfaction, quality, lower turnover","Some employees find the added responsibility stressful"]},{"id":"c202-ch02-013","front":"How can HR managers serve as internal consultants to line managers?","answer":"They diagnose people problems, gather team training needs, and coach managers toward high-involvement practices.","subtitle":"Ch 2.1 · Strategic HRM","note":"Read more: 2.1 Topic 2: The Role of HRM in Business; 2.6 What Is the Role of HRM in High-Performance Work Systems?","points":["Help managers move from control-oriented styles to high-involvement (HPWS) organizations","Recommend decentralized decisions and self-managed teams","Employees then have the power, information, knowledge, and rewards to perform"]},{"id":"c202-ch02-014","front":"What is ethics, and how is it different from legality?","answer":"Ethics is a shared moral standard of right and wrong; an act can be perfectly legal yet still unethical.","subtitle":"Ch 2.7 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Base values: honesty, tolerance, responsibility","Lapses: Madoff, faked executive degrees, McLaren spying on Ferrari","Because unethical isn't always illegal, firms must define and reinforce values"]},{"id":"c202-ch02-015","front":"What formula produces ethical behavior in an organization?","answer":"Ethical values + clear expectations + rewards and punishments that back ethics = ethical behavior.","subtitle":"Ch 2.7 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Figure 2.1 in the text","Stress and pressure erode ethics, so all three pieces matter"]},{"id":"c202-ch02-016","front":"How do the utilitarian and rights standards differ?","answer":"Utilitarian seeks the most good and least harm overall; rights protects each person's rights, like privacy and safety.","subtitle":"Ch 2.7 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Utilitarian example: cutting everyone's pay instead of laying some people off","Rights example: refusing hazardous work without protective gear"]},{"id":"c202-ch02-017","front":"How do the fairness, common good, and virtue standards differ?","answer":"Fairness: equal treatment by a defensible rule; common good: care for the vulnerable; virtue: act as an ideal person.","subtitle":"Ch 2.7 · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Fairness example: debates over CEO pay vs worker pay","Common good example: refusing suppliers that use child labor","Virtue example: promptly recalling a dangerous product","The five standards can conflict; each is a lens for evaluating a decision"]},{"id":"c202-ch02-018","front":"What are the three systemic ethics errors?","answer":"Omission: no written rules; remission: pressure to act unethically; commission: ignoring sound established practices.","subtitle":"Ch 2.8 · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior","points":["Unethical acts come from individuals AND the organizational context","Top cause of ethical compromise: pressure to hit unrealistic goals or deadlines","Strong predictor: an emphasis on self-gain"]},{"id":"c202-ch02-019","front":"What signals an HR ethical dilemma rather than just a hard decision?","answer":"Someone is pushed toward an unfair, harmful, or rule-breaking act; a fair choice that disappoints someone isn't one.","subtitle":"Ch 2.8 · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior","points":["Common HR ethics areas: privacy, staffing, layoffs, rewards, safety, appraisals, labor practices","Example: pressure to hire a friend, inflate a job grade, or rate someone on non-performance factors"]},{"id":"c202-ch02-020","front":"How do a code of conduct and a code of ethics differ?","answer":"A code of conduct lists specific required and banned actions; a code of ethics states ideal values to guide choices.","subtitle":"Ch 2.8 · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior","points":["Codes alone aren't enough: need fair treatment, aligned HR systems, ethical leaders, real consequences","Good codes correlate with better reputation and citizenship rankings"]},{"id":"c202-ch02-021","front":"How should HR approach resolving an ethical dilemma?","answer":"Name the conflict, apply an ethical standard, weigh everyone affected, and choose the option you could defend openly.","subtitle":"Ch 2.8 · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior; 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Back it with HR systems: code of conduct, training, anonymous reporting, prompt discipline, rewards for ethics","Ask: Which option produces the most good? Respects rights? Treats people by a fair, job-related rule?"]},{"id":"c202-ch02-022","front":"Long tenure vs. stronger results: how should HR justify a promotion recommendation?","answer":"Recommend the stronger performer: the fairness standard judges candidates on a defensible, job-related rule like merit.","subtitle":"Ch 2.8 · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior; 2.7 The Role of HRM in Corporate Ethics and Social Responsibility","points":["Model answer: promoting on merit is fair to every candidate and best for the team and customers (utilitarian)","Promoting on loyalty alone signals that results don't matter and can feel like favoritism","Recognize loyalty in other ways: development, a retention bonus, or a mentoring role","Either way, explain the job-related criteria openly"]},{"id":"c202-ch02-023","front":"What six elements do the Federal Sentencing Guidelines expect in an ethics program?","answer":"Written standards, training, an advice channel, anonymous reporting, discipline for violators, ethics in appraisals.","subtitle":"Ch 2.8 · Legal & Regulatory","note":"Read more: 2.8 Ethical and Unethical Behavior","points":["Federal Sentencing Guidelines for Organizations","HR also hires ethical people and acts fast on violations"]},{"id":"c202-ch02-024","front":"What is corporate social responsibility (CSR)?","answer":"A company's concern for the common good and human dignity: giving, volunteering, safety, and environmental care.","subtitle":"Ch 2.9 · Strategic HRM","note":"Read more: 2.9 How Does HRM Influence Corporate Social Responsibility?","points":["Mars Ambassadors: up to 6 weeks on partner projects","Marriott: compostable containers, green ambassadors","How a firm treats its own employees is part of CSR"]},{"id":"c202-ch02-025","front":"How does a stakeholder perspective differ from a shareholder focus?","answer":"It weighs everyone affected by the firm, not just owners' returns, which leads to broader, longer-term decisions.","subtitle":"Ch 2.9 · Strategic HRM","note":"Read more: 2.9 How Does HRM Influence Corporate Social Responsibility?","points":["Four CSR categories: environment, ethics, employee and product safety, corporate governance","Serving shareholders and stakeholders isn't mutually exclusive"]},{"id":"c202-ch02-026","front":"Why does CSR only last when it's built into culture and HRM?","answer":"If hiring, training, reviews, and pay don't reinforce CSR, it fades into a side project when budgets tighten.","subtitle":"Ch 2.9 · Strategic HRM","note":"Read more: 2.9 How Does HRM Influence Corporate Social Responsibility?","points":["HR tools: CSR goals in reviews and merit pay, CSR training, human rights in HR policy, vetting contractors","Obstacles: short-term earnings focus, cost, hard-to-measure ROI, unsupportive culture"]},{"id":"c202-ch02-027","front":"What ethical failure does the Boeing 737 MAX case illustrate?","answer":"Cost and schedule pressure overrode stated safety values, and employees feared speaking up about concerns.","subtitle":"Ch 2.10 · Strategic HRM","note":"Read more: 2.10 Case Study: Boeing 737 MAX","points":["Boeing rushed the MAX to answer Airbus, pushed for lighter certification, required no new pilot training","Over 300 deaths","HR fixes: written safety standards, anonymous reporting, a stakeholder perspective"]},{"id":"c202-ch02-028","front":"What is psychological safety, and why does it matter for ethics?","answer":"Feeling able to raise concerns or admit mistakes without fear; without it, problems stay hidden until they explode.","subtitle":"Ch 2.10 · Strategic HRM","note":"Read more: 2.10 Case Study: Boeing 737 MAX","points":["Amy Edmondson called Boeing a textbook absence of psychological safety"]},{"id":"c202-ch02-029","front":"How does HRM support organizational change?","answer":"It sets the change's key goals first, builds trust, involves employees, then aligns training, feedback, and rewards.","subtitle":"Ch 2.11 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?","points":["HR-managed changes: new processes, locations, benefits programs, HRIS, international expansion","Focus on developing and keeping people critical to the new strategy","Lockheed Martin: candid communication and removing obstacles"]},{"id":"c202-ch02-030","front":"Why is a culture of trust so important during change?","answer":"Change creates uncertainty; trust keeps people committed and willing to try new behaviors instead of resisting.","subtitle":"Ch 2.11 · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?","points":["Trust is 'the glue' during change","Coercion only fits fast, radical change; otherwise consult and collaborate","HP: personal and professional goals for each employee improved retention with no productivity loss"]},{"id":"c202-ch02-031","front":"What does Hofstede's power distance dimension describe?","answer":"How much a society accepts unequal power; high means steep hierarchy, low means flatter, more equal workplaces.","subtitle":"Ch 2.12 · Strategic HRM","note":"Read more: 2.12 Global HRM","points":["High: Philippines, Guatemala, Malaysia (big authority and pay gaps)","Low: Austria, Israel, Denmark"]},{"id":"c202-ch02-032","front":"What does Hofstede's individualism dimension describe?","answer":"How loose community ties are; high favors individual rewards and freedom, low favors group harmony and shared rewards.","subtitle":"Ch 2.12 · Motivational Concepts","note":"Read more: 2.12 Global HRM","points":["High: U.S., Australia, New Zealand","Low: Guatemala, Ecuador, Bangladesh (harmony over blunt honesty)"]},{"id":"c202-ch02-033","front":"What does Hofstede's masculinity dimension describe?","answer":"A preference for assertiveness, achievement, and material reward vs. modesty, cooperation, and quality of life.","subtitle":"Ch 2.12 · Strategic HRM","note":"Read more: 2.12 Global HRM","points":["High: Japan, Hungary, Slovakia (distinct 'men's' and 'women's' work)","Low: Denmark, Sweden, Norway (equal opportunity, often legislated)"]},{"id":"c202-ch02-034","front":"What does Hofstede's uncertainty avoidance dimension describe?","answer":"How uneasy people feel in unfamiliar situations; high favors detailed rules and structure, low tolerates risk.","subtitle":"Ch 2.12 · Strategic HRM","note":"Read more: 2.12 Global HRM","points":["High: Greece, Portugal, Uruguay -> detailed written policies","Low: Singapore, Jamaica, Hong Kong -> informal, risk-accepting"]},{"id":"c202-ch02-035","front":"What does Hofstede's long-term orientation dimension describe?","answer":"A focus on long-range planning and obligations; long-term cultures prize education, training, and work ethic.","subtitle":"Ch 2.12 · Strategic HRM","note":"Read more: 2.12 Global HRM","points":["Long: China, Taiwan","Short: West Africa, Canada (individualism, creativity, faster change)","Individuals don't always match their national culture, and values shift over time"]},{"id":"c202-ch02-036","front":"What does HR do in each phase of a merger or acquisition?","answer":"Due diligence: check culture fit, plan talent; integration: pick who stays, unify culture; post-close: develop people.","subtitle":"Ch 2.13 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions","points":["Due diligence: assess cultural compatibility; start talent planning and retention early","Integration: decide who stays or goes; retain key people; create a common culture","Post-close: address stakeholder satisfaction; strengthen the new culture; roll out development plans"]},{"id":"c202-ch02-037","front":"Why is HR the foundation of merger and acquisition success?","answer":"Most deals fail on culture clash and lost talent, and HR is the function that manages both before and after closing.","subtitle":"Ch 2.13 · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions","points":["Up to 85% of mergers miss their goals (DaimlerChrysler split after a culture clash)","If a deal was for talent and the talent leaves, it's futile (Oracle-PeopleSoft exodus)","HR acts as facilitator and coach and treats leavers and survivors fairly"]},{"id":"c202-ch02-038","front":"What makes an HR metric worth tracking?","answer":"It ties to business goals, drives behavior, links to rewards, uses accurate data, and guides real decisions.","subtitle":"Ch 2.14 · Effective HRM","note":"Read more: 2.14 HRM Metrics","points":["Don't measure everything; focus on what drives strategy execution","Differentiation strategy -> innovation metrics; low-cost strategy -> efficiency metrics","Innovation metric = % of sales from products launched in the last 5 years"]},{"id":"c202-ch02-039","front":"How is turnover rate calculated?","answer":"Number of employees who left in a period ÷ average number of employees in that period.","subtitle":"Ch 2.14 · Effective HRM","note":"Read more: 2.14 HRM Metrics","points":["Example: 18 leavers ÷ 120 average employees = 15%","Related: tenure = average years of service"]},{"id":"c202-ch02-040","front":"How is absence rate calculated?","answer":"Total absence days ÷ (average number of employees × workdays in the period).","subtitle":"Ch 2.14 · Effective HRM","note":"Read more: 2.14 HRM Metrics","points":["Example: 60 absence days ÷ (25 employees × 20 days) = 12%"]},{"id":"c202-ch02-041","front":"How is the ROI of an HR program calculated?","answer":"(Program benefits − total program cost) ÷ total program cost, multiplied by 100.","subtitle":"Ch 2.14 · Effective HRM","note":"Read more: 2.14 HRM Metrics","points":["Example: $90K benefit on a $60K program = 50% ROI","Other ratios: revenue or profit per employee = revenue (or profit) ÷ employees","Job offer acceptance rate = offers accepted ÷ offers extended"]},{"id":"c202-ch02-042","type":"scenario","front":"A brokerage says teamwork is a core value, then switches from team bonuses to purely individual commissions. Brokers start hoarding leads. What's the HR lesson?","choices":["Individual pay always beats team pay","The pay change sent a mixed message that undercut the stated culture","Culture doesn't affect sales behavior","The firm needs a stricter code of conduct"],"correct":1,"explanation":"Rewards are among HR's loudest culture signals. When pay rewards the opposite of a stated value, people follow the pay and the culture gets muddled.","subtitle":"Ch 2.5 Apply · Strategic HRM","note":"Read more: 2.5 Culture and HRM"},{"id":"c202-ch02-043","type":"scenario","front":"A hotel group wants a warm, guest-first culture. Which HR move reinforces it most directly?","choices":["Hire for friendliness, train the technical skills, and recognize great service","Hire whoever has the most hotel experience","Cut training to fund renovations","Add more rules about uniform standards"],"correct":0,"explanation":"HR shapes culture through who it hires, what it trains, and what it rewards. Marriott's 'hire friendly, train technical' is exactly this.","subtitle":"Ch 2.5 Apply · Strategic HRM","note":"Read more: 2.5 Culture and HRM; 2.15 Real World Response: Marriott"},{"id":"c202-ch02-044","type":"scenario","front":"A plant manager wants to become a high-performance work system. Which current practice works AGAINST that goal?","choices":["Sharing monthly financial results with everyone","Letting teams schedule their own work","Reserved parking and a private dining room for managers only","Paying a bonus tied to plant performance"],"correct":2,"explanation":"HPWS reduces status distinctions so everyone feels like a contributor. Executive-only perks signal a control-oriented hierarchy.","subtitle":"Ch 2.6 Apply · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?"},{"id":"c202-ch02-045","type":"scenario","front":"A sales director tells HR her team 'just isn't performing.' Acting as an internal consultant, what should HR do first?","choices":["Recommend firing the bottom 10%","Tell her it's a management issue, not HR's","Diagnose the problem, including the team's skill and training needs, before proposing fixes","Raise everyone's commission rate"],"correct":2,"explanation":"Internal consultants diagnose before prescribing. Gathering individual and team training needs is a core way HR supports managers.","subtitle":"Ch 2.6 Apply · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?; 2.1 Topic 2: The Role of HRM in Business"},{"id":"c202-ch02-046","type":"scenario","front":"Which statement about how HRM supports leadership is FALSE?","choices":["HPWS supports leaders by limiting how much power employees share","HR coaches leaders through merger resistance and trust issues","Accurate metrics help leaders make better people decisions","Reinforced values help employees know how to act without a rule"],"correct":0,"explanation":"HPWS works by SHARING power, information, and rewards with employees, not limiting it. The other three are real ways HRM supports leadership.","subtitle":"Ch 2.6 Apply · Strategic HRM","note":"Read more: 2.6 What Is the Role of HRM in High-Performance Work Systems?; 2.17 Summary and Application"},{"id":"c202-ch02-047","type":"scenario","front":"Which of these is an ethical dilemma in HRM?","choices":["A manager asks HR to quietly drop a qualified applicant after learning he's in cancer treatment","A manager schedules quarterly career conversations","HR chooses between two strong internal candidates using posted criteria","HR moves open enrollment to November"],"correct":0,"explanation":"A dilemma involves pressure to do something unfair or harmful. Picking fairly between good candidates is hard but not unethical.","subtitle":"Ch 2.8 Apply · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior"},{"id":"c202-ch02-048","type":"scenario","front":"A company has no written policy on accepting gifts from vendors, and buyers start taking expensive trips from suppliers. Which systemic ethics error is this?","choices":["Commission","Remission","Omission","Utilitarian error"],"correct":2,"explanation":"Omission is the lack of written rules. Without clear standards, people fill the gap with self-interest.","subtitle":"Ch 2.8 Apply · Strategic HRM","note":"Read more: 2.8 Ethical and Unethical Behavior"},{"id":"c202-ch02-049","type":"scenario","front":"A firm has a code of conduct and annual ethics training, but employees who see misconduct have no way to report it without revealing their identity. Which Federal Sentencing Guidelines element is missing?","choices":["Written standards","Anonymous misconduct reporting","Ethics in performance appraisals","Ethics training"],"correct":1,"explanation":"The guidelines expect written standards, training, an advice channel, anonymous reporting, discipline, and ethics in appraisals. Fear of retaliation silences reporters.","subtitle":"Ch 2.8 Apply · Legal & Regulatory","note":"Read more: 2.8 Ethical and Unethical Behavior"},{"id":"c202-ch02-050","type":"scenario","front":"An HR director refuses a manager's request to browse employees' medical files, even though it would speed up a scheduling decision. Which ethical standard guides her?","choices":["Utilitarian","Common good","Rights","Virtue"],"correct":2,"explanation":"The rights standard protects each person's moral rights, including privacy, even when overriding them would be convenient.","subtitle":"Ch 2.7 Apply · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-051","type":"scenario","front":"A clothing company drops a cheaper supplier after learning it uses child labor. Which ethical standard best explains the decision?","choices":["Common good","Fairness","Utilitarian","Rights"],"correct":0,"explanation":"The common good standard emphasizes respect and compassion for everyone, especially the most vulnerable, such as children.","subtitle":"Ch 2.7 Apply · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-052","type":"scenario","front":"Which step would most help a company's CSR commitment survive the next budget squeeze?","choices":["A one-time donation announced in a press release","A CSR page on the website","CSR goals built into performance reviews, merit pay, and training","An annual volunteer day organized by marketing"],"correct":2,"explanation":"CSR lasts when it's embedded in culture through HR systems. Linking it to reviews, pay, and training makes it part of everyday behavior.","subtitle":"Ch 2.9 Apply · Strategic HRM","note":"Read more: 2.9 How Does HRM Influence Corporate Social Responsibility?"},{"id":"c202-ch02-053","type":"scenario","front":"Engineers at a manufacturer raise safety concerns, but managers dismiss them to protect a launch date, and staff fear for their jobs if they push. Which HR fix targets the root cause?","choices":["Bigger launch bonuses","Faster certification","Firing the engineers who complained","Written safety standards, anonymous reporting, and leaders who reward speaking up"],"correct":3,"explanation":"The root problem is a lack of psychological safety and values that give way under pressure. HR can make speaking up safe and expected.","subtitle":"Ch 2.10 Apply · Strategic HRM","note":"Read more: 2.10 Case Study: Boeing 737 MAX; 2.8 Ethical and Unethical Behavior"},{"id":"c202-ch02-054","type":"scenario","front":"A company is replacing its HR information system next year. As HR plans the change, what should come first?","choices":["Identify the key goals the change must achieve","Train managers on the new screens","Announce that use is mandatory","Shift the culture toward innovation"],"correct":0,"explanation":"HR practices have to fit the specific change, so start by defining its goals, then design communication, training, and rewards around them.","subtitle":"Ch 2.11 Apply · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-055","type":"scenario","front":"Employees are resisting a new scheduling process. There's no crisis, and leaders have six months. Which approach fits best?","choices":["Mandate it and discipline holdouts","Explain the why, involve employees in the design, train them, and reward the new behaviors","Wait for resisters to quit","Roll it out silently"],"correct":1,"explanation":"Coercion is only for fast, radical change. Otherwise, communication, participation, training, and aligned rewards build the trust change needs.","subtitle":"Ch 2.11 Apply · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-056","type":"scenario","front":"During a major restructuring, rumors spread and top performers update their résumés. What should HR prioritize to keep them committed?","choices":["Building trust through honest, frequent communication and follow-through","Cutting information to avoid panic","Speeding up layoffs","Adding stricter attendance rules"],"correct":0,"explanation":"Trust is the glue during change. When people believe what leaders tell them, they stay committed through uncertainty.","subtitle":"Ch 2.11 Apply · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-057","type":"scenario","front":"A U.S. firm opens an office in a country with very high uncertainty avoidance. How should it adjust HR policies?","choices":["Keep policies vague to encourage flexibility","Provide detailed written policies and clear procedures","Rely on informal word-of-mouth rules","Rotate job duties weekly"],"correct":1,"explanation":"High uncertainty avoidance cultures are uneasy with ambiguity, so detailed policies and structure reduce anxiety.","subtitle":"Ch 2.12 Apply · Strategic HRM","note":"Read more: 2.12 Global HRM"},{"id":"c202-ch02-058","type":"scenario","front":"A manufacturer plans an incentive program for a plant in a strongly collectivist (low-individualism) country. Which design fits best?","choices":["Rank-and-yank individual bonuses","Commission paid only to the top performer","Team or plant-wide rewards that reinforce group harmony","No incentives at all"],"correct":2,"explanation":"Low-individualism cultures value group harmony and collective rewards. Individual rankings can feel divisive and backfire.","subtitle":"Ch 2.12 Apply · Motivational Concepts","note":"Read more: 2.12 Global HRM"},{"id":"c202-ch02-059","type":"scenario","front":"A company in a high power-distance country introduces open-door 'challenge any decision' meetings. Turnout is near zero. What's the most likely reason?","choices":["Employees lack motivation","The meetings are too long","The practice clashes with norms that defer to authority","Pay is too low"],"correct":2,"explanation":"In high power-distance cultures, people expect clear hierarchy, so publicly challenging bosses feels inappropriate. Adapt the practice to local norms.","subtitle":"Ch 2.12 Apply · Strategic HRM","note":"Read more: 2.12 Global HRM"},{"id":"c202-ch02-060","type":"scenario","front":"A firm expanding into a long-term-oriented culture wants to attract and keep strong employees. Which offering is likely to resonate most?","choices":["Education, training, and long-range career development","Flashy quarterly spot bonuses","Frequent reorganizations to keep things fresh","Short contracts with no development"],"correct":0,"explanation":"Long-term-oriented cultures value education, training, a strong work ethic, and planning for the future.","subtitle":"Ch 2.12 Apply · Strategic HRM","note":"Read more: 2.12 Global HRM"},{"id":"c202-ch02-061","type":"scenario","front":"A company averaged 240 employees last year, and 36 left. What was its turnover rate?","choices":["6.7%","36%","15%","24%"],"correct":2,"explanation":"Turnover rate = leavers ÷ average employees = 36 ÷ 240 = 0.15, or 15%.","subtitle":"Ch 2.14 Apply · Effective HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-062","type":"scenario","front":"A 40-person team logged 96 absence days over a 20-workday month. What is the absence rate?","choices":["2.4%","12%","4.8%","24%"],"correct":1,"explanation":"Absence rate = absence days ÷ (employees × workdays) = 96 ÷ (40 × 20) = 96 ÷ 800 = 12%.","subtitle":"Ch 2.14 Apply · Effective HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-063","type":"scenario","front":"A $40,000 safety training program produced $70,000 in savings. What is its ROI?","choices":["175%","57%","43%","75%"],"correct":3,"explanation":"ROI = (benefits − cost) ÷ cost × 100 = ($70K − $40K) ÷ $40K × 100 = 75%.","subtitle":"Ch 2.14 Apply · Effective HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-064","type":"scenario","front":"A company competes by launching new products faster than rivals. Which HR metric best tracks whether its people strategy is working?","choices":["Health care cost per employee","Percentage of sales from products introduced in the last five years","Absence rate","Workers' comp cost per employee"],"correct":1,"explanation":"Metrics should match strategy. A differentiation or innovation strategy calls for innovation metrics; low-cost strategies favor efficiency metrics.","subtitle":"Ch 2.14 Apply · Effective HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-065","type":"scenario","front":"Before signing a deal, HR interviews managers at the target company and compares how each firm makes decisions and rewards people. Which merger phase is this, and why does it matter?","choices":["Due diligence; it reveals whether the cultures can work together","Integration; it decides who gets laid off","Post-close; it measures stakeholder satisfaction","Integration; it sets the new pay plan"],"correct":0,"explanation":"Assessing cultural compatibility is HR's key due diligence job, and culture clash is the top reason mergers fail.","subtitle":"Ch 2.13 Apply · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-066","type":"scenario","front":"A merger closed eight months ago. Which HR activity belongs in this post-close phase?","choices":["Assessing cultural compatibility","Rolling out long-term development plans and checking stakeholder satisfaction","Deciding which executives to retain","Negotiating the purchase price"],"correct":1,"explanation":"Post-close work strengthens the new culture, addresses stakeholder satisfaction, and implements development plans. Retention decisions happen during integration.","subtitle":"Ch 2.13 Apply · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-067","type":"scenario","front":"A tech giant buys a startup mainly for its engineers, and within weeks several key engineers interview elsewhere. What should HR do?","choices":["Let them go; the code is what matters","Offer targeted retention bonuses, clear roles, and honest communication about the future","Freeze all communication until integration ends","Merge them into existing teams without discussion"],"correct":1,"explanation":"If a deal is for talent and the talent leaves, it fails. HR uses retention tools (bonuses, raises, promotions) plus communication to keep key people.","subtitle":"Ch 2.13 Apply · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-068","type":"scenario","front":"Whether a strategy succeeds often depends on how well it fits the company's...","choices":["Approach","Values statement","Culture","Budget"],"correct":2,"explanation":"Culture either reinforces or undermines strategy, so strategy and culture must fit.","subtitle":"Ch 2.4 Practice · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-069","type":"scenario","front":"A video game studio celebrates bold ideas and tolerates failed experiments. Which culture type is this?","choices":["Bureaucratic","Consensual","Competitive","Entrepreneurial"],"correct":3,"explanation":"Entrepreneurial cultures emphasize creativity, innovation, and risk-taking (EA, IDEO).","subtitle":"Ch 2.4 Practice · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-070","type":"scenario","front":"A drug manufacturer runs on standard operating procedures, sign-offs, and strict compliance checks. Which culture type fits?","choices":["Bureaucratic","Entrepreneurial","Competitive","Consensual"],"correct":0,"explanation":"Bureaucratic cultures value formal structure, correct procedures, and consistency, common in regulated industries.","subtitle":"Ch 2.4 Practice · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-071","type":"scenario","front":"A firm prizes loyalty and tradition, promotes almost entirely from within, and has many 25-year employees. Which culture type is this?","choices":["Competitive","Consensual","Entrepreneurial","Bureaucratic"],"correct":1,"explanation":"Consensual cultures emphasize loyalty, tradition, and long tenure (law firms, military).","subtitle":"Ch 2.4 Practice · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-072","type":"scenario","front":"A trading desk is intense and focused on beating rivals and dominating the market. Which culture type is this?","choices":["Consensual","Bureaucratic","Competitive","Entrepreneurial"],"correct":2,"explanation":"Competitive cultures emphasize advantage and market superiority, and they can be stressful.","subtitle":"Ch 2.4 Practice · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-073","type":"scenario","front":"What is the main benefit of a strong, consistent HR system for culture?","choices":["Employees interpret the culture in their own different ways","It increases access to rewards","Employees share the same perception of the culture","Employees become more subordinate to goals"],"correct":2,"explanation":"A strong HR system sends consistent signals, so people perceive the same culture and know what's expected.","subtitle":"Ch 2.5 Practice · Strategic HRM","note":"Read more: 2.5 Culture and HRM"},{"id":"c202-ch02-074","type":"scenario","front":"Which ethical standard asks which option produces the greatest good and the least harm?","choices":["Rights","Fairness","Common good","Utilitarian"],"correct":3,"explanation":"The utilitarian standard weighs total benefits against total harms.","subtitle":"Ch 2.7 Practice · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-075","type":"scenario","front":"Which ethical standard focuses on protecting the moral rights of everyone affected?","choices":["Rights","Utilitarian","Fairness","Common good"],"correct":0,"explanation":"The rights standard protects rights like privacy, truthful information, and safety.","subtitle":"Ch 2.7 Practice · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-076","type":"scenario","front":"Which ethical standard asks whether everyone is treated equally, or fairly by a defensible standard?","choices":["Virtue","Fairness","Rights","Utilitarian"],"correct":1,"explanation":"The fairness (justice) standard requires equal treatment or differences based on a defensible standard.","subtitle":"Ch 2.7 Practice · Strategic HRM","note":"Read more: 2.7 The Role of HRM in Corporate Ethics and Social Responsibility"},{"id":"c202-ch02-077","type":"scenario","front":"CSR programs last over time when they are integrated with the company's...","choices":["Diversity statement","Ethics hotline","Advertising","Culture"],"correct":3,"explanation":"CSR sticks when it's part of the culture, which HR reinforces through its practices.","subtitle":"Ch 2.9 Practice · Strategic HRM","note":"Read more: 2.9 How Does HRM Influence Corporate Social Responsibility?"},{"id":"c202-ch02-078","type":"scenario","front":"When launching a change initiative, what is HR's first step?","choices":["Shift to an innovation strategy","Train managers","Identify the key goals","Pressure employees to comply"],"correct":2,"explanation":"HR first defines what the change must achieve, then designs practices that fit it.","subtitle":"Ch 2.11 Practice · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-079","type":"scenario","front":"Which kind of culture is the key factor in getting employees through organizational change?","choices":["A culture of trust","A culture of performance","A culture of diversity","A culture of competition"],"correct":0,"explanation":"Trust keeps employees committed when change brings uncertainty.","subtitle":"Ch 2.11 Practice · Strategic HRM","note":"Read more: 2.11 How Does HRM Support Organizational Change?"},{"id":"c202-ch02-080","type":"scenario","front":"Which HR task best predicts whether a merger will work?","choices":["Revising company goals","Evaluating whether the two cultures are compatible","Resolving disputes between managers","Implementing performance plans"],"correct":1,"explanation":"Culture compatibility, checked during due diligence, is the strongest predictor of merger success.","subtitle":"Ch 2.13 Practice · Strategic HRM","note":"Read more: 2.13 HRM During Mergers and Acquisitions"},{"id":"c202-ch02-081","type":"scenario","front":"What should HR metrics focus on above all?","choices":["Collecting as much data as possible","Measuring culture","How well the business strategy is executed","Overall headcount"],"correct":2,"explanation":"The most important thing to measure is the execution of business strategy.","subtitle":"Ch 2.14 Practice · Effective HRM","note":"Read more: 2.14 HRM Metrics"},{"id":"c202-ch02-082","type":"scenario","front":"Which list names the four organizational culture types in the textbook?","choices":["Administrative, bureaucratic, consensual, directorial","Entrepreneurial, bureaucratic, consensual, competitive","Administrative, bureaucratic, consensual, competitive","Entrepreneurial, bureaucratic, consensual, directorial"],"correct":1,"explanation":"The four types are entrepreneurial, bureaucratic, consensual, and competitive. 'Administrative' and 'directorial' are distractors.","subtitle":"Ch 2 Quiz Q1 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-083","type":"scenario","front":"When HR strategy is truly strategic, what does it do for the company?","choices":["Disrupts competitors' supply chains","Improves the firm's public image only","Positively affects business outcomes","Guarantees cooperation from every employee"],"correct":2,"explanation":"Strategic HRM improves business outcomes by aligning people practices with strategy.","subtitle":"Ch 2 Quiz Q2 · Strategic HRM","note":"Read more: 2.2 Introduction"},{"id":"c202-ch02-084","type":"scenario","front":"A new hire asks what 'company culture' really means. Which answer is most accurate?","choices":["The firm's objectives, goals, values, and mission","The tasks and jobs people perform","The employees, managers, and leaders who work there","The shared norms, values, and assumptions of its members"],"correct":3,"explanation":"Culture is the shared norms, values, and assumptions guiding how people see and do things. A mission statement is not the culture itself.","subtitle":"Ch 2 Quiz Q3 · Strategic HRM","note":"Read more: 2.4 Why Is Organizational Culture Important?"},{"id":"c202-ch02-085","type":"scenario","front":"For a culture to work, how should employees perceive it?","choices":["Individually, based on their role","Similarly, sharing the same interpretation","Differently, so diverse views coexist","Unequally, depending on seniority"],"correct":1,"explanation":"Culture works when employees share interpretations of policies and of what's expected and rewarded.","subtitle":"Ch 2 Quiz Q4 · Strategic HRM","note":"Read more: 2.5 Culture and HRM"},{"id":"c202-ch02-086","type":"scenario","front":"Which is a way HR supports line managers as an internal consultant?","choices":["Gathering individual and team training needs","Researching insurance carriers for customers","Auditing customer accounts","Managing counterpart relationships with suppliers"],"correct":0,"explanation":"Assessing individual and team training needs helps managers close skill gaps, a core consulting role.","subtitle":"Ch 2 Quiz Q5 · Strategic HRM","note":"Read more: 2.1 Topic 2: The Role of HRM in Business; 2.6 What Is the Role o
